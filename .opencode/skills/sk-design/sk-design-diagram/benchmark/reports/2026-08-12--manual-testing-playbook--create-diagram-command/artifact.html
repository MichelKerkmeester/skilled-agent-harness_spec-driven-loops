<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order placement flow · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Order placement flow</h1>

    <svg viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="order-flow-title order-flow-desc">
      <title id="order-flow-title">Order placement flow</title>
      <desc id="order-flow-desc">Sequence diagram of the order placement flow: the customer submits a checkout, the checkout service captures payment via the payment service, creates the order via the order service, and returns the order confirmation to the customer.</desc>
        <defs>
          <!-- Dot grid background -->
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>

          <!-- Arrow markers -->
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- Background: paper + dot grid -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- =================================================================
             LIFELINES — dashed vertical lines from each actor, behind everything.
             Actor lifeline x-coords: 128, 352, 584, 800
             ================================================================= -->
        <line x1="128" y1="128" x2="128" y2="488" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="352" y1="128" x2="352" y2="488" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="584" y1="128" x2="584" y2="488" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="128" x2="800" y2="488" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- =================================================================
             ACTIVATION BARS — w=8 rects on lifelines showing control duration.
             Drawn before message arrows so arrows land on their edges.
             ================================================================= -->
        <!-- Checkout activation: receives at y=176, responds at y=480 -->
        <rect x="348" y="180" width="8" height="304" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- Payment activation: called at y=240, returns at y=304 -->
        <rect x="580" y="244" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- Order activation: called at y=368, returns at y=448 -->
        <rect x="796" y="372" width="8" height="76" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- =================================================================
             MESSAGE ARROWS — time flows top→down.
             Draw before labels so label masks cover the line.
             ================================================================= -->

        <!-- M1: Customer → Checkout  (POST /api/checkout · link-blue) -->
        <line x1="128" y1="176" x2="352" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- M2: Checkout → Payment  (capture payment · muted) -->
        <line x1="352" y1="240" x2="584" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M3: Payment → Checkout  (return 200 captured · muted dashed) -->
        <line x1="584" y1="304" x2="356" y2="304" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- M4: Checkout → Order  (create order · muted) -->
        <line x1="352" y1="368" x2="800" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M5: Order self-message  (persist order · muted U-loop) -->
        <path d="M 808 408 L 844 408 L 844 440 L 808 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M6: Order → Checkout  (return 201 created · muted dashed) -->
        <line x1="800" y1="448" x2="356" y2="448" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- M7: Checkout → Customer  (primary success · coral) -->
        <line x1="352" y1="480" x2="128" y2="480" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- =================================================================
             MESSAGE LABELS — each with an opaque paper-colored mask.
             ================================================================= -->

        <!-- M1 label -->
        <rect x="180" y="160" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="240" y="168" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /API/CHECKOUT</text>

        <!-- M2 label -->
        <rect x="420" y="224" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="468" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /PAYMENTS</text>

        <!-- M3 label -->
        <rect x="416" y="288" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="468" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · CAPTURED</text>

        <!-- M4 label -->
        <rect x="520" y="352" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="576" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /ORDERS</text>

        <!-- M5 label (right of the self-loop) -->
        <rect x="852" y="392" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="900" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERSIST ORDER</text>

        <!-- M6 label -->
        <rect x="496" y="432" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="576" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">201 · ORDER CREATED</text>

        <!-- M7 label (coral · primary response) -->
        <rect x="168" y="464" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="240" y="472" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">201 · ORDER CONFIRMED</text>

        <!-- =================================================================
             ACTOR BOXES — drawn after arrows/labels.
             Each actor: 144–160 wide × 56 tall. Centers: 128, 352, 584, 800.
             ================================================================= -->

        <!-- Actor 1: Customer (external / soft) -->
        <rect x="56" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="64" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="78" y="88" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="128" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Customer</text>
        <text x="128" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser</text>

        <!-- Actor 2: Checkout Service (focal / coral) -->
        <rect x="272" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="72" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="280" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="296" y="88" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRV</text>
        <text x="352" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Checkout Service</text>
        <text x="352" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api/checkout</text>

        <!-- Actor 3: Payment Service (backend / muted) -->
        <rect x="512" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="512" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="520" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="534" y="88" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAY</text>
        <text x="584" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Payment Service</text>
        <text x="584" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Stripe · capture</text>

        <!-- Actor 4: Order Service (backend / muted) -->
        <rect x="728" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="736" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="750" y="88" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORD</text>
        <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Order Service</text>
        <text x="800" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orders · :5432</text>

        <!-- =================================================================
             LEGEND — horizontal strip at the bottom.
             Separator at y=504, eyebrow at y=520, items at y=540–548.
             ================================================================= -->
        <line x1="56" y1="504" x2="944" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="56" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <!-- Item 1: Focal actor swatch (coral) -->
        <rect x="56" y="540" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="76" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal actor</text>

        <!-- Item 2: Activation bar swatch -->
        <rect x="176" y="536" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="188" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

        <!-- Item 3: Request arrow (link-blue) -->
        <line x1="292" y1="548" x2="320" y2="548" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="328" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

        <!-- Item 4: Return / async (muted dashed) -->
        <line x1="460" y1="548" x2="488" y2="548" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="496" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return / async</text>

        <!-- Item 5: Primary response (coral) -->
        <line x1="636" y1="548" x2="664" y2="548" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="672" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary response</text>

      </svg>
  </div>
</body>
</html>
