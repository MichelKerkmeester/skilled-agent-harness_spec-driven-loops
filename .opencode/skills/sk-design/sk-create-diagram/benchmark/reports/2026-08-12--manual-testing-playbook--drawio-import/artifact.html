<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imported from draw.io — System</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Imported from draw.io · doc-inline · balanced</p>
    <h1>System — request path</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sysr-title sysr-desc">
      <title id="sysr-title">System — request path</title>
      <desc id="sysr-desc">Architecture diagram showing a web app sending requests to an API service, which reads from Postgres and caches in Redis.</desc>
      <defs>
        <marker id="sysr-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="sysr-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="40" y="136" width="200" height="280" rx="8" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="56" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">EDGE</text>

      <rect x="320" y="136" width="240" height="280" rx="8" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="336" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CORE SERVICES</text>

      <rect x="640" y="136" width="280" height="280" rx="8" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="656" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DATA</text>

      <!-- Connectors (drawn before boxes) -->
      <!-- Web App -> API Service -->
      <line x1="220" y1="260" x2="340" y2="260" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sysr-arrow-link)"/>
      <!-- API Service -> Postgres -->
      <path d="M540,248 H652 Q660,248 660,240 V208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sysr-arrow)"/>
      <!-- API Service -> Redis Cache -->
      <path d="M540,272 H652 Q660,272 660,280 V328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sysr-arrow)"/>

      <!-- Arrow labels -->
      <rect x="256" y="240" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUESTS</text>

      <rect x="580" y="228" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>

      <rect x="572" y="252" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHES</text>

      <!-- Nodes: Edge -->
      <rect x="60" y="232" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="232" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="140" y="259" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web App</text>
      <text x="140" y="273" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">entry point</text>

      <!-- Nodes: Core -->
      <rect x="340" y="224" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="224" width="200" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="440" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Service</text>
      <text x="440" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routes requests</text>

      <!-- Nodes: Data -->
      <rect x="660" y="176" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="176" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="780" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
      <text x="780" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">system data</text>

      <rect x="660" y="296" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="296" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="780" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis Cache</text>
      <text x="780" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fast cache</text>

      <!-- Legend -->
      <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="524" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="144" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL</text>

      <rect x="240" y="524" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SERVICE</text>

      <rect x="376" y="524" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="400" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STORE</text>

      <rect x="496" y="524" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="520" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CLIENT</text>

      <line x1="616" y1="529" x2="648" y2="529" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="656" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">REQUEST</text>
    </svg>
  </div>
</body>
</html>
