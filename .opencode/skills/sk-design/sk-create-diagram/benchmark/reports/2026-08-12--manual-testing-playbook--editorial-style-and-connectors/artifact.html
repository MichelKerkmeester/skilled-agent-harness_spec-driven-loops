<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support handoff process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Diagram Design</p>
    <h1>Support handoff process</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="support-handoff-title support-handoff-desc">
      <title id="support-handoff-title">Support handoff process</title>
      <desc id="support-handoff-desc">Swimlane diagram of the support handoff process: L1 triage attempts a fix, escalates to L2 investigation, and L2 deployment to ops ships a hotfix to production.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->
      <line x1="40" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="176" x2="960" y2="176" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="272" x2="960" y2="272" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="368" x2="960" y2="368" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Actor column divider -->
      <line x1="160" y1="80" x2="160" y2="368" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="60" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">L1 · FRONT LINE</text>
      <text x="60" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">L2 · SUPPORT</text>
      <text x="60" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">OPS</text>

      <!-- Arrows (drawn first, before boxes) -->
      <!-- 1. Triage -> Attempt fix (within L1) -->
      <line x1="300" y1="128" x2="340" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2. Attempt fix -> Investigate (L1 -> L2 handoff, orthogonal elbow) -->
      <path d="M 400,152 V 176 Q 400,184 408,184 H 552 Q 560,184 560,176 V 200"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 3. Investigate -> Fix &amp; verify (within L2) -->
      <line x1="640" y1="224" x2="680" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4. Fix &amp; verify -> Deploy hotfix (L2 -> Ops critical handoff, accent) -->
      <path d="M 720,248 V 272 Q 720,280 712,280 H 468 Q 460,280 460,272 V 296"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 5. Investigate -> Attempt fix (revision loop, dashed) -->
      <path d="M 520,224 H 380 Q 372,224 372,232 V 152"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Arrow labels (opaque mask + 8px visible gap above connector) -->
      <rect x="300" y="108" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTO</text>

      <rect x="444" y="164" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ESCALATE</text>

      <rect x="552" y="260" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="588" y="268" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEPLOY</text>

      <rect x="408" y="204" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="448" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REVISION</text>

      <!-- Steps -->
      <!-- L1: Triage ticket -->
      <rect x="180" y="104" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Triage ticket</text>
      <text x="240" y="140" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">severity check</text>

      <!-- L1: Attempt fix -->
      <rect x="340" y="104" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Attempt fix</text>
      <text x="400" y="140" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">known solution</text>

      <!-- L2: Investigate -->
      <rect x="520" y="200" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="580" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Investigate</text>
      <text x="580" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">root cause</text>

      <!-- L2: Fix &amp; verify -->
      <rect x="680" y="200" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fix &amp; verify</text>
      <text x="740" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">staging test</text>

      <!-- Ops: Deploy hotfix (focal) -->
      <rect x="400" y="296" width="120" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="460" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Deploy hotfix</text>
      <text x="460" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">production</text>

      <!-- Legend strip (horizontal bottom, hairline separator) -->
      <line x1="40" y1="416" x2="960" y2="416" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="444" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="452" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Step</text>

      <rect x="132" y="444" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="152" y="452" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Focal outcome</text>

      <line x1="268" y1="448" x2="296" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="304" y="452" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Within lane</text>

      <line x1="404" y1="448" x2="432" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="440" y="452" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Handoff</text>

      <line x1="516" y1="448" x2="544" y2="448" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="552" y="452" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Revision</text>

      <line x1="628" y1="448" x2="656" y2="448" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="664" y="452" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Critical handoff</text>
    </svg>
  </div>
</body>
</html>
