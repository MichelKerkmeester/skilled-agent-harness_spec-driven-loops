# -----------------------------------------------------------------
# OPENCODE CREATE: DIAGRAM CREATION WORKFLOW (CONFIRM MODE)
# -----------------------------------------------------------------
# Mode: confirm-only (interactive step-by-step approval)
# Note: This workflow follows the same creation path as :auto, with
#       explicit approval checkpoints between major decisions.
#       All executions use interactive confirmation gates.
# -----------------------------------------------------------------
role: Expert Diagram Author using sk-doc create-diagram packet
purpose: Produce an HTML/SVG technical diagram, an ASCII/markdown flowchart, or redraw an existing draw.io/Mermaid source with format-aware validation
action: Resolve html-svg (default) versus ascii-markdown before selecting a type or pattern; then run the matching creation and validation workflow with an approval checkpoint after each step

# -----------------------------------------------------------------
# PREREQUISITE: CREATE-DIAGRAM PACKET VERIFICATION
# -----------------------------------------------------------------
# PHASE 0 in the presentation contract verifies the packet resources
# BEFORE this YAML workflow loads. If you're executing this workflow,
# create-diagram verification has already passed.
#
# To invoke correctly: /create:diagram <target-diagram.html|target-flowchart.md> [description | --import source-file] [--output-format html-svg|ascii-markdown] [--type <diagram-type>] [--format png|svg|html+png for export] :confirm
# -----------------------------------------------------------------

operating_mode:
  workflow: sequential_5_step
  workflow_compliance: MANDATORY
  workflow_execution: interactive
  approvals: step_by_step
  tracking: progressive_task_checklists
  validation: checkpoint_based_with_taste_gate
  output_configuration: "self-contained html-svg file or markdown flowchart"
  description: |
    Executes the 5-step diagram workflow with approval gates at each checkpoint.
    User confirms, reviews, or modifies at each step before the workflow advances.

development_philosophy:
  principle: "The highest-quality move is usually deletion — earn every node, every accent, every connector"
  approach: "Resolve format -> Detect html-svg shape or ascii-markdown pattern -> Load references -> Create or redraw -> Validate -> Deliver"
  mandate: "Never invent a component to fill a layout; never silently drop one when redrawing an import source"

diagram_path_resolution:
  default: none
  required_extension: ".html for html-svg; .md for ascii-markdown"

output_format_resolution:
  default: html-svg
  values: [html-svg, ascii-markdown]
  before: diagram_type_or_pattern
  signals:
    explicit: "--output-format html-svg|ascii-markdown or pre-bound output_format"
    ascii_markdown: "markdown target or ASCII flowchart, workflow diagram, text diagram, decision tree, decision branch, approval loop diagram, or parallel execution diagram request"
    html_svg: "diagram, HTML, SVG, draw.io, Mermaid, import, export, or no ASCII/markdown signal"
  ambiguous_action: "Use UNKNOWN_FALLBACK and ask for the target artifact format; never guess"

# -----------------------------------------------------------------
# CONFIDENCE & CLARIFICATION FRAMEWORK
# -----------------------------------------------------------------
confidence_framework:
  thresholds:
    high: { range: "80-100%", action: "Proceed with citable source" }
    medium: { range: "40-79%", action: "Proceed with caution, document assumptions" }
    low: { range: "0-39%", action: "STOP - Ask clarification with A/B/C options" }
  scoring_weights:
    request_shape_clarity: 0.25
    target_path_clarity: 0.20
    source_content_specificity: 0.30
    diagram_type_clarity: 0.25
  clarification_format: |
    "I need clarity (confidence: [NN%]). Which approach:
    - A) [option with brief rationale]
    - B) [option with brief rationale]
    - C) [option with brief rationale]"
  escalation:
    timebox_minutes: 10
    failed_attempts_threshold: 2
    action: "Present options to user with current findings"

# -----------------------------------------------------------------
# CHECKPOINT OPTIONS
# -----------------------------------------------------------------
checkpoint_options:
  standard:
  - label: "Approve"
    description: "Approve and continue to next step"
  - label: "Review"
    description: "Show more details"
  - label: "Modify"
    description: "Make changes before proceeding"

# -----------------------------------------------------------------
# REQUEST ANALYSIS FRAMEWORK
# -----------------------------------------------------------------
request_analysis_framework:
  code_search_note: "Use Glob/Grep to locate the target path, any prior diagram at that path, and (for import) the source file. Read files before drawing."
  solution_flow:
  - "Resolve html-svg versus ascii-markdown before selecting a type or pattern"
  - "Parse carefully: generate, import, export, or flowchart — which shape is ACTUALLY requested?"
  - "Gather Context: read the source content or import source file"
  - "Identify Approach: the SIMPLEST diagram type that represents the real content"
  - "Validate Choice: would a table or a sentence communicate this better?"
  - "Clarify If Needed: if <80% confidence, ask"
  - "Scope Check: producing ONLY the requested artifact for the resolved format?"
  - "Execute: draw or redraw, checkpoint, run the taste gate, checkpoint, and report"
  pre_change_validation:
    items:
    - "Output format resolved before type or pattern selection?"
    - "Target path matches the resolved format (.html for html-svg, .md for ascii-markdown)?"
    - "For html-svg generate: source content and diagram type resolved?"
    - "For html-svg import: source file exists and format recognized?"
    - "For html-svg export: an existing generated diagram and a target format identified?"
    - "For ascii-markdown: source process and pattern resolved?"
    - "Confidence >=80%? (if not: ask)"
    stop_conditions: [ "Any item unchecked", "No target diagram path (generate/import)" ]
    stop_action: "STOP and address before proceeding"

# -----------------------------------------------------------------
# USER INPUTS (From gate outputs)
# -----------------------------------------------------------------
user_inputs:
  output_format: "[OUTPUT_FORMAT] one of: html-svg (default), ascii-markdown. FROM FORMAT RESOLUTION."
  request_shape: "[REQUEST_SHAPE] one of: generate, import, export, flowchart. FROM UNIFIED SETUP PHASE."
  target_diagram_path: "[TARGET_DIAGRAM_PATH] workspace-relative .html path for html-svg or .md path for ascii-markdown. FROM UNIFIED SETUP PHASE."
  source_content: "[SOURCE_CONTENT] what the artifact should show. Required for html-svg generate or ascii-markdown. FROM UNIFIED SETUP PHASE."
  diagram_type: "[DIAGRAM_TYPE] one of the 27 supported html-svg types. Required for html-svg generate. FROM UNIFIED SETUP PHASE."
  ascii_pattern: "[ASCII_PATTERN] one of the six ascii-markdown workflow-shape patterns. Required for ascii-markdown. FROM FORMAT RESOLUTION."
  import_source_path: "[IMPORT_SOURCE_PATH] path to the drawio/Mermaid source. Required for import. FROM UNIFIED SETUP PHASE."
  export_format: "[EXPORT_FORMAT] png, svg, or html+png. Required for export. FROM UNIFIED SETUP PHASE."

# -----------------------------------------------------------------
# FIELD HANDLING
# -----------------------------------------------------------------
field_handling:
  request_shape:
    validation: "must be one of: generate, import, export, flowchart"
    default: "derive_from_arguments"
  target_diagram_path:
    validation: "workspace-relative path ending in .html for html-svg or .md for ascii-markdown"
    required: true
  output_format:
    validation: "must be html-svg or ascii-markdown"
    default: html-svg
    resolution: "must be resolved before diagram_type or ascii_pattern"
  diagram_type:
    validation: "must be one of the 27 types listed in SKILL.md WHEN TO USE selection guide"
    default: "derive_from_source_content"
  ascii_pattern:
    validation: "must be one of the six patterns in references/ascii-format/pattern-selection.md"
    required_when: "output_format=ascii-markdown"
  defaults:
    output_format: "html-svg: single self-contained HTML file; ascii-markdown: markdown file with a fenced text flowchart"
    skill_contract: .opencode/skills/sk-doc/sk-create-diagram/SKILL.md

input_contract:
  required:
    - create_diagram_verified
    - output_format
    - request_shape
    - target_diagram_path
  conditional:
    - source_content       # required for html-svg generate or ascii-markdown
    - diagram_type         # required for html-svg generate
    - ascii_pattern        # required for ascii-markdown
    - import_source_path   # required for html-svg import
    - export_format        # required for html-svg export

# -----------------------------------------------------------------
# DOCUMENTATION LEVEL
# -----------------------------------------------------------------
documentation_level:
  default: "No separate spec packet for ordinary diagram or flowchart creation"
  required_files:
  - target_diagram_path
  note: "The command output is a single self-contained HTML file unless the user explicitly asks for surrounding documentation."

# -----------------------------------------------------------------
# CREATE-DIAGRAM RESOURCES
# -----------------------------------------------------------------
diagram_resources:
  skill_contract: .opencode/skills/sk-doc/sk-create-diagram/SKILL.md
diagram_scripts:
  drawio_extract: .opencode/skills/sk-doc/sk-create-diagram/scripts/drawio_extract.py
  mermaid_extract: .opencode/skills/sk-doc/sk-create-diagram/scripts/mermaid_extract.py
  validate_flowchart: .opencode/skills/sk-doc/sk-create-diagram/scripts/validate-flowchart.sh
diagram_references:
  style_guide: .opencode/skills/sk-doc/sk-create-diagram/references/foundations/style-guide.md
  onboarding: .opencode/skills/sk-doc/sk-create-diagram/references/foundations/onboarding.md
  output_spec: .opencode/skills/sk-doc/sk-create-diagram/references/foundations/output-spec.md
  import_drawio: .opencode/skills/sk-doc/sk-create-diagram/references/import-export/import-drawio.md
  import_mermaid: .opencode/skills/sk-doc/sk-create-diagram/references/import-export/import-mermaid.md
  export: .opencode/skills/sk-doc/sk-create-diagram/references/import-export/export.md
  type_reference_pattern: .opencode/skills/sk-doc/sk-create-diagram/references/types/type-<name>.md
  ascii_route_map: .opencode/skills/sk-doc/sk-create-diagram/references/ascii-format/README.md
  ascii_pattern_selection: .opencode/skills/sk-doc/sk-create-diagram/references/ascii-format/pattern-selection.md
  ascii_notation: .opencode/skills/sk-doc/sk-create-diagram/references/ascii-format/notation-and-validator.md

ascii_patterns:
  linear: .opencode/skills/sk-doc/sk-create-diagram/assets/ascii-patterns/simple-workflow.md
  decision: .opencode/skills/sk-doc/sk-create-diagram/assets/ascii-patterns/decision-tree-flow.md
  parallel: .opencode/skills/sk-doc/sk-create-diagram/assets/ascii-patterns/parallel-execution.md
  approval: .opencode/skills/sk-doc/sk-create-diagram/assets/ascii-patterns/approval-workflow-loops.md
  swimlane: .opencode/skills/sk-doc/sk-create-diagram/assets/ascii-patterns/system-architecture-swimlane.md
  journey: .opencode/skills/sk-doc/sk-create-diagram/assets/ascii-patterns/user-onboarding.md
diagram_templates:
  minimal_light: .opencode/skills/sk-doc/sk-create-diagram/assets/templates/template.html
  minimal_dark: .opencode/skills/sk-doc/sk-create-diagram/assets/templates/template-dark.html
  full_editorial: .opencode/skills/sk-doc/sk-create-diagram/assets/templates/template-full.html
  terminal: .opencode/skills/sk-doc/sk-create-diagram/assets/templates/template-terminal.html

# -----------------------------------------------------------------
# WORKFLOW ENFORCEMENT (CRITICAL)
# -----------------------------------------------------------------
workflow_enforcement:
  mode: strict
  step_order: sequential_mandatory
  skip_allowed: false
  phase_gate:
    location: "Between Step 2 and Step 3"
    purpose: "Verify format-specific references and validation requirements are loaded before creating output"
    requirements:
    - "For html-svg: style guide checked for customization (style-guide gate, generate/import only)"
    - "For html-svg: matching type or import reference loaded and complexity budget known"
    - "For ascii-markdown: pattern-selection and notation references plus one pattern asset loaded"
    action_if_failed: "STOP and return to the incomplete step"
  critical_steps:
    step_2_resource_loading:
      enforcement: "MUST resolve output_format first; html-svg loads style-guide.md plus the type/import/export reference, while ascii-markdown loads the pattern-selection and notation references plus one pattern asset"
      verification: "Cannot proceed without user confirmation that the format-specific resources are loaded"
    step_3_draw_or_redraw:
      enforcement: "MUST produce a single self-contained HTML file with inline SVG for html-svg, or one markdown flowchart for ascii-markdown; MUST NOT invent or silently drop components on import"
      verification: "Fidelity ledger recorded for import; complexity budget respected for html-svg generate; pattern/source fidelity respected for ascii-markdown; user approves before the validation gate"
    step_4_taste_gate:
      enforcement: "MUST run the SKILL.md §6 Pre-Output Checklist (SUCCESS CRITERIA / taste gate) before delivery"
      verification: "Every checklist item explicitly checked and approved by the user"

gate_logic:
  hard:
    H0_diagram_verified:
      description: "create-diagram packet resource verification must have passed in Phase 0"
      fail_action: "STOP and return to the command setup phase"
    H1_required_fields:
      description: "Required setup fields for the resolved output_format and request_shape must be present before creating output"
      fail_action: "STOP and collect missing inputs"
    H2_connector_rules:
      description: "The five mandatory connector rules must hold in delivered html-svg output"
      fail_action: "Fix the diagram before delivery"
    H3_accessible_svg:
      description: "Delivered html-svg output must carry the accessible SVG contract; ascii-markdown output must pass validate-flowchart.sh"
      fail_action: "Fix the accessibility contract before delivery"
  soft:
    S1_existing_diagram:
      description: "Warn when the target diagram path already exists"
      fail_action: "Proceed only after explicit overwrite intent"
    S2_style_not_customized:
      description: "Warn on the first diagram in a project when the style guide is still at the shipped default"
      fail_action: "Run the style-guide gate dialogue from SKILL.md before drawing, unless the user already opted for the default"

# -----------------------------------------------------------------
# WORKFLOW (5 STEPS WITH CHECKPOINTS)
# -----------------------------------------------------------------
workflow:
  step_1_request_analysis:
    purpose: Parse inputs, resolve output_format before request_shape/type/pattern, and validate the target path
    activities:
    - "Resolve output_format first: explicit --output-format or pre-bound marker, .md target, or ASCII/markdown flowchart signals select ascii-markdown; otherwise default to html-svg"
    - "If output_format is ambiguous, stop with UNKNOWN_FALLBACK and ask rather than guessing"
    - Confirm request_shape, target_diagram_path, and the format-specific required fields
    - Check whether target_diagram_path already exists
    validation:
      path_format: "workspace-relative .html path for html-svg or .md path for ascii-markdown"
      check_exists: true
      command: "test -e [target_diagram_path]"
    checkpoint:
      question: "Format=[output_format], shape=[request_shape], target=[target_diagram_path]. Proceed?"
      options:
      - label: "A) Proceed"
        description: "Continue with these settings"
      - label: "B) Change target path"
        description: "Use a different output path"
      - label: "C) Change shape or source"
        description: "Re-resolve request_shape or source content"
    outputs:
    - output_format_confirmed
    - request_shape_confirmed
    - target_path_validated

  step_2_resource_loading:
    purpose: Load the format-specific reference set (MANDATORY)
    enforcement: MANDATORY
    activities:
    - "IF output_format=html-svg: load references/foundations/style-guide.md — ALWAYS"
    - "IF output_format=html-svg and generate: run the style-guide gate on first use; load references/types/type-<diagram_type>.md"
    - "IF output_format=html-svg and import: route by extension to import-drawio.md or import-mermaid.md; run the extraction script (never render)"
    - "IF output_format=html-svg and export: load references/import-export/export.md"
    - "IF output_format=ascii-markdown: load references/ascii-format/pattern-selection.md and references/ascii-format/notation-and-validator.md; select and load exactly one assets/ascii-patterns/*.md pattern"
    checkpoint:
      question: "Loaded the format-specific resources for [output_format] plus [shape reference or ASCII pattern]. Proceed?"
      options: checkpoint_options.standard
    outputs:
    - style_guide_loaded
    - shape_reference_loaded
    - extraction_ir_captured (import only)
    validation: resources_loaded

  step_3_draw_or_redraw:
    purpose: Produce the artifact for the resolved output_format and shape
    enforcement: MANDATORY
    activities:
    - "IF output_format=html-svg and generate: copy the closest template, draw against the type reference's layout conventions and complexity budget, apply the five connector rules"
    - "IF output_format=html-svg and import: set the four output dials, redraw the extracted IR, report the fidelity ledger"
    - "IF output_format=html-svg and export: extract the <svg> node and emit the requested format(s)"
    - "IF output_format=ascii-markdown: draft one fenced text flowchart from the selected pattern using real source nodes, explicit branch labels, joins, loops, and terminal states where applicable"
    - Write the output to the resolved path
    checkpoint:
      question: "Artifact drafted at [path] in [output_format]. [Fidelity ledger summary if import]. Review before validation?"
      options:
      - label: "A) Proceed to taste gate"
        description: "Content looks correct"
      - label: "B) Show the diagram"
        description: "Display the drafted SVG/HTML for review"
      - label: "C) Revise"
        description: "Adjust content, type, or dials before continuing"
    outputs:
    - diagram_file_created
    - fidelity_ledger (import only)
    validation: file_created

  step_4_taste_gate:
    purpose: Run the format-specific validation gate before delivery
    enforcement: HARD_BLOCK
    activities:
    - "IF output_format=html-svg: run the SKILL.md §6 taste gate (type fit, remove test, signal, technical accessibility and connector rules, typography)"
    - "IF output_format=ascii-markdown: run bash scripts/validate-flowchart.sh [target_diagram_path], then review raw markdown readability and source fidelity"
    - If any item fails, fix the diagram and re-run this step
    checkpoint:
      question: "Validation result for [output_format]: [PASS/FAIL with findings]. Proceed to delivery?"
      options:
      - label: "A) Continue to delivery"
        description: "Taste gate passed"
      - label: "B) Review findings"
        description: "Show detailed checklist results"
      - label: "C) Fix issues"
        description: "Address findings and re-run the gate"
    outputs:
    - taste_gate_result: pass_or_fail
    - taste_gate_findings: list_if_failed
    validation: taste_gate_passed

  step_5_delivery:
    purpose: Emit completion status with path and taste-gate evidence
    condition: "target_diagram_path or export artifact path is not null"
    activities:
    - Ensure the output remains a single artifact for the resolved format
    - Record output_format, request_shape, diagram_type or ascii_pattern or import source, fidelity ledger, and validation result
    - State any fidelity limitation honestly
    - Do not create packet-local advisor metadata or extra output files
    checkpoint:
      question: "Delivery summary recorded. Diagram creation complete!"
      options:
      - label: "Done"
        description: "Complete workflow"
      - label: "View summary"
        description: "Show final summary"
    outputs:
    - delivery_summary: "diagram path, design-system state, and taste-gate evidence"
    validation: delivery_ready
    validation_evidence:
      validator: "html-svg: SKILL.md §6 Pre-Output Checklist; ascii-markdown: scripts/validate-flowchart.sh"
      critical_note: "Run every applicable format-specific validation item directly against the delivered artifact before claiming delivery."
      when: "Immediately after the diagram file is written"
    anchor_requirements:
      enforcement: NOT_APPLICABLE
      rationale: "The command creates a single diagram artifact, not a memory packet."
    importance_tier:
      assign: normal
      rationale: "Diagram creation is artifact-scoped unless the user requests durable project memory."

# -----------------------------------------------------------------
# CIRCUIT BREAKER
# -----------------------------------------------------------------
circuit_breaker:
  consecutive_failure_threshold: 3
  states:
    closed: "Normal operation"
    open: "3+ failures - pause and report to user"
    half_open: "Test with single retry before resuming"
  on_open:
    action: "Report failures to user with summary"
    suggest: "Review inputs and try again, or escalate"

# -----------------------------------------------------------------
# ERROR RECOVERY
# -----------------------------------------------------------------
error_recovery:
  invalid_target_path:
    action: "Show valid format (workspace-relative .html path), prompt for correction"
    example: "Expected: docs/diagrams/architecture.html"
  ambiguous_diagram_type:
    action: "Present the WHEN TO USE selection guide and ask which type fits"
  unrecognized_import_source:
    action: "Explain supported formats: .drawio, .drawio.xml, .drawio.png, .drawio.svg, .mmd, .mermaid, or Markdown with fenced mermaid blocks"
  taste_gate_failure:
    action: "Fix the specific failing checklist item and re-run the gate"
  export_without_generated_diagram:
    action: "Ask for the path to the already-generated diagram to export"

# -----------------------------------------------------------------
# INTERACTIVE EXECUTION
# -----------------------------------------------------------------
interactive_execution:
  principle: "Execute workflow steps with user approval at each checkpoint"
  user_feedback_handling:
    approve: "Continue to next step"
    review: "Show detailed output before proceeding"
    modify: "Apply requested changes and re-validate"

# -----------------------------------------------------------------
# QUALITY STANDARDS
# -----------------------------------------------------------------
quality_standards:
  taste_gate_validation: MANDATORY
  validation_enforcement: HARD_BLOCK
  validation_pipeline:
    stage_1: "Type fit and remove test"
    stage_2: "Signal (accent, legend, complexity budget)"
    stage_3: "Technical (accessible SVG, connector rules, 4px grid)"
    stage_4: "Typography"
  template_adherence: required
  core_standards_reference: ".opencode/skills/sk-doc/sk-create-diagram/SKILL.md"

# -----------------------------------------------------------------
# COMPLETION REPORT TEMPLATE
# -----------------------------------------------------------------
completion_report:
  template: |
    Diagram Creation Complete

    Output Format: [html-svg | ascii-markdown]
    Shape: [generate | import | export | flowchart]
    Diagram Type: [diagram-type, html-svg generate only] | Pattern: [ascii-pattern, ascii-markdown only]
    Location: [target-diagram-path]

    Validation:
    - [SKILL.md §6 taste gate for html-svg | scripts/validate-flowchart.sh for ascii-markdown]: PASSED

    Output:
    - [Single self-contained HTML file, inline SVG, no external images | Single markdown flowchart with fenced text diagram]

    STATUS=OK PATH=[target-diagram-path]

# -----------------------------------------------------------------
# TERMINATION
# -----------------------------------------------------------------
termination:
  after_step: step_5_delivery
  message: "Diagram creation workflow complete."
  next_steps:
    - condition: "Diagram needs source-owner review"
      action: "Ask the content owner to verify components and relationships"
    - condition: "Diagram should export for a slide or social card"
      action: "Run /create:diagram again with an export request against the same path"

# -----------------------------------------------------------------
# RULES
# -----------------------------------------------------------------
rules:
  ALWAYS:
    - "Resolve output_format before selecting a diagram type or ASCII pattern"
    - "For html-svg, load style-guide.md before drawing anything"
    - "For html-svg, load the matching type-<name>.md or import-<format>.md reference before drawing"
    - "For ascii-markdown, load pattern-selection.md and one matching ascii-patterns/*.md asset before drafting"
    - "Run the full html-svg taste gate or ascii-markdown flowchart validator before claiming delivery"
    - "Respect the five mandatory connector rules exactly for html-svg"
    - "Deliver the accessible-SVG contract for html-svg"
    - "Report the fidelity ledger honestly for html-svg import redraws"
    - "Label ascii-markdown decision branches with [YES]/[NO] or check/cross notation"
    - "Pause at checkpoints for user approval"
  NEVER:
    - "Skip the taste gate between drawing and delivery"
    - "Invent or silently drop a component when redrawing an import source"
    - "Present an import redraw as pixel-perfect"
    - "Produce a diagonal connector between off-axis nodes"
    - "Export a diagram unprompted"
    - "Proceed without user approval at checkpoints"
    - "Create packet-local advisor metadata"
