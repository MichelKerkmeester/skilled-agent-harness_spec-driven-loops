# ─────────────────────────────────────────────────────────────────
# DOCTOR: CAUSAL GRAPH — RETIRING
# ─────────────────────────────────────────────────────────────────
# This workflow diagnosed causal edges stored in the continuity database. That
# database is being decommissioned, and the capability has no replacement: the
# retrieval conventions that replace the retired retrieval tools are a lexical
# index plus a lexical scan, and neither can traverse graph edges or update them
# statefully. Declaring the loss is the honest outcome; a grep recipe dressed up
# as lineage analysis would not be.
#
# Nothing below runs a diagnostic. The route stays reachable only so an operator
# who types it gets told what happened instead of an unexplained failure. It is
# deleted with the subsystem in phase 003 of the memory decommission.
# ─────────────────────────────────────────────────────────────────
status: retiring
role: Retiring route notice
purpose: State that causal-graph and drift analysis are unsupported, and name what to use instead.
action: Print the notice; write nothing; exit.

operating_mode:
  workflow: single_step
  execution: non_interactive
  approvals: none
  intent: NOTICE

mutation_boundaries:
  allowed_targets: []
  forbidden_targets:
    - "**/*"
  enforcement: "This route writes nothing. Any attempted write halts with STATUS=FAIL and ERROR='retiring-route-mutation-violation'."

unsupported_capability:
  capability: "Causal graph traversal and drift analysis"
  boundary: "Explicit Markdown links and typed evidence in the packet documents are what remain. Grep cannot traverse or statefully update graph edges, so there is no equivalent recipe and none is offered."
  no_hit_behavior: "This route always reports the capability as unsupported. It never returns a partial or inferred lineage, and it never degrades into a keyword search dressed as a graph answer."

workflow:
  phase_0_notice:
    purpose: Emit the retiring notice
    activities:
      - "Print: /doctor causal-graph is retiring. Causal-graph and drift analysis are unsupported — the capability lived in the continuity database being decommissioned, and the lexical replacement cannot traverse edges."
      - "Point the operator at the surviving routes: /doctor memory for trigger-index and retrieval-convention diagnostics, and the packet's own decision-record.md and Markdown cross-links for lineage."
      - "Exit without reading the retired database and without writing any file."
    outputs:
      - status: STATUS_UNSUPPORTED
    validation: notice_emitted

output_contract:
  format: text
  required_sections:
    - status_header
    - unsupported_notice
    - alternatives

halt_conditions:
  - "Any attempted write → STATUS=FAIL with ERROR='retiring-route-mutation-violation'"
  - "Any attempted database read → STATUS=FAIL; this route has no data source"
