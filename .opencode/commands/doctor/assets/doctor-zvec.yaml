# ─────────────────────────────────────────────────────────────────
# DOCTOR: ZVEC RETRIEVAL LANE WORKFLOW (INTERACTIVE READ-ONLY MODE)
# ─────────────────────────────────────────────────────────────────
role: Expert Operator running the zvec retrieval-lane diagnostic in interactive mode
purpose: Read-only health check of the concept lane — which zvec-grep entry point resolved, whether the workspace index exists and is ready, what embedding schema it was built with, and how much of the corpus it covers
action: Resolve the binary → run the lane's status subcommand → present presence, readiness, embedding schema, coverage and freshness → final status

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: sequential_read_only_diagnostic
  compliance: MANDATORY
  execution: interactive
  approvals: none
  tracking: diagnostic_report_and_exit_code
  validation: script_exit_code
  read_only: true

# ─────────────────────────────────────────────────────────────────
# ZVEC DOCTOR INVARIANT
# ─────────────────────────────────────────────────────────────────
zvec_doctor_invariant: |
  This doctor is read-only by contract. It reports on the zvec lane; it never builds,
  refreshes, rebuilds or drops an index, and it never edits the committed scope file.
  Index construction is an explicit operator action through the lane's own `index`
  subcommand, because it walks the whole corpus and can download an embedding model.

  Three properties of the underlying tool shape what this diagnostic can and cannot
  claim, and each is a reason a naive check would report health it never established:

    - zvec-grep exits 0 or 1 and nothing else. `zg status` exits 0 even with no index
      at all, so index presence is never inferred from an exit status. The lane reads
      the generated manifest instead, and reports a missing index as a missing index.
    - `--check-ready` exits 1 for a not-ready index AND for a genuine engine fault,
      and both print an `Error:` line. Only the sentence differs — the not-ready path
      names the state, an engine fault carries a `Code:` line — so the lane matches
      that sentence. A diagnostic that branched on the exit, or on the presence of
      `Error:`, would report a broken tool as a calm "no index yet".
    - The lane's own exit mapping is the retrieval convention's: 0 = ready, 1 = a
      valid empty answer (no index, or an index that is not ready), 2 or higher = an
      execution fault. An exit of 1 is never a failure of this diagnostic.
    - The embedding provider, model and dimension come from
      <root>/.zvec-grep/manifest.json, the field the tool itself reads. The status
      text is presentation and may change without notice.

  The index directory is git-ignored, so nothing this diagnostic reads is under
  version control except the scope file. Drift between the committed scope and the
  scope stored in the manifest is therefore expected after a scope edit and is
  reported, not repaired: zvec-grep reuses its stored file selection until an
  explicit --rebuild or --reset-paths.

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  contract: "local command design contract"
  conventions: ".opencode/skills/system-spec-kit/references/retrieval/retrieval-conventions.md"
  lane_script: ".opencode/skills/system-spec-kit/scripts/retrieval/zvec-lane.mjs"
  status_command: 'node .opencode/skills/system-spec-kit/scripts/retrieval/zvec-lane.mjs status --json'
  scope_config: ".zvec-grep-lane.json"
  index_directory: ".zvec-grep/"
  manifest_path: ".zvec-grep/manifest.json"
  binary_override_env: "SPECKIT_ZVEC_GREP_BIN"
  execution_mode: "direct (ZVEC_GREP_MODE is forced on every spawn; the lane runs no daemon)"
  status_policy: "Exit 0 = index present and ready. Exit 1 = a valid empty answer: no index, or an index that exists but is not ready. Exit 2 or higher = an execution fault, reported with stderr attached and never as a not-ready."

# ─────────────────────────────────────────────────────────────────
# USER INPUTS
# ─────────────────────────────────────────────────────────────────
user_inputs:
  execution_mode: "INTERACTIVE"

# ─────────────────────────────────────────────────────────────────
# FIELD HANDLING
# ─────────────────────────────────────────────────────────────────
field_handling:
  validation:
    execution_mode_must_be: INTERACTIVE

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  read_only: true
  allowed_targets: []
  forbidden_targets:
    - "**/*"
  invariant: "This workflow is read-only. It may execute the lane's status subcommand and print output. It must not build, refresh, rebuild or drop an index, must not edit the committed scope file, and must not repair any drift it reports."

# ─────────────────────────────────────────────────────────────────
# LANE SIGNALS
# ─────────────────────────────────────────────────────────────────
lane_signals:
  binary_unresolved:
    detection: "The lane reports binarySource=fallback, meaning no override, no zg on PATH and no fork checkout answered"
    severity: high
    note: "Every subcommand fails until an entry point exists. Set SPECKIT_ZVEC_GREP_BIN or install the CLI."
  index_absent:
    detection: "indexPresent is false; no manifest exists under the index directory"
    severity: medium
    note: "Not a fault. The ripgrep lane is unaffected and answers every exact query on its own."
  index_not_ready:
    detection: "indexPresent is true but ready is false"
    severity: medium
  embedding_schema_missing:
    detection: "A manifest exists but carries no embedding block"
    severity: high
  scope_drift:
    detection: "The glob set in the committed scope file differs from the selection stored in the manifest rootPaths"
    severity: low
    note: "Expected after a scope edit. The stored selection wins until an explicit rebuild, so the index still answers correctly with the older scope."
  coverage_unreported:
    detection: "The status text printed no file counts"
    severity: low
    note: "Presentation drift in the tool, not an index fault. Coverage is the one field this diagnostic scrapes rather than reads from the manifest."
  fork_binary_in_use:
    detection: "binarySource=fork-clone, meaning the working checkout answered rather than an installed CLI"
    severity: low
    note: "Valid, and expected while the fork carries unlanded work. Worth naming in a report because a working tree can be mid-rebuild."

# ─────────────────────────────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────────────────────────────
workflow:
  phase_0_diagnose:
    purpose: "Run the read-only lane status check."
    activities:
      - "Execute upstream_assets.status_command via Bash from the repository root."
      - "Capture stdout and exit code."
      - "Record binary, binarySource and mode from the JSON record."
    outputs:
      - lane_status_record
      - exit_code

  phase_1_report:
    purpose: "Present the lane state and the final status."
    activities:
      - "Print the resolved entry point and which rung of the resolution order answered."
      - "Print index presence, the named index state (ready, undecided, unindexed, stale, indexing, failed, cancelled or disabled), embedding provider/model/dimension/metric, coverage counts, last-updated time and index size on disk."
      - "Compare the committed scope file's glob set against the manifest rootPaths and name any drift."
      - "Note that every finding is report-only; building and rebuilding the index stay operator-owned."

# ─────────────────────────────────────────────────────────────────
# OUTPUT FORMAT
# ─────────────────────────────────────────────────────────────────
output_format: |
  STATUS=OK       lane exit 0 — index present and ready.
  STATUS=EMPTY    lane exit 1 — no index yet, or an index that is not ready. A valid
                  answer, not a failure. The ripgrep lane is unaffected.
  STATUS=FAIL     lane exit 2 or higher — execution fault, reported with stderr attached.

  The report names the resolved entry point, the embedding schema the index was built
  with, its coverage and freshness, and any drift between the committed scope and the
  scope stored in the manifest. Remediation — building or rebuilding the index — is
  operator-gated and never performed by this diagnostic.

# ─────────────────────────────────────────────────────────────────
# HALT CONDITIONS
# ─────────────────────────────────────────────────────────────────
halt_conditions:
  - "Lane exits 2 or higher → STATUS=FAIL with stderr attached"
  - "Lane exits 1 → STATUS=EMPTY, not FAIL; report the missing or unready index and stop"
  - "Any phase attempts an index build, refresh, drop or scope edit → STATUS=FAIL with ERROR='confirm-mode-mutation-violation'"
