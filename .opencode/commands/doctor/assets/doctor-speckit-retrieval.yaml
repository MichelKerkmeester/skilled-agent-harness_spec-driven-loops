# ─────────────────────────────────────────────────────────────────
# DOCTOR: TRIGGER-INDEX AND RETRIEVAL-CONVENTIONS WORKFLOW (INTERACTIVE DIAGNOSTIC MODE)
# ─────────────────────────────────────────────────────────────────
role: Expert Operator running trigger-index and retrieval-convention diagnostics in interactive mode
purpose: Read-only health check + staleness detection with user review gates. No mutations. Report goes to packet-local scratch.
action: Discovery → gate → analysis → gate → staleness classification → recommendation → state log

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: sequential
  compliance: MANDATORY
  execution: interactive
  approvals: per_phase
  tracking: phase_by_phase
  validation: continuous_self_validation
  intent: DIAGNOSE  # never APPLY in this YAML


speckit_retrieval_doctor_invariant: |
  This doctor is read-only by contract and needs no background service. It treats the
  generated trigger index at .opencode/skills/system-spec-kit/runtime/data/trigger-index.json as
  the artifact it diagnoses but never regenerates. Regeneration is owned by the
  /doctor:update orchestrator, which runs the generator over the whole corpus in one pass.

upstream_assets:
  contract: "local command design contract"
  conventions: ".opencode/skills/system-spec-kit/references/retrieval/retrieval-conventions.md"
  index_path: ".opencode/skills/system-spec-kit/runtime/data/trigger-index.json"
  lookup_command: 'node .opencode/skills/system-spec-kit/runtime/cli/retrieval/lookup-trigger-index.mjs --json -- "<prompt>"'
  lookup_policy: "The lookup reads a file and exits. There is no socket to probe and no daemon to start. Exit 0 = at least one candidate, exit 1 = clean no-hit reported as an empty result, exit 2 or higher = an execution error reported with stderr attached and never as a no-hit."
  generator_command: "node .opencode/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs"
  files:
    acceptance: "specs/system-speckit/033-system-speckit-v4/017-memory-database-decommission/001-trigger-index-replacement/acceptance-criteria.md"  # the bar the index and lookup were accepted against
    latency_report: ".opencode/skills/system-spec-kit/runtime/cli/retrieval/fixtures/latency-report.json"  # cold-lookup budget evidence
  pass_policy:
    lookup_exit_class: "0 or 1 on the frozen prompt set; 2 or higher fails"  # the lookup contract, never a result count
    cold_lookup_p95_budget_ms: 200  # the budget the latency report was accepted under
    index_regenerates_byte_identical: true  # two generator runs must hash the same
speckit_retrieval_doctor_philosophy:
  principle: "Detect index staleness before it breaks Gate 1 lookups; this command never mutates — regeneration runs through /doctor:update"
  approach: "Read the index and its manifest → run the lookup and a ripgrep recipe → classify staleness → emit recommendations"
  mandate: "This command is read-only by contract."
  honest_loss: "The retired continuity database offered semantic paraphrase, vector and BM25 fusion, decay, access tracking, session dedup and causal traversal. None of them has a replacement here. This doctor diagnoses a lexical index and a lexical scan, and it reports a miss as a miss."

# ─────────────────────────────────────────────────────────────────
# USER INPUTS (passed from Markdown setup phase)
# ─────────────────────────────────────────────────────────────────
user_inputs:
  execution_mode: "[EXECUTION_MODE] - INTERACTIVE (this YAML)"
  intent: "[INTENT] - DIAGNOSE (this YAML)"
  incremental: "[INCREMENTAL] - true|false (informational; no regeneration in this command)"

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES (READ-ONLY)
# ─────────────────────────────────────────────────────────────────

field_handling:
  defaults:
    incremental_empty: "false"
  incremental_policy:
    true: "diagnostic input only; recommend an incremental regeneration when medium staleness is detected"
    false: "diagnostic input only; recommend a full regeneration when high-severity staleness is detected"
mutation_boundaries:
  allowed_targets:
    - "<packet_scratch>/doctor-speckit-retrieval-report.*.md"  # the diagnostic report only
    - "<packet_scratch>/doctor-speckit-retrieval-state.*.json"  # the diagnostic state log only
  forbidden_targets:
    - ".opencode/skills/system-spec-kit/runtime/data/trigger-index.json"  # never regenerate from the doctor
    - "<active-spec-folder>/**/*.md"  # never write into spec packet docs from /doctor speckit-retrieval
    - "<active-spec-folder>/description.json"  # spec metadata belongs to the continuity writer
    - "<active-spec-folder>/graph-metadata.json"  # graph metadata is not a doctor target
    - ".opencode/skills/**/SKILL.md"  # never edit skill bodies
    - ".opencode/skills/**/graph-metadata.json"
    - ".opencode/agents/**/*.md"
    - ".opencode/commands/doctor/*.md"
    - ".opencode/commands/doctor/assets/doctor_*.yaml"
  enforcement: "This command is READ-ONLY by contract. No mutation phases exist in this YAML. Any attempted write halts with STATUS=FAIL and ERROR='confirm-mode-mutation-violation'."
  validator:
    name: validate_targets
    runs: "before any file write; diagnostic mode should never reach a write path"
    steps:
      - "For each target: resolve via realpath; reject absolute paths; reject paths containing `..` or symlinks escaping repo root"
      - "Assert resolved target is repo-relative under repo_root"
      - "Match resolved target against allowed_targets patterns only"
      - "Reject any match against forbidden_targets patterns"
      - "On first violation: abort, append violation to state log, exit STATUS=FAIL with diagnostic"
    on_pass: "diagnostic reads may continue"
    on_fail: "abort before any write; STATUS=FAIL ERROR=\"target validation failed: <path>\""

# ─────────────────────────────────────────────────────────────────
# INTERACTIVE GATES
# ─────────────────────────────────────────────────────────────────
interactive_gates:
  before_phase_1_analysis:
    prompt: "Phase 0 complete. Continue to Phase 1? (y/n/details)"
    blocking: true
    approvals:
      y: "continue to phase_1_analysis"
      n: "STATUS=CANCELLED; emit state log with phase=phase_0_discovery"
      details: "print Phase 0 discovery outputs, then ask again"
  before_phase_2_recommendation:
    prompt: "Phase 1 complete. Continue to Phase 2? (y/n/details)"
    blocking: true
    approvals:
      y: "continue to phase_2_recommendation"
      n: "STATUS=CANCELLED; emit state log with phase=phase_1_analysis"
      details: "print Phase 1 staleness classification outputs, then ask again"

# ─────────────────────────────────────────────────────────────────
# STALENESS SIGNALS
# ─────────────────────────────────────────────────────────────────
staleness_signals:
  index_older_than_corpus:
    detection: "Any indexed source file has an mtime newer than the trigger index mtime"
    severity: medium
  manifest_hash_mismatch:
    detection: "The index's recorded manifestHash does not match a fresh manifest over the same included paths"
    severity: medium
  lookup_exit_error:
    detection: "The lookup command exits 2 or higher, or emits stderr"
    severity: high
    note: "An exit of 1 is a clean no-hit and is never a staleness signal. Conflating the two is the failure this row exists to prevent."
  ripgrep_ambient_config:
    detection: "A recipe run without --no-config returns a different result set than the same recipe with it, meaning RIPGREP_CONFIG_PATH is injecting arguments"
    severity: high
  trigger_phrase_drift:
    detection: "Frontmatter trigger_phrases changed in a source file since the index was generated"
    severity: low
  anchor_marker_drift:
    detection: "Unmatched or orphan <!-- ANCHOR:id --> / <!-- /ANCHOR:id --> pairs in indexed packets"
    severity: low
  corpus_pollution:
    detection: "Indexed trigger_phrases that are generic workflow words or stopword-only phrases per retrieval-conventions.md section 8"
    severity: high
  schema_version_mismatch:
    detection: "The index schema version does not match the version the lookup script expects"
    severity: high

# ─────────────────────────────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────────────────────────────
workflow:
  phase_0_discovery:
    purpose: Confirm the index exists, the lookup runs and a ripgrep recipe resolves; capture baseline
    activities:
      - "Bash: test -f .opencode/skills/system-spec-kit/runtime/data/trigger-index.json (index present)"
      - "Bash: stat -f '%m %z' .opencode/skills/system-spec-kit/runtime/data/trigger-index.json (mtime + size)"
      - "Run upstream_assets.lookup_command with a known probe prompt; record exit status, indexHash, manifestHash and candidatePhraseCount"
      - "Run the path-only recipe from retrieval-conventions.md section 2.2 for a known phrase; record exit status and path count"
      - "Re-run that recipe with the roots set to a path that does not exist; confirm exit 2 with stderr, proving the wrapper can tell a broken invocation from a clean miss"
      - "Interactive gate: before_phase_1_analysis"
    outputs:
      - index_present: true|false
      - index_mtime: {path: string, mtime: epoch_seconds}
      - index_size: {path: string, size: bytes}
      - lookup_exit: 0|1|2+
      - index_hash: string
      - manifest_hash: string
      - candidate_phrase_count: N
      - ripgrep_exit: 0|1|2+
      - ripgrep_path_count: N
    validation: discovery_complete
    fail_fast:
      - "Lookup exits 2 or higher → STATUS=FAIL with stderr attached"
      - "Index file missing → STATUS=MISSING, message='trigger index not generated'; the ripgrep lane still works and is reported separately"

  phase_1_analysis:
    purpose: Classify staleness signals + identify suspect packets
    activities:
      - "Cross-reference the index mtime with source mtimes: any indexed file newer than the index signals staleness"
      - "Sample up to 5 packets flagged as staleness candidates"
      - "For each sample, read its frontmatter trigger_phrases and compare against the phrases the index holds for that path (read-only)"
      - "Screen the sampled phrases against the retrieval-conventions.md section 8 warn list for corpus pollution"
      - "Aggregate signals into a staleness_classes count map"
      - "Interactive gate: before_phase_2_recommendation"
    outputs:
      - staleness_classes:
          index_older_than_corpus: N
          manifest_hash_mismatch: M
          lookup_exit_error: K
          ripgrep_ambient_config: L
          trigger_phrase_drift: P
          anchor_marker_drift: Q
          corpus_pollution: R
          schema_version_mismatch: S
      - sample_staleness_explanations: [up to 5 entries]
      - severity_max: low|medium|high
    validation: analysis_complete

  phase_2_recommendation:
    purpose: Translate staleness signals into recommended action
    rules:
      - "If severity_max == high (schema mismatch, lookup error, ambient config, or corpus pollution) → recommend a full regeneration via /doctor:update, or a corpus fix first when the signal is pollution"
      - "If severity_max == medium (index older than corpus OR manifest hash mismatch) → recommend an incremental regeneration via /doctor:update"
      - "If severity_max == low (trigger phrase OR anchor drift) → recommend monitoring; rerun in 1-2 weeks"
      - "If no staleness → status=OK, no action needed"
      - "A lookup exit of 1 with a healthy index is a correct empty answer, not a finding. Never recommend a regeneration to make a no-hit disappear."
    outputs:
      - status: OK|DEGRADED|STALE|MISSING
      - recommended_command: string
      - recommended_when: now|low-activity-window|monitor

  phase_3_report:
    purpose: Emit packet-local report + state log
    activities:
      - "Compose report following the OUTPUT CONTRACT below"
      - "Write to <packet_scratch>/doctor-speckit-retrieval-report.<timestamp>.md (mutation class: add-only per _routes.yaml; the trigger index itself stays read-only)"
      - "Print summary table to stdout"
    outputs:
      - report_path: string
      - status: STATUS_OK | STATUS_DEGRADED | STATUS_STALE | STATUS_MISSING
    validation: report_emitted

# ─────────────────────────────────────────────────────────────────
# OUTPUT CONTRACT
# ─────────────────────────────────────────────────────────────────
output_contract:
  format: markdown
  required_sections:
    - status_header
    - index_state_table
    - staleness_signals_block
    - recommendation_block
  optional_sections:
    - sample_staleness_explanations
  state_log:
    path: "<packet_scratch>/doctor-speckit-retrieval-state.<timestamp>.json"
    schema:
      command: "/doctor speckit-retrieval"
      mode: INTERACTIVE
      intent: DIAGNOSE
      timestamp: ISO_8601
      duration_seconds: number
      status: OK|DEGRADED|STALE|MISSING|FAIL|CANCELLED
      staleness_classes: object
      recommendation: string

# ─────────────────────────────────────────────────────────────────
# HALT CONDITIONS
# ─────────────────────────────────────────────────────────────────
halt_conditions:
  - "Phase 0 lookup exits 2 or higher → STATUS=FAIL with stderr attached"
  - "Trigger index missing entirely → STATUS=MISSING (not FAIL); recommend /doctor:update to generate it"
  - "Any phase emits a write attempt outside the packet scratch → STATUS=FAIL with ERROR='confirm-mode-mutation-violation'"
  - "User answers `n` at any interactive gate → STATUS=CANCELLED and emit state log"
