  - { host: cursor, event: beforeSubmitPrompt, path: ".opencode/skills/system-spec-kit/runtime/hooks/cursor/spec-gate-classify.mjs", type: file_exists }
  - { host: cursor, event: beforeSubmitPrompt, path: ".opencode/skills/system-spec-kit/runtime/dist/hooks/cursor/user-prompt-submit.js", type: file_exists }
