  - { host: codex, event: Stop, path: ".opencode/scripts/session-cleanup.sh", type: file_exists }
  - { host: codex, event: PreCompact, path: ".opencode/skills/system-spec-kit/runtime/dist/hooks/codex/compact-inject.js", type: file_exists }
  - { host: devin, event: SessionStart, path: ".opencode/skills/system-spec-kit/runtime/dist/hooks/devin/session-start.js", type: file_exists }
  - { host: devin, event: UserPromptSubmit, path: ".opencode/skills/system-spec-kit/runtime/dist/hooks/devin/user-prompt-submit.js", type: file_exists }
  - { host: devin, event: PreToolUse, path: ".opencode/skills/sk-git/scripts/hooks/git-preflight-advisory.mjs", type: file_exists }
