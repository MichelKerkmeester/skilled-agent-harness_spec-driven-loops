  - { host: codex, event: SessionStart, path: ".opencode/skills/system-spec-kit/runtime/dist/hooks/codex/session-start.js", type: file_exists }
  - { host: codex, event: SessionStart, path: ".opencode/bin/worktree-guard.sh", type: file_exists }
  - { host: codex, event: SessionStart, path: ".opencode/bin/check-git-hooks.sh", type: file_exists }
  - { host: codex, event: SessionStart, path: ".opencode/bin/git-live-follow.sh", type: file_exists }
  - { host: codex, event: SessionStart, path: ".opencode/skills/sk-code/sk-code-quality/scripts/check-dist-staleness.sh", type: file_exists }
  - { host: codex, event: UserPromptSubmit, path: ".opencode/skills/system-spec-kit/runtime/dist/hooks/codex/user-prompt-submit.js", type: file_exists }
  - { host: codex, event: UserPromptSubmit, path: ".opencode/skills/system-spec-kit/runtime/hooks/codex/spec-gate-classify.mjs", type: file_exists }
  - { host: codex, event: PreToolUse, path: ".opencode/hooks/dispatch/codex/dispatch-preflight-lint.mjs", type: file_exists }
  - { host: codex, event: PreToolUse, path: ".opencode/skills/sk-git/scripts/hooks/git-preflight-advisory.mjs", type: file_exists }
  - { host: codex, event: PreToolUse, path: ".opencode/skills/system-spec-kit/runtime/hooks/codex/spec-gate-enforce.mjs", type: file_exists }
