name: Provision dependency trees

description: >-
  Restore the provisioned dependency trees and build outputs from the Actions cache,
  then run the repository's own provisioning walk. The walk checks only that each
  tree's first dependency directory exists and that the five listed build outputs
  carry a stamp matching the tracked sources their list line names. The other cached
  outputs have no walk check, so a cache hit shortens the install and build work and
  is not a check of installed versions or of every build input.

inputs:
  cache:
    description: Set to false to force a cold provision, so the install path still runs.
    default: 'true'
  bun-version:
    description: The bun version the two bun-built packages need.
    default: '1.3.9'

runs:
  using: composite
  steps:
    - id: node
      shell: bash
      run: echo "major=$(node -p 'process.versions.node.split(".")[0]')" >> "$GITHUB_OUTPUT"

    - id: restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          .skilled/node_modules
          .opencode/node_modules
          .skilled/skills/sk-vision/vision-runtime/node_modules
          .skilled/skills/system-spec-kit/node_modules
          .skilled/skills/system-skill-advisor/runtime/node_modules
          .skilled/skills/system-deep-loop/node_modules
          .skilled/skills/system-deep-loop/runtime/node_modules
          .skilled/skills/sk-doc/node_modules
          .pi/extensions/pi-cache-optimizer/node_modules
          .pi/extensions/pi-fast-mode-w-subagent-support/node_modules
          .skilled/skills/sk-design/sk-design-md-generator/backend/node_modules
          .skilled/skills/sk-vision/vision-runtime/dist
          .skilled/skills/sk-vision/hooks/opencode/sk-vision.js
          .skilled/skills/system-spec-kit/shared/dist
          .skilled/skills/system-spec-kit/runtime/dist
          .skilled/skills/system-spec-kit/runtime/cli/dist
          .skilled/skills/system-skill-advisor/runtime/dist
          .skilled/skills/sk-design/sk-design-md-generator/backend/dist
          .skilled/skills/system-spec-kit/.node-version-marker
          .git/provision-stamps
          ~/.npm
        key: provision-${{ runner.os }}-node${{ steps.node.outputs.major }}-bun${{ inputs.bun-version }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/bun.lockb', '.skilled/package.json', '.opencode/package.json', '.skilled/skills/sk-vision/vision-runtime/package.json', '.skilled/skills/system-spec-kit/package.json', '.skilled/skills/system-spec-kit/shared/package.json', '.skilled/skills/system-spec-kit/runtime/package.json', '.skilled/skills/system-spec-kit/runtime/cli/package.json', '.skilled/skills/system-skill-advisor/runtime/package.json', '.skilled/skills/system-deep-loop/package.json', '.skilled/skills/system-deep-loop/runtime/package.json', '.skilled/skills/sk-doc/package.json', '.pi/extensions/pi-cache-optimizer/package.json', '.pi/extensions/pi-fast-mode-w-subagent-support/package.json', '.skilled/skills/sk-design/sk-design-md-generator/backend/package.json', '.skilled/skills/system-spec-kit/.npmrc', '.skilled/skills/system-spec-kit/tsconfig.json', '.skilled/skills/system-spec-kit/runtime/tsconfig.json', '.skilled/skills/sk-git/scripts/worktree-provision-paths.txt', '.skilled/skills/sk-git/scripts/worktree-naming.sh', '.github/actions/setup/action.yml') }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - shell: bash
      run: |
        set -euo pipefail
        source .skilled/skills/sk-git/scripts/worktree-naming.sh
        provision_worktree "$GITHUB_WORKSPACE"

    - if: inputs.cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.restore.outputs.cache-primary-key }}
        path: |
          .skilled/node_modules
          .opencode/node_modules
          .skilled/skills/sk-vision/vision-runtime/node_modules
          .skilled/skills/system-spec-kit/node_modules
          .skilled/skills/system-skill-advisor/runtime/node_modules
          .skilled/skills/system-deep-loop/node_modules
          .skilled/skills/system-deep-loop/runtime/node_modules
          .skilled/skills/sk-doc/node_modules
          .pi/extensions/pi-cache-optimizer/node_modules
          .pi/extensions/pi-fast-mode-w-subagent-support/node_modules
          .skilled/skills/sk-design/sk-design-md-generator/backend/node_modules
          .skilled/skills/sk-vision/vision-runtime/dist
          .skilled/skills/sk-vision/hooks/opencode/sk-vision.js
          .skilled/skills/system-spec-kit/shared/dist
          .skilled/skills/system-spec-kit/runtime/dist
          .skilled/skills/system-spec-kit/runtime/cli/dist
          .skilled/skills/system-skill-advisor/runtime/dist
          .skilled/skills/sk-design/sk-design-md-generator/backend/dist
          .skilled/skills/system-spec-kit/.node-version-marker
          .git/provision-stamps
          ~/.npm
