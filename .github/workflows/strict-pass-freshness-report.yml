name: Strict Pass Freshness Report

# Whole-corpus visibility, deliberately NOT a merge gate. The per-PR gate in
# changed-packet-validation.yml catches what a change breaks; nothing else
# notices a toolchain change that breaks packets no PR touched, which is the
# failure this run exists to surface.
#
# It reports and does not block. The job it replaces carried continue-on-error
# on the sweep and then tested the recorded outcome in a downstream job, so a
# known-failure state reported success — a gate that cannot fail is worse than
# no gate, because it is read as one.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  strict-pass-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The validator loads TypeScript rule modules that import across the
      # runtime package, so installing only the cli workspace leaves every
      # one of those rules erroring — which reads as thousands of failing packets
      # rather than as a missing toolchain.
      - name: Install spec-kit dependencies
        # Only the package root carries a lockfile; shared, runtime and
        # runtime/cli are workspaces of it, so the root install is what
        # provisions all three in one pass. Installing a workspace directly
        # fails for want of its own lockfile.
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
          ( cd .opencode/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
          npm --prefix .opencode/skills/system-spec-kit/runtime run build

      # Without a stored baseline every failing folder reads as a first run, so a
      # regression is indistinguishable from debt the packet already carried. The
      # last successful run's uploaded report is the only record of what passed
      # before, and its absence is expected exactly once: the run that records the
      # baseline for the next one.
      - name: Fetch the previous baseline report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          baseline_dir=.strict-pass-freshness/baseline
          mkdir -p "$baseline_dir"

          # The baseline must come from the same branch as this run, so the ref
          # name narrows the lookup. No match yields an empty id, which is a first
          # run rather than an error.
          run_id=$(gh run list \
            --workflow strict-pass-freshness-report.yml \
            --branch "$GITHUB_REF_NAME" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty') || run_id=""

          if [ -z "$run_id" ]; then
            echo "::notice::No baseline report found; this run records the baseline"
            exit 0
          fi

          # An expired or deleted artifact fails the download; that is still the
          # no-baseline case rather than an error of this run.
          if ! gh run download "$run_id" \
                 --pattern 'strict-pass-freshness-report-*' \
                 --dir "$baseline_dir"; then
            echo "::notice::No baseline report found; this run records the baseline"
            exit 0
          fi

          # A pattern match extracts under a per-artifact directory, so locate the
          # report rather than assume a fixed depth. A report that will not parse
          # is no baseline either: the sweep aborts on one instead of recording it.
          baseline_report=$(find "$baseline_dir" -name report.json -type f -print -quit)
          if [ -z "$baseline_report" ] || ! node -e '
                const fs = require("node:fs");
                const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (!Array.isArray(report.results)) process.exit(1);
              ' "$baseline_report" 2>/dev/null; then
            echo "::notice::No baseline report found; this run records the baseline"
            exit 0
          fi

          # Steps are separate shells, and the sweep reads this to decide whether
          # to compare against the report or record a fresh baseline.
          echo "BASELINE_REPORT=$baseline_report" >> "$GITHUB_ENV"
          echo "Baseline report from run $run_id: $baseline_report"

      - name: Sweep the corpus
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .strict-pass-freshness

          # A baseline turns known debt into known-failure rows and surfaces a
          # regression instead of re-reporting every failure as a first run.
          baseline_args=()
          if [ -n "${BASELINE_REPORT:-}" ]; then
            baseline_args=(--baseline "$BASELINE_REPORT")
            echo "Sweeping against baseline $BASELINE_REPORT"
          fi

          # The leading ./ is load-bearing: node --import reads a bare path as a
          # package name, so without it the loader never resolves and the sweep
          # dies before it reads a single packet.
          node --import ./.opencode/skills/system-spec-kit/node_modules/tsx/dist/loader.mjs \
            .opencode/skills/system-spec-kit/runtime/cli/sweep/strict-pass-freshness.ts \
            --roots specs \
            "${baseline_args[@]}" \
            --format json > .strict-pass-freshness/report.json
          sweep_status=$?

          # A non-zero status because packets fail is the report, not an error.
          # A report that will not parse means the sweep never ran, and that must
          # fail loudly rather than publish an empty artifact that reads as clean.
          if ! node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' \
                 .strict-pass-freshness/report.json 2>/dev/null; then
            echo "::error::Sweep produced no readable report (exit $sweep_status); it did not run"
            exit 1
          fi

          # shellcheck disable=SC2016 # the quoted script is JavaScript, so its ${} is not the shell's
          node -e '
            const r = JSON.parse(require("fs").readFileSync(".strict-pass-freshness/report.json","utf8"));
            const rows = r.results ?? [];
            const by = rows.reduce((a,x) => (a[x.status] = (a[x.status] ?? 0) + 1, a), {});
            console.log("packets swept:", rows.length);
            for (const [k,v] of Object.entries(by)) console.log(`  ${k}: ${v}`);
            const regressions = by.regression ?? 0;
            if (regressions > 0) {
              console.log("");
              console.log(`::warning::${regressions} packet(s) regressed against the stored baseline`);
              // Folder names come from the tree and can hold line breaks or "::"
              // text, which the runner would read as workflow commands. Command
              // parsing stays off until the random token closes the block.
              const token = require("node:crypto").randomUUID();
              console.log(`::stop-commands::${token}`);
              for (const x of rows.filter(y => y.status === "regression").slice(0, 25)) {
                console.log(`  ${x.folder}: ${x.message}`);
              }
              console.log(`::${token}::`);
            }
          '

      # Reports only; the repair flag is deliberately absent. A gate that
      # silently rewrote packets would erase the drift it exists to surface, and
      # nobody would learn that a rename left records pointing at the old place.
      - name: Derived-repair drift report
        continue-on-error: true
        run: |
          set -euo pipefail
          # The report names packet folders, and a folder name can hold a line break
          # followed by workflow-command text. The output is replayed inside a
          # stop-commands block that only a random token closes.
          report="$(mktemp)"
          node .opencode/skills/system-spec-kit/runtime/cli/spec/repair-derived.cjs --roots specs > "$report" 2>&1 || true
          token="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          [[ -n "$token" ]] || exit 1
          printf '::stop-commands::%s\n' "$token"
          cat "$report"
          printf '\n::%s::\n' "$token"
          rm -f "$report"

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-pass-freshness-report-${{ github.run_id }}
          path: .strict-pass-freshness/report.json
          if-no-files-found: error
