name: sk-git Script Tests

# The worktree naming, allocation and provisioning suite ran in no workflow, so a
# broken allocator or provisioning rule reached main unseen. The suite builds its
# own throwaway repositories and stubs every installer, so it needs only git, bash
# and node, which reads package manifests.
# It also runs when any tracked package manifest changes, because the suite
# checks every one against the provisioning list.
on:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/skills/sk-git/**'
      - '.opencode/skills/sk-git/**'
      - '.skilled/**/package.json'
      - '.opencode/**/package.json'
      - '.pi/**/package.json'
      - '.github/workflows/sk-git-script-tests.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/skills/sk-git/**'
      - '.opencode/skills/sk-git/**'
      - '.skilled/**/package.json'
      - '.opencode/**/package.json'
      - '.pi/**/package.json'
      - '.github/workflows/sk-git-script-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sk-git-scripts:
    name: sk-git script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run the worktree-naming suite
        run: bash .skilled/skills/sk-git/scripts/tests/worktree-naming.test.sh
