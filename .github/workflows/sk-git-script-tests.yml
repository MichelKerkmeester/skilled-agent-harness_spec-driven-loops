name: sk-git Script Tests

# The worktree naming, allocation and provisioning suite ran in no workflow, so a
# broken allocator or provisioning rule reached main unseen. The suite builds its
# own throwaway repositories and stubs every installer, so it needs only git, bash
# and node, which reads package manifests.
# It also runs when any tracked package manifest changes, because the suite
# checks every one against the provisioning list.
on:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/skills/sk-git/**'
      - '.opencode/skills/sk-git/**'
      - '.skilled/**/package.json'
      - '.opencode/**/package.json'
      - '.pi/**/package.json'
      - '.github/workflows/sk-git-script-tests.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/skills/sk-git/**'
      - '.opencode/skills/sk-git/**'
      - '.skilled/**/package.json'
      - '.opencode/**/package.json'
      - '.pi/**/package.json'
      - '.github/workflows/sk-git-script-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sk-git-scripts:
    name: sk-git script tests
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_TESTS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run the worktree-naming suite
        run: bash .skilled/skills/sk-git/scripts/tests/worktree-naming.test.sh

      - name: Run the commit-id-naming suite
        run: bash .skilled/skills/sk-git/scripts/tests/commit-id-naming.test.sh

      - name: Run the migrate-legacy-branch-names suite
        run: bash .skilled/skills/sk-git/scripts/tests/migrate-legacy-branch-names.test.sh

      # stamp-branch.sh rewrites commit messages with git-filter-repo and exits 2
      # without it, and the runner image does not ship it.
      - name: Install git-filter-repo
        run: python3 -m pip install git-filter-repo==2.47.0

      - name: Run the stamp-branch suite
        run: bash .skilled/skills/sk-git/scripts/tests/stamp-branch.test.sh

      - name: Run the validate-message-git-timeout suite
        run: node --test .skilled/skills/sk-git/scripts/tests/validate-message-git-timeout.test.mjs
