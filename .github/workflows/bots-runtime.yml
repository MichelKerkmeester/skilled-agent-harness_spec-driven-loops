name: Bots Runtime Tests

# The bots runtime suites and the post-commit enqueue harness ran only on a
# developer's machine, so a broken runner, queue or installer could reach main
# with no check failing. The runtime imports the deep-loop ledger and executor
# libraries, so a change there runs these suites too.
on:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/skills/system-skilled-bots/**'
      - '.opencode/skills/system-skilled-bots/**'
      - '.skilled/skills/system-deep-loop/runtime/lib/**'
      - '.opencode/skills/system-deep-loop/runtime/lib/**'
      - '.skilled/skills/system-deep-loop/runtime/scripts/lib/**'
      - '.opencode/skills/system-deep-loop/runtime/scripts/lib/**'
      - '.skilled/skills/system-deep-loop/package*.json'
      - '.opencode/skills/system-deep-loop/package*.json'
      - '.skilled/skills/system-deep-loop/runtime/package*.json'
      - '.opencode/skills/system-deep-loop/runtime/package*.json'
      - '.skilled/skills/system-spec-kit/package*.json'
      - '.opencode/skills/system-spec-kit/package*.json'
      - '.skilled/skills/system-spec-kit/shared/**'
      - '.opencode/skills/system-spec-kit/shared/**'
      - '.skilled/skills/sk-code/shared/scripts/lib/repository-identity.cjs'
      - '.opencode/skills/sk-code/shared/scripts/lib/repository-identity.cjs'
      - '.skilled/hooks/shared/hook-flags.sh'
      - '.opencode/hooks/shared/hook-flags.sh'
      - '.skilled/scripts/git-hooks/lib/autostash-orphan-guard.sh'
      - '.opencode/scripts/git-hooks/lib/autostash-orphan-guard.sh'
      - '.skilled/scripts/git-hooks/post-commit'
      - '.opencode/scripts/git-hooks/post-commit'
      - '.skilled/bin/bots.cjs'
      - '.opencode/bin/bots.cjs'
      - '.github/workflows/bots-runtime.yml'
      - '.skilled/crates/bots-tui/**'
      # .opencode holds no crates folder, so git reports no changes beneath this path.
      # The gate-input check requires every source-root filter to name both roots, so
      # this twin is required and inert.
      - '.opencode/crates/bots-tui/**'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/skills/system-skilled-bots/**'
      - '.opencode/skills/system-skilled-bots/**'
      - '.skilled/skills/system-deep-loop/runtime/lib/**'
      - '.opencode/skills/system-deep-loop/runtime/lib/**'
      - '.skilled/skills/system-deep-loop/runtime/scripts/lib/**'
      - '.opencode/skills/system-deep-loop/runtime/scripts/lib/**'
      - '.skilled/skills/system-deep-loop/package*.json'
      - '.opencode/skills/system-deep-loop/package*.json'
      - '.skilled/skills/system-deep-loop/runtime/package*.json'
      - '.opencode/skills/system-deep-loop/runtime/package*.json'
      - '.skilled/skills/system-spec-kit/package*.json'
      - '.opencode/skills/system-spec-kit/package*.json'
      - '.skilled/skills/system-spec-kit/shared/**'
      - '.opencode/skills/system-spec-kit/shared/**'
      - '.skilled/skills/sk-code/shared/scripts/lib/repository-identity.cjs'
      - '.opencode/skills/sk-code/shared/scripts/lib/repository-identity.cjs'
      - '.skilled/hooks/shared/hook-flags.sh'
      - '.opencode/hooks/shared/hook-flags.sh'
      - '.skilled/scripts/git-hooks/lib/autostash-orphan-guard.sh'
      - '.opencode/scripts/git-hooks/lib/autostash-orphan-guard.sh'
      - '.skilled/scripts/git-hooks/post-commit'
      - '.opencode/scripts/git-hooks/post-commit'
      - '.skilled/bin/bots.cjs'
      - '.opencode/bin/bots.cjs'
      - '.github/workflows/bots-runtime.yml'
      - '.skilled/crates/bots-tui/**'
      # .opencode holds no crates folder, so git reports no changes beneath this path.
      # The gate-input check requires every source-root filter to name both roots, so
      # this twin is required and inert.
      - '.opencode/crates/bots-tui/**'
      - 'specs/system-skilled-bots/003-openbot-parity-build/003-terminal-screen/001-ux-and-component-map/design/**'
      - 'specs/system-skilled-bots/003-openbot-parity-build/003-terminal-screen/002-architecture-and-contracts/design/**'
      - 'specs/system-skilled-bots/003-openbot-parity-build/010-conversations/001-chat-ux-and-pane-map/design/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bots-runtime:
    name: Bots runtime vitest suites and post-commit harness
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_TESTS != 'off'
    # Bots run only on macOS: the scheduler is launchd and desktop delivery is
    # osascript. The suites stub both, but the runner's process and path handling
    # is only proven on the platform it ships for.
    runs-on: macos-latest
    # One local run of the suite takes about 65 seconds. The four installs take
    # most of the job, so the limit leaves room for a cold npm cache.
    timeout-minutes: 20
    steps:
      # No suite in this job reads loop state, so the checkout skips the research, review,
      # scratch and archive folders under specs/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /*
            !/specs/**/research/
            !/specs/**/review/
            !/specs/**/scratch/
            !/specs/**/z_archive/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The bots runtime imports deep-loop runtime modules, which resolve their own
      # packages and link @spec-kit/shared by path. The typecheck uses the spec-kit
      # workspace's tsc, so that workspace is installed first.
      - name: Install the bots runtime and the runtimes it imports
        run: |
          set -euo pipefail
          npm --prefix .skilled/skills/system-spec-kit ci
          ( cd .skilled/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
          npm --prefix .skilled/skills/system-deep-loop ci
          npm --prefix .skilled/skills/system-deep-loop/runtime ci
          npm --prefix .skilled/skills/system-skilled-bots/runtime ci

      - name: Typecheck the bots runtime
        run: npm --prefix .skilled/skills/system-skilled-bots/runtime run typecheck

      - name: Run the bots runtime suites
        run: npm --prefix .skilled/skills/system-skilled-bots/runtime test

      - name: Run the post-commit enqueue harness
        run: bash .skilled/skills/system-skilled-bots/runtime/tests/post-commit-leg.test.sh

  bots-tui:
    name: Bots terminal screen crate
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_TESTS != 'off'
    # The screen draws in any Unix terminal and ships for macOS and Linux, so the
    # Linux runner proves the crate. The toolchain and every action are pinned by
    # commit, so a moved tag cannot change the compiler under the job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@3334128f4a3bea6d0d6718ee50ff473f7f275e31 # dtolnay/rust-toolchain@1.92.0
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt

      - name: Keep the cargo registry and the build output between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .skilled/crates/bots-tui/target
          key: bots-tui-${{ runner.os }}-${{ hashFiles('.skilled/crates/bots-tui/Cargo.lock') }}

      # cargo fmt rejects --locked, so only the three steps that resolve the lock carry it.
      - name: Check the formatting
        run: cargo fmt --check --manifest-path .skilled/crates/bots-tui/Cargo.toml

      - name: Lint with warnings denied
        run: cargo clippy --locked --manifest-path .skilled/crates/bots-tui/Cargo.toml --all-targets -- -D warnings

      - name: Run the crate tests
        run: cargo test --locked --manifest-path .skilled/crates/bots-tui/Cargo.toml

      - name: Build the release binary the ui verb starts
        run: cargo build --release --locked --manifest-path .skilled/crates/bots-tui/Cargo.toml

      # The crate ships a copy of the packet's design files and sample payloads, so
      # an edit made on one side only fails here rather than drifting.
      - name: Keep the shipped design copy equal to the packet copies
        run: |
          set -euo pipefail
          D1=specs/system-skilled-bots/003-openbot-parity-build/003-terminal-screen/001-ux-and-component-map/design
          D2=specs/system-skilled-bots/003-openbot-parity-build/003-terminal-screen/002-architecture-and-contracts/design
          D3=specs/system-skilled-bots/003-openbot-parity-build/010-conversations/001-chat-ux-and-pane-map/design
          diff -r -x architecture.md -x contracts.md -x chat-mockups.md "$D1" .skilled/crates/bots-tui/design
          diff "$D2/architecture.md" .skilled/crates/bots-tui/design/architecture.md
          diff "$D2/contracts.md" .skilled/crates/bots-tui/design/contracts.md
          diff "$D3/mockups.md" .skilled/crates/bots-tui/design/chat-mockups.md
          for name in status activity inbox routines; do
            diff "$D2/payloads/$name.json" ".skilled/crates/bots-tui/tests/fixtures/payloads/$name.json"
          done
