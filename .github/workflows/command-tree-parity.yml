name: Command Tree Parity

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/commands/**'
      - '.opencode/commands/**'
      - '.claude/commands/**'
      - '.cursor/commands/**'
      - '.claude/agents/**'
      - '.skilled/agents/**'
      - '.opencode/agents/**'
      - '.cursor/agents/**'
      - '.devin/agents/**'
      - '.skilled/skills/**/SKILL.md'
      - '.opencode/skills/**/SKILL.md'
      - '.dsh/**'
      - '.skilled/skills/system-spec-kit/**'
      - '.opencode/skills/system-spec-kit/**'
      - '.claude/settings.json'
      - '.claude/hooks/**'
      - '.codex/hooks.json'
      - '.codex/hooks/**'
      - '.cursor/hooks.json'
      - '.cursor/hooks/**'
      - '.devin/hooks.v1.json'
      - '.devin/hooks/**'
      - '.github/workflows/command-tree-parity.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/commands/**'
      - '.opencode/commands/**'
      - '.claude/commands/**'
      - '.cursor/commands/**'
      - '.claude/agents/**'
      - '.skilled/agents/**'
      - '.opencode/agents/**'
      - '.cursor/agents/**'
      - '.devin/agents/**'
      - '.skilled/skills/**/SKILL.md'
      - '.opencode/skills/**/SKILL.md'
      - '.dsh/**'
      - '.skilled/skills/system-spec-kit/**'
      - '.opencode/skills/system-spec-kit/**'
      - '.claude/settings.json'
      - '.claude/hooks/**'
      - '.codex/hooks.json'
      - '.codex/hooks/**'
      - '.cursor/hooks.json'
      - '.cursor/hooks/**'
      - '.devin/hooks.v1.json'
      - '.devin/hooks/**'
      - '.github/workflows/command-tree-parity.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every model load runs on the CPU, so the onnxruntime-node install skips its Linux CUDA
  # provider download: unused here, and the install step that fails when that host times out.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  command-tree-parity:
    name: OpenCode and Claude command trees stay identical
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_TESTS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install the spec-kit workspace
        # The checkers require @spec-kit/shared, a workspace package that only
        # resolves after an install links it, so a bare checkout cannot
        # find the module; the checker imports a checked-in source module, so no
        # build is needed.
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
      - name: Compare command trees
        run: |
          set -euo pipefail
          CHECKER=".opencode/skills/system-spec-kit/runtime/cli/validate-command-tree-parity.sh"
          # Fail closed in CI: a required guard must exist. A PR that deletes or
          # moves the checker must not silently disable its own gate.
          if [ ! -f "$CHECKER" ]; then
            echo "::error::Command tree parity checker not found at $CHECKER — failing closed."
            exit 1
          fi
          if ! bash "$CHECKER"; then
            echo "::error::OpenCode and Claude command trees differ — see the diff above."
            exit 1
          fi
          echo "Command trees are byte-identical."

  dsh-mirror:
    # The DSH runtime reads generated skill, agent and prompt copies. Its source and
    # output paths are filtered above so changes to either side run these checks.
    name: DSH skill, agent and prompt mirrors match their sources
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_TESTS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install the spec-kit workspace
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
      - name: Compare the DSH mirrors with their sources
        run: |
          set -euo pipefail
          node .opencode/skills/system-spec-kit/runtime/cli/dsh/sync-skills-dsh.cjs --check
          node .opencode/skills/system-spec-kit/runtime/cli/dsh/sync-prompts-dsh.cjs --check
          node .opencode/skills/system-spec-kit/runtime/cli/dsh/sync-agents-dsh.cjs --check
