name: Command Tree Parity

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/commands/**'
      - '.opencode/commands/**'
      - '.claude/commands/**'
      - '.cursor/commands/**'
      - '.claude/agents/**'
      - '.skilled/agents/**'
      - '.opencode/agents/**'
      - '.cursor/agents/**'
      - '.devin/agents/**'
      - '.skilled/skills/**/SKILL.md'
      - '.opencode/skills/**/SKILL.md'
      - '.hermes/**'
      - '.skilled/skills/system-spec-kit/**'
      - '.opencode/skills/system-spec-kit/**'
      - '.claude/settings.json'
      - '.claude/hooks/**'
      - '.codex/hooks.json'
      - '.codex/hooks/**'
      - '.cursor/hooks.json'
      - '.cursor/hooks/**'
      - '.devin/hooks.v1.json'
      - '.devin/hooks/**'
      - '.github/workflows/command-tree-parity.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/commands/**'
      - '.opencode/commands/**'
      - '.claude/commands/**'
      - '.cursor/commands/**'
      - '.claude/agents/**'
      - '.skilled/agents/**'
      - '.opencode/agents/**'
      - '.cursor/agents/**'
      - '.devin/agents/**'
      - '.skilled/skills/**/SKILL.md'
      - '.opencode/skills/**/SKILL.md'
      - '.hermes/**'
      - '.skilled/skills/system-spec-kit/**'
      - '.opencode/skills/system-spec-kit/**'
      - '.claude/settings.json'
      - '.claude/hooks/**'
      - '.codex/hooks.json'
      - '.codex/hooks/**'
      - '.cursor/hooks.json'
      - '.cursor/hooks/**'
      - '.devin/hooks.v1.json'
      - '.devin/hooks/**'
      - '.github/workflows/command-tree-parity.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  command-tree-parity:
    name: OpenCode and Claude command trees stay identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Provision the dependency trees the parity checkers load
        uses: ./.github/actions/setup
      - name: Compare command trees
        run: |
          set -euo pipefail
          CHECKER=".opencode/skills/system-spec-kit/runtime/cli/validate-command-tree-parity.sh"
          # Fail closed in CI: a required guard must exist. A PR that deletes or
          # moves the checker must not silently disable its own gate.
          if [ ! -f "$CHECKER" ]; then
            echo "::error::Command tree parity checker not found at $CHECKER — failing closed."
            exit 1
          fi
          if ! bash "$CHECKER"; then
            echo "::error::OpenCode and Claude command trees differ — see the diff above."
            exit 1
          fi
          echo "Command trees are byte-identical."

  hermes-mirror:
    # The Hermes runtime reads generated copies of every skill's SKILL.md, of the agent
    # personas and of the command prompts. The filter above names each of those sources,
    # so an edit to any of them runs this job; a missed input is what lets a stale copy
    # land green, which is the failure this job exists to catch.
    name: Hermes skill and prompt copies match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Provision the dependency trees the Hermes checkers load
        uses: ./.github/actions/setup
      - name: Compare the Hermes copies with their sources
        run: |
          set -euo pipefail
          node .opencode/skills/system-spec-kit/runtime/cli/hermes/sync-skills-hermes.cjs --check
          node .opencode/skills/system-spec-kit/runtime/cli/hermes/sync-prompts-hermes.cjs --check
