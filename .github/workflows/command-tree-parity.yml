name: Command Tree Parity

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'skilled/**']
  push:
    branches: [main, 'skilled/**']

permissions:
  contents: read

jobs:
  command-tree-parity:
    name: OpenCode and Claude command trees stay identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the spec-kit workspace
        # The checkers require @spec-kit/shared, a workspace package that only
        # resolves after an install links it, so a bare checkout cannot
        # find the module; the checker imports a checked-in source module, so no
        # build is needed.
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
      - name: Compare command trees
        run: |
          set -euo pipefail
          CHECKER=".opencode/skills/system-spec-kit/runtime/cli/validate-command-tree-parity.sh"
          # Fail closed in CI: a required guard must exist. A PR that deletes or
          # moves the checker must not silently disable its own gate.
          if [ ! -f "$CHECKER" ]; then
            echo "::error::Command tree parity checker not found at $CHECKER — failing closed."
            exit 1
          fi
          if ! bash "$CHECKER"; then
            echo "::error::OpenCode and Claude command trees differ — see the diff above."
            exit 1
          fi
          echo "Command trees are byte-identical."

  hermes-mirror:
    # The Hermes runtime reads generated copies of every skill's SKILL.md and of the
    # command prompts. An edit to any skill can leave its copy stale, and no path filter
    # narrow enough to keep a heavier workflow cheap sees every such edit, so the copies
    # are compared here, on every push and pull request.
    name: Hermes skill and prompt copies match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the spec-kit workspace
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
      - name: Compare the Hermes copies with their sources
        run: |
          set -euo pipefail
          node .opencode/skills/system-spec-kit/runtime/cli/hermes/sync-skills-hermes.cjs --check
          node .opencode/skills/system-spec-kit/runtime/cli/hermes/sync-prompts-hermes.cjs --check
