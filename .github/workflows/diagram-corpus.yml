name: Diagram Corpus

on:
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.opencode/skills/sk-design/sk-design-diagram/**'
      - '.github/workflows/diagram-corpus.yml'
  pull_request:
    paths:
      - '.opencode/skills/sk-design/sk-design-diagram/**'
      - '.github/workflows/diagram-corpus.yml'
  workflow_dispatch:

# The corpus check is the diagram packet's contract: one family per module over every shipped
# template and example. It blocks because the corpus was made green before the checker existed,
# so there is no backlog behind the gate and nobody has to triage it. The literal marker is what
# passes, not the exit code: a run that dies before its first check exits without printing a
# failure, and the marker is only printed by a run that got to the end.
#
# The render pass is deliberately not here. It drives an installed browser, and the capture
# review that needs one says so and runs on a schedule rather than passing quietly in CI.
jobs:
  corpus:
    name: Corpus contract, its mutation suite and both applicator gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Corpus check
        run: |
          set -euo pipefail
          cd .opencode/skills/sk-design/sk-design-diagram
          node scripts/check-diagram-corpus.cjs | tee /tmp/diagram-corpus.log
          grep -q 'RESULT: PASSED' /tmp/diagram-corpus.log

      # Both applicators must reproduce the shipped bytes: the token applicator proves the forms are
      # generated from the palette source, and the DESIGN.md applicator proves the carried Style
      # Reference still describes that same palette. An exclusion here would hide exactly the drift
      # these two steps exist to catch, so neither takes one.
      - name: Both applicators reproduce the stock bytes
        run: |
          set -euo pipefail
          cd .opencode/skills/sk-design/sk-design-diagram
          node scripts/apply-diagram-tokens.cjs --default --all --out /tmp/diagram-forms | tee /tmp/applicator.log
          grep -q 'RESULT: PASSED' /tmp/applicator.log
          diff -rq /tmp/diagram-forms assets/diagrams
          node scripts/apply-design-md.cjs --default --all --out /tmp/diagram-themed | tee /tmp/design-md.log
          grep -q 'RESULT: PASSED' /tmp/design-md.log
          diff -rq /tmp/diagram-themed assets/diagrams

      - name: Mutation suite
        run: |
          set -euo pipefail
          cd .opencode/skills/sk-design/sk-design-diagram
          node --test scripts/tests/
