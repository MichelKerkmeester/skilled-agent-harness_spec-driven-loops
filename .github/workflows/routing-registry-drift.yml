name: Routing Registry Drift Guard

# Makes the C-plus guarantee real: a change to the advisor's hardcoded routing
# maps without a matching mode-registry.json change (or vice-versa) fails CI here.
# Pairs with the local drift-guard test; this is the authoritative gate.
#
# It also blocks compiled-routing freshness drift: editing a hub's routing inputs
# without re-minting drops that hub to legacy routing silently, so the trigger paths
# below cover every input that can invalidate a serving manifest.
#
# The paths below are deliberately WIDER than the set that actually stales a manifest.
# They answer "is it worth running the drift check", where the pre-commit re-mint gate
# answers "which hub must be re-minted right now", and a false positive costs a CI
# minute here while a false negative costs a silent legacy fallback. Measured, only a
# SKILL.md under a hub plus that hub's hub-router.json and mode-registry.json change
# the policy hash; ROUTER.md, leaf-manifest.json, description.json, graph-metadata.json
# and command-metadata.json do not. See .opencode/scripts/git-hooks/pre-commit,
# gate:route-remint, which carries the narrow set and the reason it is narrow.
on:
  push:
    # skilled/v* is included because release-line pushes land directly (no PR),
    # and both live skill-metadata regressions to date arrived exactly that way.
    branches: [main, 'skilled/v*']
    paths:
      - '.github/actions/**'
      - '.github/workflows/routing-registry-drift.yml'
      - '.opencode/skills/*/mode-registry.json'
      - '.skilled/skills/*/mode-registry.json'
      - '.opencode/skills/*/hub-router.json'
      - '.skilled/skills/*/hub-router.json'
      - '.opencode/skills/system-skill-advisor/runtime/**'
      - '.skilled/skills/system-skill-advisor/runtime/**'
      - '.opencode/commands/doctor/scripts/parent-skill-check.cjs'
      - '.skilled/commands/doctor/scripts/parent-skill-check.cjs'
      - '.opencode/commands/doctor/scripts/skill-graph-freshness.cjs'
      - '.skilled/commands/doctor/scripts/skill-graph-freshness.cjs'
      - '.opencode/skills/sk-doc/sk-create-skill/assets/parent-skill/**'
      - '.skilled/skills/sk-doc/sk-create-skill/assets/parent-skill/**'
      - '.opencode/skills/sk-doc/sk-create-skill/references/parent-skill/**'
      - '.skilled/skills/sk-doc/sk-create-skill/references/parent-skill/**'
      - '.opencode/skills/*/SKILL.md'
      - '.skilled/skills/*/SKILL.md'
      - '.opencode/skills/**/SKILL.md'
      - '.skilled/skills/**/SKILL.md'
      - '.opencode/skills/*/ROUTER.md'
      - '.skilled/skills/*/ROUTER.md'
      - '.opencode/skills/*/leaf-manifest.json'
      - '.skilled/skills/*/leaf-manifest.json'
      - '.opencode/skills/*/leaf-manifest.config.json'
      - '.skilled/skills/*/leaf-manifest.config.json'
      - '.opencode/skills/*/command-metadata.json'
      - '.skilled/skills/*/command-metadata.json'
      - '.opencode/skills/*/leaf-aliases.json'
      - '.skilled/skills/*/leaf-aliases.json'
      - '.opencode/skills/*/manual-testing-playbook/**'
      - '.skilled/skills/*/manual-testing-playbook/**'
      - '.opencode/skills/*/description.json'
      - '.skilled/skills/*/description.json'
      - '.opencode/skills/*/graph-metadata.json'
      - '.skilled/skills/*/graph-metadata.json'
      - '.opencode/skills/sk-doc/sk-create-skill/scripts/**'
      - '.skilled/skills/sk-doc/sk-create-skill/scripts/**'
      - '.opencode/bin/compiled-route*'
      - '.skilled/bin/compiled-route*'
      - '.opencode/bin/lib/compiled-route*'
      - '.skilled/bin/lib/compiled-route*'
      - 'specs/sk-doc/z_archive/019-skill-routing-refactor/015-router-unification-program/**'
      - 'specs/system-deep-loop/039-deprecate-improvement-modes/013-drift-guard-repairs/baseline/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/routing-registry-drift.yml'
      - '.opencode/skills/*/mode-registry.json'
      - '.skilled/skills/*/mode-registry.json'
      - '.opencode/skills/*/hub-router.json'
      - '.skilled/skills/*/hub-router.json'
      - '.opencode/skills/system-skill-advisor/runtime/**'
      - '.skilled/skills/system-skill-advisor/runtime/**'
      - '.opencode/commands/doctor/scripts/parent-skill-check.cjs'
      - '.skilled/commands/doctor/scripts/parent-skill-check.cjs'
      - '.opencode/commands/doctor/scripts/skill-graph-freshness.cjs'
      - '.skilled/commands/doctor/scripts/skill-graph-freshness.cjs'
      - '.opencode/skills/sk-doc/sk-create-skill/assets/parent-skill/**'
      - '.skilled/skills/sk-doc/sk-create-skill/assets/parent-skill/**'
      - '.opencode/skills/sk-doc/sk-create-skill/references/parent-skill/**'
      - '.skilled/skills/sk-doc/sk-create-skill/references/parent-skill/**'
      - '.opencode/skills/*/SKILL.md'
      - '.skilled/skills/*/SKILL.md'
      - '.opencode/skills/**/SKILL.md'
      - '.skilled/skills/**/SKILL.md'
      - '.opencode/skills/*/ROUTER.md'
      - '.skilled/skills/*/ROUTER.md'
      - '.opencode/skills/*/leaf-manifest.json'
      - '.skilled/skills/*/leaf-manifest.json'
      - '.opencode/skills/*/leaf-manifest.config.json'
      - '.skilled/skills/*/leaf-manifest.config.json'
      - '.opencode/skills/*/command-metadata.json'
      - '.skilled/skills/*/command-metadata.json'
      - '.opencode/skills/*/leaf-aliases.json'
      - '.skilled/skills/*/leaf-aliases.json'
      - '.opencode/skills/*/manual-testing-playbook/**'
      - '.skilled/skills/*/manual-testing-playbook/**'
      - '.opencode/skills/*/description.json'
      - '.skilled/skills/*/description.json'
      - '.opencode/skills/*/graph-metadata.json'
      - '.skilled/skills/*/graph-metadata.json'
      - '.opencode/skills/sk-doc/sk-create-skill/scripts/**'
      - '.skilled/skills/sk-doc/sk-create-skill/scripts/**'
      - '.opencode/bin/compiled-route*'
      - '.skilled/bin/compiled-route*'
      - '.opencode/bin/lib/compiled-route*'
      - '.skilled/bin/lib/compiled-route*'
      - 'specs/sk-doc/z_archive/019-skill-routing-refactor/015-router-unification-program/**'
      - 'specs/system-deep-loop/039-deprecate-improvement-modes/013-drift-guard-repairs/baseline/**'

# Least-privilege default: these jobs only check out and run read-only gates,
# so they never need write access. Declared explicitly rather than inheriting
# the repository default token grant.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  routing-drift:
    name: Registry == advisor maps; compiled-routing freshness; parent-skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Provision the dependency trees the checkers load
        uses: ./.github/actions/setup
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Routing-registry drift-guard + parity suites
        working-directory: .opencode/skills/system-skill-advisor/runtime
        # The drift-guard asserts the hardcoded Python/TS routing maps equal the
        # registry projection; the parity suites assert per-mode routing. The
        # routing surface is dependency-free (aliases.ts has no imports;
        # workspace-root.ts is node-only) and the suites shell to a stdlib-only
        # python3 dump — so the gate installs only vitest on demand rather than the
        # full skill (which carries native + ML deps unrelated to routing).
        run: |
          set -euo pipefail
          npx --yes vitest@4.0.18 run \
            tests/routing-registry-drift-guard.vitest.ts \
            tests/routing-parity-deep-skills.vitest.ts \
            tests/routing-parity-deep-council.vitest.ts
      - name: Compiled-routing freshness — serving matches inputs, runtime matches source
        # Editing a hub's routing inputs without re-minting silently drops that hub to
        # legacy routing: nothing errors and nothing logs, so it is only ever found by
        # accident. Since the pre-commit re-mint gate landed, most of this drift is
        # repaired in the commit that caused it, so reaching here usually means the gate
        # was bypassed or the commit was made elsewhere. This remains the authoritative
        # blocker, and it is the only one that sees the pushed commit rather than a
        # working tree, which is exactly the case the local gate cannot cover. A hub that is
        # mid-restructure can be excused through the checked-in exemptions file, which
        # covers only an uncompilable hub and never a stale or drifted one.
        run: |
          set -euo pipefail
          node .skilled/bin/compiled-route-guard.cjs
      - name: Compiled-serving admission — compiled decisions against playbook routing gold
        # Scores every hub's compiled decisions against the routing gold its playbook
        # authors, the bar a hub must clear to serve compiled traffic. system-deep-loop
        # now passes its whole playbook, so it blocks. The other hubs stay warn-only until
        # their baseline is triaged: it records engine drift and stale gold against
        # admitted hubs, and a blocking step would fail every unrelated push on them.
        run: |
          set -euo pipefail
          node .skilled/bin/compiled-route-admission.cjs --hub system-deep-loop
          node .skilled/bin/compiled-route-admission.cjs --all --warn-only
      - name: Parent-skill structural invariants (one identity, registry coverage) — every hub
        # Glob-enrolled: every skill carrying a mode-registry.json is a parent hub and is
        # checked, so a fifth hub joins the gate automatically with no hand-maintained list.
        run: |
          set -euo pipefail
          for registry in .opencode/skills/*/mode-registry.json; do
            hub="$(dirname "$registry")"
            echo "── parent-skill-check: $hub"
            node .opencode/commands/doctor/scripts/parent-skill-check.cjs "$hub"
          done
      - name: Skill-root metadata class contract — every root, hub or standalone
        # The per-hub loop above enrolls only registry-bearing hubs, which is exactly
        # how standalone roots drifted unnoticed. This gate discovers every root from
        # its SKILL.md, classifies it, enforces the class-required/forbidden file set,
        # and byte-checks generated manifests and derived alias projections — so a
        # missing file is a failure here, not a silence.
        run: |
          set -euo pipefail
          node .opencode/skills/sk-doc/sk-create-skill/scripts/ci-skill-root-metadata.cjs
          node .opencode/skills/sk-doc/sk-create-skill/scripts/ci-leaf-manifest-freshness.cjs
          node .opencode/skills/sk-doc/sk-create-skill/scripts/ci-skill-derived-freshness.cjs
      - name: Skill-graph compiler validation — full derived schema + path existence
        # The gates above check presence and byte-freshness; only the compiler
        # validates the full derived block (topics/entities/causal_summary, edge
        # weight bands, dependency cycles) and that every key_files/source_docs/
        # entities path resolves to a real file. Without it a malformed derived
        # block passes CI green and only fails later at an offline advisor
        # rebuild. Stdlib-only python, so it runs in this lean job as-is; the
        # same command reproduces any failure locally.
        run: |
          set -euo pipefail
          python3 .opencode/skills/system-skill-advisor/runtime/scripts/skill_graph_compiler.py --validate-only
      - name: Router intent-signal carry - ROUTER.md vocabulary reaches graph-metadata
        # A hub's ROUTER.md intent vocabulary must be carried into its
        # graph-metadata.json intent_signals, the field the advisor scores; a
        # missing carry is otherwise silent, so the check exits 1 and names it.
        run: |
          set -euo pipefail
          node .opencode/skills/sk-doc/sk-create-skill/scripts/generate-router-intent-signals.cjs --check
      - name: Compiled skill graph freshness - compiled json matches graph-metadata
        # The compiled skill-graph.json fell days behind its sources with nothing
        # failing. Strict mode exits 1 on a stale, ghost or missing compiled
        # entry and names the regenerate command.
        run: |
          set -euo pipefail
          node .opencode/commands/doctor/scripts/skill-graph-freshness.cjs --strict

  golden-prompt-gate:
    name: Gate-2 golden prompts — real scorer top-1/top-3 + joined compiled mode
    # Separate from the dependency-light drift/parity job above: this gate runs
    # the REAL TS fusion scorer against labelled prompts and asserts top-1/top-3
    # skill selection plus, for compiled-serving hubs, the concrete workflowMode.
    # It therefore needs a full advisor install (zod + a native sqlite dep) and
    # the @spec-kit/shared dist the scorer imports — which the lean job avoids on
    # purpose. Kept as its own job so the lean gate stays untouched and fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Provision the dependency trees the golden-prompt gate loads
        uses: ./.github/actions/setup
      - name: Golden-prompt acceptance suite
        working-directory: .opencode/skills/system-skill-advisor/runtime
        run: |
          set -euo pipefail
          npx vitest run tests/routing-golden-prompts.vitest.ts
      - name: Scorer-eval baseline ratchet — exact holdout/bucket counts + release floors
        # The golden-prompt suite above checks a weaker property and stays green
        # through a routing regression confined to contested or single-intent
        # prompts. This ratchet is the only gate that pins holdout top-1 to an
        # exact count, holds every named bucket, and enforces the release floors,
        # re-scoring live under the same no-sqlite fallback regime the baseline
        # was captured in. It runs here, in the full-install job, because it
        # imports the real fusion scorer and the built shared dist.
        working-directory: .opencode/skills/system-skill-advisor/runtime
        run: |
          set -euo pipefail
          npx vitest run tests/parity/scorer-eval-baseline-ratchet.vitest.ts
      - name: Python for the parity steps
        # The divergence ratchet fails by design when python3 is missing, and the
        # corpus gate below runs python3 too, so the job installs the interpreter
        # the lean job above uses instead of relying on the runner image.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Local-vs-native divergence ratchet - no unledgered scorer drift
        # Compares the local Python scorer with the in-process native scorer, top-1
        # per prompt, and fails on any divergence missing from the approved ledger
        # or any ledger entry that no longer matches. It scores against a skill
        # graph indexed fresh from this checkout at the ledger's pinned instant, so
        # it is green here exactly when it is green locally. It is a blocking step
        # of its own, never folded into the warn-only admission step above.
        working-directory: .opencode/skills/system-skill-advisor/runtime
        run: |
          set -euo pipefail
          npx vitest run tests/parity/local-native-divergence-ratchet.vitest.ts
      - name: Holdout independence - every scoring surface declares its overlap
        # Fails when a surface that scores prompts shares a holdout row it does not
        # declare, when a declared overlap no longer exists, or when a runtime file
        # reads a scored corpus without being declared, and holds holdout top-1 at
        # the committed baseline.
        working-directory: .opencode/skills/system-skill-advisor/runtime
        run: |
          set -euo pipefail
          npx vitest run tests/parity/holdout-independent.vitest.ts
      - name: Routing-accuracy corpus gate — pinned corpus, baseline floors
        # An unpinned corpus makes an accuracy floor meaningless: silently adding
        # or relabeling rows moves the number without any routing change. So the
        # corpus files are first verified against the sha256 pins recorded in the
        # checked-in baseline capture, and only then scored. The floors are the
        # scorer's deterministic no-sqlite (fallback-regime) baseline — CI has no
        # skill-graph.sqlite (gitignored, produced only by the live daemon's
        # ingest), so the advisor scores via its local fallback here and the
        # sqlite-regime numbers in the baseline capture do not apply (they read
        # higher: graph boosts). Equality passes; any regression in CI's own
        # regime fails. historical-clean keeps known-good prompts from regressing
        # inside the allowed band. Runs here rather than in the lean job because
        # the gate3 leg imports the built shared dist the install step produces.
        working-directory: .opencode/skills/system-skill-advisor/runtime
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import hashlib, json, pathlib, sys
          baseline = json.load(open("../../../specs/system-deep-loop/039-deprecate-improvement-modes/013-drift-guard-repairs/baseline/routing-baseline.json"))
          corpus_dir = pathlib.Path("scripts/routing-accuracy")
          bad = []
          for name, meta in baseline["corpus"].items():
              if not isinstance(meta, dict) or "sha256" not in meta:
                  continue
              actual = hashlib.sha256((corpus_dir / name).read_bytes()).hexdigest()
              if actual != meta["sha256"]:
                  bad.append(f"{name}: pinned {meta['sha256'][:16]}… actual {actual[:16]}…")
          if bad:
              print("CORPUS DRIFTED FROM PIN — recapture the baseline before scoring:")
              print("\n".join(f"  {line}" for line in bad))
              sys.exit(2)
          print("corpus matches the pinned baseline hashes")
          EOF
          python3 scripts/routing-accuracy/score-routing-corpus.py \
            --dataset "$PWD/scripts/routing-accuracy/labeled-prompts.jsonl" \
            --min-advisor-accuracy 0.5333 \
            --min-gate3-f1 0.9843 \
            --min-joint-tt 101 \
            --max-joint-ft 3 \
            --max-joint-ff 1 \
            --require-historical-clean
