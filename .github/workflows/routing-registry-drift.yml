name: Routing Registry Drift Guard

# Makes the C-plus guarantee real: a change to the advisor's hardcoded routing
# maps without a matching mode-registry.json change (or vice-versa) fails CI here.
# Pairs with the local drift-guard test; this is the authoritative gate.
#
# It also blocks compiled-routing freshness drift: editing a hub's routing inputs
# without re-minting drops that hub to legacy routing silently, so the trigger paths
# below cover every input that can invalidate a serving manifest.
on:
  push:
    # skilled/v* is included because release-line pushes land directly (no PR),
    # and both live skill-metadata regressions to date arrived exactly that way.
    branches: [main, 'skilled/v*']
    paths:
      - '.github/workflows/routing-registry-drift.yml'
      - '.opencode/skills/*/mode-registry.json'
      - '.opencode/skills/*/hub-router.json'
      - '.opencode/skills/system-skill-advisor/mcp-server/**'
      - '.opencode/commands/doctor/scripts/parent-skill-check.cjs'
      - '.opencode/skills/sk-doc/sk-create-skill/assets/parent-skill/**'
      - '.opencode/skills/sk-doc/sk-create-skill/references/parent-skill/**'
      - '.opencode/skills/*/SKILL.md'
      - '.opencode/skills/*/leaf-manifest.json'
      - '.opencode/skills/*/leaf-manifest.config.json'
      - '.opencode/skills/*/command-metadata.json'
      - '.opencode/skills/*/leaf-aliases.json'
      - '.opencode/skills/*/description.json'
      - '.opencode/skills/*/graph-metadata.json'
      - '.opencode/skills/sk-doc/sk-create-skill/scripts/**'
      - '.opencode/bin/compiled-route*'
      - '.opencode/bin/lib/compiled-route*'
      - '.opencode/specs/sk-doc/019-skill-routing-refactor/015-router-unification-program/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/routing-registry-drift.yml'
      - '.opencode/skills/*/mode-registry.json'
      - '.opencode/skills/*/hub-router.json'
      - '.opencode/skills/system-skill-advisor/mcp-server/**'
      - '.opencode/commands/doctor/scripts/parent-skill-check.cjs'
      - '.opencode/skills/sk-doc/sk-create-skill/assets/parent-skill/**'
      - '.opencode/skills/sk-doc/sk-create-skill/references/parent-skill/**'
      - '.opencode/skills/*/SKILL.md'
      - '.opencode/skills/*/leaf-manifest.json'
      - '.opencode/skills/*/leaf-manifest.config.json'
      - '.opencode/skills/*/command-metadata.json'
      - '.opencode/skills/*/leaf-aliases.json'
      - '.opencode/skills/*/description.json'
      - '.opencode/skills/*/graph-metadata.json'
      - '.opencode/skills/sk-doc/sk-create-skill/scripts/**'
      - '.opencode/bin/compiled-route*'
      - '.opencode/bin/lib/compiled-route*'
      - '.opencode/specs/sk-doc/019-skill-routing-refactor/015-router-unification-program/**'

jobs:
  routing-drift:
    name: Registry == advisor maps; compiled-routing freshness; parent-skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Routing-registry drift-guard + parity suites
        working-directory: .opencode/skills/system-skill-advisor/mcp-server
        # The drift-guard asserts the hardcoded Python/TS routing maps equal the
        # registry projection; the parity suites assert per-mode routing. The
        # routing surface is dependency-free (aliases.ts has no imports;
        # workspace-root.ts is node-only) and the suites shell to a stdlib-only
        # python3 dump — so the gate installs only vitest on demand rather than the
        # full skill (which carries native + ML deps unrelated to routing).
        run: |
          set -euo pipefail
          npx --yes vitest@4.0.18 run \
            tests/routing-registry-drift-guard.vitest.ts \
            tests/routing-parity-deep-skills.vitest.ts \
            tests/routing-parity-deep-council.vitest.ts
      - name: Compiled-routing freshness — serving matches inputs, runtime matches source
        # Editing a hub's routing inputs without re-minting silently drops that hub to
        # legacy routing: nothing errors and nothing logs, so it is only ever found by
        # accident. This is the authoritative blocker for that drift. A hub that is
        # mid-restructure can be excused through the checked-in exemptions file, which
        # covers only an uncompilable hub and never a stale or drifted one.
        run: |
          set -euo pipefail
          node .opencode/bin/compiled-route-guard.cjs
      - name: Parent-skill structural invariants (one identity, registry coverage) — every hub
        # Glob-enrolled: every skill carrying a mode-registry.json is a parent hub and is
        # checked, so a fifth hub joins the gate automatically with no hand-maintained list.
        run: |
          set -euo pipefail
          for registry in .opencode/skills/*/mode-registry.json; do
            hub="$(dirname "$registry")"
            echo "── parent-skill-check: $hub"
            node .opencode/commands/doctor/scripts/parent-skill-check.cjs "$hub"
          done
      - name: Skill-root metadata class contract — every root, hub or standalone
        # The per-hub loop above enrolls only registry-bearing hubs, which is exactly
        # how standalone roots drifted unnoticed. This gate discovers every root from
        # its SKILL.md, classifies it, enforces the class-required/forbidden file set,
        # and byte-checks generated manifests and derived alias projections — so a
        # missing file is a failure here, not a silence.
        run: |
          set -euo pipefail
          node .opencode/skills/sk-doc/sk-create-skill/scripts/ci-skill-root-metadata.cjs
          node .opencode/skills/sk-doc/sk-create-skill/scripts/ci-leaf-manifest-freshness.cjs
          node .opencode/skills/sk-doc/sk-create-skill/scripts/ci-skill-derived-freshness.cjs

  golden-prompt-gate:
    name: Gate-2 golden prompts — real scorer top-1/top-3 + joined compiled mode
    # Separate from the dependency-light drift/parity job above: this gate runs
    # the REAL TS fusion scorer against labelled prompts and asserts top-1/top-3
    # skill selection plus, for compiled-serving hubs, the concrete workflowMode.
    # It therefore needs a full advisor install (zod + a native sqlite dep) and
    # the @spec-kit/shared dist the scorer imports — which the lean job avoids on
    # purpose. Kept as its own job so the lean gate stays untouched and fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install advisor scorer + build the shared projection dependency
        # tsc for the shared build comes from the spec-kit install; the scorer
        # runs in a force-local regime at test time so no skill-graph DB is built.
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
          ( cd .opencode/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
          npm --prefix .opencode/skills/system-skill-advisor/mcp-server ci
      - name: Golden-prompt acceptance suite
        working-directory: .opencode/skills/system-skill-advisor/mcp-server
        run: |
          set -euo pipefail
          npx vitest run tests/routing-golden-prompts.vitest.ts
