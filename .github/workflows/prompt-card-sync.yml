name: Prompt-Knowledge Card Sync
on:
  pull_request:
    branches: [main]

jobs:
  card-sync:
    name: Prompt-knowledge drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run prompt-quality card-sync guard
        run: |
          set -euo pipefail
          GUARD=".opencode/skills/system-skill-advisor/mcp-server/scripts/check-prompt-quality-card-sync.sh"
          if [ ! -f "$GUARD" ]; then
            echo "::warning::card-sync guard not found at $GUARD — skipping"
            exit 0
          fi
          # Structural drift guard across sk-prompt and the cli-* executor layers:
          # framework/CLEAR table inlining and Tier-3 escalation-rule drift.
          bash "$GUARD" .
          echo "All clear — prompt-knowledge layers are in sync."
