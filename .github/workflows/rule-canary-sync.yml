name: Rule Canary Sync
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'skilled/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rule-canary:
    name: Load-bearing rule wording stays in sync across copies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The canary reads AGENTS.md and the sk-code skill tree, and the step below calls
      # it through the .opencode/skills link, so those three paths are all it needs on
      # disk. A file the checker starts reading must be added to this list, or the step
      # fails closed on a runner that never checked it out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            /AGENTS.md
            /.skilled/skills/sk-code/
            /.opencode/skills
          sparse-checkout-cone-mode: false
      - name: Check that load-bearing rule wording has not drifted
        run: |
          set -euo pipefail
          CANARY=".opencode/skills/sk-code/sk-code-review/scripts/check-rule-copies.js"
          # Fail closed in CI: a required guard must exist. A PR that deletes or
          # moves the canary must not silently disable its own gate.
          if [ ! -f "$CANARY" ]; then
            echo "::error::Rule canary not found at $CANARY — failing closed."
            exit 1
          fi
          if node "$CANARY"; then
            echo "All clear — load-bearing rule wording is in sync."
          else
            echo "::error::Load-bearing rule wording drifted — restore the invariant strings so every copy agrees."
            exit 1
          fi
