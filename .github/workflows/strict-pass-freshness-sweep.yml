name: Strict Pass Freshness Sweep

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  strict-pass-freshness:
    runs-on: ubuntu-latest
    outputs:
      sweep-outcome: ${{ steps.sweep.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The validator this sweep shells out to loads TypeScript rule modules that
      # import across the mcp-server package, so installing only the sweep's own
      # scripts leaves every one of those rules erroring. That reads as thousands
      # of failing packets rather than as a missing toolchain, which is how this
      # job stayed red while looking like a content problem.
      - name: Install spec-kit dependencies
        # Only the package root carries a lockfile; the server, shared project and
        # scripts are workspaces of it, so the root install is what provisions all
        # three. Installing a workspace directly fails for want of its own lockfile.
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
          ( cd .opencode/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
          npm --prefix .opencode/skills/system-spec-kit/mcp-server run build
          ( cd .opencode/skills/system-spec-kit/scripts && npm ci )

      - name: Restore previous strict-pass freshness report
        uses: actions/cache@v4
        with:
          path: .strict-pass-freshness/report.json
          key: ${{ runner.os }}-strict-pass-freshness-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-strict-pass-freshness-${{ github.ref_name }}-

      - name: Run strict-pass freshness sweep
        id: sweep
        continue-on-error: true
        shell: bash
        run: |
          report_dir=.strict-pass-freshness
          report_path="$report_dir/report.json"
          next_report_path="$report_dir/report.next.json"
          mkdir -p "$report_dir"

          # A restored report is only a usable baseline if it actually parses.
          # An unreadable one is discarded rather than passed on, because the
          # sweep reads its baseline eagerly and a truncated file aborts the
          # whole run — which would make one bad cache entry self-perpetuating.
          baseline_args=()
          if [[ -s "$report_path" ]] && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$report_path" 2>/dev/null; then
            baseline_args=(--baseline "$report_path")
          elif [[ -e "$report_path" ]]; then
            echo "::warning::Discarding unreadable restored baseline at $report_path — this run establishes a fresh one."
            rm -f "$report_path"
          fi

          set +e
          # The leading ./ is load-bearing: node --import reads a bare path as a
          # package name, so without it the loader never resolves and the sweep
          # dies before it reads a single packet.
          node --import ./.opencode/skills/system-spec-kit/scripts/node_modules/tsx/dist/loader.mjs \
            .opencode/skills/system-spec-kit/scripts/sweep/strict-pass-freshness.ts \
            --roots specs \
            --format json \
            "${baseline_args[@]}" > "$next_report_path"
          sweep_status=$?
          set -e

          # Only promote output that parses. Publishing a truncated report would
          # cache it as next week's baseline and strand the sweep on a file it
          # cannot read.
          if [[ -s "$next_report_path" ]] && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$next_report_path" 2>/dev/null; then
            mv "$next_report_path" "$report_path"
          else
            echo "::warning::Sweep produced no readable report; keeping the previous baseline."
            rm -f "$next_report_path"
            [[ -f "$report_path" ]] || echo '{"results":[]}' > "$report_path"
          fi
          exit "$sweep_status"

      # Reports only; the repair flag is deliberately absent. A gate that
      # silently rewrote packets would erase the drift it exists to surface, and
      # nobody would learn that a rename left records pointing at the old place.
      # Its exit status is ignored on purpose: a repairable packet is a finding
      # for a person to act on, not a reason to fail the sweep.
      - name: Derived-repair drift report — recomputable packet facts
        continue-on-error: true
        run: |
          set -euo pipefail
          node .opencode/skills/system-spec-kit/scripts/spec/repair-derived.cjs --roots specs || true

      - name: Publish strict-pass freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-pass-freshness-report-${{ github.run_id }}
          path: .strict-pass-freshness/report.json
          if-no-files-found: error

  strict-pass-freshness-gate:
    needs: strict-pass-freshness
    runs-on: ubuntu-latest
    steps:
      - name: Enforce strict-pass freshness result
        env:
          SWEEP_OUTCOME: ${{ needs.strict-pass-freshness.outputs.sweep-outcome }}
        run: test "$SWEEP_OUTCOME" = "success"
