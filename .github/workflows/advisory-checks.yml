name: Advisory Checks
on:
  push:
    branches: [main, 'skilled/**']
  pull_request:
  workflow_dispatch:

# Two jobs share this file. `advisory` holds four report-only steps: checks worth seeing
# that must not block, and that were previously paid for on every commit or push locally.
# None of them belongs in a hook: one is advisory by design, and another has a
# known-failing backlog that predates it. Running them here keeps the signal and gives the
# output somewhere readable, without taxing the working loop or mailing anyone about rot
# they did not cause. Their continue-on-error keeps that job green, because a red X nobody
# is expected to act on is how a gate becomes background noise. Read the step output, not
# the run status.
#
# `gate-critical` is the opposite case and carries no continue-on-error: it runs the
# gate-critical node suites, so a regression in one of them turns the check red instead
# of reporting the rot again.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Every model load runs on the CPU, so the onnxruntime-node install skips its Linux CUDA
  # provider download: unused here, and the install step that fails when that host times out.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  advisory:
    name: Advisory — test suites and doc-model references
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_FRESHNESS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Node test suites (report-only)
        continue-on-error: true
        run: |
          set -uo pipefail
          RUNNER=".skilled/scripts/run-node-tests.mjs"
          # Fail closed: a missing script is a moved or deleted file, not an empty
          # report. The step keeps continue-on-error, so the job stays green by design
          # while this step shows the error.
          if [ ! -f "$RUNNER" ]; then
            echo "::error::Node test runner not found at $RUNNER — failing closed."
            exit 1
          fi
          node "$RUNNER"

      - name: Doc-model reference drift (report-only)
        continue-on-error: true
        run: |
          set -uo pipefail
          VALIDATOR=".opencode/skills/sk-doc/scripts/validate-doc-model-refs.js"
          # Fail closed: a missing script is a moved or deleted file, not an empty
          # report. The step keeps continue-on-error, so the job stays green by design
          # while this step shows the error.
          if [ ! -f "$VALIDATOR" ]; then
            echo "::error::Doc-model validator not found at $VALIDATOR — failing closed."
            exit 1
          fi
          if ! node "$VALIDATOR"; then
            echo "::error::doc-model drift found; fix by citing canonical model names from registry.ts"
            exit 1
          fi

      - name: Trigger index freshness (report-only)
        continue-on-error: true
        run: |
          set -uo pipefail
          GENERATOR=".skilled/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs"
          # Fail closed: a missing script is a moved or deleted file, not an empty
          # report. The step keeps continue-on-error, so the job stays green by design
          # while this step shows the error.
          if [ ! -f "$GENERATOR" ]; then
            echo "::error::Trigger index generator not found at $GENERATOR, failing closed."
            exit 1
          fi
          # The checkout is committed content, so this compares the committed index with
          # the corpus it should describe. The lookup cannot afford this walk per call.
          if ! node "$GENERATOR" --check; then
            echo "::error::trigger index drift found; the trigger-index-rebuild workflow repairs drift on the integration branches after merge, or regenerate locally with node $GENERATOR"
            exit 1
          fi

      - name: AGENTS.md manifest (report-only)
        continue-on-error: true
        run: |
          set -uo pipefail
          MANIFEST=".skilled/commands/doctor/scripts/agents-md-manifest.cjs"
          # Fail closed: a missing script is a moved or deleted file, not an empty
          # report. The step keeps continue-on-error, so the job stays green by design
          # while this step shows the error.
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AGENTS.md manifest tool not found at $MANIFEST, failing closed."
            exit 1
          fi
          if ! node "$MANIFEST" --check; then
            echo "::error::AGENTS.md manifest drift found; the operator records a released body with node $MANIFEST --write"
            exit 1
          fi

  gate-critical:
    name: Gate-critical node suites (blocking)
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_FRESHNESS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # The suite imports the built shared package and js-yaml from the spec-kit
      # workspace, and the hook entries import the built skill advisor, so a fresh
      # runner needs both workspaces installed and built first.
      - name: Install and build the spec-kit and skill advisor workspaces
        run: |
          set -euo pipefail
          npm --prefix .skilled/skills/system-spec-kit ci
          npm --prefix .skilled/skills/system-spec-kit run build
          npm --prefix .skilled/skills/system-skill-advisor/runtime ci
          npm --prefix .skilled/skills/system-skill-advisor/runtime run build
      # These suites read the spec-gate environment switches, so a shell that sets
      # AI_SESSION_CHILD or SYSTEM_SPEC_GATE_ENFORCE fails them. A runner sets neither.
      # hook-stdin-deadline.test.mjs is left out on purpose: it races a 500 ms
      # deadline against an 800 ms write, and a busy runner loses that race.
      - name: Gate-critical node suites
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            .skilled/skills/system-spec-kit/runtime/cli/tests/sync-agents-dsh.test.mjs \
            .skilled/skills/system-spec-kit/runtime/cli/tests/sync-prompts-dsh.test.mjs \
            .skilled/skills/system-spec-kit/runtime/cli/tests/sync-runtime-mirrors.test.mjs \
            .skilled/skills/system-spec-kit/runtime/cli/tests/sync-skills-dsh.test.mjs \
            .skilled/skills/system-spec-kit/runtime/cli/tests/unactioned-recorded-failure-audit.test.mjs \
            .skilled/skills/system-spec-kit/runtime/tests/hooks/gate-3-menu-parity.test.mjs \
            .skilled/skills/system-spec-kit/runtime/tests/hooks/permission-request-policy.test.mjs \
            .skilled/skills/system-spec-kit/runtime/tests/hooks/spec-gate-claude.test.mjs \
            .skilled/skills/system-spec-kit/runtime/tests/hooks/spec-gate-codex.test.mjs \
            .skilled/skills/system-spec-kit/runtime/tests/hooks/spec-gate-core.test.mjs \
            .skilled/skills/system-spec-kit/runtime/tests/hooks/spec-gate-devin.test.mjs \
            .skilled/skills/system-spec-kit/runtime/tests/hooks/spec-gate-prebind.test.mjs
