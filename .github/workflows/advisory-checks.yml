name: Advisory Checks
on:
  push:
    branches: [main, 'skilled/**']
  pull_request:
  workflow_dispatch:

# Home for checks that are worth seeing but must not block, and that were previously
# paid for on every commit or push locally. Neither belongs in a hook: one is advisory
# by design, and the other has a known-failing backlog that predates it. Running them
# here keeps the signal and gives the output somewhere readable, without taxing the
# working loop or mailing anyone about rot they did not cause.
#
# continue-on-error keeps the job green: a red X nobody is expected to act on is how a
# gate becomes background noise. Read the step output, not the run status.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  advisory:
    name: Advisory — test suites and doc-model references
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Node test suites (report-only)
        continue-on-error: true
        run: |
          set -uo pipefail
          RUNNER=".skilled/scripts/run-node-tests.mjs"
          # Fail closed: a missing script is a moved or deleted file, not an empty
          # report. The step keeps continue-on-error, so the job stays green by design
          # while this step shows the error.
          if [ ! -f "$RUNNER" ]; then
            echo "::error::Node test runner not found at $RUNNER — failing closed."
            exit 1
          fi
          node "$RUNNER"

      - name: Doc-model reference drift (report-only)
        continue-on-error: true
        run: |
          set -uo pipefail
          VALIDATOR=".opencode/skills/sk-doc/scripts/validate-doc-model-refs.js"
          # Fail closed: a missing script is a moved or deleted file, not an empty
          # report. The step keeps continue-on-error, so the job stays green by design
          # while this step shows the error.
          if [ ! -f "$VALIDATOR" ]; then
            echo "::error::Doc-model validator not found at $VALIDATOR — failing closed."
            exit 1
          fi
          if ! node "$VALIDATOR"; then
            echo "::error::doc-model drift found; fix by citing canonical model names from registry.ts"
            exit 1
          fi

      - name: Trigger index freshness (report-only)
        continue-on-error: true
        run: |
          set -uo pipefail
          GENERATOR=".skilled/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs"
          # Fail closed: a missing script is a moved or deleted file, not an empty
          # report. The step keeps continue-on-error, so the job stays green by design
          # while this step shows the error.
          if [ ! -f "$GENERATOR" ]; then
            echo "::error::Trigger index generator not found at $GENERATOR, failing closed."
            exit 1
          fi
          # The checkout is committed content, so this compares the committed index with
          # the corpus it should describe. The lookup cannot afford this walk per call.
          if ! node "$GENERATOR" --check; then
            echo "::error::trigger index drift found; the trigger-index-rebuild workflow repairs drift on the integration branches after merge, or regenerate locally with node $GENERATOR"
            exit 1
          fi
