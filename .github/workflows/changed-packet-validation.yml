name: Changed Packet Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changed-packets:
    name: Spec packets touched by this PR validate clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The validator loads TypeScript rule modules that import across the
      # mcp-server package, so installing only the scripts workspace leaves every
      # one of those rules erroring — which reads as failing packets rather than
      # as a missing toolchain.
      - name: Install spec-kit dependencies
        # Only the package root carries a lockfile; the server, shared project and
        # scripts are workspaces of it, so the root install is what provisions all
        # three. Installing a workspace directly fails for want of its own lockfile.
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
          ( cd .opencode/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
          npm --prefix .opencode/skills/system-spec-kit/mcp-server run build
          ( cd .opencode/skills/system-spec-kit/scripts && npm ci )

      - name: Validate the packets this PR changed
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # A packet is the nearest ancestor of a changed file that owns a
          # spec.md. Scoping the gate to what the PR touched is the point: the
          # corpus carries pre-existing failures, and a whole-tree gate would
          # block every author for packets they never opened.
          packets=$(
            git diff --name-only --diff-filter=ACMR "$BASE" "$HEAD" -- specs \
            | while IFS= read -r file; do
                dir=$(dirname "$file")
                while [ "$dir" != "specs" ] && [ "$dir" != "." ] && [ "$dir" != "/" ]; do
                  if [ -f "$dir/spec.md" ]; then echo "$dir"; break; fi
                  dir=$(dirname "$dir")
                done
              done | sort -u
          )

          if [ -z "$packets" ]; then
            echo "No spec packets changed by this PR."
            exit 0
          fi

          echo "Packets to validate:"
          echo "$packets" | sed 's/^/  /'
          echo ""

          failed=0
          while IFS= read -r packet; do
            [ -n "$packet" ] || continue
            # --no-recursive keeps a phase parent from dragging in children this
            # PR never touched; each changed child is already in the list itself.
            rc=0
            out=$(bash .opencode/skills/system-spec-kit/scripts/spec/validate.sh \
                    "$packet" --strict --no-recursive 2>&1) || rc=$?

            # A stale or unbuilt orchestrator makes validate.sh refuse to run and
            # emit no rule output at all. Requiring the explicit verdict line
            # means that silence fails the gate instead of reading as a pass.
            if ! grep -q '^RESULT: PASSED' <<<"$out"; then
              failed=$((failed + 1))
              echo "::error file=$packet/spec.md::Packet validation failed"
              echo "$out" | grep -E '^\s*[x!]|^Summary:|^RESULT:' | sed 's/^/    /' || true
              echo ""
            fi
            [ "$rc" -eq 0 ] || true
          done <<<"$packets"

          if [ "$failed" -gt 0 ]; then
            echo "BLOCKED: $failed packet(s) changed by this PR do not validate."
            echo "Run: bash .opencode/skills/system-spec-kit/scripts/spec/validate.sh <packet> --strict"
            exit 1
          fi
          echo "All changed packets validate clean."
