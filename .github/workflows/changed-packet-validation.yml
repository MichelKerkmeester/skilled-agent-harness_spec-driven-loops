name: Changed Packet Validation

on:
  push:
    branches: [main, 'skilled/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changed-packets:
    name: Spec packets touched by this PR validate clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The validator loads TypeScript rule modules that import across the
      # runtime package, so installing only the cli workspace leaves every
      # one of those rules erroring — which reads as failing packets rather than
      # as a missing toolchain.
      - name: Install spec-kit dependencies
        # Only the package root carries a lockfile; shared, runtime and
        # runtime/cli are workspaces of it, so the root install is what
        # provisions all three in one pass. Installing a workspace directly
        # fails for want of its own lockfile.
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
          ( cd .opencode/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
          npm --prefix .opencode/skills/system-spec-kit/runtime run build

      - name: Validate the packets this PR changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            # A direct push compares against the previous tip; a branch's first
            # push has an all-zero before-sha, so fall back to the parent commit.
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            case "$BASE" in 0000000000000000000000000000000000000000|"") BASE="$(git rev-parse "$HEAD~1")" ;; esac
          fi

          # A packet is in scope when one of ITS OWN documents changed — the
          # files the validator actually grades — not when anything anywhere
          # beneath it changed. Attributing every nested artifact to its nearest
          # packet put 427 packets in scope for a bulk edit and blocked on
          # pre-existing failures in packets nobody had opened, which is the
          # whole-tree behaviour this gate exists to avoid.
          #
          # A changed research log or lineage output under a packet is evidence,
          # not a graded document, so it does not pull the packet in.
          # A name is shown with its line breaks written out. A raw break would put
          # the rest of the name at column 0, where the runner reads it as a command.
          display_name() {
            local value=$1
            value=${value//$'\r'/'\r'}
            value=${value//$'\n'/'\n'}
            printf '%s' "$value"
          }

          # NUL-delimited, because a name may hold a line break. Git quotes such a
          # name unless -z is given, and a quoted name matches no file, so the
          # packet was dropped without a word.
          packet_list=$(mktemp)
          git diff -z --name-only --diff-filter=ACMR "$BASE" "$HEAD" -- specs \
            | while IFS= read -r -d '' file; do
                # Parameter expansion, not basename or dirname: command substitution
                # would strip a line break from the end of a folder name.
                case "${file##*/}" in
                  (spec.md|plan.md|tasks.md|implementation-summary.md|decision-record.md|acceptance-criteria.md|handover.md|description.json|graph-metadata.json)
                    dir=${file%/*}
                    # Only the packet that owns the document, never an ancestor:
                    # a doc orphaned by a deleted spec.md must not silently
                    # attribute to the parent packet and escape validation.
                    if [ -f "$dir/spec.md" ]; then printf '%s\0' "$dir"; fi
                    ;;
                esac
              done | sort -z -u > "$packet_list"

          if [ ! -s "$packet_list" ]; then
            rm -f "$packet_list"
            echo "No spec packets changed by this PR."
            exit 0
          fi

          echo "Packets to validate:"
          while IFS= read -r -d '' packet; do
            printf '  %s\n' "$(display_name "$packet")"
          done < "$packet_list"
          echo ""

          # A packet name is text a pull request controls, and the runner reads a
          # line that starts with "::" as a workflow command. Escaping happens
          # before the text reaches an annotation: % first, so the escapes added
          # for the other characters are not escaped again, then the characters
          # the runner treats as delimiters.
          annotation_data() {
            local value=$1
            value=${value//'%'/%25}
            value=${value//$'\r'/%0D}
            value=${value//$'\n'/%0A}
            printf '%s' "$value"
          }
          annotation_property() {
            local value
            value=$(annotation_data "$1")
            value=${value//:/%3A}
            value=${value//,/%2C}
            printf '%s' "$value"
          }
          annotate_packet_error() {
            printf '::error file=%s::%s\n' \
              "$(annotation_property "$1/spec.md")" "$(annotation_data "$2")"
          }
          # Raw validator output is replayed between a stop-commands marker and a
          # random token. The workflow file is public, so a fixed token could be
          # typed into a packet name; a token drawn fresh each run cannot.
          replay_raw() {
            local token
            token=$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')
            printf '::stop-commands::%s\n' "$token"
            cat "$1"
            printf '\n::%s::\n' "$token"
          }

          # Block on regressions, not on the corpus's existing state. A packet
          # that already failed at the merge base is not this PR's doing, and
          # failing the author for it is the whole-tree behaviour this gate
          # exists to avoid. Only the base comparison distinguishes the two, so
          # packets that fail here are re-checked against a worktree at the base.
          #
          # The comparison is over the SETS of failing rules, not over the bare
          # verdict: a packet that failed rule A at the base and rule B at head
          # carries a failure this PR introduced even though it was red before.
          failing_rules() {
            # Prints the failing rule names from the orchestrator's JSON report
            # on stdin, one per line. A strict run fails exactly when an entry's
            # status is "error" — warnings are advice and summary.errors counts
            # those entries — so those rules are the set this gate compares. A
            # report that does not parse, lacks entries, or records a skipped
            # run exits nonzero, and the caller then fails closed.
            # shellcheck disable=SC2016 # the quoted script is JavaScript, so its ${} is not the shell's
            node -e '
              const fs = require("fs");
              let report;
              try { report = JSON.parse(fs.readFileSync(0, "utf8")); } catch { process.exit(1); }
              if (report.skipped === true || !Array.isArray(report.entries)) process.exit(1);
              const failing = report.entries.filter((entry) => entry.status === "error").map((entry) => entry.rule);
              process.stdout.write([...new Set(failing)].sort().map((rule) => `${rule}\n`).join(""));
            '
          }
          declare -a broken=()
          declare -A head_failing=()
          while IFS= read -r -d '' packet; do
            [ -n "$packet" ] || continue
            # --no-recursive keeps a phase parent from dragging in children this
            # PR never touched; each changed child is already in the list itself.
            # The validator's stderr is not parsed, but it reaches the log as is,
            # so it is captured and replayed like the other raw output.
            head_err=$(mktemp)
            head_out=$(bash .opencode/skills/system-spec-kit/runtime/cli/spec/validate.sh \
                         "$packet" --strict --no-recursive --json 2>"$head_err") || true
            if [ -s "$head_err" ]; then replay_raw "$head_err"; fi
            rm -f "$head_err"
            # A stale or unbuilt orchestrator makes validate.sh refuse to run
            # and emit no report at all. Anything that does not parse as a
            # report keeps the packet in play so the comparison below fails
            # closed instead of reading silence as a pass.
            if ! rules=$(printf '%s\n' "$head_out" | failing_rules); then
              broken+=("$packet")
              continue
            fi
            if [ -n "$rules" ]; then
              broken+=("$packet")
              head_failing["$packet"]="$rules"
            fi
          done < "$packet_list"
          rm -f "$packet_list"

          if [ ${#broken[@]} -eq 0 ]; then
            echo "All changed packets validate clean."
            exit 0
          fi

          echo "${#broken[@]} changed packet(s) do not validate; checking which are regressions."
          base_tree=$(mktemp -d)
          if ! git worktree add --detach "$base_tree" "$BASE" >/dev/null 2>&1; then
            echo "::error::Could not materialise the merge base; failing closed rather than skipping the comparison"
            exit 1
          fi

          regressions=0
          for packet in "${broken[@]}"; do
            if [ ! -d "$base_tree/$packet" ]; then
              annotate_packet_error "$packet" "New packet does not validate"
              regressions=$((regressions + 1))
              continue
            fi
            # A head run that produced no report has no failing set to compare,
            # so it fails closed here instead of borrowing the base's verdict.
            if [ -z "${head_failing["$packet"]+set}" ]; then
              annotate_packet_error "$packet" "Validator produced no verdict for the head copy; failing closed"
              regressions=$((regressions + 1))
              continue
            fi
            # This checkout's validator against the base's content. The base
            # worktree has no built dist of its own, and building one there
            # would make every packet read as failing at the base — which would
            # silently disable the gate rather than fail it.
            base_err=$(mktemp)
            base_out=$(bash .opencode/skills/system-spec-kit/runtime/cli/spec/validate.sh \
                         "$base_tree/$packet" --strict --no-recursive --json 2>"$base_err") || true
            if [ -s "$base_err" ]; then replay_raw "$base_err"; fi
            rm -f "$base_err"
            if ! base_rules=$(printf '%s\n' "$base_out" | failing_rules); then
              annotate_packet_error "$packet" "Validator produced no verdict for the base copy; failing closed"
              regressions=$((regressions + 1))
              continue
            fi
            # Only head rules absent from the base's failing set are new. Both
            # sides are sorted and unique, as failing_rules prints them.
            new_rules=$(comm -23 \
              <(printf '%s\n' "${head_failing["$packet"]}") \
              <(printf '%s\n' "$base_rules"))
            if [ -n "$new_rules" ]; then
              annotate_packet_error "$packet" "Regression — new failing rule(s): $(paste -s -d , <<<"$new_rules")"
              # The detail lines are validator text, and they name the packet.
              detail_file=$(mktemp)
              bash .opencode/skills/system-spec-kit/runtime/cli/spec/validate.sh "$packet" --strict --no-recursive 2>&1 \
                | grep -E '^\s*[x!]|^Summary:' | sed 's/^/    /' > "$detail_file" || true
              replay_raw "$detail_file"
              rm -f "$detail_file"
              regressions=$((regressions + 1))
            else
              echo "  pre-existing (also fails at the merge base): $(display_name "$packet")"
              echo "    failing rule(s): $(paste -s -d , <<<"${head_failing["$packet"]}")"
            fi
          done

          git worktree remove --force "$base_tree" >/dev/null 2>&1 || true

          if [ "$regressions" -gt 0 ]; then
            echo ""
            echo "BLOCKED: $regressions packet(s) regressed in this PR."
            echo "Run: bash .opencode/skills/system-spec-kit/runtime/cli/spec/validate.sh <packet> --strict"
            exit 1
          fi
          echo "No regressions: every failing packet already failed at the merge base."
