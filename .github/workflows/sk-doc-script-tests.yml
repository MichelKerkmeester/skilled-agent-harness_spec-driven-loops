name: sk-doc Script Tests

# These tests ran nowhere, and four of them failed for weeks without anyone
# seeing. Two of them walk the whole repository, the durable-directory manifest
# and the README verdict baseline, so this runs on every push rather than only
# when sk-doc changes. The rename harness takes ten minutes and runs in its own
# workflow, scoped to the scripts it exercises.
on:
  pull_request:
    branches: [main, 'skilled/**']
  push:
    branches: [main, 'skilled/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sk-doc-scripts:
    name: sk-doc script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: .github/workflows/sk-doc-script-tests.yml

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The packager validates frontmatter with PyYAML and falls back to a lenient
      # parser without it, which accepts documents the tests expect it to reject.
      - name: Install test dependencies
        run: python3 -m pip install pytest==8.4.2 pyyaml==6.0.3

      # The scaffolder's class gate reads frontmatter through @spec-kit/shared,
      # and the root-name matrix loads a deep-loop script that resolves it through
      # the deep-loop package, so both are installed and the shared package built.
      - name: Install the packages the scripts load
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
          ( cd .opencode/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
          npm --prefix .opencode/skills/sk-doc ci
          npm --prefix .opencode/skills/system-deep-loop ci

      - name: Run the sk-doc script tests
        env:
          SKIP_TESTS: test_rename_tooling_fixture_harness.py
        run: bash .opencode/skills/sk-doc/scripts/tests/run-script-tests.sh

  # The catalog validator passed all 29 packages on its first run, so it blocks
  # from day one. The shared runner globs only its own directory, so the
  # validator's fixture test, which lives beside the validator, runs here.
  catalog-packages:
    name: Feature catalog packages validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Validate every feature catalog package
        run: python3 .skilled/skills/sk-doc/sk-create-feature-catalog/scripts/validate_catalog_package.py

      - name: Run the catalog validator fixture tests
        run: python3 .skilled/skills/sk-doc/sk-create-feature-catalog/scripts/tests/test_validator_fixtures.py

  citation-drift:
    name: No new broken citations
    runs-on: ubuntu-latest
    steps:
      # The base comparison needs the base commit, so the full history is fetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run the citation gate tests
        run: node --test .skilled/skills/sk-doc/scripts/tests/test-cite-drift-gate.mjs

      # A pull request fails only on an unresolved or past-end citation its merge
      # base does not have; older ones print as one count. A push only reports.
      # Once the older count reaches 0, this base comparison can be dropped and
      # every broken citation can block.
      - name: Check citations against the merge base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$(git merge-base "$BASE_SHA" HEAD)"
            node .skilled/skills/sk-doc/shared/scripts/cite-drift-gate.mjs --base "$BASE"
          else
            node .skilled/skills/sk-doc/shared/scripts/cite-drift-gate.mjs
          fi
