name: sk-doc Script Tests

# Two of the sk-doc script tests walk the whole repository, the durable-directory
# manifest and the README verdict baseline, so they run on every push rather than
# only when sk-doc changes. The other 54 are in sk-doc Script Tests (Filtered),
# which runs them when an sk-doc path changes. The rename harness takes ten
# minutes and runs in its own workflow, scoped to the scripts it exercises.
on:
  pull_request:
    branches: [main, 'skilled/**']
  push:
    branches: [main, 'skilled/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every model load runs on the CPU, so the onnxruntime-node install skips its Linux CUDA
  # provider download: unused here, and the install step that fails when that host times out.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  sk-doc-repository-walk:
    name: sk-doc repository walk tests
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_FRESHNESS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: .github/workflows/sk-doc-script-tests.yml

      # The verdict baseline reads frontmatter through the validator, which falls
      # back to a lenient parser without PyYAML, and the baseline can then differ.
      - name: Install the verdict baseline dependency
        run: python3 -m pip install pyyaml==6.0.3

      - name: Run the repository walk tests
        env:
          ONLY_TESTS: test_readme_manifest.py test_readme_verdict_parity.py
        run: bash .opencode/skills/sk-doc/scripts/tests/run-script-tests.sh

  # The catalog validator passed all 29 packages on its first run, so it blocks
  # from day one. The shared runner globs only its own directory, so the
  # validator's fixture test, which lives beside the validator, runs here.
  catalog-packages:
    name: Feature catalog packages validate
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_FRESHNESS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Validate every feature catalog package
        run: python3 .skilled/skills/sk-doc/sk-create-feature-catalog/scripts/validate_catalog_package.py

      - name: Run the catalog validator fixture tests
        run: python3 .skilled/skills/sk-doc/sk-create-feature-catalog/scripts/tests/test_validator_fixtures.py

  # The render ledger and its staged sets may only shrink, and every skill must
  # package under --strict. Staged findings print as advisory warnings, so the
  # sweep fails only on an enforced render finding or another contract break.
  render-gate:
    name: Render ledger holds and every skill packages strictly
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_FRESHNESS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The packager parses frontmatter with PyYAML and is laxer without it.
      - name: Install the packager dependency
        run: python3 -m pip install pyyaml==6.0.3

      - name: Run the render-known-debt ratchet
        run: node --test .skilled/skills/sk-doc/sk-create-skill/scripts/tests/render-known-debt-ratchet.test.cjs

      # Packaging a hub reads only its own root, so each mode is packaged too.
      - name: Package every skill and mode under --strict
        run: |
          set -uo pipefail
          failed=0
          for skill_md in .skilled/skills/*/SKILL.md .skilled/skills/*/*/SKILL.md; do
            [ -f "$skill_md" ] || continue
            skill="$(dirname "$skill_md")"
            if ! python3 .skilled/skills/sk-doc/sk-create-skill/scripts/package_skill.py "$skill" --check --strict; then
              echo "::error::${skill} fails package_skill.py --check --strict"
              failed=1
            fi
          done
          exit "$failed"

  citation-drift:
    name: No new broken citations
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_FRESHNESS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The base comparison needs the base commit, so the full history is fetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run the citation gate tests
        run: node --test .skilled/skills/sk-doc/scripts/tests/test-cite-drift-gate.mjs

      # A pull request fails only on an unresolved or past-end citation its merge
      # base does not have; older ones print as one count. A push only reports.
      # Once the older count reaches 0, this base comparison can be dropped and
      # every broken citation can block.
      - name: Check citations against the merge base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$(git merge-base "$BASE_SHA" HEAD)"
            node .skilled/skills/sk-doc/shared/scripts/cite-drift-gate.mjs --base "$BASE"
          else
            node .skilled/skills/sk-doc/shared/scripts/cite-drift-gate.mjs
          fi
