name: Spec-Kit Check

on:
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.opencode/skills/system-spec-kit/**'
      - '.github/workflows/spec-kit-check.yml'
      # The mirror-parity job compares generated mirrors against their sources.
      # Triggering on the spec-kit runtime alone let a mirror drift on a command
      # or agent commit, ship unseen, and fail here later on whoever next touched
      # the runtime. Every mirror source and every mirror output triggers it now.
      - '.opencode/commands/**'
      - '.opencode/agents/**'
      - '.opencode/skills/*/command-metadata.json'
      - '.codex/**'
      - '.claude/**'
      - '.cursor/**'
      - '.devin/**'
      - '.pi/**'
  pull_request:
    branches: [main]
    paths:
      - '.opencode/skills/system-spec-kit/**'
      - '.github/workflows/spec-kit-check.yml'
      # The mirror-parity job compares generated mirrors against their sources.
      # Triggering on the spec-kit runtime alone let a mirror drift on a command
      # or agent commit, ship unseen, and fail here later on whoever next touched
      # the runtime. Every mirror source and every mirror output triggers it now.
      - '.opencode/commands/**'
      - '.opencode/agents/**'
      - '.opencode/skills/*/command-metadata.json'
      - '.codex/**'
      - '.claude/**'
      - '.cursor/**'
      - '.devin/**'
      - '.pi/**'

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, import policy and test suites for the spec-kit packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only the package root carries a lockfile; shared, runtime and
      # runtime/cli are workspaces of it, so the root install provisions all
      # three. The CLI's check gate maps dist files back to sources, so every
      # package is built before it runs.
      - name: Install and build the spec-kit packages
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
          # The runtime project imports the OpenCode plugin entrypoints, which depend
          # on the plugin SDK declared in .opencode/package.json.
          npm --prefix .opencode ci
          # The plugins-purity suite imports every plugin entrypoint; the communication
          # projection plugin imports its package's compiled output, which that
          # package builds on install through its prepare script.
          npm --prefix .opencode/skills/sk-communication/cli-communication-projection ci
          # The skill-advisor plugin imports the advisor server's compiled output in the
          # same way; its build also compiles the shared package it depends on.
          npm --prefix .opencode/skills/system-skill-advisor/runtime ci
          npm --prefix .opencode/skills/system-skill-advisor/runtime run build
          ( cd .opencode/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
          npm --prefix .opencode/skills/system-spec-kit/runtime run build
          npm --prefix .opencode/skills/system-spec-kit/runtime/cli run build

      # The CLI check is the only gate that rejects a reverse import into the
      # engine's internals; before this workflow nothing ran it outside a
      # developer's shell.
      - name: CLI check gate and typecheck
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit/runtime/cli run check
          npm --prefix .opencode/skills/system-spec-kit/runtime/cli run typecheck

      - name: Shared package tests
        run: npm --prefix .opencode/skills/system-spec-kit/shared test

      # The ripgrep recipe and residue-sweep suites spawn rg; the runner image
      # does not ship it, and without it every recipe exits 2.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: CLI vitest project
        run: |
          set -euo pipefail
          cd .opencode/skills/system-spec-kit/runtime/cli
          npx vitest run --config ../../vitest.config.ts --project cli

      - name: Legacy module lanes and the bash validation suites
        # These lanes are what `npm test` runs after the vitest project, and they
        # rotted unseen while only the vitest project ran here.
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit/runtime/cli run test:legacy
          npm --prefix .opencode/skills/system-spec-kit/runtime/cli run test:validation

      - name: Runtime vitest project
        # The runtime's own suites, which failed in seven files for months while
        # only the CLI project ran here.
        run: |
          set -euo pipefail
          cd .opencode/skills/system-spec-kit/runtime
          npx vitest run --config ../vitest.config.ts --project root

  mirrors:
    name: Runtime mirrors agree with their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The same read-only checks /doctor runtime-mirrors runs on demand. The
      # agent-mirror workflow covers agents only; these cover commands, prompts,
      # the agent roster and the command catalog, so prompt and command drift
      # stops being invisible to CI.
      # The sync scripts require @spec-kit/shared through the workspace link,
      # which only an install creates on a clean runner.
      - name: Install the workspace and build its shared package
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
          ( cd .opencode/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )

      - name: Mirror parity checks
        run: |
          set -euo pipefail
          node .opencode/skills/system-spec-kit/runtime/cli/runtime-mirrors/sync-runtime-mirrors.cjs --check
          node .opencode/skills/system-spec-kit/runtime/cli/codex/sync-agents.cjs --check
          node .opencode/skills/system-spec-kit/runtime/cli/codex/sync-prompts.cjs --check
          node .opencode/commands/doctor/scripts/agent-roster-mirror-check.cjs
          node .opencode/commands/doctor/scripts/command-catalog-mirror-check.cjs
          node .opencode/skills/system-spec-kit/runtime/cli/runtime-mirrors/sync-hook-registrations.cjs --check
          node .opencode/skills/system-spec-kit/runtime/cli/runtime-mirrors/sync-gate1-pointers.cjs --check
