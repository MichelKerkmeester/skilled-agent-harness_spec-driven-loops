name: OpenCode Dual-Version Battery

# OpenCode 1.19.4 and 2.1.4 are separate npm packages that both claim the name
# `opencode`, and the repo's plugins register differently on each major. Neither
# family ran anywhere, so a plugin that loads on one major and not the other
# reached a commit unseen. Each pinned package is installed into its own prefix,
# the battery reports one JSON summary per family, and a `both` job proves the
# two dispatch names still resolve to two different binaries.
on:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.opencode/plugins/**'
      - '.skilled/plugins/**'
      - '.skilled/skills/sk-vision/**'
      - '.opencode/skills/sk-vision/**'
      - '.skilled/agents/**'
      - '.opencode/agents/**'
      - '.skilled/hooks/dispatch/**'
      - '.opencode/hooks/dispatch/**'
      - '.skilled/bin/tests/opencode-config-shape.test.cjs'
      - '.opencode/bin/tests/opencode-config-shape.test.cjs'
      - '.opencode/package.json'
      - '.skilled/package.json'
      - '.opencode/package-lock.json'
      - '.skilled/package-lock.json'
      - 'opencode.json'
      - '.skilled/commands/doctor/scripts/opencode-version-battery.cjs'
      - '.opencode/commands/doctor/scripts/opencode-version-battery.cjs'
      - '.skilled/commands/doctor/scripts/tests/opencode-version-battery.test.cjs'
      - '.opencode/commands/doctor/scripts/tests/opencode-version-battery.test.cjs'
      - '.skilled/skills/cli-external-orchestration/cli-opencode/**'
      - '.opencode/skills/cli-external-orchestration/cli-opencode/**'
      - '.skilled/skills/cli-external-orchestration/**/*.md'
      - '.opencode/skills/cli-external-orchestration/**/*.md'
      - '.hermes/skills/cli-opencode/**'
      - '.github/actions/**'
      - '.github/workflows/opencode-dual-version.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.opencode/plugins/**'
      - '.skilled/plugins/**'
      - '.skilled/skills/sk-vision/**'
      - '.opencode/skills/sk-vision/**'
      - '.skilled/agents/**'
      - '.opencode/agents/**'
      - '.skilled/hooks/dispatch/**'
      - '.opencode/hooks/dispatch/**'
      - '.skilled/bin/tests/opencode-config-shape.test.cjs'
      - '.opencode/bin/tests/opencode-config-shape.test.cjs'
      - '.opencode/package.json'
      - '.skilled/package.json'
      - '.opencode/package-lock.json'
      - '.skilled/package-lock.json'
      - 'opencode.json'
      - '.skilled/commands/doctor/scripts/opencode-version-battery.cjs'
      - '.opencode/commands/doctor/scripts/opencode-version-battery.cjs'
      - '.skilled/commands/doctor/scripts/tests/opencode-version-battery.test.cjs'
      - '.opencode/commands/doctor/scripts/tests/opencode-version-battery.test.cjs'
      - '.skilled/skills/cli-external-orchestration/cli-opencode/**'
      - '.opencode/skills/cli-external-orchestration/cli-opencode/**'
      - '.skilled/skills/cli-external-orchestration/**/*.md'
      - '.opencode/skills/cli-external-orchestration/**/*.md'
      - '.hermes/skills/cli-opencode/**'
      - '.github/actions/**'
      - '.github/workflows/opencode-dual-version.yml'
  workflow_dispatch:
    inputs:
      cold:
        description: Provision from scratch instead of restoring the cache
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  battery:
    name: Battery on OpenCode ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One family per prefix, and each entry reports on its own; a failure in one
    # must not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: v1
            package: opencode-ai@1.19.4
            name: opencode
          - family: v2
            package: '@opencode/cli@2.1.4'
            name: opencode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The plugins import the plugin workspace, the spec-kit shared package and
      # compiled runtimes that are not committed, so the repository's own
      # worktree provisioning installs and builds every tree it lists.
      - name: Provision the dependency trees the plugins import
        uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cold != 'true' }}

      # Some of the trigger paths are unit tests, and a trigger path no step runs
      # starts the workflow without checking the change that started it. They read
      # fixtures, the repository's own config and the skill's documentation, never
      # an installed binary, so they run before either family is installed.
      - name: Run the config-shape, battery and cli-opencode doc unit tests
        run: |
          set -euo pipefail
          node --test \
            .skilled/bin/tests/opencode-config-shape.test.cjs \
            .skilled/commands/doctor/scripts/tests/opencode-version-battery.test.cjs \
            .skilled/skills/cli-external-orchestration/cli-opencode/scripts/tests/default-model-id.test.cjs \
            .skilled/skills/cli-external-orchestration/cli-opencode/scripts/tests/opencode2-models-form.test.cjs

      # The sk-vision TypeScript suite and type check need the provisioned trees, so they
      # ride the v1 leg rather than a second provisioning job. The Python handler suite
      # under python/ is left out because it needs Pillow, which the runner lacks.
      - name: Run the sk-vision runtime suite
        if: matrix.family == 'v1'
        working-directory: .skilled/skills/sk-vision/vision-runtime
        run: |
          set -euo pipefail
          bun test tests
          bunx tsc --noEmit

      # Both packages claim the `opencode` name, so each family owns its prefix
      # and the battery reaches the binary by its full path.
      - name: Install OpenCode ${{ matrix.family }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/opencode-${{ matrix.family }}"
          npm install -g --prefix "$prefix" "${{ matrix.package }}"
          bin="$prefix/bin/${{ matrix.name }}"
          if [ ! -e "$bin" ] && [ -e "$prefix/bin/opencode2" ]; then
            bin="$prefix/bin/opencode2"
          fi
          if [ ! -e "$bin" ]; then
            echo "::error::${{ matrix.package }} installed no ${{ matrix.name }} under $prefix/bin"
            exit 1
          fi
          "$bin" --version
          echo "OPENCODE_BIN=$bin" >>"$GITHUB_ENV"

      # The battery probes $OPENCODE_BIN first, so it reads the family this
      # prefix holds. Any non-zero exit, a degraded or skipped leg included,
      # fails the job.
      - name: Run the version battery for ${{ matrix.family }}
        run: |
          set -euo pipefail
          node .skilled/commands/doctor/scripts/opencode-version-battery.cjs \
            --family=${{ matrix.family }} \
            --json \
            --out "$RUNNER_TEMP/battery-${{ matrix.family }}.json"

      - name: Upload the ${{ matrix.family }} battery summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battery-${{ matrix.family }}
          path: ${{ runner.temp }}/battery-${{ matrix.family }}.json
          if-no-files-found: warn

  both:
    name: Both versions installed at once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Provision the dependency trees the plugins import
        uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cold != 'true' }}

      - name: Install both versions into their own prefixes
        run: |
          set -euo pipefail
          npm install -g --prefix "$RUNNER_TEMP/opencode-v1" opencode-ai@1.19.4
          npm install -g --prefix "$RUNNER_TEMP/opencode-v2" @opencode/cli@2.1.4

      # v2 opens the same database as v1 by default and migrates it in place, so
      # the `opencode2` entry is a launcher that moves it to its own file first.
      # Only this launcher carries the name; the v2 prefix bin stays off PATH so
      # its own `opencode` cannot shadow v1's.
      - name: Write the opencode2 launcher
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          printf '%s\n' \
            '#!/bin/sh' \
            '# v2 would otherwise open the same opencode.db as v1 and migrate it in place.' \
            '# A relative OPENCODE_DB resolves under the shared data directory.' \
            ": \"\${OPENCODE_DB:=opencode-v2.db}\"" \
            'export OPENCODE_DB' \
            "exec \"$RUNNER_TEMP/opencode-v2/bin/opencode2\" \"\$@\"" \
            >"$RUNNER_TEMP/bin/opencode2"
          chmod +x "$RUNNER_TEMP/bin/opencode2"
          printf '%s\n' "$RUNNER_TEMP/bin" "$RUNNER_TEMP/opencode-v1/bin" >>"$GITHUB_PATH"

      - name: Assert the two entries stay distinct
        run: |
          set -euo pipefail
          v1="$(command -v opencode || true)"
          v2="$(command -v opencode2 || true)"
          printf 'opencode -> %s\n' "$v1"
          printf 'opencode2 -> %s\n' "$v2"
          if [ -z "$v1" ] || [ -z "$v2" ]; then
            echo "::error::Both names must resolve; opencode='$v1' opencode2='$v2'"
            exit 1
          fi
          if [ "$v1" = "$v2" ]; then
            echo "::error::opencode and opencode2 resolve to the same path: $v1"
            exit 1
          fi
          case "$v1" in /*) ;; *) echo "::error::opencode is not an absolute path: $v1"; exit 1 ;; esac
          case "$v2" in /*) ;; *) echo "::error::opencode2 is not an absolute path: $v2"; exit 1 ;; esac
          v1_out="$(opencode --version | tr -d '\r')"
          v2_out="$(opencode2 --version | tr -d '\r')"
          printf 'opencode --version -> %s\n' "$v1_out"
          printf 'opencode2 --version -> %s\n' "$v2_out"
          if [ "$v1_out" != "1.19.4" ]; then
            echo "::error::opencode reports '$v1_out', expected 1.19.4"
            exit 1
          fi
          if [ "$v2_out" != "opencode v2.1.4" ]; then
            echo "::error::opencode2 reports '$v2_out', expected opencode v2.1.4"
            exit 1
          fi

      # With no OPENCODE_BIN set, the battery reads v1 through `opencode` and v2
      # through `opencode2`, the layout the skill documents.
      - name: Run the version battery against both installs
        run: |
          set -euo pipefail
          node .skilled/commands/doctor/scripts/opencode-version-battery.cjs \
            --family=both \
            --json \
            --out "$RUNNER_TEMP/battery-both.json"

      - name: Upload the both-family battery summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battery-both
          path: ${{ runner.temp }}/battery-both.json
          if-no-files-found: warn
