name: Playbook Operator Contract
on:
  # Deliberately NOT path-filtered. The contract validates cross-tree citations, so a
  # rename far outside any playbook directory can break hundreds of scenarios. A filtered
  # trigger would let that land green because no watched path changed.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  operator-contract:
    name: Manual-testing-playbook operator-scenario contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every bail-out below is a hard failure, never a skip. This gate exists because a
      # backlog once grew while builds stayed green: the corpus scan silently covered a
      # third of the roots, and absence of a result was indistinguishable from a passing
      # one. A gate that goes green when it cannot find its own validator, or when its
      # allowlist is empty, recreates precisely that condition.
      - name: Verify the gate can actually run
        run: |
          set -euo pipefail
          VALIDATOR=".opencode/skills/sk-doc/sk-create-manual-testing-playbook/scripts/validate-playbook-package.cjs"
          ALLOWLIST=".opencode/skills/sk-doc/sk-create-manual-testing-playbook/playbook-failclosed-allowlist.txt"
          for required in "$VALIDATOR" "$ALLOWLIST"; do
            if [ ! -f "$required" ]; then
              echo "::error::gate input missing: $required"
              echo "If this path moved, update this workflow in the same change."
              exit 1
            fi
          done
          roots="$(grep -cve '^[[:space:]]*$' -e '^[[:space:]]*#' "$ALLOWLIST" || true)"
          if [ "${roots:-0}" -lt 1 ]; then
            echo "::error::the fail-closed allowlist lists no roots"
            exit 1
          fi
          echo "Gate inputs present; $roots roots are held to the contract."

      - name: Enforce the operator-scenario contract across the playbook fleet
        run: |
          set -euo pipefail
          node .opencode/skills/sk-doc/sk-create-manual-testing-playbook/scripts/validate-playbook-package.cjs --strict

      # A root the scan cannot see cannot fail, so absence is indistinguishable from a
      # pass. Listing the roots turns "silently no longer scanned" into a hard failure.
      - name: Assert every fail-closed root is still discovered
        run: |
          set -euo pipefail
          PACKET=".opencode/skills/sk-doc/sk-create-manual-testing-playbook"
          node "$PACKET/scripts/validate-playbook-package.cjs" --no-strict --format json > /tmp/fleet.json
          node -e '
            const fs = require("fs");
            const path = require("path");
            const packet = ".opencode/skills/sk-doc/sk-create-manual-testing-playbook";
            const seen = new Set(
              JSON.parse(fs.readFileSync("/tmp/fleet.json", "utf8")).packages
                .map((entry) => path.relative(process.cwd(), entry.playbookRoot)),
            );
            const wanted = fs.readFileSync(path.join(packet, "playbook-failclosed-allowlist.txt"), "utf8")
              .split("\n").map((line) => line.trim())
              .filter((line) => line && !line.startsWith("#"));
            if (wanted.length === 0) {
              console.log("::error::allowlist parsed to zero roots");
              process.exit(1);
            }
            const missing = wanted.filter((root) => !seen.has(root));
            for (const root of missing) {
              console.log(`::error::fail-closed root is no longer discovered by the fleet scan: ${root}`);
            }
            if (missing.length > 0) {
              console.log("Restore it, or remove its line in the same PR with a reason.");
              process.exit(1);
            }
            console.log(`All ${wanted.length} fail-closed roots are still discovered and enforced.`);
          '
