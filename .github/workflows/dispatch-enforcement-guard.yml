name: Dispatch Enforcement Guard

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'skilled/**']
  push:
    branches: [main, 'skilled/**']

permissions:
  contents: read

jobs:
  dispatch-enforcement-guard:
    name: Every declared dispatch rule is reachable and discriminates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Run the dispatch rule engine suite
        # This gate exists because the failure it guards is silence. A check with no
        # implementation, an implementation no packet declares, a predicate that only
        # ever saw commands it passed, and a runtime whose shape matched none of its
        # own dispatches all looked enforced while enforcing nothing. The shared
        # report-only test runner already collects this suite, but a report cannot
        # fail a build, so the suite that proves enforcement gets its own blocking job.
        run: |
          set -euo pipefail
          SUITE=".skilled/hooks/dispatch/lib/dispatch-rule-checks.test.mjs"
          # Fail closed: a pull request that deletes the suite must not disable its own gate.
          if [ ! -f "$SUITE" ]; then
            echo "::error::Dispatch rule suite not found at $SUITE — failing closed."
            exit 1
          fi
          if ! node --test "$SUITE"; then
            echo "::error::A dispatch rule is unreachable, undeclared, or does not discriminate — see the failures above."
            exit 1
          fi
      - name: Run the dispatch audit core suite
        run: |
          set -euo pipefail
          npm --prefix .skilled ci
          # The quarantined evidence tray (review/containment) freezes an older copy of
          # this suite that resolves no skills tree, so only the live copies enforce.
          # Vitest is installed under .skilled, never at the repository root, so the
          # runner is called by its path. npx resolves through any node_modules above
          # it and has run a cached, unpinned vitest in place of the locked one.
          .skilled/node_modules/.bin/vitest run .skilled/hooks/dispatch/lib/dispatch-audit.test.mjs --exclude "**/review/containment/**"

  hooks-vitest:
    name: Every hook vitest suite passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install the hooks test runner
        run: npm --prefix .skilled ci
      # The runtime adapter suites, Pi's preflight lint and directive dedup and the
      # Codex shell-tool names, ran in no job, so a rename upstream broke them
      # unseen. The hooks config collects every vitest suite in the tree and skips
      # the node:test files, which run on their own.
      - name: Run the hooks vitest tree
        run: .skilled/node_modules/.bin/vitest run --config .skilled/hooks/vitest.config.ts
