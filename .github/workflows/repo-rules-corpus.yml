name: Repo Rules Corpus
on:
  pull_request:
    branches: [main]
    paths:
      - 'REPO RULES.md'
      - 'repo-rules/**'
      - '.skilled/repo-rules/**'
      # No .opencode/repo-rules tree exists; the gate-input check requires every
      # source-root filter to name both roots, so this twin is required and inert.
      - '.opencode/repo-rules/**'
      - '.opencode/skills/sk-doc/sk-create-repo-rule/scripts/check-repo-rules.cjs'
      - '.skilled/skills/sk-doc/sk-create-repo-rule/scripts/check-repo-rules.cjs'
  push:
    branches: [main, 'skilled/**']
    paths:
      - 'REPO RULES.md'
      - 'repo-rules/**'
      - '.skilled/repo-rules/**'
      # No .opencode/repo-rules tree exists; the gate-input check requires every
      # source-root filter to name both roots, so this twin is required and inert.
      - '.opencode/repo-rules/**'
      - '.opencode/skills/sk-doc/sk-create-repo-rule/scripts/check-repo-rules.cjs'
      - '.skilled/skills/sk-doc/sk-create-repo-rule/scripts/check-repo-rules.cjs'

jobs:
  repo-rules-corpus:
    name: Repo-rules corpus stays in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Check repo-rules corpus
        run: |
          set -euo pipefail
          GUARD=".skilled/skills/sk-doc/sk-create-repo-rule/scripts/check-repo-rules.cjs"
          # This gate keeps the repo-rules corpus loadable so drift cannot leave a rule silently unloaded.
          # Fail closed in CI: a PR that deletes or moves this required checker must not disable the gate.
          if [ ! -f "$GUARD" ]; then
            echo "::error::Repo-rules guard not found at $GUARD — failing closed."
            exit 1
          fi
          if node "$GUARD"; then
            echo "All clear — repo-rules corpus is consistent."
          else
            echo "::error::Repo-rules corpus drifted — restore the rule files, router rows and trigger phrases so every rule remains loadable."
            exit 1
          fi
