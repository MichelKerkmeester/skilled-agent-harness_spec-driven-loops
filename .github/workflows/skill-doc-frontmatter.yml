name: Skill Doc Frontmatter
on:
  pull_request:
    branches: [main]
    paths:
      # A single * does not cross a slash, so this once matched only top-level
      # skills and ignored every packet-owned doc — the bulk of the corpus.
      - '.opencode/skills/**/references/**'
      - '.skilled/skills/**/references/**'
      - '.opencode/skills/**/assets/**'
      - '.skilled/skills/**/assets/**'
      # Any changed skill doc must raise its version, which the doc-version-raise job checks.
      - '.opencode/skills/**/*.md'
      - '.skilled/skills/**/*.md'
      - '.skilled/skills/system-skill-advisor/runtime/scripts/check-skill-doc-frontmatter.sh'
      - '.opencode/skills/system-skill-advisor/runtime/scripts/check-skill-doc-frontmatter.sh'
      - '.github/workflows/skill-doc-frontmatter.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      # A single * does not cross a slash, so this once matched only top-level
      # skills and ignored every packet-owned doc — the bulk of the corpus.
      - '.opencode/skills/**/references/**'
      - '.skilled/skills/**/references/**'
      - '.opencode/skills/**/assets/**'
      - '.skilled/skills/**/assets/**'
      - '.skilled/skills/system-skill-advisor/runtime/scripts/check-skill-doc-frontmatter.sh'
      - '.opencode/skills/system-skill-advisor/runtime/scripts/check-skill-doc-frontmatter.sh'
      - '.github/workflows/skill-doc-frontmatter.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontmatter-coverage:
    name: Skill reference/asset frontmatter contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run skill-doc frontmatter guard (coverage mode)
        run: |
          set -euo pipefail
          GUARD=".opencode/skills/system-skill-advisor/runtime/scripts/check-skill-doc-frontmatter.sh"
          # Fail closed in CI: a required guard must exist. A PR that deletes or
          # moves the checker must not silently disable its own gate.
          if [ ! -f "$GUARD" ]; then
            echo "::error::frontmatter guard not found at $GUARD — failing closed."
            exit 1
          fi
          # Coverage mode: every reference/asset doc (READMEs exempt) must
          # carry the full contract-valid frontmatter block. The corpus
          # reached 355/355 conformant on 2026-06-11; new docs must be
          # born conformant.
          bash "$GUARD" . --coverage
          echo "All clear — skill doc frontmatter matches the contract."

  doc-version-raise:
    name: Changed skill docs raise their version
    # Only a pull request has a base to compare against. This is what catches a
    # commit made with SPECKIT_SKIP_DOC_VERSION_BUMP set, or one that never ran the hook.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The comparison needs the base branch, so the full history is fetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The engine reads frontmatter through @spec-kit/shared, so that package is built.
      - name: Install the packages the engine loads
        run: |
          set -euo pipefail
          npm --prefix .skilled/skills/system-spec-kit ci
          ( cd .skilled/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
          npm --prefix .skilled/skills/sk-doc ci

      # Fails on a changed doc whose body changed while its version did not go up, and
      # prints the one command that raises them against the same base.
      - name: Check every changed doc body raised its version
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .skilled/skills/sk-doc/shared/scripts/frontmatter-version.mjs bump --check --base "origin/$BASE_REF"
