name: sk-code Script Tests

# The sk-code script suites, the drift-guard orchestrator's among them, were
# collected only by the shared node runner, whose run is advisory, so a broken
# aggregation or guard reached main unseen. Every suite in the folder is
# node:test and offline, and each builds its own throwaway tree.
on:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/skills/sk-code/**'
      - '.opencode/skills/sk-code/**'
      # The runner tests load the registry compiler and the two folders it requires.
      - '.skilled/bin/lib/compiled-routing/003-contract-schemas/**'
      - '.opencode/bin/lib/compiled-routing/003-contract-schemas/**'
      - '.skilled/bin/lib/compiled-routing/004-compiler-n1-shadow/**'
      - '.opencode/bin/lib/compiled-routing/004-compiler-n1-shadow/**'
      - '.skilled/bin/lib/compiled-routing/009-parent-hub-rollout/001-sk-code/**'
      - '.opencode/bin/lib/compiled-routing/009-parent-hub-rollout/001-sk-code/**'
      # The runner's dist check loads the spec-kit freshness library and its workspace.
      - '.skilled/skills/system-spec-kit/runtime/cli/lib/dist-freshness.cjs'
      - '.opencode/skills/system-spec-kit/runtime/cli/lib/dist-freshness.cjs'
      - '.skilled/skills/system-spec-kit/shared/workspace/**'
      - '.opencode/skills/system-spec-kit/shared/workspace/**'
      - '.skilled/skills/system-spec-kit/package-lock.json'
      - '.opencode/skills/system-spec-kit/package-lock.json'
      # The review mode's rule-canary suite reads AGENTS.md as one of its targets.
      - 'AGENTS.md'
      - '.github/workflows/sk-code-script-tests.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/skills/sk-code/**'
      - '.opencode/skills/sk-code/**'
      # The runner tests load the registry compiler and the two folders it requires.
      - '.skilled/bin/lib/compiled-routing/003-contract-schemas/**'
      - '.opencode/bin/lib/compiled-routing/003-contract-schemas/**'
      - '.skilled/bin/lib/compiled-routing/004-compiler-n1-shadow/**'
      - '.opencode/bin/lib/compiled-routing/004-compiler-n1-shadow/**'
      - '.skilled/bin/lib/compiled-routing/009-parent-hub-rollout/001-sk-code/**'
      - '.opencode/bin/lib/compiled-routing/009-parent-hub-rollout/001-sk-code/**'
      # The runner's dist check loads the spec-kit freshness library and its workspace.
      - '.skilled/skills/system-spec-kit/runtime/cli/lib/dist-freshness.cjs'
      - '.opencode/skills/system-spec-kit/runtime/cli/lib/dist-freshness.cjs'
      - '.skilled/skills/system-spec-kit/shared/workspace/**'
      - '.opencode/skills/system-spec-kit/shared/workspace/**'
      - '.skilled/skills/system-spec-kit/package-lock.json'
      - '.opencode/skills/system-spec-kit/package-lock.json'
      # The review mode's rule-canary suite reads AGENTS.md as one of its targets.
      - 'AGENTS.md'
      - '.github/workflows/sk-code-script-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sk-code-scripts:
    name: sk-code script tests
    if: vars.SKILLED_CI != 'off' && vars.SKILLED_CI_TESTS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run the sk-code script tests
        run: node --test .skilled/skills/sk-code/sk-code-skilled/scripts/tests/*.test.cjs

      # Quality and review will read a checklist's rule overrides through the shared
      # linter, so a linter that lets a hard floor rule through fails here first.
      - name: Run the sk-code shared script tests
        run: node --test .skilled/skills/sk-code/shared/scripts/tests/*.test.cjs

      # The quality mode's bash suites cover the comment-hygiene checker that
      # pre-commit and the comment-hygiene job call, so a broken checker fails here first.
      - name: Run the sk-code-quality bash suites
        run: |
          set -euo pipefail
          bash .skilled/skills/sk-code/sk-code-quality/scripts/tests/check-comment-hygiene.test.sh
          bash .skilled/skills/sk-code/sk-code-quality/scripts/tests/ceiling-report.test.sh
          bash .skilled/skills/sk-code/sk-code-quality/scripts/typo-flags.test.sh
          bash .skilled/skills/sk-code/sk-code-quality/scripts/hooks/claude-posttooluse.test.sh

      # The review mode's suite drives the rule canary and both review-output checkers
      # against tampered copies and fixtures. Rule Canary Sync runs only the canary on
      # the live tree, so a checker regression would otherwise reach main unseen.
      - name: Run the sk-code-review bash suite
        run: bash .skilled/skills/sk-code/sk-code-review/scripts/tests/check-rule-copies.test.sh

      # The alignment drift checker reads each router from ROUTER.md, and its Python
      # suite sat beside the script with no job running it, so a regression went unseen.
      - name: Run the sk-code-skilled alignment drift tests
        run: python3 .skilled/skills/sk-code/sk-code-skilled/assets/scripts/test_verify_alignment_drift.py

      # The runner's dist check loads the spec-kit freshness library, which resolves
      # the shared workspace package through node_modules. Install scripts are skipped
      # because the tests need only the workspace links, never a native build.
      - name: Install the spec-kit workspace
        run: npm --prefix .skilled/skills/system-spec-kit ci --no-audit --no-fund --ignore-scripts

      # The quality runner's fixtures build throwaway repositories and assert the run
      # wrote nothing, so a runner that starts writing fails here before any hook uses it.
      - name: Run the sk-code-quality runner tests
        run: node --test .skilled/skills/sk-code/sk-code-quality/scripts/tests/*.test.cjs

      # The spec-kit library the quality runner loads declares Node 20 support, and
      # the pool helper's long-line case once failed only on a Node 20 parent, so
      # that one suite reruns on that major.
      - name: Setup Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Run the parallel node check suite on Node 20
        run: node --test .skilled/skills/sk-code/sk-code-quality/scripts/tests/parallel-node-check.test.cjs
