name: Markdown Link Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - '.opencode/skills/**'
      - '.skilled/skills/**'
      - '.opencode/commands/**'
      - '.skilled/commands/**'
      - '.opencode/agents/**'
      - '.skilled/agents/**'
      - '.claude/agents/**'
      - '.claude/commands/**'
      - '.codex/agents/**'
      - '.codex/commands/**'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.opencode/skills/**'
      - '.skilled/skills/**'
      - '.opencode/commands/**'
      - '.skilled/commands/**'
      - '.opencode/agents/**'
      - '.skilled/agents/**'
      - '.claude/agents/**'
      - '.claude/commands/**'
      - '.codex/agents/**'
      - '.codex/commands/**'

jobs:
  markdown-link-integrity:
    name: No broken markdown links in skills/commands/agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check markdown link integrity (whole-repo)
        run: |
          set -euo pipefail
          GUARD=".opencode/skills/system-spec-kit/runtime/cli/check-markdown-links.cjs"
          # Fail closed in CI: a required guard must exist. A PR that deletes or
          # moves the checker must not silently disable its own gate.
          if [ ! -f "$GUARD" ]; then
            echo "::error::markdown-link guard not found at $GUARD — failing closed."
            exit 1
          fi
          # The guard walks the active skills/commands/agents docs itself (whole-repo, not
          # changed-files) because a deleted target breaks unchanged referrers. It prints any
          # broken links and exits non-zero, which fails this step.
          node "$GUARD"
