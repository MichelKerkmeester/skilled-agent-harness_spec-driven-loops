name: Pi Extension Tests

# Every folder under .pi/extensions that holds a package.json is found at run
# time, so adding an extension needs no edit here. Each one installs from its
# lockfile, then runs its test script plus its typecheck and pack check when it
# defines them.
on:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.pi/extensions/**'
      - '.github/workflows/pi-extension-tests.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.pi/extensions/**'
      - '.github/workflows/pi-extension-tests.yml'

permissions:
  contents: read

jobs:
  discover:
    name: Discover extensions
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List extension folders
        id: list
        shell: bash
        run: |
          set -euo pipefail
          folders=$(find .pi/extensions -mindepth 2 -maxdepth 2 -name package.json \
            | sed -e 's|/package\.json$||' -e 's|.*/||' \
            | sort)
          if [ -z "$folders" ]; then
            echo "::error::No folder under .pi/extensions holds a package.json"
            exit 1
          fi
          extensions=$(printf '%s\n' "$folders" | jq -R -s -c 'split("\n")|map(select(length>0))')
          echo "extensions=$extensions" >> "$GITHUB_OUTPUT"
          echo "Found $extensions"

  pi-extension:
    name: ${{ matrix.extension }} tests
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.discover.outputs.extensions) }}
    defaults:
      run:
        working-directory: .pi/extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Run the test script
        run: npm test

      - name: Typecheck
        run: npm run --if-present typecheck

      - name: Check the packed extension
        run: npm run --if-present check:pack
