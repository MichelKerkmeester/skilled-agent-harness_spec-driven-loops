name: Pi Extension Tests

# Each .pi extension carries its own TypeScript suite, run by its own package
# script from its own lockfile, and no workflow called either one, so a broken
# extension reached main unseen. Each leg installs one extension from its
# lockfile and runs its test script.
on:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.pi/extensions/**'
      - '.github/workflows/pi-extension-tests.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.pi/extensions/**'
      - '.github/workflows/pi-extension-tests.yml'

permissions:
  contents: read

jobs:
  pi-extension:
    name: ${{ matrix.extension }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: [pi-cache-optimizer, pi-fast-mode-w-subagent-support]
    defaults:
      run:
        working-directory: .pi/extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Run the test script
        run: npm test
