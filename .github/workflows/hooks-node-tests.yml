name: Hook Node Tests

# The hook suites under .skilled/hooks that are written for `node --test`, and the
# hook installer test, ran in no workflow, so a hook regression reached main unseen.
# Vitest skips those files because they "run on their own", and the dispatch guard
# runs only the rule-check suite, so nothing else collected them. The suites import
# the hook libraries and spawn the hook scripts, and the installer test provisions
# throwaway repositories, so the job provisions every listed tree and runs on any
# change under the source roots or the root files that tell a project checkout from
# this repository.
on:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/**'
      - '.opencode/**'
      - '.pi/**'
      - '.claude/**'
      - '.codex/**'
      - '.cursor/**'
      - '.devin/**'
      - '.hermes/**'
      - '.env.example'
      - '.github/workflows/hooks-node-tests.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.skilled/**'
      - '.opencode/**'
      - '.pi/**'
      - '.claude/**'
      - '.codex/**'
      - '.cursor/**'
      - '.devin/**'
      - '.hermes/**'
      - '.env.example'
      - '.github/workflows/hooks-node-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hook-node-tests:
    name: Hook node:test suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The suites import trees git ignores, so the repository's own worktree
      # provisioning installs and builds every tree it lists.
      - name: Provision the dependency trees the hook tests import
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/bun" bun@1.3.9
          # A package with a bun.lock or bun.lockb and no package-lock.json installs and builds with bun.
          export PATH="$RUNNER_TEMP/bun/node_modules/.bin:$PATH"
          source .skilled/skills/sk-git/scripts/worktree-naming.sh
          provision_worktree "$GITHUB_WORKSPACE"

      # The installer test makes commits in temporary repositories, which need an author.
      - name: Set a git identity for the tests
        run: |
          git config --global user.name "hook-tests-ci"
          git config --global user.email "hook-tests-ci@example.invalid"

      # The same rule the vitest config uses to skip these files: every JavaScript test
      # file under the hooks tree that does not import vitest, outside node_modules. An
      # empty selection fails the step instead of reporting a run that tested nothing.
      - name: Run the hook node:test suites
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find .skilled/hooks -type f \
            \( -name '*.test.mjs' -o -name '*.test.cjs' -o -name '*.test.js' \) \
            -not -path '*/node_modules/*' -print \
            | sort \
            | while IFS= read -r file; do
                grep -qE "(from[[:space:]]+|require\()['\"]vitest['\"]" "$file" || printf '%s\n' "$file"
              done)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::no node:test hook files were found; the collection rule matched nothing"
            exit 1
          fi
          echo "Collected ${#files[@]} node:test hook files"
          node --test "${files[@]}"

      - name: Run the hook installer test
        run: bash .skilled/hooks/git/install-hooks.test.sh
