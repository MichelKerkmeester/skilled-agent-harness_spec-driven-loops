name: sk-doc Rename Harness

# The rename tooling fixture harness takes about ten minutes, so it runs only
# when the scripts it exercises change. The rest of the sk-doc script tests run
# on every push in sk-doc Script Tests.
on:
  pull_request:
    branches: [main, 'skilled/**']
    paths:
      - '.opencode/skills/sk-doc/scripts/**'
      - '.skilled/skills/sk-doc/scripts/**'
      - '.opencode/skills/sk-doc/shared/scripts/**'
      - '.skilled/skills/sk-doc/shared/scripts/**'
      - '.github/workflows/sk-doc-rename-harness.yml'
  push:
    branches: [main, 'skilled/**']
    paths:
      - '.opencode/skills/sk-doc/scripts/**'
      - '.skilled/skills/sk-doc/scripts/**'
      - '.opencode/skills/sk-doc/shared/scripts/**'
      - '.skilled/skills/sk-doc/shared/scripts/**'
      - '.github/workflows/sk-doc-rename-harness.yml'

permissions:
  contents: read

jobs:
  rename-harness:
    name: Rename tooling fixture harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python3 -m pip install pytest==8.4.2 pyyaml==6.0.3

      - name: Install the packages the scripts load
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
          ( cd .opencode/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
          npm --prefix .opencode/skills/sk-doc ci
          npm --prefix .opencode/skills/system-deep-loop ci

      - name: Run the rename tooling fixture harness
        env:
          ONLY_TESTS: test_rename_tooling_fixture_harness.py
        run: bash .opencode/skills/sk-doc/scripts/tests/run-script-tests.sh
