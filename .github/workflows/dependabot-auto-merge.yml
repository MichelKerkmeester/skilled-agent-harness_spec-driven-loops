name: Dependabot Auto-merge
# Dependabot security updates open a fix PR for each new advisory. This turns on
# auto-merge for the narrowest safe slice of those PRs: an npm security update,
# and only when every bump in it is a patch release. GitHub then merges it once
# the required checks pass. Every other Dependabot PR waits for a person.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot security patch updates
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read the update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A fix for one package in one directory arrives ungrouped rather than in
      # npm-security. It is still a security update: every npm version update
      # matches the catch-all npm-runtime group, so only a security fix lands
      # outside both groups.
      - name: Enable auto-merge for an npm security patch
        if: >-
          steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
          && (steps.meta.outputs.dependency-group == 'npm-security' || steps.meta.outputs.dependency-group == '')
          && steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # A merge commit keeps Dependabot's own commit, which the message
        # contract has already checked, rather than rewriting it in a squash.
        run: gh pr merge --auto --merge "$PR_URL"
