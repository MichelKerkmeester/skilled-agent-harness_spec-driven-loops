name: Agent Mirror Sync
on:
  pull_request:
    branches: [main]

jobs:
  agent-mirror-sync:
    name: Agent runtime mirrors stay in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The checker loads the frontmatter parser from the built shared package.
      - name: Build the shared package the checker loads
        run: |
          set -euo pipefail
          npm --prefix .opencode/skills/system-spec-kit ci
          ( cd .opencode/skills/system-spec-kit/shared && ../node_modules/.bin/tsc --build )
      - name: Check changed agent files for mirror drift
        run: |
          set -euo pipefail
          CHECKER=".opencode/bin/check-agent-mirror-sync.cjs"
          # Fail closed in CI: a required guard must exist. A PR that deletes or
          # moves the checker must not silently disable its own gate.
          if [ ! -f "$CHECKER" ]; then
            echo "::error::Agent mirror-sync checker not found at $CHECKER — failing closed."
            exit 1
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=()
          while IFS= read -r file; do
            [ -n "$file" ] && CHANGED+=("$file")
          done < <(git diff --name-only --diff-filter=ACMD "$BASE" "$HEAD" | grep -E '^\.(opencode|skilled|claude|codex)/agents/' || true)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No agent files changed — nothing to verify."
            exit 0
          fi
          if ! node "$CHECKER" "${CHANGED[@]}"; then
            echo "::error::Agent runtime mirrors are out of sync — see drift report above."
            exit 1
          fi
          echo "All agent runtime mirrors are in sync."
