# Throwaway UI harness: renders the real Phone views against mock state so
# the design can be iterated in the simulator without a paired Mac.
#
#   cd tools/uiharness && xcodegen generate
#   xcodebuild -project Harness.xcodeproj -scheme Harness \
#     -destination 'id=<booted simulator udid>' CODE_SIGNING_ALLOWED=NO build
#   xcrun simctl install booted <built .app> && xcrun simctl launch booted com.timwilliams.harness.ui
#
# It compiles the actual source files (not copies), so what you see is what
# the app ships.
name: Harness
options:
  bundleIdPrefix: com.timwilliams.harness
  deploymentTarget: { iOS: "17.0" }
settings:
  base: { SWIFT_VERSION: "5.9" }
packages:
  RemoteKit:
    path: ../../packages/RemoteKit
targets:
  Harness:
    type: application
    platform: iOS
    dependencies:
      - package: RemoteKit
    sources:
      - Harness
      - path: ../../app/Phone/Composer.swift
      - path: ../../app/Phone/ChangesView.swift
      - path: ../../app/Phone/PermissionSheet.swift
      - path: ../../app/Phone/Dictation.swift
      - path: ../../app/Shared/ComposerMenus.swift
      - path: ../../app/Shared/WorkingIndicator.swift
      - path: ../../app/Shared/BrandWordmark.swift
      - path: ../../app/Shared/DesignTokens.swift
      - path: ../../app/Shared/AgentStore.swift
      - path: ../../app/Shared/TodoList.swift
      - path: ../../app/Shared/Transcript.swift
      - path: ../../app/Shared/ReasoningBlock.swift
      - path: ../../app/Shared/PromptAttachments.swift
      - path: ../../app/Shared/ModelStore.swift
    info:
      path: Harness/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: harness
        NSSpeechRecognitionUsageDescription: harness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timwilliams.harness.ui
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
