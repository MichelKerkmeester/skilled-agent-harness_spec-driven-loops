name: JavaScript assertion maps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'runtime/javascript/**'
      - 'tests/runtime/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'docs/assertion-*.md'
      - 'Cargo.*'
      - 'package*.json'
      - '.github/workflows/assertion-maps.yml'

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --quiet
      - run: npm run test:runtime
      - run: npm run test:rust-assets
      - run: npm run test:assertion-maps:js
      - run: node scripts/package-preflight.mjs
