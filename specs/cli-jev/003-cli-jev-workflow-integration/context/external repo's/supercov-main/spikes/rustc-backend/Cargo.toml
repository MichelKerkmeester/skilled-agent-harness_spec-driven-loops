[package]
name = "supercov-rustc-backend-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

# The wrapper content-hashes itself for every handshake; hashing must run
# optimized even in dev builds (mirrors the engine workspace override).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3
