[package]
name = "deem-runtime"
version = "0.1.0"
edition = "2021"
description = "Minimal high-performance CPU runtime for Deem letter-slot decision models"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
rayon = "1"
tiny_http = "0.12"

[[bin]]
name = "gemmbench"
path = "src/bin/gemmbench.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "deem-server"
path = "src/bin/deem_server.rs"

[lib]
name = "deem_runtime"
