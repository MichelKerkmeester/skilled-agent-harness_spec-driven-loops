name: Latest Pi compatibility

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Latest published Pi packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install current Pi public packages for compatibility checking
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts
          typescript@5.9.3 @types/node@22.19.19
          @earendil-works/pi-coding-agent@latest
          @earendil-works/pi-tui@latest
          typebox@latest

      - name: Show resolved Pi package versions
        run: npm ls @earendil-works/pi-coding-agent @earendil-works/pi-tui typebox --depth=0

      - name: Type-check against current Pi public APIs
        run: npx tsc -p tsconfig.json

      - name: Run regression tests
        run: npm test
