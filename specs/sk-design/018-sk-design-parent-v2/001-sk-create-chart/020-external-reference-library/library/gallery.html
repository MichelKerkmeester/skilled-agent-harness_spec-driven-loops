</style></head><body><h1>External chart reference library</h1><p>52 captures from 39 sources, 2026-09-08. Each capture shows the top of a scrolled page; click it to open the source.</p><main><figure><a href="https://ui.shadcn.com/charts/area"><img src="shadcn-area-light.jpg" loading="lazy" alt="shadcn-area light"></a><figcaption><strong>shadcn-area</strong> · light · component library<br>The register the corpus adopted: card header and footer, bare axes, horizontal dashed grid, gradient area, chip legend; the interactive area with its range select at the top, twelve variants below.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/area"><img src="shadcn-area-dark.jpg" loading="lazy" alt="shadcn-area dark"></a><figcaption><strong>shadcn-area</strong> · dark · component library<br>The register the corpus adopted: card header and footer, bare axes, horizontal dashed grid, gradient area, chip legend; the interactive area with its range select at the top, twelve variants below.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/bar"><img src="shadcn-bar-light.jpg" loading="lazy" alt="shadcn-bar light"></a><figcaption><strong>shadcn-bar</strong> · light · component library<br>Bar family: rounded free corners, label inside and above, negative bars, horizontal bars, a mixed bar list with per-row colour.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/bar"><img src="shadcn-bar-dark.jpg" loading="lazy" alt="shadcn-bar dark"></a><figcaption><strong>shadcn-bar</strong> · dark · component library<br>Bar family: rounded free corners, label inside and above, negative bars, horizontal bars, a mixed bar list with per-row colour.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/line"><img src="shadcn-line-light.jpg" loading="lazy" alt="shadcn-line light"></a><figcaption><strong>shadcn-line</strong> · light · component library<br>Line family: 2px linear and step lines, dot policies, a custom-label line with the highlighted point, a two-series header with totals.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/line"><img src="shadcn-line-dark.jpg" loading="lazy" alt="shadcn-line dark"></a><figcaption><strong>shadcn-line</strong> · dark · component library<br>Line family: 2px linear and step lines, dot policies, a custom-label line with the highlighted point, a two-series header with totals.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/tooltip"><img src="shadcn-tooltip-light.jpg" loading="lazy" alt="shadcn-tooltip light"></a><figcaption><strong>shadcn-tooltip</strong> · light · component library<br>Every tooltip card variant on the same stacked bar: indicator dot, line and dashed, no indicator, no label, custom label and formatter. The card measured in phase 15.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/tooltip"><img src="shadcn-tooltip-dark.jpg" loading="lazy" alt="shadcn-tooltip dark"></a><figcaption><strong>shadcn-tooltip</strong> · dark · component library<br>Every tooltip card variant on the same stacked bar: indicator dot, line and dashed, no indicator, no label, custom label and formatter. The card measured in phase 15.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/radial"><img src="shadcn-radial-light.jpg" loading="lazy" alt="shadcn-radial light"></a><figcaption><strong>shadcn-radial</strong> · light · component library<br>Radial rings with a centred total in several forms; a form the corpus deliberately does not draw, kept as the counter-example.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/radial"><img src="shadcn-radial-dark.jpg" loading="lazy" alt="shadcn-radial dark"></a><figcaption><strong>shadcn-radial</strong> · dark · component library<br>Radial rings with a centred total in several forms; a form the corpus deliberately does not draw, kept as the counter-example.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/pie"><img src="shadcn-pie-light.jpg" loading="lazy" alt="shadcn-pie light"></a><figcaption><strong>shadcn-pie</strong> · light · component library<br>Pie and donut variants with legends and centre labels; the other form the corpus substitutes with unit grids and rings.</figcaption></figure><figure><a href="https://ui.shadcn.com/charts/pie"><img src="shadcn-pie-dark.jpg" loading="lazy" alt="shadcn-pie dark"></a><figcaption><strong>shadcn-pie</strong> · dark · component library<br>Pie and donut variants with legends and centre labels; the other form the corpus substitutes with unit grids and rings.</figcaption></figure><figure><a href="https://www.tremor.so/docs/visualizations/area-chart"><img src="tremor-area-light.jpg" loading="lazy" alt="tremor-area light"></a><figcaption><strong>tremor-area</strong> · light · component library<br>Tremor area chart: soft gradient fills, a compact legend row, a dark code block beside the live example; the Tailwind sibling of the shadcn register.</figcaption></figure><figure><a href="https://www.tremor.so/docs/visualizations/tracker"><img src="tremor-tracker-light.jpg" loading="lazy" alt="tremor-tracker light"></a><figcaption><strong>tremor-tracker</strong> · light · component library<br>The tracker: a row of status cells for uptime or deployments, the smallest chart form on the list and one the corpus lacks.</figcaption></figure><figure><a href="https://www.tremor.so/docs/visualizations/bar-list"><img src="tremor-bar-list-light.jpg" loading="lazy" alt="tremor-bar-list light"></a><figcaption><strong>tremor-bar-list</strong> · light · component library<br>The bar list: ranked horizontal bars with the label inside the bar and the value at the right edge; a table and a chart at once.</figcaption></figure><figure><a href="https://www.tremor.so/docs/visualizations/spark-chart"><img src="tremor-spark-light.jpg" loading="lazy" alt="tremor-spark light"></a><figcaption><strong>tremor-spark</strong> · light · component library<br>Spark area, line and bar charts at KPI size; the micro-visualisation family worth adding to the corpus.</figcaption></figure><figure><a href="https://blocks.tremor.so/"><img src="tremor-blocks-light.jpg" loading="lazy" alt="tremor-blocks light"></a><figcaption><strong>tremor-blocks</strong> · light · component library<br>Composed dashboard blocks: KPI cards with sparklines, chart cards with header controls, in one visual system.</figcaption></figure><figure><a href="https://mantine.dev/charts/area-chart/"><img src="mantine-area-light.jpg" loading="lazy" alt="mantine-area light"></a><figcaption><strong>mantine-area</strong> · light · component library<br>Recharts wrapped in a full component system: legend below, series toggles, stacked and split variants, a restrained blue and teal pair on a plain grid.</figcaption></figure><figure><a href="https://mantine.dev/charts/bar-chart/"><img src="mantine-bar-light.jpg" loading="lazy" alt="mantine-bar light"></a><figcaption><strong>mantine-bar</strong> · light · component library<br>Grouped, stacked and waterfall bars with a violet ramp; the legend and tooltip share the library tokens.</figcaption></figure><figure><a href="https://mantine.dev/charts/line-chart/"><img src="mantine-line-light.jpg" loading="lazy" alt="mantine-line light"></a><figcaption><strong>mantine-line</strong> · light · component library<br>Line charts with gradient strokes, dashed reference lines and per-point dots; the gradient-line idea is distinctive.</figcaption></figure><figure><a href="https://nivo.rocks/line/"><img src="nivo-line-light.jpg" loading="lazy" alt="nivo-line light"></a><figcaption><strong>nivo-line</strong> · light · component library<br>A saturated pastel set on a light grid with the live prop editor beside it; dense multi-line in a playful palette.</figcaption></figure><figure><a href="https://nivo.rocks/bar/"><img src="nivo-bar-light.jpg" loading="lazy" alt="nivo-bar light"></a><figcaption><strong>nivo-bar</strong> · light · component library<br>Stacked and grouped bars in the same pastel set, with pattern fills as a colour alternative.</figcaption></figure><figure><a href="https://www.chartjs.org/docs/latest/samples/line/line.html"><img src="chartjs-line-light.jpg" loading="lazy" alt="chartjs-line light"></a><figcaption><strong>chartjs-line</strong> · light · library samples<br>The canvas default: pink and blue lines with markers on a grey grid. The baseline for un-designed defaults.</figcaption></figure><figure><a href="https://www.chartjs.org/docs/latest/samples/line/line.html"><img src="chartjs-line-dark.jpg" loading="lazy" alt="chartjs-line dark"></a><figcaption><strong>chartjs-line</strong> · dark · library samples<br>The canvas default: pink and blue lines with markers on a grey grid. The baseline for un-designed defaults.</figcaption></figure><figure><a href="https://apexcharts.com/javascript-chart-demos/line-charts/"><img src="apex-line-light.jpg" loading="lazy" alt="apex-line light"></a><figcaption><strong>apex-line</strong> · light · library samples<br>Twelve line variants in a gallery grid: annotations, dashed, stepline, gradient, missing data, real-time. Useful for annotation placement.</figcaption></figure><figure><a href="https://echarts.apache.org/examples/en/index.html"><img src="echarts-examples-light.jpg" loading="lazy" alt="echarts-examples light"></a><figcaption><strong>echarts-examples</strong> · light · library samples<br>The widest catalogue of forms; one colour set across hundreds of examples.</figcaption></figure><figure><a href="https://observablehq.com/@d3/gallery"><img src="d3-gallery-light.jpg" loading="lazy" alt="d3-gallery light"></a><figcaption><strong>d3-gallery</strong> · light · library samples<br>The D3 gallery of bespoke forms; the reference for what a standalone SVG can express.</figcaption></figure><figure><a href="https://observablehq.com/@observablehq/plot-gallery"><img src="plot-gallery-light.jpg" loading="lazy" alt="plot-gallery light"></a><figcaption><strong>plot-gallery</strong> · light · library samples<br>Observable Plot examples in one restrained style: dots, lines, bars, areas, facets, maps.</figcaption></figure><figure><a href="https://observablehq.com/plot/marks/area"><img src="plot-area-docs-light.jpg" loading="lazy" alt="plot-area-docs light"></a><figcaption><strong>plot-area-docs</strong> · light · library docs<br>The area mark page in both schemes: monochrome fills on bare axes, stacked and banded variants, the leanest area charts on the list.</figcaption></figure><figure><a href="https://observablehq.com/plot/marks/area"><img src="plot-area-docs-dark.jpg" loading="lazy" alt="plot-area-docs dark"></a><figcaption><strong>plot-area-docs</strong> · dark · library docs<br>The area mark page in both schemes: monochrome fills on bare axes, stacked and banded variants, the leanest area charts on the list.</figcaption></figure><figure><a href="https://observablehq.com/plot/marks/line"><img src="plot-line-docs-light.jpg" loading="lazy" alt="plot-line-docs light"></a><figcaption><strong>plot-line-docs</strong> · light · library docs<br>The line mark page in both schemes: thin ink lines, gap handling, multi-series with a colour legend.</figcaption></figure><figure><a href="https://observablehq.com/plot/marks/line"><img src="plot-line-docs-dark.jpg" loading="lazy" alt="plot-line-docs dark"></a><figcaption><strong>plot-line-docs</strong> · dark · library docs<br>The line mark page in both schemes: thin ink lines, gap handling, multi-series with a colour legend.</figcaption></figure><figure><a href="https://vega.github.io/vega-lite/examples/"><img src="vegalite-examples-light.jpg" loading="lazy" alt="vegalite-examples light"></a><figcaption><strong>vegalite-examples</strong> · light · library samples<br>The Vega-Lite example gallery; declarative charts with sensible default axes and legends.</figcaption></figure><figure><a href="https://vega.github.io/editor/#/examples/vega-lite/line"><img src="vega-editor-line-light.jpg" loading="lazy" alt="vega-editor-line light"></a><figcaption><strong>vega-editor-line</strong> · light · library docs<br>A single Vega-Lite line beside its spec; the default axis and grid treatment.</figcaption></figure><figure><a href="https://layerchart.com/"><img src="layerchart-light.jpg" loading="lazy" alt="layerchart light"></a><figcaption><strong>layerchart</strong> · light · component library<br>Svelte chart set on a landing with a violet accent; the thumbnail wall shows the whole range in one visual system, in both schemes.</figcaption></figure><figure><a href="https://layerchart.com/"><img src="layerchart-dark.jpg" loading="lazy" alt="layerchart dark"></a><figcaption><strong>layerchart</strong> · dark · component library<br>Svelte chart set on a landing with a violet accent; the thumbnail wall shows the whole range in one visual system, in both schemes.</figcaption></figure><figure><a href="https://tanstack.com/charts/latest"><img src="tanstack-charts-light.jpg" loading="lazy" alt="tanstack-charts light"></a><figcaption><strong>tanstack-charts</strong> · light · component library<br>The 2026 entrant: composed SVG and canvas charts, funnel, rings and a world map in both schemes.</figcaption></figure><figure><a href="https://tanstack.com/charts/latest"><img src="tanstack-charts-dark.jpg" loading="lazy" alt="tanstack-charts dark"></a><figcaption><strong>tanstack-charts</strong> · dark · component library<br>The 2026 entrant: composed SVG and canvas charts, funnel, rings and a world map in both schemes.</figcaption></figure><figure><a href="https://unovis.dev/gallery"><img src="unovis-gallery-light.jpg" loading="lazy" alt="unovis-gallery light"></a><figcaption><strong>unovis-gallery</strong> · light · component library<br>Line, area, stacked and scatter galleries in one modular system; the area-with-gaps and multi-line examples are close to the corpus forms.</figcaption></figure><figure><a href="https://airbnb.io/visx/gallery"><img src="visx-gallery-light.jpg" loading="lazy" alt="visx-gallery light"></a><figcaption><strong>visx-gallery</strong> · light · component library<br>Low-level primitives from Airbnb; expressive one-off forms rather than a system.</figcaption></figure><figure><a href="https://www.amcharts.com/demos/"><img src="amcharts-demos-light.jpg" loading="lazy" alt="amcharts-demos light"></a><figcaption><strong>amcharts-demos</strong> · light · library samples<br>A demo grid with a violet and blue set; breadth of column and stacked variants.</figcaption></figure><figure><a href="https://plotly.com/javascript/line-charts/"><img src="plotly-line-light.jpg" loading="lazy" alt="plotly-line light"></a><figcaption><strong>plotly-line</strong> · light · library docs<br>The Plotly default; the only major library with keyboard mark navigation by default.</figcaption></figure><figure><a href="https://carbondesignsystem.com/data-visualization/simple-charts/"><img src="carbon-simple-light.jpg" loading="lazy" alt="carbon-simple light"></a><figcaption><strong>carbon-simple</strong> · light · design system<br>IBM Carbon guidance on simple chart types with the resources and the Carbon chart look below.</figcaption></figure><figure><a href="https://carbondesignsystem.com/data-visualization/chart-anatomy/"><img src="carbon-chart-anatomy-light.jpg" loading="lazy" alt="carbon-chart-anatomy light"></a><figcaption><strong>carbon-chart-anatomy</strong> · light · design system<br>Carbon chart anatomy: the annotated diagram of title, axes, legend, gridlines and tooltip with the spacing rules.</figcaption></figure><figure><a href="https://developer.apple.com/design/human-interface-guidelines/charts"><img src="apple-hig-charts-light.jpg" loading="lazy" alt="apple-hig-charts light"></a><figcaption><strong>apple-hig-charts</strong> · light · design system<br>Apple HIG charts page in both schemes: the hero chart and the anatomy section behind Swift Charts.</figcaption></figure><figure><a href="https://developer.apple.com/design/human-interface-guidelines/charts"><img src="apple-hig-charts-dark.jpg" loading="lazy" alt="apple-hig-charts dark"></a><figcaption><strong>apple-hig-charts</strong> · dark · design system<br>Apple HIG charts page in both schemes: the hero chart and the anatomy section behind Swift Charts.</figcaption></figure><figure><a href="https://urbaninstitute.github.io/graphics-styleguide/"><img src="urban-styleguide-light.jpg" loading="lazy" alt="urban-styleguide light"></a><figcaption><strong>urban-styleguide</strong> · light · editorial style guide<br>The Urban Institute style guide with its chart parts, typography and colour sections in view.</figcaption></figure><figure><a href="https://ourworldindata.org/grapher/life-expectancy"><img src="owid-life-expectancy-light.jpg" loading="lazy" alt="owid-life-expectancy light"></a><figcaption><strong>owid-life-expectancy</strong> · light · editorial product<br>Our World in Data grapher: direct end labels, entity selector, table and map tabs, a source line and download row, with the explanatory sections below. The best public editorial chart product.</figcaption></figure><figure><a href="https://ourworldindata.org/grapher/co-emissions-per-capita"><img src="owid-co2-light.jpg" loading="lazy" alt="owid-co2 light"></a><figcaption><strong>owid-co2</strong> · light · editorial product<br>The same grapher on a dense multi-line series; log toggle and label collision handling.</figcaption></figure><figure><a href="https://flourish.studio/examples/"><img src="flourish-examples-light.jpg" loading="lazy" alt="flourish-examples light"></a><figcaption><strong>flourish-examples</strong> · light · editorial product<br>Flourish template gallery on a dark ground; editorial forms with strong typography.</figcaption></figure><figure><a href="https://vercel.com/analytics"><img src="vercel-analytics-light.jpg" loading="lazy" alt="vercel-analytics light"></a><figcaption><strong>vercel-analytics</strong> · light · product marketing<br>A single hairline line chart as a hero with a small tooltip card, then dashboard panels; the most minimal register on the list.</figcaption></figure><figure><a href="https://vercel.com/analytics"><img src="vercel-analytics-dark.jpg" loading="lazy" alt="vercel-analytics dark"></a><figcaption><strong>vercel-analytics</strong> · dark · product marketing<br>A single hairline line chart as a hero with a small tooltip card, then dashboard panels; the most minimal register on the list.</figcaption></figure></main></body></html>
