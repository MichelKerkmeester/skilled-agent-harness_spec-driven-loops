<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imported from Mermaid — New user onboarding</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Imported from Mermaid · doc-inline · simplified</p>
    <h1>New user onboarding</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obf-title obf-desc">
      <title id="obf-title">New user onboarding flow</title>
      <desc id="obf-desc">Flowchart showing a new user signing up, verifying their email with a retry loop, completing their profile, and reaching the dashboard.</desc>
      <defs>
        <marker id="obf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="obf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors (drawn before nodes) -->
      <!-- Sign up -> Email verified? -->
      <path d="M480,132 V172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#obf-arrow)"/>
      <!-- Email verified? -> Complete profile (Yes) -->
      <path d="M544,220 H640" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#obf-arrow-accent)"/>
      <!-- Email verified? -> Send verification email (No) -->
      <path d="M480,268 V312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#obf-arrow)"/>
      <!-- Send verification email -> Email verified? (retry loop) -->
      <path d="M416,312 V220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#obf-arrow)"/>
      <!-- Complete profile -> Reach dashboard -->
      <path d="M740,248 V424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#obf-arrow)"/>

      <!-- Arrow labels -->
      <rect x="564" y="200" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="209" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="492" y="282" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="291" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="388" y="258" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="416" y="267" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY</text>

      <!-- Nodes -->
      <!-- Start / End ovals -->
      <rect x="400" y="76" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sign up</text>

      <rect x="660" y="424" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reach dashboard</text>

      <!-- Decision (focal) -->
      <polygon points="416,220 480,172 544,220 480,268" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Email verified?</text>

      <!-- Steps -->
      <rect x="640" y="192" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Complete profile</text>

      <rect x="396" y="312" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Send verification email</text>

      <!-- Legend -->
      <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <polygon points="124,529 132,524 140,529 132,534" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="152" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL</text>

      <polygon points="248,529 256,524 264,529 256,534" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="276" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DECISION</text>

      <rect x="388" y="524" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="412" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STEP</text>

      <rect x="488" y="524" width="16" height="10" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="512" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">START / END</text>

      <line x1="640" y1="529" x2="672" y2="529" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="680" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HAPPY PATH</text>
    </svg>
  </div>
</body>
</html>
