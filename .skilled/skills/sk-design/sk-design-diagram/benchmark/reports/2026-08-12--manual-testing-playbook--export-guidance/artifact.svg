<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="checkout-architecture-title checkout-architecture-desc">
      <title id="checkout-architecture-title">Checkout service architecture</title>
      <desc id="checkout-architecture-desc">Architecture diagram showing the checkout service calling the auth service over HTTP, with a Postgres store behind the services tier.</desc>
      <defs>
        <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');]]></style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones (drawn before arrows and nodes) -->
      <rect x="140" y="96" width="720" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="456" y="100" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="108" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE TIER</text>

      <rect x="360" y="280" width="280" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="468" y="284" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="292" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA TIER</text>

      <!-- Arrows first (behind boxes) -->
      <line x1="356" y1="184" x2="620" y2="184" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 268,216 V 268 Q 268,276 276,276 H 460 Q 468,276 468,284 V 320"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (opaque mask + 8px visible gap) -->
      <rect x="456" y="164" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="172" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>

      <rect x="344" y="256" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="368" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>

      <!-- Node: Checkout Service (focal) -->
      <rect x="180" y="152" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="152" width="176" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="188" y="160" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="208" y="168" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRV</text>
      <text x="268" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Checkout Service</text>
      <text x="268" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /api/checkout</text>

      <!-- Node: Auth Service (backend) -->
      <rect x="620" y="152" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="152" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="628" y="160" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="648" y="168" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
      <text x="708" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auth Service</text>
      <text x="708" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OAuth · token</text>

      <!-- Node: Postgres Store (store) -->
      <rect x="400" y="320" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="320" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="408" y="328" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="428" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="500" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres Store</text>
      <text x="500" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">orders · :5432</text>

      <!-- Legend strip (horizontal bottom) -->
      <line x1="40" y1="448" x2="960" y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="480" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="488" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Focal / service</text>

      <rect x="200" y="480" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="488" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Backend</text>

      <rect x="320" y="480" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="340" y="488" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Store</text>

      <line x1="436" y1="484" x2="464" y2="484" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="472" y="488" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">HTTP call</text>

      <line x1="600" y1="484" x2="628" y2="484" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="636" y="488" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">SQL write</text>
    </svg>