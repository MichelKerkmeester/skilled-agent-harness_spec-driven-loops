#<<! Profile template. /doctor:ci scaffold renders it with ci-scaffold.cjs from the repository CI profile, .sk-code/ci.json or the generic default.>>
#<<! A <<name>> slot takes a profile value, a #<<#name>> line opens a block kept when the profile sets it, #<<^name>> one kept when it does not,>>
#<<! #<</name>> closes it, and a #<<=name:width>> line is a comment the renderer wraps at that width. A #<<! line never reaches the rendered file.>>
# Workflow scaffold. Copy this file to .github/workflows/<name>.yml, then replace every
# prose placeholder in a comment and rename the workflow and the job. The block order is
# the order the existing workflows use: name, triggers, permissions, concurrency, jobs.

#<<#readme>>
# Rename this to a short title that matches the row the workflow README gets.
#<</readme>>
#<<^readme>>
# Rename this to a short title.
#<</readme>>
name: Example Workflow

on:
  push:
#<<#integrationBranches>>
    # Integration branches only. A workflow that must see every branch is an
    # intentional exception and is recorded in the trigger rules, so do not copy
    # the every-branch trigger without that record.
    branches: <<integrationBranches>>
#<</integrationBranches>>
#<<#pathTwins>>
    # Add a paths: filter only when the workflow reads a known set of files. Every
    # entry that names <<twinRoots>> needs its <<twinPartners>> twin in the same filter, and a
    # filter on generated paths belongs to push only, never to pull_request.
#<</pathTwins>>
#<<^pathTwins>>
    # Add a paths: filter only when the workflow reads a known set of files. A filter
    # on generated paths belongs to push only, never to pull_request.
#<</pathTwins>>
  pull_request:
#<<#defaultBranch>>
    branches: [<<defaultBranch>>]
#<</defaultBranch>>

# Least privilege. Widen it per job, and only for a job that runs no repository code.
permissions:
  contents: read

# One group per workflow and ref. A superseded pull request run is cancelled and a
# branch push run is never cancelled. Switch the value to true to cancel on <<defaultBranchLabel>> too.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  example:
    name: Say what this job proves
#<<#switch>>
    # The switch condition. It is job-level because on: filters see no contexts. AND it
    # onto any condition the job already has. off is the only disable token.<<#groups>> Use the<</groups>>
#<<#groups>>
    # group variable that matches the job: <<groupList>>.
#<</groups>>
    if: <<switchCondition>>
#<</switch>>
    runs-on: ubuntu-latest
    # Size from measured runs: max(<<timeoutFloor>>, 3 x p50, 2 x p100) minutes. Replace this value.
    timeout-minutes: <<timeoutFloor>>
    steps:
      # Every remote action is pinned to a full commit SHA with the release tag as a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Leave no token in the git config, so a step that later pushes gets it explicitly.
          persist-credentials: false

#<<#setupAction>>
      # A job that imports built trees calls the composite setup action here instead of
      # repeating install and build steps. See the job block template for the call.

#<</setupAction>>
      - name: Run the check
        run: |
          set -euo pipefail
          echo "replace this with the check"
#<<#readme>>

#<<=readmeStep:90>>
#<</readme>>
