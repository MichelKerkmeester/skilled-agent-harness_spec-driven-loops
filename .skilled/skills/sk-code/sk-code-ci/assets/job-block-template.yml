#<<! Profile template. /doctor:ci scaffold renders it with ci-scaffold.cjs --job from the repository CI profile, as the workflow template says.>>
# Job scaffold. Paste the job under jobs: in a workflow that already carries the
# workflow-level permissions and concurrency blocks. Replace every prose placeholder.
jobs:
  example:
    name: Say what this job proves
#<<#switch>>
    # Switch condition: job-level, ANDed onto any existing condition, off disables.
    if: <<switchCondition>>
#<</switch>>
    runs-on: ubuntu-latest
    # Size from measured runs: max(<<timeoutFloor>>, 3 x p50, 2 x p100) minutes.
    timeout-minutes: <<timeoutFloor>>
    # Use this block only when the workflow declares permissions: {} at the top. A write
    # scope belongs to a job that runs no repository code. Delete it when the workflow
    # already grants contents: read to every job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Leave no token in the git config, so a step that later pushes gets it explicitly.
          persist-credentials: false

#<<#setupAction>>
      #<<=setupComment:89>>
      - name: Provision the dependency trees
        uses: <<setupUses>>
#<<#setupWith>>
        with:
          #<<=setupWith>>
#<</setupWith>>

#<</setupAction>>
      - name: Run the check
        run: |
          set -euo pipefail
          echo "replace this with the check"
