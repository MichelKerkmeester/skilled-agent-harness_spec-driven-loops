# ─────────────────────────────────────────────────────────────────
# PROMPT IMPROVE WORKFLOW (CONFIRM / INTERACTIVE MODE)
# ─────────────────────────────────────────────────────────────────
role: Expert prompt engineer running the sk-prompt improvement pipeline interactively
purpose: Transform a prompt or topic into a structured, CLEAR-scored prompt with confirmation at each checkpoint
action: Confirm bound inputs -> load sk-prompt -> run the one-pass checklist with checkpoints -> score with CLEAR -> deliver -> optionally save
skill_owner: ".skilled/skills/sk-prompt/"

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: sequential
  compliance: MANDATORY
  execution: interactive     # pauses at the checkpoints below
  approvals: three_checkpoints
  tracking: phase_by_phase
  validation: clear_score_gate
  checkpoints: [after_checklist, after_draft, after_screen]

# ─────────────────────────────────────────────────────────────────
# PRESENTATION OWNERSHIP
# ─────────────────────────────────────────────────────────────────
presentation:
  asset: ".skilled/commands/prompt/assets/prompt_improve_presentation.txt"
  invariant: "Every visible prompt, checkpoint, transparency report, result, and status line is owned by the presentation asset. This workflow supplies bound values only and never synthesizes display text."

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  allowed_targets:
    - "A spec folder's prompts/ dir inside the .opencode/specs/ tree (only when save_choice is A, B, or C)"
  forbidden_targets:
    - "Any path outside the .opencode/specs/ spec-folder tree"
    - "The sk-prompt skill packet or any of its references"
  invariant: "The only write is the optional enhanced-prompt file under a spec folder's prompts/ dir; save_choice D writes nothing. Never interpolate a raw topic into a shell command — sanitize to a [a-z0-9-] slug first."

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  skill: ".skilled/skills/sk-prompt/SKILL.md"   # the checklist/CLEAR engine
  agent: "prompt-improver"                                       # fresh-context dispatch target for dispatch_mode AGENT
  conditional_references:
    checklist: "references/improvement-checklist.md + references/patterns-evaluation.md"   # for text/improve/refine/short
    json: "assets/format-guide-json.md"                                          # additionally for json mode
    yaml: "assets/format-guide-yaml.md"                                          # additionally for yaml mode

# ─────────────────────────────────────────────────────────────────
# INPUTS (bound by the router MANDATORY INPUT GATE)
# ─────────────────────────────────────────────────────────────────
inputs:
  prompt_input: "The prompt or topic to improve. Required; never inferred from context, files, or history."
  enhancement_mode: "auto|text|improve|refine|short|json|yaml|raw — selects effort (short quick, refine thorough, else standard) + output format. Default auto (detect from content)."
  save_choice: "A existing spec folder | B new spec folder | C specific path | D skip."
  save_path: "Resolved save target when save_choice is A/B/C; unused for D."
  dispatch_mode: "INLINE (in-context) or AGENT (fresh @prompt-improver). Default AGENT when --agent or complexity >= 7/10, else INLINE."

# ─────────────────────────────────────────────────────────────────
# APPROVAL GATES
# ─────────────────────────────────────────────────────────────────
approval_gates:
  after_checklist:
    trigger: "After the checklist pass marks each row (INLINE, non-raw)"
    prompt: "Show the checklist result and the chosen skeleton or preset; wait for continue or revise."
    accepted_responses: ["continue", "revise"]
    on_abort_action: "Exit STATUS=CANCELLED with no file written"
  after_draft:
    trigger: "After the enhanced prompt is drafted"
    prompt: "Show the draft enhanced prompt and wait for confirmation to score it."
    accepted_responses: ["approve", "revise"]
    on_abort_action: "Exit STATUS=CANCELLED with no file written"
  after_screen:
    trigger: "After the CLEAR screen and quick test"
    prompt: "Show the CLEAR breakdown and wait before delivering or iterating."
    accepted_responses: ["deliver", "iterate"]
    on_abort_action: "Exit STATUS=CANCELLED with no file written"

# ─────────────────────────────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────────────────────────────
workflow:
  phase_0_setup:
    purpose: Confirm the router bound every input
    activities:
      - "Confirm the router's consolidated setup prompt bound prompt_input, enhancement_mode, save_choice, and dispatch_mode."
      - "If any applicable field is still unresolved, re-show only the missing questions from presentation.Startup and wait; never split them across prompts and never auto-select the save location."
    hard_stops:
      - "Do not proceed until every applicable field is bound."
      - "Never infer prompt_input from context, screenshots, or conversation history."
    validation: inputs_bound

  phase_1_load:
    purpose: Load the sk-prompt engine and the references this mode needs
    activities:
      - "Read upstream_assets.skill."
      - "Load conditional_references per enhancement_mode (checklist set for text/improve/refine/short; json/yaml guides added for those formats; none for raw)."
    on_missing_skill:
      status: 'STATUS=FAIL ERROR="sk-prompt skill not found at .skilled/skills/sk-prompt/SKILL.md"'
    validation: skill_loaded

  phase_2_enhance:
    purpose: Produce the enhanced prompt via the resolved dispatch path, pausing at each checkpoint
    activities:
      - "dispatch_mode AGENT: dispatch Task(subagent_type=prompt-improver) with raw_task, task_type, complexity_hint, constraints; capture FRAMEWORK, CLEAR_SCORE, TEST, CHANGES, RATIONALE, ENHANCED_PROMPT, ESCALATION_NOTES."
      - "dispatch_mode INLINE: checklist pass -> pause at approval_gates.after_checklist -> draft from the skeleton or a named preset -> pause at approval_gates.after_draft -> self-check and, when thorough, the quick test -> continue to phase_3_score."
      - "short mode checks rows 1, 3, 4 and 6 only; raw mode passes through with no checklist and no checkpoints."
    outputs:
      - framework: "default skeleton or preset name"
      - enhanced_prompt: "formatted per enhancement_mode (markdown default, json, or yaml)"
      - test: "quick test result or NOT RUN"
      - changes: "Added, Changed, Removed and Skipped report"
    validation: enhancement_produced

  phase_3_score:
    purpose: Score the enhanced prompt and iterate to threshold
    activities:
      - "Score with CLEAR: C/10 (floor 7), L/10 (floor 7), E/15 (floor 10), A/10 (floor 7), R/5 (floor 3)."
      - "Write the reason before each dimension score."
      - "Pass at 40+/50 with all floors met; below that, revise the weakest dimension, up to 3 repair cycles, then deliver the best version with a note."
      - "INLINE: after scoring, pause at approval_gates.after_screen; iterate runs one more repair cycle within the 3-cycle cap."
      - "raw mode skips scoring."
    outputs:
      - clear_score: "total/50 plus per-dimension breakdown"
    validation: clear_threshold_met

  phase_4_deliver:
    purpose: Present the enhanced prompt and its transparency report
    activities:
      - "Render presentation.Results.Success with framework or preset, mode, dispatch, effort, the checklist result, the quick test result or NOT RUN, the CLEAR breakdown, open items and the change report."
    validation: delivered

  phase_5_save:
    purpose: Persist the enhanced prompt when the user chose to save
    activities:
      - "A: confirm the spec folder exists, mkdir -p [folder]/prompts/, write [hyphen-case].md with frontmatter."
      - "B: sanitize the topic to a [a-z0-9-] slug (fallback untitled-prompt), find the next number under .opencode/specs/, mkdir -p .opencode/specs/[NNN]-[slug]/prompts/, write the file."
      - "C: resolve to absolute, confirm it stays inside the .opencode/specs/ tree (reject escapes and .. climbs), never overwrite silently (confirm or auto-suffix), write the file."
      - "D: write nothing."
    file_frontmatter:
      title: "[Descriptive title]"
      framework: "[default skeleton|RCAF|COSTAR|...]"
      mode: "[MODE used]"
      clear_score: "[N]/50"
      created: "[YYYY-MM-DD]"
    validation: saved_or_skipped

# ─────────────────────────────────────────────────────────────────
# QUALITY GATES
# ─────────────────────────────────────────────────────────────────
quality_gates:
  clear_threshold:
    location: "After phase_3_score"
    blocking: soft
    checks:
      - "CLEAR total >= 40/50 with every dimension at or above its floor (skipped in raw mode)"
    on_fail: 'After 3 repair cycles still below threshold: deliver the best version with STATUS=OK, the score and a note naming the weakest dimension'

# ─────────────────────────────────────────────────────────────────
# ERROR RECOVERY
# ─────────────────────────────────────────────────────────────────
error_recovery:
  skill_missing: "Emit the phase_1 skill-missing STATUS=FAIL and stop."
  user_aborts_at_gate: "Honor the abort, exit STATUS=CANCELLED, no file written."
  clear_below_threshold: "Revise up to 3 repair cycles, then deliver the best version with the score and a note."
  save_path_escapes_tree: "Reject and stop; tell the user to move the file manually after an in-tree save."

# ─────────────────────────────────────────────────────────────────
# RULES
# ─────────────────────────────────────────────────────────────────
rules:
  ALWAYS:
    - load_sk_prompt_before_enhancing
    - pause_at_each_checkpoint_and_wait_for_the_user
    - score_with_clear_unless_raw_mode
    - render_all_display_from_the_presentation_asset
    - sanitize_topic_to_slug_before_any_path_or_shell_use
  NEVER:
    - infer_prompt_input_from_context_or_history
    - auto_select_the_save_location
    - write_outside_the_specs_tree
    - overwrite_an_existing_prompt_file_silently

# ─────────────────────────────────────────────────────────────────
# OUTPUT
# ─────────────────────────────────────────────────────────────────
output: |
  STATUS=OK SCORE=[N]/50 FRAMEWORK=[NAME] when delivered without saving.
  STATUS=OK SCORE=[N]/50 FRAMEWORK=[NAME] SAVED=[path] when the prompt was saved.
  STATUS=CANCELLED when the user aborts at any checkpoint.
  STATUS=OK SCORE=[N]/50 FRAMEWORK=[NAME] NOTE="below threshold after 3 repair cycles" when CLEAR never reached 40/50.
  STATUS=FAIL ERROR="..." on skill-missing.
