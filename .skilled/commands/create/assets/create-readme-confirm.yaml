# ─────────────────────────────────────────────────────────────────
# OPENCODE CREATE: README WORKFLOW (CONFIRM MODE)
# ─────────────────────────────────────────────────────────────────
# Mode: confirm-only (interactive step-by-step approval)
# Note: This workflow does NOT support :auto mode. All executions
#       require user confirmation at checkpoints for content review.
#
# Supports: README creation
# Routing: The setup phase in .skilled/commands/create/readme.md resolves the
#          target. See operation_routing below.
#
# Note: Documents should include concise metadata (no Table of Contents, no <!-- ANCHOR --> comments).
# Use YAML frontmatter (title, description, trigger_phrases) for consistency.
# ─────────────────────────────────────────────────────────────────
role: Expert Documentation Creator using sk-doc skill
purpose: Create comprehensive README files with proper structure and optimization
action: Generate scannable, well-organized README documentation with proper structure

# ─────────────────────────────────────────────────────────────────
# PREREQUISITE: @markdown AGENT VERIFICATION
# ─────────────────────────────────────────────────────────────────
# This workflow REQUIRES the @markdown agent for:
#   - Template-first workflow (loads templates before creating)
#   - DQI scoring (target: 70+ Acceptable)
#   - sk-doc skill integration
#
# PHASE 0 in the command markdown verifies @markdown agent BEFORE
# this YAML workflow loads. If you're executing this workflow,
# @markdown verification has already passed.
#
# To invoke correctly:
#   README: @markdown /create:readme [path]
# ─────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────
# OPERATION ROUTING
# ─────────────────────────────────────────────────────────────────
# This YAML handles the README operation.
# The setup phase in .skilled/commands/create/readme.md resolves the target
# from the command arguments:
#
#   /create:readme [path]   -> README operation
#
# The operation section below is OPERATION: README.
# ─────────────────────────────────────────────────────────────────

operation_routing:
  readme:
    trigger: "/create:readme [path]"
    description: "Create a folder README with proper structure and AI-optimization"
    skip_to: "OPERATION: README"

operating_mode:
  workflow: sequential_6_step
  workflow_compliance: MANDATORY
  workflow_execution: interactive
  approvals: step_by_step
  tracking: progressive_task_checklists
  validation: checkpoint_based
  description: |
    Executes the 6-step documentation workflow with approval gates at each checkpoint.
    User confirms, reviews, or modifies at each step before the workflow advances.

development_philosophy:
  principle: "Question-answering format maximizes AI usefulness"
  approach: "Discover -> Structure -> Generate -> Validate"
  mandate: "Progressive disclosure - Quick Start first, details follow"

runtime_agent_path_resolution:
  default: .skilled/agents
  claude: .claude/agents

# ─────────────────────────────────────────────────────────────────
# CONFIDENCE & CLARIFICATION FRAMEWORK
# ─────────────────────────────────────────────────────────────────
confidence_framework:
  thresholds:
    high: { range: "80-100%", action: "Proceed with citable source" }
    medium: { range: "40-79%", action: "Proceed with caution, document assumptions" }
    low: { range: "0-39%", action: "STOP - Ask clarification with A/B/C options" }

  scoring_weights:
    scope_clarity: 0.30
    content_completeness: 0.25
    structure_adherence: 0.25
    audience_fit: 0.20

  clarification_format: |
    "I need clarity (confidence: [NN%]). Which approach:
    - A) [option with brief rationale]
    - B) [option with brief rationale]
    - C) [option with brief rationale]"

  escalation:
    timebox_minutes: 10
    failed_attempts_threshold: 2
    action: "Present options to user with current findings"

# ─────────────────────────────────────────────────────────────────
# REQUEST ANALYSIS FRAMEWORK
# ─────────────────────────────────────────────────────────────────
request_analysis_framework:
  solution_flow:
  - "Parse carefully: What is ACTUALLY requested?"
  - "Gather Context: Scan directory structure"
  - "Identify Approach: SIMPLEST solution that works"
  - "Validate Choice: Follow patterns, maintainable"
  - "Clarify If Needed: If <80% confidence, ask"
  - "Scope Check: Solving ONLY what was asked?"
  - "Execute: Implement with minimal complexity"

  pre_change_validation:
    items:
    - "Target path confirmed?"
    - "README type determined? (project/component/feature/skill)"
    - "Key features identified?"
    - "Structure template selected?"
    - "Confidence >=80%? (if not: ask)"
    stop_conditions: [ "Any item unchecked", "Path not found" ]
    stop_action: "STOP and address before proceeding"

input_contract:
  required:
  - create_readme_verified
  - operation
  - execution_mode
  optional:
  - target_path
  - project_name
  - readme_type
  - spec_path

# ─────────────────────────────────────────────────────────────────
# CHECKPOINT OPTIONS
# ─────────────────────────────────────────────────────────────────
checkpoint_options:
  standard:
  - label: "Approve"
    description: "Approve and continue to next step"
  - label: "Review"
    description: "Show more details"
  - label: "Modify"
    description: "Make changes before proceeding"

# ─────────────────────────────────────────────────────────────────
# WORKFLOW ENFORCEMENT (CRITICAL)
# ─────────────────────────────────────────────────────────────────
workflow_enforcement:
  mode: strict
  step_order: sequential_mandatory
  skip_allowed: false

  phase_gate:
    location: "Between Step 2 and Step 3"
    purpose: "Verify content discovery complete before structure selection"
    requirements:
    - "Key features identified (3-5)"
    - "Target audience determined"
    - "Prerequisites/dependencies gathered"
    action_if_failed: "STOP and return to incomplete step"

  critical_steps:
    step_2_discovery:
      enforcement: "MUST gather project information before writing"
      verification: "Cannot proceed without identified features"
    step_4_generation:
      enforcement: "MUST use template structure with sections, tables"
      verification: "All sections written, no placeholder content"
    step_5_validation:
      enforcement: "MUST verify structure and completeness"
      verification: "DQI score >= 70 before claiming complete"

gate_logic:
  hard:
    H0_write_verified:
      description: "@markdown verification must have passed in Phase 0"
      fail_action: "STOP and return to the command setup phase"
    H1_required_inputs:
      description: "Required README inputs must be present"
      fail_action: "STOP and collect missing inputs"
    H2_validation_gate:
      description: "Generated documentation must pass the structural validation path"
      fail_action: "Fix the generated output before continuing"
  soft:
    S1_discovered_context:
      description: "Discovered project context may proceed with logged assumptions"
      fail_action: "Proceed with rationale"

# ─────────────────────────────────────────────────────────────────
# CIRCUIT BREAKER
# ─────────────────────────────────────────────────────────────────
circuit_breaker:
  consecutive_failure_threshold: 3
  states:
    closed: "Normal operation"
    open: "3+ failures -- pause and report to user"
    half_open: "Test with single retry before resuming"
  on_open:
    action: "Report failures to user with summary"
    suggest: "Review inputs and try again, or escalate"

# ─────────────────────────────────────────────────────────────────
# INTERACTIVE EXECUTION
# ─────────────────────────────────────────────────────────────────
interactive_execution:
  principle: "Execute workflow steps with user approval at each checkpoint"
  user_feedback_handling:
    approve: "Continue to next step"
    review: "Show detailed output before proceeding"
    modify: "Apply requested changes and re-validate"
    skip: "Mark step as skipped with reason, continue"

# ─────────────────────────────────────────────────────────────────
# QUALITY STANDARDS
# ─────────────────────────────────────────────────────────────────
quality_standards:
  dqi_minimum: 70
  dqi_enforcement: FLEXIBLE
  validation_pipeline:
    stage_1: "Structural check (title, sections, separators)"
    stage_2: "Content check (code blocks, tables, no placeholders)"
  template_adherence: required
  core_standards_reference: ".skilled/skills/sk-doc/shared/references/core-standards.md"

workflow_overview:
  steps:
  - id: step_1_request_analysis
    purpose: "Normalize inputs and resolve the target operation"
  - id: step_2_content_discovery
    purpose: "Gather README source context"
  - id: step_3_structure_selection
    purpose: "Choose the correct template and section contract"
  - id: step_4_content_generation
    purpose: "Generate the document content for the selected operation"
  - id: step_5_validation
    purpose: "Run structure and quality validation"
  - id: step_6_save_context
    purpose: "Persist spec context and emit completion status"

# ════════════════════════════════════════════════════════════════
# OPERATION: README
# ════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────
# README: USER INPUTS (From gate outputs)
# ─────────────────────────────────────────────────────────────────
readme_user_inputs:
  target_path: |
    [TARGET_PATH]
    Where to create README.
    FROM UNIFIED SETUP PHASE (Q0 or command argument).

  readme_type: |
    [README_TYPE]
    Type: project | component | feature | skill
    FROM UNIFIED SETUP PHASE (Q1).

  path_verified: |
    [PATH_VERIFIED]
    Whether target path exists.
    FROM UNIFIED SETUP PHASE (automatic verification).

  existing_readme: |
    [EXISTING_README]
    Whether README.md already exists at path.
    FROM UNIFIED SETUP PHASE (automatic detection).

# ─────────────────────────────────────────────────────────────────
# README: TYPES
# ─────────────────────────────────────────────────────────────────
readme_types:
  project:
    scope: "Entire project"
    sections:
    # Canonical sections from readme-template.md S13 (omits FAQ for project scope)
    - "OVERVIEW"
    - "QUICK START"
    - "FEATURES"
    - "STRUCTURE"
    - "CONFIGURATION"
    - "USAGE EXAMPLES"
    - "TROUBLESHOOTING"
    - "RELATED DOCUMENTS"
    key_questions:
    - "What is this?"
    - "How do I install it?"
    - "How do I use it?"
    - "How do I contribute?"

  component:
    scope: "Module or package"
    sections:
    # Full canonical 9-section set from readme-template.md S13
    - "OVERVIEW"
    - "QUICK START"
    - "FEATURES"
    - "STRUCTURE"
    - "CONFIGURATION"
    - "USAGE EXAMPLES"
    - "TROUBLESHOOTING"
    - "FAQ"
    - "RELATED DOCUMENTS"
    key_questions:
    - "What does this component do?"
    - "How do I use the API?"
    - "How do I integrate it?"

  feature:
    scope: "Specific feature"
    sections:
    # Canonical subset from readme-template.md S13 (omits STRUCTURE, FAQ, RELATED DOCUMENTS)
    - "OVERVIEW"
    - "QUICK START"
    - "FEATURES"
    - "CONFIGURATION"
    - "USAGE EXAMPLES"
    - "TROUBLESHOOTING"
    key_questions:
    - "What does this feature do?"
    - "How do I enable it?"
    - "How do I configure it?"

  skill:
    scope: "OpenCode skill"
    sections:
    # Full canonical 9-section set from readme-template.md S13
    - "OVERVIEW"
    - "QUICK START"
    - "FEATURES"
    - "STRUCTURE"
    - "CONFIGURATION"
    - "USAGE EXAMPLES"
    - "TROUBLESHOOTING"
    - "FAQ"
    - "RELATED DOCUMENTS"
    key_questions:
    - "When does this skill activate?"
    - "What commands are available?"
    - "What MCP tools does it use?"

# ─────────────────────────────────────────────────────────────────
# README: AI OPTIMIZATION PRINCIPLES
# ─────────────────────────────────────────────────────────────────
readme_ai_optimization:
  question_answering:
    description: "Structure to answer common questions"
    examples:
    - question: "How do I install?"
      maps_to: "Installation section"
    - question: "How do I configure?"
      maps_to: "Configuration section"

  scannable_structure:
    description: "Easy to scan and find information"
    techniques:
    - "Clear headings"
    - "Code examples for every feature"
    - "Tables for options"
    - "ASCII diagrams for architecture"

  progressive_disclosure:
    description: "Quick Start first, details follow"
    order:
    - "Quick Start (get running fast)"
    - "Details (deep configuration)"
    - "Reference (complete API)"

# ─────────────────────────────────────────────────────────────────
# README: REFERENCE TEMPLATES
# ─────────────────────────────────────────────────────────────────
readme_reference_templates:
  readme_template: .skilled/skills/sk-doc/sk-create-readme/assets/readme-template.md
  speckit_readme: .skilled/skills/system-spec-kit/README.md
  memory_readme: .skilled/skills/system-spec-kit/README.md
  core_standards: .skilled/skills/sk-doc/shared/references/core-standards.md

# ─────────────────────────────────────────────────────────────────
# README: TEMPLATE EVOLUTION REFERENCES
# ─────────────────────────────────────────────────────────────────
# Points to readme-template.md sections for patterns not embedded here.
# The canonical template is the single source of truth for all README structure.
readme_template_references:
  canonical_structure: "readme-template.md S13 (Complete Template)"
  writing_patterns: "readme-template.md S6 (Writing Patterns)"
  style_guide: "readme-template.md S7 (Style Reference)"
  badge_shields: "readme-template.md S8 (Badge Shields)"
  before_after_patterns: "readme-template.md S6.4 (Before/After)"
  architecture_diagrams: "readme-template.md S6.5 (Architecture Diagrams)"

# ─────────────────────────────────────────────────────────────────
# README: WORKFLOW (6 STEPS WITH CHECKPOINTS)
# ─────────────────────────────────────────────────────────────────
readme_workflow:
  step_1_request_analysis:
    purpose: Determine scope and location (from UNIFIED SETUP PHASE)
    activities:
    - Confirm target_path from UNIFIED SETUP PHASE
    - Confirm readme_type from UNIFIED SETUP PHASE
    - Confirm path_verified from UNIFIED SETUP PHASE
    - Confirm existing_readme handling from UNIFIED SETUP PHASE
    - Validate readme_type is one of: project, component, feature, skill
    type_reference:
      project: "Entire project - overview, installation, configuration, usage"
      component: "Module/package - purpose, API, usage examples, integration"
      feature: "Specific feature - what it does, how it works, configuration"
      skill: "OpenCode skill - triggers, commands, MCP tools, architecture"
    outputs:
    - target_confirmed
    - type_confirmed
    - scope_defined
    checkpoint:
      question: "Create [type] README at [path]. Proceed?"
      options:
      - label: "A) Proceed"
        description: "Create README with these settings"
      - label: "B) Change type"
        description: "Select different README type"
      - label: "C) Change location"
        description: "Use different target path"

  step_2_content_discovery:
    purpose: Gather project information based on type
    activities:
    - Scan for project metadata
    - Identify main features and capabilities
    - Find existing documentation to reference
    - Check for configuration options
    scan_targets:
      project:
      - "package.json / pyproject.toml for metadata"
      - "Main entry points and configuration files"
      - "Key features and capabilities"
      - "Existing documentation"
      component:
      - "Component purpose and scope"
      - "Exported APIs and interfaces"
      - "Usage examples in codebase"
      - "Dependencies and integration points"
      feature_or_skill:
      - "Feature scope and capabilities"
      - "Commands, triggers, or APIs"
      - "Configuration options"
      - "Architecture if applicable"
    questions:
    - "What are the key aspects to document?"
    - "Main purpose/value proposition?"
    - "Key features (3-5)?"
    - "Target audience?"
    - "Prerequisites/dependencies?"
    prompt_template: |
      +------------------------------------------------------------+
      | "What are the key aspects to document?"                    |
      |                                                            |
      | - Main purpose/value proposition?                          |
      | - Key features (3-5)?                                      |
      | - Target audience?                                         |
      | - Prerequisites/dependencies?                              |
      +------------------------------------------------------------+
    outputs:
    - features_identified
    - metadata_gathered
    - structure_understood
    checkpoint:
      question: "Key features identified. Review?"
      options: checkpoint_options.standard

  step_3_structure_selection:
    purpose: Choose appropriate template based on type
    activities:
    - Select section structure based on readme_type
    - Adapt sections to specific project needs
    - Plan content for each section
    - Identify which optional sections to include
    core_pattern:
      all_types:
      - "Title + Tagline (one-liner description)"
      - "Numbered sections"
      - "Tables for structured data"
      - "Code blocks with language tags"
      - "Horizontal rules between major sections"
    emoji_guidance:
      note: "Optional emoji prefix suggestions (not required in output)"
      examples:
        overview: "OVERVIEW"
        quick_start: "QUICK START"
        structure: "STRUCTURE"
        features: "FEATURES"
        configuration: "CONFIGURATION"
        usage_examples: "USAGE EXAMPLES"
        troubleshooting: "TROUBLESHOOTING"
        faq: "FAQ"
        related_documents: "RELATED DOCUMENTS"
    outputs:
    - template_selected
    - sections_planned
    - content_outline
    checkpoint:
      question: "Structure selected. Proceed to generation?"
      options: checkpoint_options.standard

  step_4_content_generation:
    purpose: Write comprehensive README following selected structure
    activities:
    - Write Title + Tagline (concise, clear value proposition)
    - Write each section
    - Create tables for structured data (features, commands, config)
    - Add code blocks with language tags
    - Create ASCII diagrams for architecture/flow visualization
    - Add horizontal rules between major sections
    - Write to target_path
    quality_requirements:
      title: "Clear, concise value proposition"
      sections: "Numbered sections"
      tables: "For structured data (features, commands, config)"
      code_blocks: "Always specify language"
      diagrams: "ASCII for architecture/flow"
      separators: "Horizontal rules between major sections"
    outputs:
    - readme_file: created
    - sections_count: number
    - tables_count: number
    - code_blocks_count: number
    checkpoint:
      question: "README generated. Review?"
      options:
      - label: "A) Show full content"
        description: "Display complete README"
      - label: "B) Proceed"
        description: "Continue to validation"

  step_5_validation:
    purpose: Verify README quality and completeness
    activities:
    - Structure check (title, sections, separators)
    - Content check (code blocks, tables, no placeholders, valid links)
    - Completeness check (Quick Start, Troubleshooting, FAQ for component/skill)
    - DQI check if script available
    validation_checklist:
      structure:
      - "Title + one-liner tagline present"
      - "All sections numbered"
      - "Horizontal rules between sections"
      content:
      - "All code blocks have language tags"
      - "Tables are properly formatted"
      - "No placeholder text remaining"
      - "Links are valid"
      completeness:
      - "Quick Start section present"
      - "Troubleshooting section present"
      - "FAQ section present (for component/skill)"
    quality_gates:
      dqi_minimum: 70
      dqi_band: "Acceptable"
      enforcement: "Flexible"
    outputs:
    - validation_passed: boolean
    - checklist_results: object
    - dqi_score: number (optional)
    checkpoint:
      question: "Validation complete. README ready?"
      options:
      - label: "Proceed"
        description: "Continue to save context"
      - label: "Fix issues"
        description: "Address validation failures"
      - label: "View summary"
        description: "Show final summary"

  step_5b_quality_validation:
    purpose: Quality-validate the created README artifact
    agent_availability:
      agent_file: "[runtime_agent_path]/markdown.md"
      template_contract:
        source: "sk-doc"
        validators: "validate_document.py + extract_structure.py"
        precedence: "Template compliance and DQI quality checks are mandatory before completion."
      rule_reference: "AGENTS.md S3 -- sk-doc template alignment and quality validation"
      condition: "ONLY when this step is actively executing"
      blocking: false
      not_for: "reviewing this workflow prompt or any pre-step activity"
    activities:
    - "Run @markdown quality validation to score the created README file"
    - "Validation checks: structure completeness, content quality, DQI standards"
    - "Score against 100-point rubric (Accuracy 40%, Completeness 35%, Consistency 25%)"
    on_low_score:
      threshold: 70
      action: "Log warnings and suggest improvements; do not block workflow"
    outputs:
    - quality_score: number
    - validation_findings: list
    - improvement_suggestions: list (if score < 70)
    checkpoint:
      question: "Quality validation complete (score: [quality_score]/100). Continue?"
      options:
      - label: "A) Accept and continue"
        description: "Proceed to save context"
      - label: "B) View findings"
        description: "Show detailed review findings"
      - label: "C) Address issues"
        description: "Fix issues before continuing"

  step_6_save_context:
    purpose: Preserve workflow decisions and context
    activities:
    - Invoke system-spec-kit skill
    - Document README creation decisions
    - Record structure choices and rationale
    - Save validation results
    - Create memory file with timestamp
    - Index memory file for immediate search availability
    tool_invocation:
      command: 'Read(".skilled/skills/system-spec-kit/SKILL.md")'
      note: "Activate context saving via memory skill"
    memory_content:
      include:
      - README type and target path
      - Structure decisions made
      - Content sources and references
      - Validation results
      - Any challenges or decisions made
    outputs:
    - implementation_summary: "[SPEC_FOLDER]/implementation-summary.md"
    validation: context_saved
    checkpoint:
      question: "Context saved. README creation complete!"
      options:
      - label: "Done"
        description: "Complete workflow"
      - label: "View summary"
        description: "Show final summary"

    # -- CONTINUITY WRITE -----------------------------------------
    write_continuity:
      purpose: "Refresh the packet continuity frontmatter and generated metadata"
      writer: "node .skilled/skills/system-spec-kit/runtime/cli/dist/continuity/generate-context.js"
      invocation: |
        node .skilled/skills/system-spec-kit/runtime/cli/dist/continuity/generate-context.js \
          /tmp/save-context-data-<session-id>.json [SPEC_FOLDER]
      critical_note: "The writer is the whole write: it keeps atomic same-directory update and lock semantics, needs no background service, and has no indexing step after it. The target is the canonical spec packet; standalone memory/*.md files are retired and the runtime rejects them."
      when: "Immediately after implementation-summary.md is written to disk"

    anchor_requirements:
      enforcement: MANDATORY
      minimum_anchors: 2
      pattern: "[context-type]-[keywords]-[spec-number]"
      format: "<!-- ANCHOR:ID --> content <!-- /ANCHOR:ID -->"
      case: "UPPERCASE recommended for visibility"
      required_sections:
      - context_type: "general"
        section: "Session summary with README creation outcomes"
        example_id: "GENERAL-SESSION-SUMMARY-{spec#}"
        example: |
          <!-- ANCHOR:GENERAL-SESSION-SUMMARY-{spec#} -->
          ## Session Summary
          Created [type] README at [path]...
          <!-- /ANCHOR:GENERAL-SESSION-SUMMARY-{spec#} -->
      - context_type: "decision"
        section: "Key decisions made during README creation"
        example_id: "DECISION-README-STRUCTURE-{spec#}"
        example: |
          <!-- ANCHOR:DECISION-README-STRUCTURE-{spec#} -->
          ## Key Decisions
          - Chose structure X because...
          <!-- /ANCHOR:DECISION-README-STRUCTURE-{spec#} -->
      optional_sections:
      - context_type: "implementation"
        section: "Structure and sections chosen"
        example_id: "IMPLEMENTATION-STRUCTURE-{spec#}"
      - context_type: "research"
        section: "Content sources and references"
        example_id: "RESEARCH-SOURCES-{spec#}"
      benefit: "93% token savings on anchor-based retrieval"
      reference: "See /speckit:save Step 3 for full anchor documentation"

    importance_tier:
      assign: normal
      rationale: "README creation is standard documentation task"
      promotion_note: "Edit the document's importance_tier frontmatter and rerun the continuity writer to promote to 'important' if README becomes a key reference"
      tier_reference: |
        critical: Foundational decisions (high priority in search)
        important: Significant work like implementations
        normal: Standard context like documentation tasks (this workflow)
        temporary: Short-term notes
        deprecated: Outdated but retained

# ─────────────────────────────────────────────────────────────────
# README: TEMPLATE REFERENCES
# ─────────────────────────────────────────────────────────────────
readme_templates:
  # -- CANONICAL TEMPLATE REFERENCES ----------------------------------------
  # Full README scaffolds are NOT embedded here to avoid dual sources of truth.
  # All types use the canonical 9-section template as their base.
  project_readme: |
    # Reference: See readme-template.md S13 (Complete Template) for the canonical 9-section scaffold.
    # Adapt sections per readme_types.project.sections above.
    # Template path: .skilled/skills/sk-doc/sk-create-readme/assets/readme-template.md
  component_readme: |
    # Reference: See readme-template.md S13 (Complete Template) for the canonical 9-section scaffold.
    # Adapt sections per readme_types.component.sections above.
    # Template path: .skilled/skills/sk-doc/sk-create-readme/assets/readme-template.md
  feature_readme: |
    # Reference: See readme-template.md S13 (Complete Template) for the canonical 9-section scaffold.
    # Adapt sections per readme_types.feature.sections above (subset of 9 sections).
    # Template path: .skilled/skills/sk-doc/sk-create-readme/assets/readme-template.md
  skill_readme: |
    # Reference: See readme-template.md S13 (Complete Template) for the canonical 9-section scaffold.
    # Adapt sections per readme_types.skill.sections above.
    # Template path: .skilled/skills/sk-doc/sk-create-readme/assets/readme-template.md

# ─────────────────────────────────────────────────────────────────
# README: COMPLETION REPORT TEMPLATE
# ─────────────────────────────────────────────────────────────────
readme_completion_report:
  template: |
    README Created

    Location: [path]
    Type: [project|component|feature|skill]

    Structure:
    - Title + Tagline: OK
    - Sections: [N] numbered
    - Tables: [N]
    - Code blocks: [N]
    - ASCII diagrams: [N]

    Quality:
    - All sections linked: OK
    - No placeholders: OK
    - Horizontal rules: OK

    Next Steps:
    - Review for accuracy
    - Add screenshots if applicable
    - Test all code examples

    STATUS=OK PATH=[readme-path]

# ─────────────────────────────────────────────────────────────────
# README: RULES
# ─────────────────────────────────────────────────────────────────
readme_rules:
  ALWAYS:
  - "Load readme-template.md before creating content"
  - "Pause at checkpoints for user approval"
  - "Include Quick Start section with clear examples"
  - "Use numbered H2 sections"
  - "Validate structure before claiming complete"
  NEVER:
  - "Skip validation steps"
  - "Create documents without loading templates first"
  - "Proceed without user approval at checkpoints"
  - "Leave placeholder text in final output"
  - "Omit troubleshooting section"
  - "Create README without user-confirmed path"

# ════════════════════════════════════════════════════════════════
# SHARED: ERROR RECOVERY
# ════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────
# ERROR RECOVERY
# ─────────────────────────────────────────────────────────────────
error_recovery:
  template_not_found:
    action: "Check template paths, verify sk-doc skill exists"
    fallback: "Use inline minimal template structure"
  validation_failure:
    action: "Show specific validation errors, guide fixes"
    retry: true
  file_write_failure:
    action: "Check permissions, verify path exists, create parent directories"
    retry: true
  validation_fails:
    action: "Show which sections need content, guide fixes"
    loop: true
  user_rejects_approach:
    action: "Return to planning, gather alternative requirements"
    restart_from: "step_2_content_discovery"

  path_not_exist:
    operation: readme
    action: "Create directory or choose different path"
    options: [ "Create directory", "Choose different path", "Cancel" ]
  readme_exists:
    operation: readme
    action: "Offer update, backup, or new location"
    options: [ "Overwrite", "Backup and overwrite", "Merge", "Cancel" ]
  no_project_info:
    operation: readme
    action: "Prompt for manual input"
    questions: [ "Project name?", "Key features?", "Target audience?" ]

# ════════════════════════════════════════════════════════════════
# SHARED: TERMINATION
# ════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────
# TERMINATION
# ─────────────────────────────────────────────────────────────────
termination:
  after_step: step_6_save_context
  message: "README creation workflow complete."
  next_steps:
  - condition: "README needs screenshots"
    action: "Add visual assets to enhance documentation"
  - condition: "Create another README"
    action: "Run /create:readme [path]"
  # -- Common next steps --

rules:
  must:
  - "Use the README template bundle"
  - "Validate the generated document before completion"
  must_not:
  - "Skip Phase 0 @markdown verification"
  - condition: "Want to save context"
    action: "Run /speckit:save"
