# ─────────────────────────────────────────────────────────────────
# OPENCODE CREATE: CHANGELOG CREATION WORKFLOW (AUTO MODE)
# ─────────────────────────────────────────────────────────────────
# Mode: autonomous (no user approval gates)
# Note: This workflow executes all steps sequentially with
#       continuous self-validation. Pauses only if confidence < 40%.
# ─────────────────────────────────────────────────────────────────
role: Expert Changelog Creator with dynamic work detection
purpose: Create properly formatted changelog entries by analyzing recent work and resolving components
action: Detect work context, resolve component folder, calculate version, generate formatted changelog

# ─────────────────────────────────────────────────────────────────
# PREREQUISITE: @markdown AGENT VERIFICATION
# ─────────────────────────────────────────────────────────────────
# This workflow REQUIRES the @markdown agent for:
#   - Template-first workflow (loads format before generating)
#   - Changelog format validation
#   - Version number verification
#
# PHASE 0 in the command markdown verifies @markdown agent BEFORE
# this YAML workflow loads. If you're executing this workflow,
# @markdown verification has already passed.
#
# To invoke correctly: @markdown /create:changelog [source]
# ─────────────────────────────────────────────────────────────────

operating_mode:
  workflow: sequential_8_step
  workflow_compliance: MANDATORY
  workflow_execution: autonomous
  approvals: none
  tracking: progressive_task_checklists
  validation: continuous_self_validation
  description: |
    Executes the 8-step changelog creation workflow without step-by-step approval.
    Pauses only if confidence drops below threshold or component resolution is ambiguous.

development_philosophy:
  principle: "Detect accurately, format consistently"
  approach: "Analyze -> Resolve -> Calculate -> Generate -> Validate -> Write"
  mandate: "Dynamic detection with human-quality output matching 400+ existing changelogs"

runtime_agent_path_resolution:
  default: .skilled/agents
  claude: .claude/agents

# ─────────────────────────────────────────────────────────────────
# CONFIDENCE & CLARIFICATION FRAMEWORK
# ─────────────────────────────────────────────────────────────────
confidence_framework:
  thresholds:
    high: { range: "80-100%", action: "Proceed with citable source" }
    medium:
      { range: "40-79%", action: "Proceed with caution, document assumptions" }
    low:
      { range: "0-39%", action: "STOP - Ask clarification with A/B/C options" }

  scoring_weights:
    work_context_availability: 0.30
    component_resolution_confidence: 0.25
    version_calculation_certainty: 0.25
    content_completeness: 0.20

  clarification_format: |
    "I need clarity (confidence: [NN%]). Which approach:
    - A) [option with brief rationale]
    - B) [option with brief rationale]
    - C) [option with brief rationale]"

  escalation:
    timebox_minutes: 10
    failed_attempts_threshold: 2
    action: "Present options to user with current findings"

# ─────────────────────────────────────────────────────────────────
# REQUEST ANALYSIS FRAMEWORK
# ─────────────────────────────────────────────────────────────────
request_analysis_framework:
  solution_flow:
    - "Parse input: spec folder path, component name, or auto-detect mode"
    - "Gather context: Read spec artifacts or git history"
    - "Resolve component: Map changed files to changelog folder"
    - "Calculate version: Scan existing files, determine next version"
    - "Generate content: Format per established template"
    - "Validate: Check format, version sequencing, completeness"
    - "Write: Create file in correct location"

  pre_change_validation:
    items:
      - "Source identified? (spec folder, component, or git history)"
      - "Component folder resolved?"
      - "Version number calculated?"
      - "Content generated with all required sections?"
      - "Confidence >=80%? (if not: ask)"
    stop_conditions: ["Any item unchecked", "Component unresolved"]
    stop_action: "STOP and address before proceeding"

# ─────────────────────────────────────────────────────────────────
# USER INPUTS (From Setup Phase outputs)
# ─────────────────────────────────────────────────────────────────
user_inputs:
  source_type: |
    [SOURCE_TYPE]
    One of: spec_folder, component, git_history
    FROM UNIFIED SETUP PHASE (Q0 or $ARGUMENTS).

  spec_folder: |
    [SPEC_FOLDER]
    Path to spec folder (if source_type = spec_folder).
    FROM UNIFIED SETUP PHASE (Q0 choice A).

  component_hint: |
    [COMPONENT_HINT]
    Component name hint (if source_type = component).
    FROM UNIFIED SETUP PHASE (Q0 choice B).

  version_bump: |
    [VERSION_BUMP]
    One of: major, minor, patch, build, auto
    FROM UNIFIED SETUP PHASE (--bump flag or Q1).

  publish_release: |
    [PUBLISH_RELEASE]
    Boolean: true or false.
    FROM UNIFIED SETUP PHASE (--release flag or PRE-BOUND SETUP marker).
    Defaults to false. Only becomes true via an explicit flag or marker --
    never a silent default. See step_7_publish_release.

# ─────────────────────────────────────────────────────────────────
# FIELD HANDLING
# ─────────────────────────────────────────────────────────────────
field_handling:
  source_type:
    validation: "must be one of: spec_folder, component, git_history"
    required: true

  version_bump:
    validation: "must be one of: major, minor, patch, build, auto"
    default: "auto"

  publish_release:
    validation: "must be boolean (true/false)"
    default: false
    note: "Only true via explicit --release flag or PRE-BOUND SETUP marker. Never silently defaulted to true; autonomous mode never infers this from context."

  defaults:
    changelog_root: ".skilled/changelog/"
    date_format: "YYYY-MM-DD"
    version_format: "v{MAJOR}.{MINOR}.{PATCH}.{BUILD}"
    initial_version: "v1.0.0.0"
    project_url: "https://github.com/MichelKerkmeester/opencode--spec-kit-skilled-agent-orchestration"

input_contract:
  required:
    - create_agent_verified
    - source_type
  optional:
    - spec_folder
    - component_hint
    - version_bump
    - publish_release

# ─────────────────────────────────────────────────────────────────
# DOCUMENTATION LEVEL
# ─────────────────────────────────────────────────────────────────
documentation_level:
  default: "Level 1 (Baseline)"
  required_files:
    - spec.md
    - plan.md
    - tasks.md
  note: "Changelog creation is typically Level 1 unless multi-component"

# ─────────────────────────────────────────────────────────────────
# COMPONENT MAPPING TABLE
# ─────────────────────────────────────────────────────────────────
# Maps file path patterns to changelog component folders.
# Ordered by specificity (most specific first).
# When a changed file matches multiple patterns, use the FIRST match.
# ─────────────────────────────────────────────────────────────────
component_mapping:
  # ─────────────────────────────────────────────────────────────────
  # DYNAMIC DISCOVERY — scan .skilled/changelog/ at runtime
  # ─────────────────────────────────────────────────────────────────
  # Component folders are NOT hardcoded. The workflow discovers them:
  #
  #   $ ls -d .skilled/changelog/*/
  #
  # Folder naming convention: plain component names, no numeric prefix
  # Example: sk-doc, system-spec-kit, sk-code
  #
  # RESOLUTION STRATEGY (most specific first):
  #   1. Use the folder name as the component name
  #   2. Match changed file paths against component names:
  #      - .skilled/skills/{name}/**  → folder containing {name}
  #      - .skilled/commands/**       → folder containing "commands"
  #      - .skilled/agents/**         → folder containing "agents"
  #   3. Match component_hint keyword against folder names
  #   4. No match: STOP and ask which component the changelog belongs to
  #
  # The agent MUST run the discovery scan in Step 2 of the workflow
  # and build the mapping dynamically from the actual folder contents.
  # ─────────────────────────────────────────────────────────────────

  discovery:
    scan_command: "ls -d .skilled/changelog/*/ 2>/dev/null | sort"
    folder_pattern: "(.*)"
    fallback_prefix: null
    note: "Folder names are plain component names. Never default an unmatched path to a guessed folder; pause and ask instead."

  resolution_rules:
    - source: "file_path"
      strategy: "Match changed file paths against discovered folder names using substring/keyword matching"
    - source: "component_hint"
      strategy: "Match user-provided hint against discovered folder names"
    - source: "spec_folder"
      strategy: "Extract spec path segments and match against discovered folder names"
    - source: "fallback"
      strategy: "No match: pause and ask the user which component this changelog belongs to; never write to a guessed folder"

# ─────────────────────────────────────────────────────────────────
# VERSION BUMP RULES
# ─────────────────────────────────────────────────────────────────
version_bump_rules:
  auto_detection:
    major:
      triggers: ["BREAKING", "overhaul", "rewrite", "migration", "v2", "v3"]
      description: "Architectural overhaul or platform-level change"
    minor:
      triggers: ["feat", "add", "new", "feature", "implement", "create"]
      description: "Significant new feature or subsystem addition"
    patch:
      triggers:
        [
          "fix",
          "bug",
          "refactor",
          "chore",
          "docs",
          "update",
          "improve",
          "cleanup",
        ]
      description: "Incremental improvement, bug fix, or refactor"
    build:
      triggers: ["hotfix", "typo", "same-day"]
      description: "Hotfix on already-published version"

  detection_order:
    - "Check user-provided --bump flag first (highest priority)"
    - "Check spec.md title and purpose for change type keywords"
    - "Check git commit messages for conventional commit prefixes"
    - "Default to patch if no clear signal"

  calculation:
    major: "{MAJOR+1}.0.0.0"
    minor: "{MAJOR}.{MINOR+1}.0.0"
    patch: "{MAJOR}.{MINOR}.{PATCH+1}.0"
    build: "{MAJOR}.{MINOR}.{PATCH}.{BUILD+1}"

# ─────────────────────────────────────────────────────────────────
# CHANGELOG CONTENT TEMPLATE
# ─────────────────────────────────────────────────────────────────
changelog_template:
  # ─────────────────────────────────────────────────────────────────
  # TEMPLATE FILE: .skilled/skills/sk-doc/sk-create-changelog/assets/changelog-template.md
  # ─────────────────────────────────────────────────────────────────
  # The canonical changelog and release notes template lives in:
  #   .skilled/skills/sk-doc/sk-create-changelog/assets/changelog-template.md
  #
  # It defines TWO narrative formats:
  #   1. COMPACT - for releases with fewer than 10 changes and no breaking change
  #      Uses: summary narrative -> ## What's New at a Glance bullets -> ## Upgrade
  #   2. EXPANDED - for 10+ changes, a major bump, or any breaking change
  #      Uses: opening narrative -> Why This Release -> What's New at a Glance ->
  #            topical H2 sections with H4 benefit-led story items -> Upgrade Notes
  #
  # FORMAT SELECTION:
  #   - Count the changes in work_context
  #   - < 10 changes and not major and not breaking -> compact format
  #   - >= 10 changes, or major bump, or any breaking change -> expanded format
  #
  # WRITING STYLE (enforced by the shared template and the HVR scanner):
  #   - Plain English for a smart person who is not a developer
  #   - Lead with why the release matters, never technical stats
  #   - Every change: what was broken + what changed + why it matters
  #   - Omission rules apply: no Files Changed tables, no test metrics, no schema
  #     tables; a table appears only when the numbers themselves are the story
  #   - Benefit-led H4 headings, 2-7 words for most and 10 at most
  #   - At-a-glance bullets open with a bold lead-in sentence
  #   - No Oxford commas, em dashes, or semicolons
  #
  # Canonical exemplar: .skilled/changelog/system-spec-kit/v4.0.0.0.md
  # Read the template file at Step 4 before generating content.
  # ─────────────────────────────────────────────────────────────────
  template_file: ".skilled/skills/sk-doc/sk-create-changelog/assets/changelog-template.md"
  style_reference: ".skilled/changelog/system-spec-kit/v4.0.0.0.md"

# ─────────────────────────────────────────────────────────────────
# SECTION NAMING
# ─────────────────────────────────────────────────────────────────
section_naming:
  # Name H2 sections for the domain they change, the way the exemplar names
  # sections like "Spec Kit" and "Safer Git". One to five domains for most
  # releases, more for a release the size of the exemplar.
  h2_topical_domain: "## {Domain Name}"
  h4_benefit_led_item: "#### {Benefit-led heading, usually 2-7 words}"
  note: |
    Fixed change-type labels (New Features, Bug Fixes) are retired as section
    names when a domain name says more. Expanded-format items are H4 headings
    with merged narrative paragraphs, never Problem/Fix labels.
    Read .skilled/skills/sk-doc/sk-create-changelog/assets/changelog-template.md for full format reference.

# ─────────────────────────────────────────────────────────────────
# WORKFLOW ENFORCEMENT
# ─────────────────────────────────────────────────────────────────
workflow_enforcement:
  mode: strict
  step_order: sequential_mandatory
  skip_allowed: false
  critical_steps:
    step_2_component_resolution:
      enforcement: "MUST resolve to a valid changelog subfolder"
      verification: "Folder exists at .skilled/changelog/{resolved_folder}/"
    step_3_version_determination:
      enforcement: "MUST calculate a sequential version number"
      verification: "No file with same version exists in target folder"
    step_5_quality_validation:
      enforcement: "MUST verify format compliance before writing"
      verification: "All required sections present in generated content"

# ─────────────────────────────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────────────────────────────
gate_logic:
  hard:
    H0_write_verified:
      description: "@markdown verification must have passed in Phase 0"
      fail_action: "STOP and return to the command setup phase"
    H1_required_fields:
      description: "Source context and resolution inputs must be present"
      fail_action: "STOP and collect missing inputs"
    H2_component_resolution:
      description: "A changelog component folder must resolve before writing"
      fail_action: "STOP and ask for a clearer source or component hint"
    H3_version_contract:
      description: "Version calculation and content format must be valid before write"
      fail_action: "Fix the version/content plan before continuing"
  soft:
    S1_auto_bump:
      description: "Auto-detected version bump may proceed with logged assumptions"
      fail_action: "Proceed with rationale"
    S2_release_optional:
      description: "Publish-release is opt-in; skipping it never blocks changelog completion"
      fail_action: "Continue to step_8_save_context with release_published=false"

workflow_overview:
  steps:
    - id: step_1_context_analysis
      purpose: "Resolve the work source and collect changelog context"
    - id: step_2_component_resolution
      purpose: "Map the work to the correct changelog component folder"
    - id: step_3_version_determination
      purpose: "Calculate the next version and release tier"
    - id: step_4_content_generation
      purpose: "Draft the changelog entry using the canonical format"
    - id: step_5_quality_validation
      purpose: "Validate structure, versioning, and completeness"
    - id: step_6_write_file
      purpose: "Write the changelog entry to the resolved component folder"
    - id: step_7_publish_release
      purpose: "Create a git tag and GitHub release, only when publish_release was explicitly set to true"
    - id: step_8_save_context
      purpose: "Persist spec context and emit completion status"

workflow:
  step_1_context_analysis:
    purpose: Detect what was worked on and gather work context
    activities:
      - "Determine source type from Setup Phase outputs"
      - |
        IF source_type = spec_folder:
          Read {spec_folder}/implementation-summary.md (primary source)
          Read {spec_folder}/tasks.md (completed tasks)
          Read {spec_folder}/spec.md (title, purpose, requirements)
          Extract: work_summary, files_changed, change_type, spec_level
          Detect output mode:
            - IF --nested flag present -> changelog_mode = nested
            - ELSE IF spec_folder is a phase child OR has direct child phase folders OR already has changelog/ -> changelog_mode = nested
            - ELSE -> changelog_mode = global
      - |
        IF source_type = component:
          Use component_hint to identify target folder
          Run: git log --oneline --since="7 days ago" -- {component_file_patterns}
          Extract: recent_commits, files_changed
          changelog_mode = global
      - |
        IF source_type = git_history:
          Run: git log --oneline --since="7 days ago"
          Run: git diff --stat HEAD~10
          Extract: recent_commits, files_changed, commit_messages
          changelog_mode = global
      - "Compile work_context object with: summary, files_changed[], change_type, source"
    outputs:
      - work_context: "Object containing summary, files, change type"
      - files_changed: "List of changed file paths"
      - change_type_hint: "Feature / fix / refactor / architecture"
      - changelog_mode: "global or nested"
    validation: context_gathered

  step_2_component_resolution:
    purpose: Resolve the correct output target for global or nested changelog mode
    activities:
      - |
        IF changelog_mode = nested:
          Run: node .skilled/skills/system-spec-kit/runtime/cli/dist/spec-folder/nested-changelog.js {spec_folder} --json
          Read canonical templates:
            - .skilled/skills/system-spec-kit/templates/changelog/root.md
            - .skilled/skills/system-spec-kit/templates/changelog/phase.md
          Extract output_path and nested summary payload
          Skip component-folder mapping and versioned release rules
      - |
        IF changelog_mode = global:
        DISCOVER available changelog folders:
          $ ls -d .skilled/changelog/*/ 2>/dev/null | sort
          Parse folder names as plain component names (no numeric prefix)
          Build runtime component list from actual directory contents
      - |
        IF changelog_mode = global:
        FOR EACH file in files_changed:
          Match file path segments against discovered component names
          Record matched component folder
      - |
        Count matches per component:
          IF single component dominates (>60% of files) -> primary_component = that component
          IF multiple components roughly equal -> list all, pick primary by file count
          IF no matches -> STOP and ask which component this changelog belongs to
      - |
        IF source_type = spec_folder:
          Extract spec path segments and match against discovered folder names
          Use as tiebreaker when file analysis is ambiguous
      - |
        IF source_type = component:
          Match component_hint against discovered folder names (substring match)
          Direct resolution without file analysis
      - "Verify target folder exists: ls .skilled/changelog/{resolved_folder}/"
      - |
        IF changelog_mode = nested:
          Verify nested output path resolves inside the target packet changelog/ folder
      - |
        IF changelog_mode = global:
        IF target folder does not exist:
          STOP - Report: "Changelog folder not found: {resolved_folder}"
          Ask user to confirm or choose different target
    outputs:
      - primary_component: "Resolved changelog subfolder name"
      - secondary_components: "Other affected components (if cross-component)"
      - resolution_confidence: "Percentage confidence in mapping"
      - nested_output_path: "Packet-local output path when changelog_mode = nested"
    validation: component_resolved

  step_3_version_determination:
    purpose: Calculate the next version number for the changelog entry
    activities:
      - |
        IF changelog_mode = nested:
          Skip version calculation. Nested packet changelogs use deterministic packet-local filenames.
      - "List existing changelog files in target folder:"
      - "  Run: ls .skilled/changelog/{primary_component}/ | sort -V"
      - "Parse the latest version file: extract MAJOR.MINOR.PATCH.BUILD"
      - |
        Determine bump type:
          IF version_bump != "auto" -> use user-specified bump type
          IF version_bump == "auto":
            Check change_type_hint against version_bump_rules.auto_detection
            Check work_context.summary for trigger keywords
            Default to "patch" if no clear signal
      - "Calculate next version using version_bump_rules.calculation"
      - |
        Verify no collision:
          IF file v{next_version}.md already exists:
            Increment BUILD segment until unique
      - "Store: next_version, bump_type_used"
    outputs:
      - next_version: "Calculated version string (e.g., v2.1.0.0)"
      - bump_type_used: "major/minor/patch/build"
      - latest_existing_version: "Previous version for reference"
    validation: version_calculated

  step_4_content_generation:
    purpose: Generate changelog content following established format
    activities:
      - "Read the template: .skilled/skills/sk-doc/sk-create-changelog/assets/changelog-template.md"
      - "If changelog_mode = nested, read .skilled/skills/system-spec-kit/templates/changelog/root.md or phase.md instead"
      - "Set DATE to today's date in YYYY-MM-DD format"
      - |
        SELECT FORMAT based on change count and release type:
          IF change_count < 10 AND change_type != major AND no breaking change -> COMPACT format
          IF change_count >= 10 OR change_type == major OR any breaking change -> EXPANDED format
          See template file Section 5 (Format Selection Guide) for full rules
      - |
        Generate SUMMARY (both formats):
          IF source_type = spec_folder:
            Use spec.md title + implementation-summary.md first paragraph
          IF source_type = component or git_history:
            Synthesize from commit messages and changed files
          Compact: 1-3 sentences. Expanded: an opening narrative of 1-5 paragraphs.
          Lead with WHY, not technical stats.
      - |
        Generate BODY using selected format:

          COMPACT FORMAT:
            ## What's New at a Glance
            - **{The change, stated as a short sentence.}** {One or two plain sentences on what it means for the reader.}

          EXPANDED FORMAT:
            ## Why This Release
            ## What's New at a Glance
            ## {Topical Domain}
              #### {Benefit-led heading, usually 2-7 words}
              {One to three narrative paragraphs, seven at most: what was broken, what changed, why it matters}
              (inline **Breaking:** markers where a change breaks something)

        Omission rules apply to every format:
          - No Files Changed tables, no test metrics, no schema tables
          - Reverted mid-cycle work compresses to one story sentence
          - A table appears only when the numbers themselves are the story

        Expanded-format heading rule:
          - Prefer 2-7 words, 10 at most, benefit-led
          - Make it easy to scan at a glance
          - Avoid packet IDs, numbering, and sentence-length headings unless truly required

        Pull content from:
          spec_folder: tasks.md completed items, implementation-summary.md sections
          component/git: commit messages grouped by type
          nested: generator payload from nested-changelog.js
      - |
        Generate UPGRADE section:
          IF breaking changes -> Upgrade Notes with Adopt/Repoint/Drop bold lead-ins
          IF no migration needed -> "No migration required."
          Compact format uses "## Upgrade"; expanded format uses "## Upgrade Notes".
      - "Assemble full content per template format (compact or expanded)"
    outputs:
      - changelog_content: "Complete formatted changelog markdown"
      - section_count: "Number of narrative sections generated"
    validation: content_generated

  step_5_quality_validation:
    purpose: Verify the generated changelog meets format and quality standards
    activities:
      - |
        FORMAT CHECKS:
          [ ] Prose starts with the summary narrative (frontmatter and an editorial title H1 may precede it, a bare version header may not)
          [ ] Spec folder blockquote present when source is a spec folder
          [ ] Summary narrative present (non-empty, leads with why)
          [ ] At-a-glance section present with bold lead-in bullets
          [ ] Expanded: Why This Release, topical H2 sections with H4 items, Upgrade Notes
          [ ] No Files Changed / Test Impact / Schema Changes default sections
          [ ] --- only between H2 sections; &nbsp; between H4 items within a section
      - |
        VERSION CHECKS:
          [ ] Version is strictly greater than latest_existing_version
          [ ] Version follows 4-segment format (MAJOR.MINOR.PATCH.BUILD)
          [ ] No file with this version exists in target folder
      - |
        CONTENT CHECKS:
          [ ] Compact summary within 3 sentences, expanded opening within 5 paragraphs
          [ ] Each at-a-glance bullet opens with a bold lead-in sentence
          [ ] H4 headings 10 words at most, H4 items 7 paragraphs at most
          [ ] Omission rules applied (no file inventories, no test metrics)
      - |
        IF any check fails:
          Log failed check(s)
          Auto-fix if possible (e.g., missing section -> add empty section)
          Re-validate after fix
    outputs:
      - validation_passed: "true/false"
      - checks_passed: "N/N total"
      - auto_fixes_applied: "List of automatic corrections"
    validation: quality_verified

  step_6_write_file:
    purpose: Write the changelog file to the correct location
    activities:
      - |
        IF changelog_mode = nested:
          Run: node .skilled/skills/system-spec-kit/runtime/cli/dist/spec-folder/nested-changelog.js {spec_folder} --write
          Verify the written packet-local file matches nested_output_path
      - "Construct output path: .skilled/changelog/{primary_component}/v{next_version}.md"
      - "Write changelog_content to output path using Write tool"
      - "Verify file was created: Read the first 5 lines of the written file"
      - |
        IF secondary_components exist:
          Note: "This work also affects: {secondary_components}"
          Suggest: "Consider creating additional changelogs for: {list}"
    outputs:
      - output_path: "Full path to created changelog file"
      - file_verified: "true/false"
    validation: file_written

  step_7_publish_release:
    purpose: Create an annotated git tag and GitHub release, only when publish_release was explicitly set to true (never a silent default)
    activities:
      - |
        IF publish_release != true:
          Set release_published = false, release_tag = null, release_url = null
          Set release_published_display = "Not requested"
          Skip the remaining activities in this step and continue to step_8_save_context
      - |
        IF publish_release == true AND changelog_mode == nested:
          PAUSE - nested changelog_mode has no single repo-wide version to tag
          Report: "Publish Release requested but changelog_mode is nested -- a release tag needs one repo-wide version. Skipping release; the changelog file is already written."
          Set release_published = false
          Set release_published_display = "No -- nested changelog_mode has no repo-wide version to tag"
          Continue to step_8_save_context
      - "Derive release_tag: \"v{next_version}\" -- the same version already written to {output_path}"
      - "Check for tag collision: run `git tag --list {release_tag}`. IF the tag already exists -> PAUSE, report the conflict, do not overwrite it, set release_published = false, set release_published_display = \"No -- tag {release_tag} already exists\""
      - "Verify `gh` CLI is available and authenticated: run `gh auth status`. IF unavailable/unauthenticated -> PAUSE, report, set release_published = false, set release_published_display = \"No -- gh CLI unavailable or unauthenticated\""
      - "Check working tree state: run `git status --porcelain -- {output_path}`. IF uncommitted, log a warning that the tag was created on a HEAD that may not include the just-written changelog file (autonomous mode never auto-commits)"
      - |
        Prepare the release notes body from {output_path}:
          IF the file opens with a YAML frontmatter block (first line is "---"):
            Strip it through its closing "---" line, plus any blank lines after it
          IF the next line starts with "# " (the editorial title H1):
            Strip that line and any immediately following blank lines
          IF anything was stripped:
            Write the remainder to a temp notes file (e.g., /tmp/release-notes-{release_tag}.md)
          ELSE:
            Use {output_path} directly as the notes file
      - "Run: git tag -a {release_tag} -m \"{release_tag}: {summary_first_sentence}\""
      - "Run: git push origin {release_tag}"
      - "Run: gh release create {release_tag} --title \"{release_tag} -- {primary_component}\" --notes-file {notes_file_path}"
      - "Capture the release URL returned by gh release create"
      - |
        ON success:
          Set release_published = true
          Set release_published_display = "Yes -- {release_tag} ({release_url})"
    outputs:
      - release_published: "true/false"
      - release_tag: "The tag name created (e.g., v2.1.0.0) or null"
      - release_url: "GitHub release URL returned by gh release create, or null"
      - release_published_display: "Human-readable summary for the completion report"
    validation: release_decision_recorded

  step_8_save_context:
    purpose: Report completion and preserve context
    activities:
      - "Display completion report (see completion_report section)"
      - |
        IF spec_path exists (from Setup Phase or spec_folder source):
          Note: "Context should be saved to spec folder"
          Suggest: "/speckit:save {spec_path}"
    outputs:
      - status: "OK or FAIL"
      - changelog_path: "Path to created file"
    validation: context_saved

# ─────────────────────────────────────────────────────────────────
# CIRCUIT BREAKER
# ─────────────────────────────────────────────────────────────────
circuit_breaker:
  enabled: true
  thresholds:
    failures: 3
    recovery_s: 60
    success_to_close: 1
  states:
    CLOSED: "normal operation"
    OPEN: "skip optional steps, complete with warnings"
    HALF_OPEN: "test single operation"

# ─────────────────────────────────────────────────────────────────
# QUALITY STANDARDS
# ─────────────────────────────────────────────────────────────────
quality_standards:
  format_compliance:
    minimum: "All required sections present"
    enforcement: "Step 5 validates before Step 6 writes"
  version_integrity:
    minimum: "Sequential, no duplicates"
    enforcement: "Step 3 validates before Step 4 generates"
  content_quality:
    minimum: "Summary narrative + at-a-glance + upgrade notes"
    enforcement: "Step 5 verifies non-empty content sections"

# ─────────────────────────────────────────────────────────────────
# AUTONOMOUS EXECUTION
# ─────────────────────────────────────────────────────────────────
autonomous_execution:
  principle: "Execute all steps without user approval gates"
  self_validation: "Verify outputs at each step before proceeding"
  error_handling: "Auto-fix where possible, escalate on hard failures"
  pause_conditions:
    - "Confidence drops below 40%"
    - "Component resolution ambiguous (multiple equally likely)"
    - "Version calculation produces unexpected result"
    - "Generated content has empty required sections"
    - "publish_release=true but changelog_mode=nested (no single repo-wide version to tag)"
    - "publish_release=true but the derived release_tag already exists (would overwrite)"
    - "publish_release=true but `gh` CLI is unavailable or unauthenticated"

# ─────────────────────────────────────────────────────────────────
# COMPLETION REPORT
# ─────────────────────────────────────────────────────────────────
completion_report:
  template: |
    Changelog Created

    Component: {primary_component}
    Version: {next_version} ({bump_type_used} bump)
    File: {output_path}

    Summary: {summary_first_sentence}

    Sections: {section_count}
    Release Published: {release_published_display}

    STATUS=OK PATH={output_path}

  on_failure: |
    Changelog Creation Failed

    Error: {error_description}
    Step: {failed_step}
    Component: {primary_component} (if resolved)

    STATUS=FAIL ERROR="{error_message}"

# ─────────────────────────────────────────────────────────────────
# ERROR RECOVERY
# ─────────────────────────────────────────────────────────────────
error_recovery:
  no_spec_artifacts:
    action: "Fall back to git history analysis"
    fallback: "If no git history either, prompt user for manual input"

  component_ambiguous:
    action: "Use highest file-count component as primary"
    fallback: "Pause and ask the user which component this changelog belongs to"

  version_conflict:
    action: "Increment BUILD segment until unique"
    fallback: "Ask user for manual version"

  empty_content:
    action: "Generate minimal changelog from available data"
    fallback: "Prompt user to provide summary and at-a-glance bullets"

  write_failure:
    action: "Check permissions, retry once"
    fallback: "Display content for manual save"

  release_publish_failure:
    action: "Check tag collision (git tag --list), gh auth status, and network; report the exact failing command"
    fallback: "Changelog file remains written; report release_published=false and let the user retry publish manually"

# ─────────────────────────────────────────────────────────────────
# TERMINATION
# ─────────────────────────────────────────────────────────────────
termination:
  after_step: 8
  message: "Changelog creation workflow complete."
  next_steps:
    - "Review the generated changelog at {output_path}"
    - "Create additional changelogs for secondary components if needed"
    - "Run /speckit:save to preserve context"

# ─────────────────────────────────────────────────────────────────
# RULES
# ─────────────────────────────────────────────────────────────────
rules:
  ALWAYS:
    - "Follow the 8-step workflow in sequence"
    - "Validate version is sequential before writing"
    - "Match the narrative changelog format defined in the shared template"
    - "Include the required narrative sections: summary, at-a-glance, upgrade notes (plus Why This Release and topical sections in expanded format)"
    - "Use the component mapping table for resolution"
    - "Report STATUS=OK or STATUS=FAIL at completion"

  NEVER:
    - "Never skip version validation (Step 3)"
    - "Never write a changelog with an empty summary or empty at-a-glance section"
    - "Never overwrite an existing changelog file"
    - "Never guess component folder without file path analysis"
    - "Never use a version number that already exists"
    - "Never create changelog folders that don't already exist"
    - "Never publish a release (tag or GitHub release) unless publish_release was explicitly set to true via --release flag or explicit PRE-BOUND SETUP marker, never via a silent default"
    - "Never overwrite or re-tag an existing release tag"
