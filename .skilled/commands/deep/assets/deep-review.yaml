# ────────
# DEEP REVIEW: DEEP REVIEW LOOP (AUTO AND CONFIRM MODES)
# ────────
# DEEP REVIEW: DEEP REVIEW LOOP (AUTO AND CONFIRM MODES)
# ────────
role: Deep Review Loop Manager
purpose: Iterative code/spec review with convergence detection across review dimensions
action: Run deep-review loop from initialization through synthesis
operating_mode:
  workflow: iterative_loop
  workflow_compliance: MANDATORY
  workflow_execution: autonomous
  approvals: none
  tracking: progressive_review_state
  validation: convergence_detection

# ────────
# OPERATING PRINCIPLES
# ────────
operating_principles:
  core: "Fresh context per iteration + externalized state = no context degradation"
  approach: "Dispatch focused review agent per dimension, evaluate convergence, repeat or stop"
  mandate: "Never hold findings in memory; write everything to files. Review target is READ-ONLY."

# ────────
# EXECUTION MODE
# ────────
execution_mode:
  source: "$ARGUMENTS"
  values: [auto, confirm]
  default: confirm
  rule: "Every step, executor branch and flag in this file runs in both modes. Under confirm, also execute every block marked applies_to: confirm at the place that carries it, and apply the mode_overrides.confirm wording. Under auto, skip every block marked applies_to: confirm and keep the autonomous wording of this file."
mode_overrides:
  confirm:
    purpose: "Iterative code/spec review with convergence detection and user approval gates"
    action: "Run deep-review loop with user confirmation at each phase transition"
    workflow_execution: "interactive"
    approvals: "multi_gate"
    approach: "Dispatch focused review agent per dimension, show results, get approval, repeat or stop"
    mandate: "Never hold findings in memory; write everything to files. Pause for user at each gate. Review target is READ-ONLY."
    phase_loop_purpose: "Dispatch review agent iterations with approval at each step"
    lock_not_acquired: "If acquired=false, stop and present recovery choices: another deep-review run already holds this packet."
    agent_dispatch_timeout: "Retry once with reduced scope. If second timeout, mark as 'timeout' and show to user for decision."
    continuity_save_failure: "Preserve the review packet in review/ as backup. Inform user."
    rules_always: [pause_at_approval_gates, present_clear_options_at_each_gate]
    rules_never: [proceed_past_approval_gate_without_user_response, auto_approve_on_behalf_of_user]

# ────────
# USER INPUTS (from setup phase)
# ────────
user_inputs:
  review_target: "[REVIEW_TARGET] - What to review. REQUIRED."
  review_target_type: "[spec-folder|skill|agent|track|files] - Target type for scope derivation. REQUIRED."
  review_dimensions: "[all|correctness,security,traceability,maintainability|custom names] - Dimensions to check. The four canonical dimensions are correctness, security, traceability and maintainability; any other name is a custom dimension, reviewed after the canonical four in configured order. Default: all."
  review_focus: "[optional free text] - Operator review focus that every iteration covers in addition to its dimension. Default: empty, which leaves the prompt unchanged."
  spec_folder: "[SPEC_FOLDER] - Spec folder path for state files. REQUIRED."
  session_id: "[SESSION_ID] - Optional caller-supplied session id for fan-out lineages. Default: timestamp."
  lineage_mode: "[auto|resume|restart|completed-continue] - Session lifecycle intent. Default: auto. The runtime persists lineage events for `resume` (same sessionId, no archive), `restart` (new sessionId, generation+1, prior review/ archived) and `completed-continue` (from --extend=N: a completed run extended in place by N iterations, same sessionId and generation). `fork` is not accepted. See deep-review/references/protocol/loop-protocol.md §Lifecycle Branches."
  extend: "[EXTEND] - Positive integer N from --extend=N. Sets lineage_mode to completed-continue and adds N iterations to a completed run. Default: unset."
  extend_minutes: "[EXTEND_MINUTES] - Positive integer M from --extend-minutes=M, the minutes added to the duration budget on an extension. Only valid with --extend. Default: unset, which adds the prior maxDurationMinutes."
  max_iterations: 7
  convergence_threshold: 0.10
  convergence_mode: "[default|off|sliding-window|divergent] - Convergence policy modifier. Default: default."
  depth_mode: "[default|expansive] - Opt-in frontier growth. expansive seeds depth-1 sub-target nodes, admits leaf frontier_proposal rows and vetoes a review stop candidate while nodes stay open. Default: default."
  stop_policy: "[convergence|max-iterations] - Stop behavior. Default: convergence. max-iterations treats convergence as telemetry until the hard iteration ceiling."
  dry_run: "[DRY_RUN] - Boolean pre-flight flag. Default: false."
  lineage_timeout_hours: "[LINEAGE_TIMEOUT_HOURS] - Optional per-lineage wall-clock ceiling in hours for fan-out runs, at most 4. Default: unset, which keeps the 4 hour ceiling."
  config.fanout_lineage_artifact_dir: "[optional internal path] - Fan-out lineage artifact override for command-owned single-lineage execution."

# ────────
# DRY-RUN CONTROL
# ────────
dry_run_control:
  enabled_when: "dry_run == true"
  default: false
  modes: [auto, confirm]
  purpose: "Run safe setup and read-only inspection, then stop before side effects."
  safe_operations:
    - "Resolve setup inputs and artifact roots."
    - "Read current state, strategy, focus, and convergence signals."
    - "Render the next prompt to terminal preview without writing prompt files."
  forbidden_operations:
    - "Executor dispatch."
    - "Persistent state, queue, lock, git index, memory, or graph mutation."
    - "Reducer refresh or generated artifact writes."
    - "Child-lineage spawn."
  event_policy:
    event_name: dry_run_halt
    sink: "terminal JSONL preview only; never append to {state_paths.state_log}"
    required_fields: [type, event, mode, boundary, step, timestamp]
    optional_fields: [run, sessionId, generation, detail]
    default_halt_event: '{"type":"event","event":"dry_run_halt","mode":"review","boundary":"{dry_run_boundary}","step":"{step_name}","timestamp":"{ISO_8601_NOW}"}'
    preview_only: "A step or branch marked dry_run_event_policy: preview-only still runs its read and classify work. It prints the event it would append as a terminal JSONL preview line and appends nothing."
  halt_hook_rule: "Before executing any command, dispatch, edit, output, template write, append_to_jsonl, append_jsonl, log_event, mcp_tool, write, or git-index mutation in a step tagged with dry_run_boundary, emit event_policy.default_halt_event with that step's name and boundary to the terminal and halt. This holds in both execution modes."
  boundary_labels:
    child_spawn: "child-spawn"
    state_mutation: "state-mutation"
    dispatch: "dispatch"
    reducer_refresh: "reducer-refresh"

# ────────
# CONTEXT LOADING
# ────────
context_loading:
  trigger: "At workflow START, before phase_init"
  purpose: "Load prior review context for the target and buffer it until strategy.md exists"
  retrieval:
    mechanism: "continuity-ladder-then-ripgrep"
    note: "File reads only. Nothing here needs a running daemon, and every step is reproducible by hand."
    ladder:
      - "{spec_folder}/handover.md when present"
      - "the _memory.continuity frontmatter block in {spec_folder}/implementation-summary.md"
      - "the packet's canonical spec docs, spec.md and decision-record.md, for what the first two steps leave open"
    free_text_recipe: "rg --no-config --json --fixed-strings --ignore-case -C 2 --glob '*.md' --glob '!**/z_archive/**' --glob '!**/node_modules/**' -- '{review_target}' specs .skilled"
    recipe_contract: ".skilled/skills/system-spec-kit/references/retrieval/retrieval-conventions.md"
    exit_status: "0 is a hit set, 1 is a clean no-hit, 2 or higher is a failure that must be surfaced instead of reported as no-hit"
    ranking: "Ripgrep does not rank. Order the hits caller-side with the tuple in retrieval-conventions.md section 5."
  when_to_skip: ["User says 'skip context' or 'fresh start'"]
  behavior:
    if_context_found: "Store full results as prior_context plus a concise prior_context_summary; inject after strategy.md is created."
    if_no_context: "Set prior_context and prior_context_summary to 'None' and continue."

# ────────
# SKILL REFERENCE
# ────────
skill_reference:
  skill: system-deep-loop
  skill_md: .skilled/skills/system-deep-loop/deep-review/SKILL.md
  references:
    loop_protocol: .skilled/skills/system-deep-loop/deep-review/references/protocol/loop-protocol.md
    state_format: .skilled/skills/system-deep-loop/deep-review/references/state/state-format.md
    convergence: .skilled/skills/system-deep-loop/deep-review/references/convergence/convergence.md
  templates:
    config: .skilled/skills/system-deep-loop/deep-review/assets/deep-review-config.json
    strategy: .skilled/skills/system-deep-loop/deep-review/assets/deep-review-strategy.md

# ────────
# AGENT CONFIGURATION
# ────────
agent_config:
  agent: deep-review
  agent_file: ".skilled/agents/deep-review.md"
  # Canonical path. Runtime-specific directories (e.g. .claude/agents/) reference this source.
  mode: subagent
  model: opus
  leaf_only: true
  tools: [Read, Write, Edit, Bash, Grep, Glob]
  mcp_servers: []

# ────────
# STATE FILE PATHS
# ────────
# ────────
# CANONICAL STATE WRITE MECHANISM
# ────────
state_write_protocol:
  mechanism: "append-gateway"
  command: "node .skilled/skills/system-deep-loop/runtime/scripts/append-mode-event.cjs --mode review --run-directory {artifact_dir} --event-json <record file>"
  applies_to: "every append_to_jsonl and append_jsonl directive in this workflow"
  refusal_handling: "halt on exit 2; never fall back to a direct file write. Exit 1 on a row that is still routed through the gateway is a workflow defect and halts; the pinned_bookkeeping rows are recorded through bookkeeping_log and are never routed."
  pinned_bookkeeping:
    events: [config_warning, lock_released, pivot_confirm_accepted, manualStop, pivot_override_accepted, maxDurationReached]
    directive: "bookkeeping_log"
    handling: "These rows are workflow bookkeeping that the review ledger schema pins to the legacy path: they have no lossless review-event target, so the gateway would refuse them with exit 1 and write nothing. They are never sent to the gateway. The step prints the row in its log line and continues; none of them is a halt condition."
  contract: |
    The directives below specify WHAT to record; this block specifies the mechanism. The gateway
    authorizes the write against the mode's durable authority record, serialises it behind the
    ledger fence, returns a receipt, and refreshes state_log from the ledger. Exit 0 means the
    record is durable in the ledger and the refreshed state_log carries it. Exit 2 means it was
    refused, and the refusal names the check that failed.

    Writing state_log directly bypasses ordering, authorization, and the receipt. Two writers
    can then interleave with no shared ordering, and a record nobody authorized carries no
    receipt, so a later reader cannot tell an accepted record from an invented one. A refusal
    is a halt, never a reason to write the file directly.

    There is no direct-append exception. state_log is a projection the gateway rebuilds from
    the ledger, so a row written beside it is dropped by the next refresh: the migration
    marker, the recovery baseline, the iteration-error row and the claim-adjudication gate
    row are canonical ledger events like every other record.

state_paths:
  # Template paths document the canonical packet layout. Runtime resolution happens via
  # step_resolve_artifact_root plus the shared resolver, so root specs keep
  # root-local review/ and child phases keep local review/ packet dirs.
  # Canonical root-spec write targets remain review/deep-review-config.json,
  # review/deep-review-state.jsonl, and review/deep-review-findings-registry.json.
  packet_dir: "{artifact_dir}"
  local_packet_dir: "{spec_folder}/review"
  legacy_root_report: "{spec_folder}/review-report.md"
  config: "{artifact_dir}/deep-review-config.json"
  state_log: "{artifact_dir}/deep-review-state.jsonl"
  findings_registry: "{artifact_dir}/deep-review-findings-registry.json"
  strategy: "{artifact_dir}/deep-review-strategy.md"
  dashboard: "{artifact_dir}/deep-review-dashboard.md"
  pause_sentinel: "{artifact_dir}/.deep-review-pause"
  lock_file: "{artifact_dir}/.deep-review.lock"
  prompt_dir: "{artifact_dir}/prompts"
  iteration_dir: "{artifact_dir}/iterations"
  iteration_pattern: "{artifact_dir}/iterations/iteration-{NNN}.md"
  # Per-iteration structured delta stream — complement to the canonical state_log
  # append. MUST contain at least one record with `type === "iteration"`; variants
  # like `"iteration_delta"` are silently dropped by the reducer.
  delta_dir: "{artifact_dir}/deltas"
  delta_pattern: "{artifact_dir}/deltas/iter-{NNN}.jsonl"
  review_output: "{artifact_dir}/review-report.md"
  resource_map_output: "{artifact_dir}/resource-map.md"
  archive_root: "{artifact_archive_root}"

# ────────
# WORKFLOW
# ────────

gate_defaults:
  after_gate_refresh_lock:
    action: "Refresh the packet lock heartbeat immediately after the operator response"
    command: "node .skilled/skills/system-deep-loop/runtime/scripts/loop-lock.cjs refresh --lock-path {state_paths.lock_file} --owner-pid {captured_owner_pid} --nonce {captured_acquire_nonce}"
    on_refresh: "If the refresh output has refreshed:false, fail closed: lost the packet lock. This run no longer holds the packet, so run step_release_lock and stop rather than continue without it."

workflow:

  step_resolve_artifact_root:
    description: "Resolve artifact directory — use fan-out lineage override when provided, else resolve from spec_folder"
    note: "Root specs keep review artifacts directly in {spec_folder}/review/. Child phases and sub-phases keep local packet directories in {spec_folder}/review/{packet}/, and archives stay local at {spec_folder}/review-archive/{packet}/."
    branch_on: "config.fanout_lineage_artifact_dir"
    if_present:
      bind:
        artifact_dir: "{config.fanout_lineage_artifact_dir}"
        artifact_root_dir: "{config.fanout_lineage_artifact_dir}"
        artifact_subfolder: null
        artifact_archive_root: "{config.fanout_lineage_artifact_dir}/_archive"
    if_absent:
      command: "node -e \"const { resolveArtifactRoot } = require('./.skilled/skills/system-spec-kit/shared/review-research-paths.cjs'); console.log(JSON.stringify(resolveArtifactRoot('{spec_folder}', 'review')));\""
      outputs:
        - artifact_root_dir: "Resolved local review owner directory"
        - artifact_subfolder: "Local packet subfolder ({ownerSlug}-pt-{NN}), else null"
        - artifact_dir: "Resolved review packet directory for this target"
        - artifact_archive_root: "Resolved local review archive directory for this target"

  step_bind_reducer_artifact_arg:
    description: "Keep the reducer on the lineage-owned artifact directory during fan-out"
    branch_on: "config.fanout_lineage_artifact_dir"
    if_present:
      bind:
        reducer_artifact_arg: "--artifact-dir {artifact_dir}"
    if_absent:
      bind:
        reducer_artifact_arg: ""

  step_apply_lifecycle_request:
    description: "Honor an explicit restart request before fan-out or normal initialization"
    dry_run_boundary: "state-mutation"
    skip_when: "lineage_mode != 'restart'"
    instructions: |
      Run this step in both execution modes, immediately after artifact resolution
      and before fan-out, so old packet files cannot be merged with fresh lineage
      outputs. A restart request must never fall back to resume. The explicit
      restart flag is operator authorization to archive the resolved review packet,
      so do not ask for a second confirmation. Rollback is to move the timestamped
      archive back to the packet directory.
    bind_prior_lineage:
      action: "Read the session id and generation of the packet that is about to be archived"
      command: |
        node -e '
          const fs = require("fs");
          const crypto = require("crypto");
          let priorSessionId = null;
          let priorGeneration = 0;
          try {
            const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const lineage = config.lineage || config;
            priorSessionId = typeof lineage.sessionId === "string" ? lineage.sessionId : null;
            priorGeneration = Number(lineage.generation) || 0;
          } catch (error) {
            if (error.code !== "ENOENT") {
              console.error("The old config cannot be read: " + error.message);
              process.exit(1);
            }
          }
          let priorTailDigest = crypto.createHash("sha256").update("").digest("hex");
          try {
            priorTailDigest = crypto.createHash("sha256").update(fs.readFileSync(process.argv[2])).digest("hex");
          } catch (error) {
            if (error.code !== "ENOENT") throw error;
          }
          console.log(JSON.stringify({ priorSessionId, priorGeneration, priorTailDigest }));
        ' "{state_paths.config}" "{state_paths.state_log}"
      outputs:
        - prior_session_id: "priorSessionId from the JSON output, null when no old config exists"
        - prior_generation: "priorGeneration from the JSON output, 0 when no old config exists"
        - prior_tail_digest: "priorTailDigest from the JSON output: the sha256 of the old state log bytes, or of zero bytes when no old state log exists"
      on_fail: "Halt with STATUS=FAIL. The old config is unreadable, so repair or archive the packet by hand."
    command: |
      if [ -e "{state_paths.archive_root}/{timestamp_slug}" ]; then
        echo "The archive folder {state_paths.archive_root}/{timestamp_slug} is already there." >&2
        exit 1
      fi
      if [ -d "{state_paths.packet_dir}" ]; then
        mkdir -p "{state_paths.archive_root}" && mv "{state_paths.packet_dir}" "{state_paths.archive_root}/{timestamp_slug}" || exit 1
      fi
      mkdir -p "{state_paths.packet_dir}"
    outputs:
      - archived_path: "{state_paths.archive_root}/{timestamp_slug} when a prior packet existed, else null"
      - lineage_mode: "restart"
    on_fail: "Halt with STATUS=FAIL; do not continue as resume or auto."

  step_reject_extend_with_fanout:
    description: "Refuse --extend on a fan-out config before any lineage spawns"
    skip_when: "lineage_mode != 'completed-continue' or config.fanout is absent"
    instructions: |
      A fan-out run jumps from step_fanout_spawn to phase_synthesis and never
      reaches the lock, the pre-classify extension step or the classifier, so an
      extension there would change nothing and report no error. Refuse the
      combination here, before step_fanout_spawn, so no lineage spawns.
    halt: true
    status: "FAIL"
    message: "Usage error (extend-with-fanout): --extend extends a single-executor review run only. This config has fanout executors, so nothing was spawned and the run is unchanged."

  step_frontier_seed:
    description: "Seed the depth-1 review frontier before any fan-out lineage spawns"
    enabled_when: "depth_mode == 'expansive'"
    skip_when: "config.fanout is absent"
    dry_run_boundary: "state-mutation"
    instructions: |
      Fan-out jumps from step_fanout_spawn to phase_synthesis and never reaches
      phase_init, so the seed runs here or not at all. fanout-run.cjs then splits
      the seeded depth-1 nodes round-robin across the lineages.
      Decompose {review_target} into 3 to 8 depth-1 sub-targets that together
      cover it: subsystems, directories or commit batches. For a commit-range
      target, record the range end SHA as the pilot SHA in this step's log, mark
      a merge commit with no diff of its own as
      {"pruneReason":"merge-no-own-diff"} and a generated index rebuild as
      {"pruneReason":"generated-artifact"}. Write them as a JSON array to
      {artifact_dir}/frontier-seed.json, one object per sub-target:
      {"question": "what to review in it", "scope": "<paths inside the review
      target>", "evidence": "<path or commit that grounds it>"}. Then run the
      command. frontier-admit.cjs is the only writer of the node store; never
      write that file by hand, and never queue or hand-expand the admitted nodes
      yourself.
    command: 'node .skilled/skills/system-deep-loop/runtime/scripts/frontier-admit.cjs seed --target review --artifact-dir "{artifact_dir}" --iteration 0 --input "{artifact_dir}/frontier-seed.json"'
    working_directory: "{repo_root}"
    outputs:
      - frontier_seed_json: "The JSON line the command prints: admitted node ids and pruned {nodeId, reason} rows"
    on_failure: "Halt with the command's stderr line. A run that asked for expansive depth must not start without its seeded frontier."

  step_fanout_spawn:
    description: "Spawn fan-out lineages; skip and proceed to phase_init normally when single-executor"
    dry_run_boundary: "child-spawn"
    skip_when: "config.fanout is absent"
    instructions: |
      Fan-out mode is active. Spawn all lineages. Each lineage runs the full loop in its own
      isolated sub-packet under {artifact_dir}/lineages/{label}/.
      This step runs before phase_init, so pass the raw review_focus. fanout-run.cjs
      normalizes it and hands every lineage the same single-line text. Escape any double
      quote, backslash, dollar sign or backtick in it for the shell, and pass an empty
      string when no focus was given.
      A cli-opencode lineage inside this fan-out is an explicit parallel-detached OpenCode
      session with a separate lineage directory and session id; it is not the single-executor
      self-invocation path. fanout-run.cjs owns the stack-only recursion guard for that
      first-level detached lineage and still blocks recursive same-kind dispatch from inside it.
      fanout-run.cjs owns native and CLI lineage execution; native is run through the
      deep/review command surface with config.fanout_lineage_artifact_dir so the LEAF
      deep-review agent is used only for individual iterations, never as a full-loop
      sub-agent or pasted phase-running prompt.
      After all lineages complete, jump directly to phase_synthesis — skip phase_init and
      phase_main_loop entirely (those are the single-executor path). The merge step in
      phase_synthesis will consolidate results across all lineages.
    sub_steps:
      step_fanout_spawn_cli:
        description: "Spawn all native and CLI lineages in capped worker pool"
        skip_when: "no entries in config.fanout.executors"
        command: |
          node .skilled/skills/system-deep-loop/runtime/scripts/fanout-run.cjs \
            --spec-folder {spec_folder} \
            --loop-type review \
            --review-focus "{review_focus}" \
            --review-target "{review_target}" \
            --review-target-type {review_target_type} \
            --fanout-config-json '{config.fanout_json}' \
            --base-artifact-dir {artifact_dir} \
            --convergence-threshold {convergence_threshold} \
            --stop-policy {stop_policy} \
            --convergence-mode {convergence_mode} \
            --depth-mode {depth_mode}
        working_directory: "{repo_root}"
        wait_for_completion: true
        optional_flags: "When lineage_timeout_hours is bound, append `--lineage-timeout-hours {lineage_timeout_hours}` to the command. When it is unset, append nothing, which keeps the 4 hour ceiling."

  # ════════
  # PHASE 1: INITIALIZATION
  # ════════
  phase_init:
    purpose: Create all state files for the review session and resolve review scope
    steps:

      step_preflight_contract:
        action: "Validate required setup bindings and executable workflow contract before any file writes"
        verify:
          - required_values_present: [review_target, review_target_type, review_dimensions, spec_folder, lineage_mode, max_iterations, convergence_threshold, convergence_mode, depth_mode, stop_policy]
          - dry_run_normalized: "Boolean true or false before workflow loading; absent flag resolves to false."
          - spec_folder_is_within: "specs/ or .opencode/specs/ (canonicalize alias roots before validation)"
          - unresolved_placeholders: "FAIL if any user-facing template references placeholders not produced by earlier steps"
          - tool_contract: "FAIL if executable steps reference tools outside the command allowlist"
          - extend_values: "When extend is bound it must be a positive integer (digits only, no sign, at least 1), and extend_minutes when bound likewise. extend_minutes without extend, or extend with a lineage_mode other than auto or completed-continue, is a usage error. Each fails here, before step_acquire_lock, with a usage error that names the flag."
        on_fail: "Halt with STATUS=FAIL and report the missing binding or unsupported contract reference"

      step_create_directories:
        action: "Create spec folder and canonical review packet directories if they don't exist"
        dry_run_boundary: "state-mutation"
        command: "mkdir -p {state_paths.prompt_dir} {state_paths.iteration_dir} {state_paths.delta_dir}"

      step_detect_resource_map:
        action: "Detect resource-map.md before config creation so init can persist coverage-gate state"
        inspect:
          - "{spec_folder}/resource-map.md"
        classify:
          present: "resource-map.md exists at init"
          absent: "resource-map.md does not exist at init"
        outputs:
          - resource_map_present: "Boolean true when {spec_folder}/resource-map.md exists, else false"
          - resource_map_known_context: "When present: concise resource-map snapshot for Known Context and charter framing. When absent: 'resource-map.md not present; skipping coverage gate'."

      step_migrate_legacy_review_state:
        action: "Rehome legacy review artifacts into review/iterations before session classification"
        dry_run_boundary: "state-mutation"
        detect:
          canonical_review_state:
            - "{state_paths.config}"
            - "{state_paths.state_log}"
            - "{state_paths.findings_registry}"
            - "{state_paths.strategy}"
          legacy_review_state:
            - "{spec_folder}/scratch/deep-research-config.json"
            - "{spec_folder}/scratch/deep-research-state.jsonl"
            - "{spec_folder}/scratch/deep-review-strategy.md"
            - "{spec_folder}/scratch/deep-review-dashboard.md"
            - "{spec_folder}/scratch/iteration-*.md"
            - "{spec_folder}/scratch/.deep-research-pause"
            - "{state_paths.local_packet_dir}/iteration-*.md"
            - "{state_paths.legacy_root_report}"
          legacy_review_markers:
            - "scratch/deep-review-strategy.md exists"
            - "scratch/deep-research-config.json declares mode == 'review' OR scratch/deep-research-state.jsonl contains mode == 'review'"
        migrate_only:
          - "{spec_folder}/scratch/deep-research-config.json -> {state_paths.config}"
          - "{spec_folder}/scratch/deep-research-state.jsonl -> {state_paths.state_log}"
          - "{spec_folder}/scratch/deep-review-strategy.md -> {state_paths.strategy}"
          - "{spec_folder}/scratch/deep-review-dashboard.md -> {state_paths.dashboard}"
          - "{spec_folder}/scratch/iteration-*.md -> {state_paths.iteration_dir}/"
          - "{spec_folder}/scratch/.deep-research-pause -> {state_paths.pause_sentinel}"
          - "{state_paths.local_packet_dir}/iteration-*.md -> {state_paths.iteration_dir}/"
          - "{state_paths.legacy_root_report} -> {state_paths.review_output}"
        on_canonical_present: "Leave canonical review/ state untouched and do not overwrite it with legacy scratch artifacts."
        on_legacy_detected: "Move only the review-specific whitelist, print LEGACY_REVIEW_STATE_MOVED and leave unrelated scratch files untouched. Nothing is appended here: an append before session classification would create the state log and turn a fresh packet into a partial one, and the moved state log was written without the ledger, so the gateway refuses every append to it until step_classify_session.on_moved_legacy_state adopts it."
        on_conflict: "If canonical review/ state and legacy scratch review state both exist but disagree, halt for operator repair instead of merging contradictory state."
        outputs:
          - legacy_migration_detected: "true when the command printed LEGACY_REVIEW_STATE_MOVED, else false"
          - migration_recorded: "false; step_record_artifact_migration sets it once the migration row is appended"
        command: |
          mkdir -p {state_paths.iteration_dir}
          if [ ! -e {state_paths.config} ] && [ ! -e {state_paths.state_log} ] && [ ! -e {state_paths.strategy} ] && [ -e {spec_folder}/scratch/deep-review-strategy.md ] && ( [ -e {spec_folder}/scratch/deep-research-config.json ] || [ -e {spec_folder}/scratch/deep-research-state.jsonl ] ); then
            [ -e {spec_folder}/scratch/deep-research-config.json ] && mv {spec_folder}/scratch/deep-research-config.json {state_paths.config}
            [ -e {spec_folder}/scratch/deep-research-state.jsonl ] && mv {spec_folder}/scratch/deep-research-state.jsonl {state_paths.state_log}
            [ -e {spec_folder}/scratch/deep-review-strategy.md ] && mv {spec_folder}/scratch/deep-review-strategy.md {state_paths.strategy}
            [ -e {spec_folder}/scratch/deep-review-dashboard.md ] && mv {spec_folder}/scratch/deep-review-dashboard.md {state_paths.dashboard}
            find {spec_folder}/scratch -maxdepth 1 -name 'iteration-*.md' -exec mv {} {state_paths.iteration_dir}/ \;
            [ -e {spec_folder}/scratch/.deep-research-pause ] && mv {spec_folder}/scratch/.deep-research-pause {state_paths.pause_sentinel}
            [ -e {state_paths.legacy_root_report} ] && mv {state_paths.legacy_root_report} {state_paths.review_output}
            echo "LEGACY_REVIEW_STATE_MOVED"
          fi
          find {state_paths.local_packet_dir} -maxdepth 1 -name 'iteration-*.md' -exec mv {} {state_paths.iteration_dir}/ \; 2>/dev/null || true

      step_acquire_lock:
        action: "Acquire the single-writer advisory lock before session classification"
        dry_run_boundary: "state-mutation"
        ttl_ms: "lock_ttl_ms = max(1800000, executor_timeout * 1000). executor_timeout is the bound dispatch timeout in seconds, 900 when unset. The lock is stale after twice this value, so it outlives the longest allowed dispatch."
        command: "node .skilled/skills/system-deep-loop/runtime/scripts/loop-lock.cjs acquire --lock-path {state_paths.lock_file} --packet-id {spec_folder} --ttl-ms {lock_ttl_ms}"
        on_acquire: "Capture lock.ownerPid as captured_owner_pid and lock.acquireNonce as captured_acquire_nonce from the JSON output, and reuse both for every release below. If acquired=false, fail closed — another deep-review run already holds this packet. Under confirm, mode_overrides.confirm.lock_not_acquired applies instead."
        note: "Uses the promoted runtime/ loop-lock CLI (single source of truth: stale-lock reclaim, clean owner-scoped release). macOS/BSD locking is advisory — best-effort single-writer, not a hard mutex across host calls. Acquire reclaims a stale lock itself and reports the old holder under `reclaimed`. A lock is stale when its heartbeat is older than twice its TTL, or when its owning process is known to be dead. No confirmation step exists in either mode: log a `reclaimed` holder and continue."
        # Lock-cleanup contract: the lock file MUST be released on every terminal exit path that follows acquisition.
        # Runtimes honoring step_acquire_lock are required to perform this cleanup before halting or pausing.
        on_halt:
          action: "Every terminal halt after the acquire runs step_release_lock before it returns control"
          command: "node .skilled/skills/system-deep-loop/runtime/scripts/loop-lock.cjs release --lock-path {state_paths.lock_file} --owner-pid {captured_owner_pid} --nonce {captured_acquire_nonce}; failures here are logged but do not block the halt"
        on_cancel:
          action: "Release the lock on user cancel or pause-sentinel detection before sentinel processing"
          command: "node .skilled/skills/system-deep-loop/runtime/scripts/loop-lock.cjs release --lock-path {state_paths.lock_file} --owner-pid {captured_owner_pid} --nonce {captured_acquire_nonce}; cancel completes regardless of cleanup result"
        on_workflow_exit:
          action: "Release the lock as the final step of any workflow exit path (success or failure)"
          command: "node .skilled/skills/system-deep-loop/runtime/scripts/loop-lock.cjs release --lock-path {state_paths.lock_file} --owner-pid {captured_owner_pid} --nonce {captured_acquire_nonce}; idempotent — safe to invoke when already released"

      step_extend_completed_run:
        action: "Extend a completed run in place, under the lock and before classification, so the classifier sees a resumable run"
        skip_when: "lineage_mode != 'completed-continue'"
        dry_run_boundary: "state-mutation"
        note: |
          --extend=N continues a finished run in the same session and generation. The
          duration clock counts wall-clock time since createdAt, idle time included, so the
          new budget starts from whichever is later, the old budget or the time already
          spent, and createdAt is never re-stamped. The event is appended before the
          config is replaced, so a failed append leaves the run complete and untouched.
        command: |
          GATEWAY=".skilled/skills/system-deep-loop/runtime/scripts/append-mode-event.cjs"
          [ -f "$GATEWAY" ] || GATEWAY="scripts/append-mode-event.cjs"
          WORK_DIR="$(mktemp -d "${TMPDIR:-/tmp}/deep-review-extend.XXXXXX")"
          node -e '
            const fs = require("fs"), crypto = require("crypto"), path = require("path");
            const [configPath, stateLogPath, extendRaw, extendMinutesRaw, workDir] = process.argv.slice(1);
            const fail = (message) => { console.error(message); process.exit(2); };
            const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
            // The preflight check refuses these first; this keeps a bad value from reaching the config.
            if (!/^[1-9][0-9]*$/.test(String(extendRaw))) {
              fail("--extend needs a positive integer, and got " + JSON.stringify(String(extendRaw)) + ".");
            }
            const minutesRaw = String(extendMinutesRaw);
            if (minutesRaw !== "" && !minutesRaw.startsWith("{") && !/^[1-9][0-9]*$/.test(minutesRaw)) {
              fail("--extend-minutes needs a positive integer, and got " + JSON.stringify(minutesRaw) + ".");
            }
            if (config.status !== "complete") {
              fail("--extend needs a completed run, and this run has status " + config.status + ". Use --lineage-mode=resume to continue an unfinished run.");
            }
            const stateBytes = fs.readFileSync(stateLogPath);
            const rows = stateBytes.toString("utf8").split("\n").filter(Boolean).flatMap((line) => {
              try { return [JSON.parse(line)]; } catch { return []; }
            });
            // One run per iteration number, error and timeout rows included. The integer
            // iteration counts first and a numeric run is the fallback, as the state reader
            // counts them, because a leaf may write its run id string in run.
            const continuedFromRun = new Set(rows
              .filter((row) => row && row.type === "iteration")
              .map((row) => (Number.isInteger(row.iteration) ? row.iteration : Number(row.run)))
              .filter((run) => Number.isInteger(run))).size;
            const addedIterations = Number(extendRaw);
            const priorMaxIterations = Number(config.maxIterations) || 0;
            const priorMaxDurationMinutes = Number(config.maxDurationMinutes) || 0;
            const createdMs = Date.parse(config.createdAt);
            const elapsedMinutesAtExtension = Number.isFinite(createdMs)
              ? Math.max(0, Math.floor((Date.now() - createdMs) / 60000))
              : 0;
            // An unset flag renders as an empty or unexpanded value, never as digits.
            const hasMinutes = /^[1-9][0-9]*$/.test(String(extendMinutesRaw));
            const addedMinutes = hasMinutes ? Number(extendMinutesRaw) : priorMaxDurationMinutes;
            // A run with no duration budget keeps none unless --extend-minutes asks for one.
            const newMaxDurationMinutes = priorMaxDurationMinutes > 0 || hasMinutes
              ? Math.max(priorMaxDurationMinutes, elapsedMinutesAtExtension) + addedMinutes
              : priorMaxDurationMinutes;
            const newMaxIterations = continuedFromRun + addedIterations;
            const sessionId = config.sessionId;
            const generation = Number(config.generation) || 1;
            const event = {
              stem: "deep_review.run_extended",
              scope: { runId: sessionId, sessionId, generation },
              data: {
                priorTailDigest: crypto.createHash("sha256").update(stateBytes).digest("hex"),
                continuedFromRun,
                extension: {
                  addedIterations,
                  priorMaxIterations,
                  newMaxIterations,
                  priorMaxDurationMinutes,
                  newMaxDurationMinutes,
                  elapsedMinutesAtExtension,
                },
              },
            };
            const next = {
              ...config,
              status: "initialized",
              maxIterations: newMaxIterations,
              maxDurationMinutes: newMaxDurationMinutes,
              lineageMode: "completed-continue",
              continuedFromRun,
            };
            fs.writeFileSync(path.join(workDir, "event.json"), JSON.stringify(event));
            fs.writeFileSync(path.join(workDir, "config.json"), JSON.stringify(next, null, 2) + "\n");
            // Config creation writes the stop policy at the top level, beside maxIterations.
            const stopPolicy = config.stopPolicy || "convergence";
            // Review has no question inbox, so under convergence an unchanged dimension set
            // can re-stop on all_dimensions_clean before the new budget is used.
            const warning = stopPolicy === "convergence"
              ? "This run stops on convergence, so it may re-stop on all_dimensions_clean right away. Pass --convergence-mode=off or use stopPolicy max-iterations to keep it running."
              : null;
            console.log(JSON.stringify({ continuedFromRun, newMaxIterations, newMaxDurationMinutes, warning }));
          ' "{state_paths.config}" "{state_paths.state_log}" "{extend}" "{extend_minutes}" "$WORK_DIR" > "$WORK_DIR/result.json" || { rm -rf "$WORK_DIR"; exit 2; }
          node "$GATEWAY" --mode review --run-directory "$(dirname "{state_paths.state_log}")" --event-json "$WORK_DIR/event.json" || { rm -rf "$WORK_DIR"; exit 1; }
          mv "$WORK_DIR/config.json" "{state_paths.config}" || { rm -rf "$WORK_DIR"; exit 1; }
          cat "$WORK_DIR/result.json"
          rm -rf "$WORK_DIR"
        outputs:
          - continued_from_run: "continuedFromRun from the JSON output"
          - max_iterations: "newMaxIterations from the JSON output; it replaces the command default so the loop cap and the convergence script read the same ceiling"
          - extension_pending: "true"
          - extension_warning: "warning from the JSON output, null when none"
        on_warning: "When extension_warning is not null, print it and continue. It never refuses the extension."
        on_fail: "Exit 2 is a usage error, such as a run that is not complete: halt with that message through step_release_lock and leave the config untouched. Any other failure halts with STATUS=FAIL through step_release_lock."

      step_snapshot_extended_review_report:
        action: "Keep the prior review report before the extension's first dispatch, so re-synthesis cannot overwrite it"
        skip_when: "extension_pending != true"
        dry_run_boundary: "state-mutation"
        command: |
          GENERATION="$(node -p 'const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); Number((c.lineage || c).generation) || 1' "{state_paths.config}")" || exit 1
          SNAPSHOT="{state_paths.packet_dir}/review-report-v${GENERATION}-r{continued_from_run}.md"
          if [ -e "$SNAPSHOT" ]; then
            echo "The review report snapshot $SNAPSHOT is already there." >&2
            exit 1
          fi
          if [ -f "{state_paths.review_output}" ]; then
            cp "{state_paths.review_output}" "$SNAPSHOT"
          fi
        note: "Keyed by generation and continuedFromRun, so a second extension of the same generation writes its own snapshot."
        on_fail: "Halt with STATUS=FAIL through step_release_lock. Never overwrite an existing snapshot."

      step_classify_session:
        action: "Classify the session before writing files"
        inspect:
          - "{state_paths.config}"
          - "{state_paths.state_log}"
          - "{state_paths.findings_registry}"
          - "{state_paths.strategy}"
        classify:
          fresh: "None of the three state artifacts exist"
          resume: "Config, JSONL, and strategy all exist and config.mode == 'review' and agree on target/spec folder"
          completed-session: "Resume artifacts exist and config.status == 'complete'"
          invalid-state: "Any partial, missing, or contradictory combination"
        extension_rule: "When extension_pending == true, step_extend_completed_run has just set status initialized and appended run_extended, so a synthesis_complete row followed by an extended row is consistent: classify as resume, never as invalid-state or completed-session."
        outputs:
          - session_state: "fresh | resume | completed-session | invalid-state"
          - prior_tail_digest: "sha256 of the state log bytes when resuming or restarting an existing lineage"
        lifecycle_routing:
          - "If lineage_mode == restart, step_apply_lifecycle_request archived the packet before the lock was taken, so session_state is fresh and on_fresh runs."
          - "If lineage_mode == auto or lineage_mode == resume, preserve the existing resume/completed/fresh behavior."
        on_resume:
          before_append: "Run on_moved_legacy_state first when it applies."
          log: "Auto-resume: state artifacts are complete and consistent. Continue the same lineage (sessionId unchanged, generation unchanged, no archive)."
          append_jsonl: '{"stem":"deep_review.run_resumed","scope":{"runId":"{session_id}","sessionId":"{session_id}","generation":{generation}},"data":{"priorTailDigest":"{prior_tail_digest}","sourceSessionId":"{session_id}","resumeReason":"Auto-resume: state artifacts are complete and consistent; continue the same lineage.","continuedFromRunId":"{session_id}-i{iteration_count}","compatibilityDecision":"exact","recoveryReceiptRef":"none"}}'
          extension_override: "When extension_pending == true, skip this append_jsonl: step_extend_completed_run already recorded the lifecycle action as run_extended, so the ledger carries one event per action. Keep lineage_mode completed-continue and skip_to phase_loop."
          skip_to: phase_loop
          confirm_choice:
            applies_to: confirm
            preempts: "Under confirm this block runs in place of the sibling log, append_jsonl and skip_to keys of on_resume. Under auto it is skipped and those keys run."
            show_dashboard: "{state_paths.dashboard}"
            ask: "Existing review session is consistent. Resume where it left off, or restart (archive the current review packet under the root-level review-archive/ tree and start a fresh session)?"
            after_gate_refresh_lock: gate_defaults.after_gate_refresh_lock
            options: [resume, restart, cancel]
            on_resume_choice:
              dry_run_boundary: "state-mutation"
              before_append: "Run on_moved_legacy_state first when it applies."
              set:
                lineage_mode: "resume"
                parent_session_id: "{session_id}"
              append_jsonl: '{"stem":"deep_review.run_resumed","scope":{"runId":"{session_id}","sessionId":"{session_id}","generation":{generation}},"data":{"priorTailDigest":"{prior_tail_digest}","sourceSessionId":"{session_id}","resumeReason":"Auto-resume: state artifacts are complete and consistent; continue the same lineage.","continuedFromRunId":"{session_id}-i{iteration_count}","compatibilityDecision":"exact","recoveryReceiptRef":"none"}}'
              skip_to: gate_init_approval
              extension_override: "When extension_pending == true, do not set lineage_mode to resume and do not append the resumed row, because run_extended already records this extension. Keep lineage_mode completed-continue and skip_to gate_init_approval."
            on_restart_choice:
              dry_run_boundary: "state-mutation"
              bind_prior_lineage:
                action: "Read the session id and generation of the packet that is about to be archived"
                command: |
                  node -e '
                    const fs = require("fs");
                    const crypto = require("crypto");
                    let priorSessionId = null;
                    let priorGeneration = 0;
                    try {
                      const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                      const lineage = config.lineage || config;
                      priorSessionId = typeof lineage.sessionId === "string" ? lineage.sessionId : null;
                      priorGeneration = Number(lineage.generation) || 0;
                    } catch (error) {
                      if (error.code !== "ENOENT") {
                        console.error("The old config cannot be read: " + error.message);
                        process.exit(1);
                      }
                    }
                    let priorTailDigest = crypto.createHash("sha256").update("").digest("hex");
                    try {
                      priorTailDigest = crypto.createHash("sha256").update(fs.readFileSync(process.argv[2])).digest("hex");
                    } catch (error) {
                      if (error.code !== "ENOENT") throw error;
                    }
                    console.log(JSON.stringify({ priorSessionId, priorGeneration, priorTailDigest }));
                  ' "{state_paths.config}" "{state_paths.state_log}"
                outputs:
                  - prior_session_id: "priorSessionId from the JSON output, null when no old config exists"
                  - prior_generation: "priorGeneration from the JSON output, 0 when no old config exists"
                  - prior_tail_digest: "priorTailDigest from the JSON output: the sha256 of the old state log bytes, or of zero bytes when no old state log exists"
                on_fail: "Halt with STATUS=FAIL through step_release_lock. The old config is unreadable, so repair or archive the packet by hand."
              command: |
                if [ -e "{state_paths.archive_root}/{timestamp_slug}" ]; then
                  echo "The archive folder {state_paths.archive_root}/{timestamp_slug} is already there." >&2
                  exit 1
                fi
                mkdir -p "{state_paths.archive_root}/{timestamp_slug}" || exit 1
                find "{state_paths.packet_dir}" -mindepth 1 -maxdepth 1 ! -name "$(basename "{state_paths.lock_file}")" -exec mv {} "{state_paths.archive_root}/{timestamp_slug}/" \; || exit 1
                mkdir -p "{state_paths.prompt_dir}" "{state_paths.iteration_dir}" "{state_paths.delta_dir}"
              on_fail: "Halt with STATUS=FAIL through step_release_lock. Never fall back to resume."
              set:
                lineage_mode: "restart"
              skip_to: step_create_config
            on_cancel_choice:
              halt: true
              release_lock: step_release_lock
              message: "Review session preserved. Manually archive or edit review/ before re-running."
        on_restart:
          action: "Nothing is archived here. step_apply_lifecycle_request archived the packet before the lock was taken, so a restart run reaches this step as fresh and continues as on_fresh."
        note_deferred_branches: "fork is deferred and not runtime-supported in this release."
        note_live_branches: "completed-continue is live through --extend=N: step_extend_completed_run reopens a completed run before classification, so it lands here as resume. The live modes are new, resume, restart and completed-continue. See deep-review/references/protocol/loop-protocol.md §Lifecycle Branches for the one-session contract."
        on_moved_legacy_state:
          applies_when: "legacy_migration_detected == true and the branch taken resumes the session or goes to synthesis; never on restart or cancel"
          order: "Runs after classification and before that branch appends anything, the resume event included."
          note: |
            The state log moved out of scratch/ was written by hand before the ledger existed, so the
            gateway refuses every append to it. Set it aside unchanged as deep-review-state.legacy.jsonl,
            open the run from the moved config, then replay its iteration rows through the gateway,
            which carries each one whole. Rows the gateway cannot carry stay only in the set-aside file,
            and the replay reports how many. Exit 2 from any of the three is a halt.
          set_aside_command: |
            STATE_LOG="{state_paths.state_log}"
            LEGACY_LOG="$(dirname "$STATE_LOG")/deep-review-state.legacy.jsonl"
            if [ -e "$LEGACY_LOG" ]; then
              echo "A set-aside legacy state log already exists at $LEGACY_LOG. Repair the packet by hand." >&2
              exit 1
            fi
            mv "$STATE_LOG" "$LEGACY_LOG"
          open_run: "Run step_create_state_log.command unchanged. With the hand-written log set aside, it opens the run from the moved config."
          replay_command: |
            GATEWAY=".skilled/skills/system-deep-loop/runtime/scripts/append-mode-event.cjs"
            [ -f "$GATEWAY" ] || GATEWAY="scripts/append-mode-event.cjs"
            RUN_DIR="$(dirname "{state_paths.state_log}")"
            node -e '
              const fs = require("fs"), os = require("os"), path = require("path");
              const { spawnSync } = require("child_process");
              const [gateway, legacyLog, runDir] = process.argv.slice(1);
              let replayedIterations = 0;
              let keptOnlyInLegacyLog = 0;
              for (const line of fs.readFileSync(legacyLog, "utf8").split("\n")) {
                if (line.trim() === "") continue;
                let row;
                try { row = JSON.parse(line); } catch { keptOnlyInLegacyLog += 1; continue; }
                // The run open already replaced the config row.
                if (row && row.type === "config") continue;
                if (!row || row.type !== "iteration") { keptOnlyInLegacyLog += 1; continue; }
                const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), "deep-review-replay-"));
                const eventFile = path.join(tempDir, "row.json");
                fs.writeFileSync(eventFile, JSON.stringify(row));
                const result = spawnSync(process.execPath, [gateway, "--mode", "review", "--run-directory", runDir, "--event-json", eventFile], { encoding: "utf8" });
                fs.rmSync(tempDir, { recursive: true, force: true });
                if (result.status === 2) { process.stdout.write(result.stdout || ""); process.exit(2); }
                if (result.status === 0) replayedIterations += 1; else keptOnlyInLegacyLog += 1;
              }
              process.stdout.write(JSON.stringify({ replayedIterations, keptOnlyInLegacyLog, legacyLog }) + "\n");
            ' "$GATEWAY" "$RUN_DIR/deep-review-state.legacy.jsonl" "$RUN_DIR"
        on_completed_session:
          before_append: "Run on_moved_legacy_state first when it applies."
          log: "Prior session already completed. Either archive the completed review/ tree and start a fresh session, or jump straight to synthesis with the existing artifacts."
          skip_to: phase_synthesis
        on_invalid_state:
          halt: true
          release_lock: step_release_lock
          message: "Existing deep-review state in review/ is incomplete or contradictory. Repair or archive the invalid review packet before continuing."
        on_fresh:
          action: "Proceed with a new session"

      step_scope_discovery:
        action: "Resolve review target to a concrete file list based on target type"
        resolve:
          spec-folder: |
            1. Inspect spec.md, plan.md, tasks.md, acceptance-criteria.md, implementation-summary.md, and goal-file-manifest.txt when present
            2. If goal-file-manifest.txt exists, parse one repo-relative path per non-empty, non-comment line; reject absolute paths, traversal outside repo_root, duplicates, missing paths, and non-file entries
            3. Fail before dispatch with line-numbered validation errors when any manifest entry is invalid; otherwise set scope = the validated manifest paths in declared order
            4. When no manifest exists, discover implementation files referenced in the canonical spec artifacts
            5. Discover test files associated with the implementation files
            6. Set scope = the packet's own canonical docs plus all discovered implementation and test files
          skill: |
            1. Read SKILL.md from .skilled/skills/{skill_name}/
            2. Discover references/, assets/, scripts/ contents
            3. Find agent definitions referencing this skill across runtimes
            4. Find command entry points referencing this skill
            5. Set scope = all discovered files
          agent: |
            1. Find agent definition across repo-managed runtimes (.claude/agents/, .skilled/agents/)
            2. Compare agent definitions for consistency
            3. Set scope = all discovered agent files
          track: |
            1. List all child spec folders under specs/{track}/ or .opencode/specs/{track}/
            2. For each: read spec.md + acceptance-criteria.md
            3. Set scope = all child spec artifacts
          files: |
            1. Expand glob patterns from review_target
            2. Validate all files exist
            3. Discover immediate cross-references (imports, links)
            4. Set scope = expanded file list + cross-references
        outputs:
          - review_scope_files: "List of all files in review scope"
          - cross_reference_targets: "{ spec_paths: [...], code_paths: [...], test_paths: [...] }"

      step_order_dimensions:
        action: "Order review dimensions based on risk priority"
        algorithm: |
          1. Iteration 0 (inventory pass): Build artifact map, identify file types, estimate complexity
          2. Subsequent iterations follow risk-ordered deep passes:
             correctness → security → traceability → maintainability
          3. If review_dimensions != "all", filter to only requested dimensions; each configured custom dimension follows the canonical four, in configured order
          4. Derive traceability protocol plan:
             - core: spec_code, checklist_evidence
             - overlay: skill_agent, agent_cross_runtime, feature_catalog_code, playbook_capability
          5. If resource_map_present, reserve at least one traceability-oriented pass to cross-check target_files from applied/T-*.md against resource-map.md and classify touched / expected-by-scope / gap / absent-from-map outcomes
          6. Store ordered list as dimension_queue
        outputs:
          - dimension_queue: "Ordered list of dimensions to review"
          - inventory_pass: true

      step_normalize_review_dimensions:
        action: "Normalize reviewDimensions once during init for config + JSONL reuse"
        outputs:
          - review_dimensions_normalized: "Canonical string[] for deep-review-config.json"
          - review_dimensions_json: "JSON.stringify(review_dimensions_normalized) for JSONL config record"
          - review_dimensions_list: "The canonical four in risk order, then each configured custom dimension in configured order, joined by ', '"
          - dimension_coverage_custom_seed: "For each configured custom dimension in configured order, the text ,\"<name>\":false; empty when every configured dimension is canonical"
        normalize: |
          Accept {review_dimensions} in any of these shapes and convert once:
            - "all" → ["correctness","security","traceability","maintainability"]
            - "correctness,security" → ["correctness","security"]
            - ["correctness"] → ["correctness"]
            - "correctness,performance" → ["correctness","performance"]
          Trim and lowercase each element and drop duplicates; an empty name fails setup. A name outside the four canonical dimension names is a custom dimension, kept in configured order after the canonical ones.

      step_normalize_review_focus:
        action: "Normalize the optional operator review focus once during init"
        outputs:
          - review_focus_normalized: "Single-line focus text, or empty string when no focus was given"
        normalize: |
          Collapse every control character (C0, C1, DEL, U+2028, U+2029) and whitespace run to one space, trim, treat an empty result as absent, and fail setup when more than 1000 characters remain.
          fanout-run.cjs applies the same rule in code, so a fan-out lineage receives the same text.

      step_resolve_session_id:
        action: "Resolve init session id from caller when supplied, else preserve timestamp fallback"
        branch_on: "session_id"
        if_present:
          bind:
            session_id_init: "{session_id}"
        if_absent:
          bind:
            session_id_init: "{ISO_8601_NOW}"

      step_create_config:
        action: "Create deep-review-config.json from template with review-specific fields"
        dry_run_boundary: "state-mutation"
        template: .skilled/skills/system-deep-loop/deep-review/assets/deep-review-config.json
        lineage_values:
          generation_init: "{prior_generation + 1} when lineage_mode == 'restart', else 1"
          lineage_mode_init: "restart when lineage_mode == 'restart', else new"
          parent_session_id_init: "{prior_session_id} when lineage_mode == 'restart', else null"
        populate:
          topic: "Review: {review_target}"
          mode: "review"
          sessionId: "{session_id_init}"
          parentSessionId: "{parent_session_id_init}"
          lineageMode: "{lineage_mode_init}"
          generation: "{generation_init}"
          continuedFromRun: null
          reviewTarget: "{review_target}"
          reviewTargetType: "{review_target_type}"
          # Reuse the single normalized init-time value from step_normalize_review_dimensions.
          reviewDimensions: "{review_dimensions_normalized}"
          # Null when review_focus_normalized is empty. The review report reads it back to show the focus.
          reviewFocus: "{review_focus_normalized}"
          resource_map_present: "{resource_map_present}"
          reviewScopeFiles: "{review_scope_files}"
          severityThreshold: "P2"
          crossReference:
            core: ["spec_code", "checklist_evidence"]
            overlay: ["skill_agent", "agent_cross_runtime", "feature_catalog_code", "playbook_capability"]
          maxIterations: "{max_iterations}"
          # Semantic: weighted P0/P1/P2 severity ratio. See SKILL.md §"Convergence Threshold Semantics".
          convergenceThreshold: "{convergence_threshold}"
          antiConvergence.convergenceMode: "{convergence_mode}"
          antiConvergence.depthMode: "{depth_mode}"
          expansiveDepth.maxDepth: 3
          expansiveDepth.maxChildrenPerNode: 6
          expansiveDepth.budgetSplit: { depth1: 0.5, depth2: 0.35, depth3: 0.15 }
          # The node cap follows the iteration budget, so admission stops before a spent budget becomes the usual close reason.
          expansiveDepth.maxFrontierNodes: "{max_iterations}"
          antiConvergence.divergent: {}
          stopPolicy: "{stop_policy}"
          stuckThreshold: 2
          maxDurationMinutes: 120
          specFolder: "{spec_folder}"
          # Honor the parsed --no-resource-map flag from deep-review.md:71 (default true; false when flag is set).
          # The markdown command parses $ARGUMENTS and binds {resource_map_emit} before this step runs.
          resource_map.emit: "{resource_map_emit}"
          createdAt: "{ISO_8601_NOW}"
          status: "initialized"
          releaseReadinessState: "in-progress"
          executionMode: "{execution_mode}"
        output: "{state_paths.config}"

      step_frontier_seed:
        description: "Seed the depth-1 review frontier so iteration 1 already has open nodes"
        enabled_when: "depth_mode == 'expansive'"
        skip_when: "config.fanout_lineage_artifact_dir is present"
        skip_reason: "A fan-out lineage receives its share of the parent's seeded nodes from fanout-run.cjs; seeding again would duplicate them."
        dry_run_boundary: "state-mutation"
        instructions: |
          Decompose {review_target} into 3 to 8 depth-1 sub-targets that together
          cover it: subsystems, directories or commit batches. For a commit-range
          target, record the range end SHA as the pilot SHA in this step's log,
          mark a merge commit with no diff of its own as
          {"pruneReason":"merge-no-own-diff"} and a generated index rebuild as
          {"pruneReason":"generated-artifact"}. Write them as a JSON array to
          {artifact_dir}/frontier-seed.json, one object per sub-target:
          {"question": "what to review in it", "scope": "<paths inside the
          review target>", "evidence": "<path or commit that grounds it>"}. Then
          run the command. frontier-admit.cjs is the only writer of the node
          store; never write that file by hand, and never queue or hand-expand
          the admitted nodes yourself.
        command: 'node .skilled/skills/system-deep-loop/runtime/scripts/frontier-admit.cjs seed --target review --artifact-dir "{artifact_dir}" --iteration 0 --input "{artifact_dir}/frontier-seed.json"'
        working_directory: "{repo_root}"
        outputs:
          - frontier_seed_json: "The JSON line the command prints: admitted node ids and pruned {nodeId, reason} rows"
        on_failure: "Halt with the command's stderr line. A run that asked for expansive depth must not start without its seeded frontier."

      step_create_state_log:
        action: "Open the run in the ledger: record deep_review.run_initialized through the append gateway, which writes the state log's first row"
        dry_run_boundary: "state-mutation"
        note: |
          The state log is a projection the gateway rebuilds from the ledger, so this step never writes
          it directly. A config row written beside the ledger carries keys the projection cannot
          rebuild, and the projection refuses to drop them, so every later append in the run would
          commit to the ledger and then exit 2. Recording the run's opening as a ledger event makes
          the projected config row the state log's first row from the start. The full config stays
          in deep-review-config.json, which is what the reducer reads.
        command: |
          GATEWAY=".skilled/skills/system-deep-loop/runtime/scripts/append-mode-event.cjs"
          [ -f "$GATEWAY" ] || GATEWAY="scripts/append-mode-event.cjs"
          EVENT_FILE="$(mktemp "${TMPDIR:-/tmp}/deep-review-run-open.XXXXXX")"
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const [configPath, workflowPath] = process.argv.slice(1);
            const sha = (bytes) => crypto.createHash("sha256").update(bytes).digest("hex");
            const raw = fs.readFileSync(configPath);
            const config = JSON.parse(raw);
            const targetTypes = { files: "file", file: "file", directory: "directory", "spec-folder": "directory", track: "directory", repository: "repository" };
            const lineageModes = { new: "fresh", fresh: "fresh", restart: "restart", resume: "resume" };
            // The projected config row shows this topic; one the schema cannot hold is left out,
            // and the row falls back to the run id rather than the run failing to open.
            const topic = typeof config.topic === "string" && config.topic.trim() !== "" && config.topic.length <= 4096
              ? config.topic
              : null;
            process.stdout.write(JSON.stringify({
              stem: "deep_review.run_initialized",
              scope: { runId: config.sessionId, sessionId: config.sessionId, generation: Number(config.generation) || 1 },
              data: {
                target: {
                  targetId: "review-target",
                  targetType: targetTypes[config.reviewTargetType] || "artifact",
                  artifactRef: "deep-review-config.json#reviewTarget",
                  sourceDigest: sha(String(config.reviewTarget)),
                  contentDigest: sha(raw),
                },
                lineageMode: lineageModes[config.lineageMode] || "fresh",
                maxIterations: Number(config.maxIterations),
                convergencePolicyVersion: "convergence-policy@" + ((config.antiConvergence && config.antiConvergence.convergenceMode) || "default"),
                reviewModeContractDigest: sha(fs.readFileSync(workflowPath)),
                initialReleaseReadinessState: "not-assessed",
                ...(topic === null ? {} : { topic }),
              },
            }));
          ' "{state_paths.config}" ".skilled/commands/deep/assets/deep-review.yaml" > "$EVENT_FILE" || { rm -f "$EVENT_FILE"; exit 1; }
          node "$GATEWAY" --mode review --run-directory "$(dirname "{state_paths.state_log}")" --event-json "$EVENT_FILE"
          STATUS=$?
          rm -f "$EVENT_FILE"
          exit "$STATUS"
        output: "{state_paths.state_log}"

      step_record_restarted_run:
        skip_when: "lineage_mode != 'restart'"
        action: "Record the restarted lineage after the run-open row so the restart marker never precedes deep_review.run_initialized"
        dry_run_boundary: "state-mutation"
        append_jsonl: '{"stem":"deep_review.run_restarted","scope":{"runId":"{session_id}","sessionId":"{session_id}","generation":{generation}},"data":{"priorTailDigest":"{prior_tail_digest}","archivedLineageId":"{prior_session_id}","restartReason":"Restart requested: the prior review packet was archived and a new lineage segment opened.","continuedFromRunId":"{prior_session_id}-i{iteration_count}","compatibilityDecision":"exact","recoveryReceiptRef":"none"}}'

      step_create_findings_registry:
        action: "Initialize reducer-owned review findings registry"
        dry_run_boundary: "state-mutation"
        content: '{"sessionId":"{session_id_init}","generation":{generation_init},"lineageMode":"{lineage_mode_init}","openFindings":[],"resolvedFindings":[],"repeatedFindings":[],"dimensionCoverage":{"correctness":false,"security":false,"traceability":false,"maintainability":false{dimension_coverage_custom_seed}},"findingsBySeverity":{"P0":0,"P1":0,"P2":0},"openFindingsCount":0,"resolvedFindingsCount":0,"convergenceScore":0.0}'
        output: "{state_paths.findings_registry}"

      step_create_strategy:
        action: "Create review strategy file from deep-review-strategy.md template"
        dry_run_boundary: "state-mutation"
        template: .skilled/skills/system-deep-loop/deep-review/assets/deep-review-strategy.md
        populate:
          review_target: "{review_target}"
          review_target_type: "{review_target_type}"
          dimensions: "{dimension_queue}"
          scope_files: "{review_scope_files}"
          cross_reference_targets: "{cross_reference_targets}"
          max_iterations: "{max_iterations}"
          convergence_threshold: "{convergence_threshold}"
          stop_policy: "{stop_policy}"
        output: "{state_paths.strategy}"

      step_seed_coverage_graph:
        action: "Seed the review coverage graph before the first convergence check"
        dry_run_boundary: "state-mutation"
        transform: |
          1. Convert review_scope_files into FILE nodes.
          2. Convert review target groupings into coarse SLICE nodes only; do not expand SYMBOL
             or DEPENDENCY nodes in review mode.
          3. Emit COVERS edges from SLICE nodes to FILE nodes when the grouping is known.
          4. Bind coverage_seed_source to "scope_discovery" and coverage_seed_confidence to 0.50.
          5. When scope discovery yields no files, emit [] for both arrays; the upsert script
             returns a warning and review continues with an empty graph.
        bash: "node .skilled/skills/system-deep-loop/runtime/scripts/upsert.cjs --spec-folder \"{spec_folder}\" --loop-type \"review\" --session-id \"{config.sessionId}\" --nodes '{coverage_seed_nodes_json}' --edges '{coverage_seed_edges_json}' --seed-source \"{coverage_seed_source}\" --seed-confidence \"{coverage_seed_confidence}\""
        outputs:
          - coverage_seed_nodes_json: "Seed nodes for review SLICE and FILE kinds only"
          - coverage_seed_edges_json: "Seed COVERS edges where review target groupings resolved"
          - coverage_seed_warning: "Warning emitted when the seed batch inserts zero nodes, else empty"
        on_warning:
          log: "Coverage graph seed inserted zero nodes; continuing with an empty graph."
          proceed: true

      step_enrich_strategy_context:
        action: "Ensure Known Context is written only after strategy.md exists"
        dry_run_boundary: "state-mutation"
        condition: "prior_context_found"
        edit: "{state_paths.strategy}"
        note: "Append or replace the Known Context section with prior_context_summary and retained detail from prior_context"

      step_enrich_strategy_resource_map:
        action: "Inject resource-map status into Known Context after strategy.md exists"
        dry_run_boundary: "state-mutation"
        edit: "{state_paths.strategy}"
        note: "When resource_map_present is true, append the resource_map_known_context snapshot and add Resource Map Coverage to the Review Charter. When false, append 'resource-map.md not present; skipping coverage gate'."

      step_frontier_reduce_seed:
        action: "Reduce once after the seed so iteration 1 already reviews a frontier node"
        enabled_when: "depth_mode == 'expansive'"
        dry_run_boundary: "reducer-refresh"
        note: "The loop binds active_frontier_node and the frontier dimension from registry.frontier, and step_create_findings_registry writes a registry with no frontier after the seed has run. Only the reducer projects the seeded nodes into it. Without this pass the first iteration has no frontier node and no frontier block. A fan-out lineage runs it too: its reducer_artifact_arg points the reducer at the lineage's own directory, where fanout-run.cjs put its share of the nodes."
        command: |
          node .skilled/skills/system-deep-loop/runtime/scripts/reduce-state.cjs {spec_folder} {reducer_artifact_arg} --create-missing-anchors
        working_directory: "{repo_root}"
        on_failure: "Log the stderr line as a config_warning bookkeeping event and continue; iteration 1 then runs on the strategy's own dimension queue and step_reduce_review_state picks the frontier up after it."

      step_init_complete:
        log: "Initialization complete. Config, state, and strategy files created. Review scope: {review_scope_files_count} files, {dimension_queue_count} dimensions."
        set: { current_iteration: 1, p0_count: 0, p1_count: 0, p2_count: 0 }

      # ─── APPROVAL GATE: Post-Init ───
      gate_init_approval:
        applies_to: confirm
        type: approval_gate
        purpose: "Show review scope, dimensions, and target files. Get approval to start loop."
        present: |
          ## Review Initialization Complete

          **Review Target**: {review_target} ({review_target_type})
          **Scope**: {review_scope_files_count} files
          **Dimensions**: {dimension_queue}
          **Max Iterations**: {max_iterations}
          **Convergence Threshold**: {convergence_threshold}
          **Known Context Summary**: {prior_context_summary}

          **Files in scope:**
          {review_scope_files_summary}

          Review `{state_paths.strategy}` for the full scope and dimension ordering.
          **State files located in**: {state_paths.packet_dir}/

          Options:
          A) Start review loop
          B) Adjust scope or dimensions
          C) Cancel
        wait_for: "User response"
        after_gate_refresh_lock: gate_defaults.after_gate_refresh_lock
        on_A: { set: { current_iteration: 1, p0_count: 0, p1_count: 0, p2_count: 0 }, proceed_to: phase_loop }
        on_B: { action: "Apply user adjustments to strategy.md, scope, or dimensions", return_to: gate_init_approval }
        on_C: { action: "Cancel workflow", status: "CANCELLED", release_lock: step_release_lock }

  # ════════
  # PHASE 2: ITERATION LOOP
  # ════════
  phase_loop:
    purpose: Dispatch review agent iterations until convergence
    repeat: true
    max_repeats: "{max_iterations}"
    steps:

      step_refresh_lock:
        action: "Refresh the packet lock heartbeat before the iteration begins"
        command: "node .skilled/skills/system-deep-loop/runtime/scripts/loop-lock.cjs refresh --lock-path {state_paths.lock_file} --owner-pid {captured_owner_pid} --nonce {captured_acquire_nonce}"
        on_refresh: "If the refresh output has refreshed:false, fail closed: lost the packet lock. This run no longer holds the packet, so run step_release_lock and stop rather than iterate without it."

      step_record_artifact_migration:
        action: "Record the legacy review state move once per session, after the run is open"
        dry_run_boundary: "state-mutation"
        skip_when: "legacy_migration_detected != true or migration_recorded == true"
        append_jsonl: '{"stem":"deep_review.migration","scope":{"runId":"{session_id}","sessionId":"{session_id}"},"data":{"mode":"review","legacyArtifacts":["deep-research-config.json","deep-research-state.jsonl",".deep-research-pause"],"canonicalArtifacts":["deep-review-config.json","deep-review-state.jsonl",".deep-review-pause"]}}'
        set: { migration_recorded: true }

      step_read_state:
        action: "Read current state from JSONL, strategy, and config"
        read:
          - "{state_paths.state_log}"
          - "{state_paths.findings_registry}"
          - "{state_paths.strategy}"
          - "{state_paths.config}"
        extract:
          - iteration_count: "Count distinct run values (the integer iteration, else a numeric run) across lines where type === 'iteration'; a redispatched run counts once"
          - highest_run: "Highest run value (the integer iteration, else a numeric run) across lines where type === 'iteration', else 0"
          - current_iteration: "max(highest_run, iteration_count) + 1"
          - last_newFindingsRatio: "Extract newFindingsRatio from last iteration record"
          - last_focus: "Extract focus/dimension from latest iteration record, else 'none yet'"
          - ratio_prev: "Extract newFindingsRatio from second-latest iteration record, else 'N/A'"
          - ratio_latest: "Extract newFindingsRatio from latest iteration record, else 'N/A'"
          - next_dimension: "When max_iterations >= 2, current_iteration == max_iterations and unfinished_core_protocols is non-empty, 'traceability': the last iteration under the cap finishes those core protocols. Otherwise, when depth_mode == 'expansive' and registry.frontier.activeNextDimension in {state_paths.findings_registry} is non-empty, that dimension: the active frontier node's next uncovered dimension. Otherwise the next uncovered dimension from dimension_queue in strategy.md."
          - dimensions_covered: "List of dimensions already reviewed"
          - dimensions_remaining: "List of dimensions not yet reviewed"
          - dimension_coverage: "covered / total dimensions"
          - coverage_age: "Iterations since dimension coverage last changed; require >= 1 before STOP"
          - p0_count: "findingsBySeverity.P0 from {state_paths.findings_registry}, the reducer's deduplicated count of open findings, else 0"
          - p1_count: "findingsBySeverity.P1 from {state_paths.findings_registry}, else 0"
          - p2_count: "findingsBySeverity.P2 from {state_paths.findings_registry}, else 0"
          - unfinished_core_protocols: "registry.traceability.unfinishedCoreProtocols from {state_paths.findings_registry} as a JSON array, else []"
          - resource_map_present: "Extract boolean from deep-review-config.json, default false"
          - resource_map_prompt_line: "If resource_map_present is true, return 'Resource Map Coverage: cross-check target_files from {spec_folder}/applied/T-*.md against {spec_folder}/resource-map.md and classify only missed coverage as gaps.' Else return 'Resource Map Coverage: resource-map.md not present; skipping coverage gate.'"
          - session_id: "Extract sessionId from deep-review-config.json"
          - generation: "Extract generation from deep-review-config.json, else 1"
          - last_3_summaries: "Summarize the latest 3 iteration records as 'run N: dimension (ratio, P0/P1/P2)'"
          - latest_status: "Extract status from latest iteration record, else 'none yet'"
          - last_claim_adjudication_passed: "Scan state.jsonl for the most recent `claim_adjudication` event; use its `passed` boolean. Default true when no event exists or when activeP0 + activeP1 == 0 (gate is vacuous without adjudicable findings)."
          - claim_adjudication_active_count: "Count of active P0/P1 findings at the time of the last claim_adjudication event; 0 when none exist"
          - security_sensitive_fix_scope: "Boolean true when the current review is a rerun after fixes involving security, path disclosure, auth/authz, sandboxing, env precedence, public schemas, persistence, or user-visible error payloads; derive from the latest review report, remediation notes, or planning packet when present, else false."
          - fix_completeness_replay_required_rows: "Count prior active or remediated P0/P1 findings, plus any prior security/path P2 findings, that require closed-gate replay before STOP."
          - fix_completeness_replay_passing_rows: "Count required replay rows marked PASS with file:line or command evidence and producer/consumer/matrix coverage."
          - stop_policy: "Extract stopPolicy from deep-review-config.json, default 'convergence'. Valid values: convergence, max-iterations."
          - convergence_mode: "Extract antiConvergence.convergenceMode when it is one of 'default', 'off', 'sliding-window', or 'divergent'; default to 'default'"
          - convergence_mode_warning: "Boolean true when antiConvergence.convergenceMode is present with an unsupported value; use 'default'"
          - depth_mode: "Extract antiConvergence.depthMode when it is 'expansive'; any other or missing value is 'default'"
          - active_frontier_node: "When depth_mode == 'expansive', registry.frontier.activeNodeId from {state_paths.findings_registry}; else, or when it is null, an empty string"
          - pivot_lineage: "Summarize registry.divergence.completed and registry.divergence.overrides with pivot ids, source iterations, and selected review direction; else 'none yet'"
          - saturated_directions: "List registry.divergence.saturatedDirections; else 'none yet'"
          - review_focus_block: "When deep-review-config.json reviewFocus is a non-empty string, return 'Operator review focus (cover it in addition to the dimension of this iteration, and say in the narrative how you addressed it): <reviewFocus>'. Else return an empty string."
          - unfinished_core_protocols_block: "Under the same condition as next_dimension's traceability case, return 'This is the last iteration under the cap. Finish these core traceability protocols: <ids, comma-separated>. Record one traceabilityChecks.results[] entry for each. A result raised from partial to pass needs a file:line reference in evidenceRefs, or it stays partial.' Else return an empty string."

      step_check_max_duration:
        action: "Stop the loop when the run has used its wall-clock budget, and still synthesize"
        command: |
          node -e '
            const config = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const maxDurationMinutes = Number(config.maxDurationMinutes);
            const startedMs = Date.parse(config.createdAt);
            const elapsedMinutes = Math.floor((Date.now() - startedMs) / 60000);
            const reached = Number.isFinite(maxDurationMinutes) && maxDurationMinutes > 0
              && Number.isFinite(startedMs) && elapsedMinutes >= maxDurationMinutes;
            console.log(JSON.stringify({ elapsedMinutes, maxDurationMinutes, reached }));
          ' "{state_paths.config}"
        outputs:
          - duration_reached: "reached from the JSON output"
          - elapsed_minutes: "elapsedMinutes from the JSON output"
        note: "The clock starts at the createdAt of the current generation's config. A resume keeps it and a restart resets it, so paused and waiting time counts."
        if_reached:
          when: "duration_reached == true"
          set: { decision: "STOP", reason: "maxDurationReached", stopReason: "maxDurationReached" }
          bookkeeping_log: '{"type":"event","event":"maxDurationReached","mode":"review","run":{current_iteration},"stopReason":"maxDurationReached","elapsedMinutes":{elapsed_minutes},"maxDurationMinutes":{config.maxDurationMinutes},"timestamp":"{ISO_8601_NOW}","sessionId":"{session_id}","generation":{generation}}'
          log: "Duration limit reached after {elapsed_minutes} minutes. Skipping dispatch and entering synthesis with partial findings."
          run_first: record_terminal_gates
          skip_to: phase_synthesis
          note: "The stop row is printed, not appended: the gateway refuses an event it has no ledger stem for. The reason reaches the synthesis report through the bound reason."
        if_not_reached:
          action: "Continue with the iteration"

      step_check_pause_sentinel:
        action: "Check for pause sentinel file"
        check: "Does {state_paths.pause_sentinel} exist?"
        if_exists:
          set:
            pending_stop_event: "paused"
            pending_stop_reason: "userPaused"
            pending_stop_detail: "sentinel file detected"
          skip_to: step_normalize_pause_events
        if_not_exists:
          proceed: true

      step_validate_convergence_config:
        action: "Validate convergence mode when loading config"
        if_convergence_mode_invalid:
          bookkeeping_log: '{"type":"event","event":"config_warning","mode":"review","field":"antiConvergence.convergenceMode","fallback":"default","message":"Unsupported convergenceMode; using default convergence behavior.","timestamp":"{ISO_8601_NOW}","sessionId":"{session_id}","generation":{generation}}'
          dry_run_event_policy: preview-only
          log: "Unsupported convergenceMode; using default convergence behavior."

      step_graph_convergence:
        action: "Run convergence.cjs once: it evaluates the coverage graph and computes the whole review stop decision"
        inspect:
          - "{state_paths.state_log}"
          - "{state_paths.findings_registry}"
        transform: |
          1. Call convergence.cjs once on the current review lineage. It returns the graph decision and the stop_decision object.
          2. Record the decision as one of CONTINUE, STOP_ALLOWED, STOP_BLOCKED.
          3. Preserve raw graph signals and blockers for reducer rollup and blocked-stop evidence.
          4. Normalize blockers to both JSON array and CSV forms for downstream stop handling.
          5. Set graph_stop_blocked = true only when graph_decision == "STOP_BLOCKED".
        bash: 'node .skilled/skills/system-deep-loop/runtime/scripts/convergence.cjs --spec-folder "{spec_folder}" --loop-type "review" --session-id "{session_id}" --convergence-mode "{convergence_mode}" --depth-mode "{depth_mode}" --stop-decision --config-path "{state_paths.config}" --state-log "{state_paths.state_log}" --registry-path "{state_paths.findings_registry}" --iteration-count "{iteration_count}" --security-sensitive-fix-scope "{security_sensitive_fix_scope}" --fix-replay-required-rows "{fix_completeness_replay_required_rows}" --fix-replay-passing-rows "{fix_completeness_replay_passing_rows}"'
        note: "The script is the only place the stop decision is computed. step_check_convergence branches on its stop_decision output."
        append_jsonl: '{"stem":"deep_review.graph_convergence_evaluated","scope":{"runId":"{session_id}","sessionId":"{session_id}","generation":{generation},"iterationId":"iteration-{current_iteration}"},"data":{"rawSignals":{graph_raw_signals_json},"weightedSignals":{graph_raw_signals_json},"dimensionCoverageDigest":"{dimension_coverage_digest}","protocolCoverageDigest":"{protocol_coverage_digest}","findingStability":"{finding_stability}","p0p1ResolutionState":"{p0p1_resolution_state}","evidenceDensity":{evidence_density},"hotspotSaturation":{hotspot_saturation},"decision":"{graph_decision_code}","policyFingerprint":"{policy_fingerprint}","blockerIds":{graph_blocker_ids_json},"stopCandidate":{stop_candidate},"graphDecision":"{graph_decision_code}","graphDigest":"{graph_digest}","signals":{graph_signals_json},"blockers":{graph_blockers_json}},"eventId":"graph-{session_id}-g{generation}-i{current_iteration}"}'
        dry_run_event_policy: preview-only
        on_missing_counters: "If loop_counters_json is missing from the output, halt with stop reason error. Never bind a default counter. Run step_release_lock before the halt returns control."
        outputs:
          - graph_decision: "CONTINUE | STOP_ALLOWED | STOP_BLOCKED"
          - stop_decision: "Tool stop_decision object: decision, stopReason, reasonDetail, weightedStopScore, signals, gates, blockedBy, graphDecision, inputs"
          - loop_counters_json: "Tool loop_counters_json object: stuckCount and consecutiveFailureCount, both rebuilt from the state log on this pass"
          - stuck_count: "loop_counters_json.stuckCount"
          - consecutive_failure_count: "loop_counters_json.consecutiveFailureCount"
          - graph_decision_code: "CONTINUE maps to continue, STOP_ALLOWED to converged, STOP_BLOCKED to blocked"
          - graph_signals_json: "JSON object returned by convergence.cjs"
          - graph_raw_signals_json: "Exact-field convergence-signals JSON built from the convergence.cjs signals; observationDigest is the sha256 of graph_signals_json"
          - graph_blockers_json: "JSON array of graph blockers when present, else []"
          - graph_blocker_ids_json: "JSON array of blocker type values; use [\"graph_blocker\"] when the decision is blocked and the list is empty"
          - graph_blockers_csv: "Comma-separated blocker summary when graph blocks STOP, else empty string"
          - graph_stop_blocked: "Boolean true when graph_decision == STOP_BLOCKED"
          - dimension_coverage_digest: "sha256 (64 lowercase hex) of the canonical JSON of the registry dimensionCoverage map"
          - protocol_coverage_digest: "sha256 (64 lowercase hex) of the canonical JSON of the protocol coverage object in graph_signals_json, or of {} when absent"
          - finding_stability: "stable when findingStabilityRatio >= convergenceThreshold, unstable when below, unknown when the signal is missing"
          - p0p1_resolution_state: "resolved when active P0 + P1 findings are 0, blocked when above 0, unknown when counts are unavailable"
          - evidence_density: "evidenceDensityRatio from graph_signals_json, capped at 1"
          - hotspot_saturation: "hotspotSaturationRatio from graph_signals_json, between 0 and 1"
          - policy_fingerprint: "sha256 (64 lowercase hex) of the canonical JSON {convergenceThreshold, stopPolicy, convergenceMode} from the review config"
          - stop_candidate: "true when graph_decision == STOP_ALLOWED, else false"
          - graph_digest: "sha256 (64 lowercase hex) of graph_signals_json"

      step_check_convergence:
        action: "Branch on the stop decision that convergence.cjs computed in step_graph_convergence"
        algorithm: |
          The whole stop decision is computed by convergence.cjs from the review config, the state log, the findings registry and the coverage graph. This step performs no arithmetic and never recomputes or overrides the result.
          The ratio signals leave out thought iterations and every iteration whose status is error or timeout, and stuck_count is loop_counters_json.stuckCount.
          The script applies this fixed order, first match wins:
          1. if iteration_count >= max_iterations: STOP (maxIterationsReached). This terminal cap is evaluated before every veto, the claim-adjudication veto included; failed legal-stop gates are recorded in stop_decision.blockedBy as synthesis evidence.
          1a. After 3 consecutive failed iterations (status error or timeout), halt the loop and enter synthesis with stop reason error and partial findings.
          2. if stuck_count >= config.stuckThreshold: STUCK_RECOVERY
          3. if convergence_mode == "off": skip convergence stop candidates and continue.
          3a. if stop_policy == "max-iterations" AND iteration_count < max_iterations: the vote is telemetry only and the decision is CONTINUE.
          4. a STOP candidate exists when every dimension is clean (all_dimensions_clean) or the weighted vote passes (composite_converged). The vote cutoffs follow the configured convergenceThreshold.
          4a. if iteration_count < min_iterations: CONTINUE (minIterationsNotReached). min_iterations is config.minIterations, else antiConvergence.minIterations, capped at max_iterations; like research, the floor runs on a candidate before the legal-stop gates.
          4b. if depth_mode == "expansive" and the frontier still holds an open or active node: CONTINUE (frontierOpen). It vetoes every review candidate, all_dimensions_clean included, and never creates a stop.
          5. the nine legal-stop gates run on a candidate: convergenceGate, dimensionCoverageGate, p0ResolutionGate, evidenceDensityGate, hotspotSaturationGate, claimAdjudicationGate, fixCompletenessReplayGate, candidateCoverageGate, graphlessFallbackGate. Any failed gate gives BLOCKED (blockedStop).
          6. the graph decision settles the candidate: STOP_ALLOWED keeps STOP, STOP_BLOCKED gives BLOCKED, CONTINUE or a missing graph decision gives CONTINUE.
          Bind the outputs from stop_decision, where G is stop_decision.gates and I is stop_decision.inputs.review:
            decision = stop_decision.decision
            stopReason = stop_decision.stopReason
            reason = stop_decision.stopReason when it is not null, else stop_decision.reasonDetail
            reason_detail = stop_decision.reasonDetail
            weighted_stop_score = stop_decision.weightedStopScore
            stop_blocked = (stop_decision.decision == "BLOCKED")
            blocked_by_json = stop_decision.blockedBy
            blocked_by_csv = the members of stop_decision.blockedBy joined with commas
            convergence_gate_pass = G.convergenceGate.pass
            convergence_gate_score = G.convergenceGate.score
            dimension_coverage_gate_pass = G.dimensionCoverageGate.pass
            dimension_coverage_gate_missing_json = G.dimensionCoverageGate.missing
            dimension_coverage_gate_covered_json = the configured review dimensions that are not in G.dimensionCoverageGate.missing
            p0_resolution_gate_pass = G.p0ResolutionGate.pass
            active_p0_count = G.p0ResolutionGate.activeP0
            evidence_density_gate_pass = G.evidenceDensityGate.pass
            avg_evidence_per_finding = I.evidenceBackedP0P1, the count of active P0 and P1 findings that carry file:line evidence
            hotspot_saturation_gate_pass = G.hotspotSaturationGate.pass
            claim_adjudication_gate_pass = G.claimAdjudicationGate.pass
            claim_adjudication_active_count = I.activeP0 plus I.activeP1
            fix_completeness_replay_gate_pass = G.fixCompletenessReplayGate.pass
            security_sensitive_fix_scope = I.securitySensitiveFixScope
            fix_completeness_replay_required_rows = I.fixReplayRequiredRows
            fix_completeness_replay_passing_rows = I.fixReplayPassingRows
            candidate_coverage_gate_pass = G.candidateCoverageGate.pass
            candidate_coverage_search_debt_json = I.searchDebt
            candidate_coverage_missing_json = the I.requiredBugClasses entries that are not in I.candidateCovered
            graphless_fallback_gate_pass = G.graphlessFallbackGate.pass
            graphless_fallback_mode = I.graphCoverageMode
            graphless_fallback_missing_json = the I.requiredBugClasses entries that are not in I.fallbackCoveredBugClasses
            graphless_fallback_unavailability_reason = the explicit reason when I.graphCoverageMode == "unavailable_blocked", else empty string
            graph_blocker_detail_json = graph_blockers_json
            recovery_strategy = one line naming the next review action for the gates in stop_decision.blockedBy. When claimAdjudicationGate is listed: "Reviewer must add typed claim-adjudication packets (claim, evidenceRefs, counterevidenceSought, alternativeExplanation, finalSeverity, confidence, downgradeTrigger) for every active P0/P1 finding before STOP is allowed." When stop_decision.reasonDetail == "graphStopBlocked": "Resolve review coverage-graph blockers before stopping." When candidateCoverageGate and graphlessFallbackGate both fail, combine their guidance. When I.unfinishedCoreProtocols is non-empty, name them and say the last iteration under the cap is reserved for them, each needing file:line evidence.
          If stop_decision is missing from the step_graph_convergence output, do not decide by hand: halt and report the script output.
        outputs:
          - decision: "STOP | BLOCKED | STUCK_RECOVERY | CONTINUE"
          - reason: "stop_decision.stopReason when set, else stop_decision.reasonDetail"
          - reason_detail: "stop_decision.reasonDetail, the fine cause behind the decision"
          - weighted_stop_score: "stop_decision.weightedStopScore, for diagnostics only"
          - stop_blocked: "Boolean true when STOP is vetoed by inline legal-stop gates or graph_decision == STOP_BLOCKED"
          - blocked_by_json: "JSON array of failed legal-stop gates when decision == BLOCKED"
          - blocked_by_csv: "Comma-separated list of failed legal-stop gates when decision == BLOCKED"
          - convergence_gate_pass: "Boolean pass/fail for convergenceGate"
          - convergence_gate_score: "Numeric score recorded for convergenceGate"
          - dimension_coverage_gate_pass: "Boolean pass/fail for dimensionCoverageGate"
          - dimension_coverage_gate_covered_json: "JSON array of covered review dimensions"
          - dimension_coverage_gate_missing_json: "JSON array of missing review dimensions"
          - p0_resolution_gate_pass: "Boolean pass/fail for p0ResolutionGate"
          - active_p0_count: "Active P0 finding count at stop-check time"
          - evidence_density_gate_pass: "Boolean pass/fail for evidenceDensityGate"
          - avg_evidence_per_finding: "Numeric evidence density for active findings"
          - hotspot_saturation_gate_pass: "Boolean pass/fail for hotspotSaturationGate"
          - claim_adjudication_gate_pass: "Boolean pass/fail for claimAdjudicationGate (false vetoes STOP)"
          - claim_adjudication_active_count: "Count of active P0/P1 findings evaluated by claimAdjudicationGate"
          - fix_completeness_replay_gate_pass: "Boolean pass/fail for fixCompletenessReplayGate (false vetoes STOP on security-sensitive fix reruns)"
          - security_sensitive_fix_scope: "Boolean true when the review is a security-sensitive fix rerun"
          - fix_completeness_replay_required_rows: "Count of closed-gate replay rows required before STOP"
          - fix_completeness_replay_passing_rows: "Count of required closed-gate replay rows that passed with evidence"
          - candidate_coverage_gate_pass: "Boolean pass/fail for candidateCoverageGate (false vetoes STOP for unresolved reducer-owned search debt or uncovered required bug classes)"
          - candidate_coverage_search_debt_json: "JSON array of reducer-owned searchDebt obligations used as blocked-stop evidence"
          - candidate_coverage_missing_json: "JSON array of required bug classes missing from candidateCoverage.covered"
          - graphless_fallback_gate_pass: "Boolean pass/fail for graphlessFallbackGate (false vetoes STOP when graphless fallback evidence is absent or unavailable_blocked)"
          - graphless_fallback_mode: "Latest reducer-owned searchCoverage.graphCoverageMode value"
          - graphless_fallback_missing_json: "JSON array of required bug classes missing cited fallback ledger rows"
          - graphless_fallback_unavailability_reason: "Explicit unavailability reason when graphCoverageMode == unavailable_blocked"
          - graph_decision: "CONTINUE | STOP_ALLOWED | STOP_BLOCKED from step_graph_convergence"
          - graph_signals_json: "JSON object returned by graph convergence"
          - graph_blockers_json: "JSON array of graph blockers"
          - graph_blockers_csv: "Comma-separated graph blocker summary"
          - recovery_strategy: "One-line hint describing the next review action when decision == BLOCKED or STUCK_RECOVERY"
          - recovery_strategy_code: "Slug form of recovery_strategy for the ledger code fields"
          - gate_results_array_json: "One {gateId,status,reasonCode,evidenceDigest} row per legal-stop gate (convergenceGate, dimensionCoverageGate, p0ResolutionGate, evidenceDensityGate, hotspotSaturationGate, claimAdjudicationGate, fixCompletenessReplayGate, candidateCoverageGate, graphlessFallbackGate), with at least one fail row when decision == BLOCKED"
          - active_total_count: "p0_count + p1_count + p2_count, the active findings total"

      step_emit_blocked_stop:
        action: "Persist blocked-stop evidence whenever the review legal-stop decision tree vetoes STOP"
        if_blocked:
          append_jsonl: '{"stem":"deep_review.blocked_stop_recorded","scope":{"runId":"{session_id}","sessionId":"{session_id}","generation":{generation},"iterationId":"iteration-{current_iteration}"},"data":{"blockedGateIds":{blocked_by_json},"gateResults":{gate_results_array_json},"activeFindingCounts":{"candidates":{active_total_count},"adjudicated":{active_total_count},"p0":{p0_count},"p1":{p1_count},"p2":{p2_count}},"recoveryStrategy":"{recovery_strategy_code}","targetDimensionId":"{next_dimension}","originatingConvergenceEventId":"graph-{session_id}-g{generation}-i{current_iteration}","appendPosition":{current_iteration},"gateDetail":{gate_results_array_json},"graphBlockerDetail":{graph_blockers_json},"recoveryHint":"{recovery_strategy}"}}'
          dry_run_event_policy: preview-only
          log: "Blocked STOP persisted for review loop. Failed gates: {blocked_by_csv}. Recovery strategy: {recovery_strategy}"
        if_not_blocked:
          proceed: true

      step_handle_convergence:
        action: "Act on convergence decision"
        if_consecutive_failures:
          applies_to: confirm
          when: "stop_decision.reasonDetail == 'consecutiveFailures'. This branch runs instead of if_stop."
          gate_consecutive_failures:
            type: approval_gate
            purpose: "In confirm mode, ask the operator Retry / Skip / Cancel before synthesis starts."
            present: |
              **{consecutive_failure_count} iterations in a row failed.**

              Options:
              A) Retry: dispatch the next iteration with the same dimension
              B) Skip: dispatch the next iteration with the next dimension
              C) Cancel: end the run with no synthesis
            wait_for: "User response"
            after_gate_refresh_lock: gate_defaults.after_gate_refresh_lock
            on_A: { set: { decision: "CONTINUE" }, proceed_to: step_normalize_pause_events }
            on_B: { action: "Advance next_dimension to the next uncovered dimension in strategy.md", set: { decision: "CONTINUE" }, proceed_to: step_normalize_pause_events }
            on_C: { action: "Cancel workflow", status: "CANCELLED", release_lock: step_release_lock }
          note: "The failure count is rebuilt from the state log, so this gate asks again after each further failed iteration and stops asking once an iteration completes."
        if_stop:
          record_terminal_gates:
            when: "Run once, immediately before control jumps to phase_synthesis: in if_existing_terminal_path, in the divergent pivot's if_failed and on_error branches, and in every confirm-mode manualStop exit (on_C) into phase_synthesis: both divergent pivot gates, gate_pre_iteration and the post-iteration gate. The auto three-errors stop (reason error) reaches it through if_existing_terminal_path. The duration stop in step_check_max_duration runs it, once, before its jump to phase_synthesis. Never run it when the pivot continues the loop."
            bash: 'node .skilled/skills/system-deep-loop/runtime/scripts/terminal-gates.cjs --config-path "{state_paths.config}" --state-log "{state_paths.state_log}" --registry-path "{state_paths.findings_registry}"'
            note: "The script computes all three gates from the config, state log and registry: evidence by the evidenceDensityGate rule, coverage by the dimensionCoverageGate rule, and scope by matching every open finding's file against reviewScopeFiles. Never judge a gate from the findings yourself. Run it fresh at this stop, even when an earlier blocked stop recorded failures."
            on_error: "When the script exits non-zero or prints status error, fail closed: bind terminal_gate_results_json to three rows, evidence, scope and coverage, each with status fail, reasonCode gate-script-error and evidenceDigest the sha256 of the script's error text, and bind failed_required_gate_ids to [\"evidence\",\"scope\",\"coverage\"]."
            evaluate: |
              terminal_stop_reason = reason when it is maxIterationsReached, maxDurationReached, manualStop or error, else "converged". Read reason, never stopReason: every manual stop sets reason to manualStop while stopReason may still hold blockedStop or stuckRecovery
            outputs:
              - terminal_gate_results_json: "Tool terminal_gate_results_json: three rows {gateId, status, reasonCode, evidenceDigest} in the order evidence, scope, coverage"
              - failed_required_gate_ids: "Tool failed_required_gate_ids: the gateIds whose status is fail, in that order; [] when all pass"
              - terminal_stop_reason: "From evaluate"
            append_jsonl: '{"stem":"deep_review.terminal_gates_recorded","scope":{"runId":"{session_id}","sessionId":"{session_id}","generation":{generation},"iterationId":"iteration-{current_iteration}"},"data":{"stopReason":"{terminal_stop_reason}","gateResults":{terminal_gate_results_json},"failedRequiredGateIds":{failed_required_gate_ids},"appendPosition":{current_iteration}}}'
            log: "Terminal gates recorded at stop {terminal_stop_reason}. Failed required gates: {failed_required_gate_ids}"
          branch_on: "convergence_mode == 'divergent' AND stop_decision.reasonDetail == 'all_dimensions_clean'"
          if_divergent_eligible:
            eligibility_contract:
              required_decision: "STOP"
              eligible_reasons: [all_dimensions_clean]
              excluded_reasons: [maxIterationsReached, blockedStop, stuckRecovery, error, manualStop, userPaused, maxDurationReached]
              fail_closed: "Any missing or ambiguous reason uses if_existing_terminal_path without preparing a pivot. The nine legal-stop gates have already run and remain unchanged."
              frontier_gate: "Under depth_mode == 'expansive' the pivot is eligible only once registry.frontier holds no open or active node. The frontierOpen stop veto already returns CONTINUE while one is open, so this gate records the order rather than adding a second check. A candidate the pivot accepts re-enters breadth through step_frontier_admit as a frontier_proposal row, and the pivot may seed from nodes closed exhausted or blocked."
            steps:
              step_prepare_divergent_pivot:
                action: "Generate state-grounded read-only review candidates and prepare or resume the pivot transaction"
                dry_run_boundary: "state-mutation"
                command: |
                  node .skilled/skills/system-deep-loop/runtime/scripts/divergent-pivot.cjs prepare --loop-type review --artifact-root "{state_paths.packet_dir}" --config "{state_paths.config}" --state-log "{state_paths.state_log}" --strategy "{state_paths.strategy}" --registry "{state_paths.findings_registry}" --current-iteration "{current_iteration}" --max-iterations "{max_iterations}" --trigger-reason "{reason_detail}"
                working_directory: "{repo_root}"
                outputs:
                  - pivot_prepare_json: "The complete parsed JSON result"
                  - pivot_prepare_status: "status from the prepare result"
                  - pivot_id: "pivotId from the prepare result"
                  - pivot_paths_json: "paths from the prepare result as JSON"
                  - pivot_resumed: "resumed from the prepare result"
                  - pivot_attempt: "attempt from the prepare result: 1, or 2 when the pivot was reopened after a retryable quorum failure"
                  - pivot_missing_seat_ids: "missingSeats ids from a pending result"
                  - pivot_seat_json: "For the current seat_id, its mandate object from missingSeats"
                  - pivot_seat_prompt: "For the current seat_id, seatPrompts[seat_id]"
                  - pivot_dispatch_context_json: "dispatchContext from a pending result as JSON"
                short_circuit: "When status is completed or failed, skip all dispatch and record steps and bind this result as pivot_result."

              step_dispatch_pivot_seat:
                action: "Natively dispatch one read-only review direction-selection seat"
                for_each: "seat_id in [seat-001, seat-002, seat-003], in that order. Run this step and then step_record_pivot_seat for one seat before the next seat starts. Seat roles: seat-001 analytical, seat-002 critical, seat-003 pragmatic."
                skip_when: "pivot_prepare_status != 'pending' or pivot_missing_seat_ids does not contain seat_id"
                attempt_scope: "Dispatch the seats of pivot_attempt only. Attempt 2 reuses the seat ids seat-001 to seat-003 and the same seat prompts; pivot_paths_json and dispatchContext.round name attempt 2, so step_record_pivot_seat writes attempt-2 events and files."
                dry_run_boundary: "dispatch"
                capture_timing: true
                if_native:
                  dispatch:
                    agent: deep-review
                    model: opus
                    context_source: "pivot_seat_prompt"
                  wait_for_completion: true
                failure_contract: "A native dispatch failure binds status=rejected, a {name,message} error, and the measured timestamps/duration, then proceeds to step_record_pivot_seat."
                outputs:
                  - pivot_seat_dispatch_status: "fulfilled or rejected"
                  - pivot_seat_output_json: "Raw native return serialized as JSON when fulfilled, else null"
                  - pivot_seat_error_json: "{name,message} when rejected, else null"
                  - pivot_seat_started_at_iso: "Dispatch start timestamp"
                  - pivot_seat_completed_at_iso: "Dispatch completion timestamp"
                  - pivot_seat_duration_ms: "Dispatch duration in milliseconds"

              step_record_pivot_seat:
                action: "Durably record the native dispatch outcome of the seat just dispatched"
                skip_when: "pivot_prepare_status != 'pending' or pivot_missing_seat_ids does not contain seat_id"
                command: |
                  node .skilled/skills/system-deep-loop/runtime/scripts/divergent-pivot.cjs record-seat <<'PIVOT_SEAT'
                  {"paths":{pivot_paths_json},"pivotId":"{pivot_id}","seat":{pivot_seat_json},"status":"{pivot_seat_dispatch_status}","output":{pivot_seat_output_json},"error":{pivot_seat_error_json},"startedAtIso":"{pivot_seat_started_at_iso}","completedAtIso":"{pivot_seat_completed_at_iso}","durationMs":"{pivot_seat_duration_ms}"}
                  PIVOT_SEAT
                working_directory: "{repo_root}"

              step_finalize_divergent_pivot:
                action: "Finalize the prepared pivot after all missing native seats are durable"
                skip_when: "pivot_prepare_status != 'pending'"
                command: |
                  node .skilled/skills/system-deep-loop/runtime/scripts/divergent-pivot.cjs finalize --paths-json '{pivot_paths_json}' --pivot-id "{pivot_id}" --resumed "{pivot_resumed}"
                working_directory: "{repo_root}"
                outputs:
                  - pivot_finalize_json: "The complete parsed final result"
                  - pivot_finalize_retryable: "retryable from the finalize result when it is true, else false"

              step_retry_divergent_pivot_once:
                action: "Reopen the pivot once as attempt 2 when finalize reports a retryable council quorum failure"
                skip_when: "pivot_prepare_status != 'pending' or pivot_finalize_retryable != true or pivot_attempt == 2"
                retryable: "Only a first-attempt quorum failure is retryable. Re-enter step_prepare_divergent_pivot with the same arguments; it returns status pending with attempt 2 and three missing seats, and the dispatch, record and finalize steps run again for that attempt."
                return_to: step_prepare_divergent_pivot
                fail_closed: "A second quorum failure is terminal: finalize returns status failed without retryable, this step is skipped, and the branch fails closed through the existing if_failed log line. A council agreement failure is never retryable."

              step_resolve_divergent_pivot_result:
                action: "Use prepare's terminal result on resume/short-circuit, otherwise use finalize's result"
                branch_on: "pivot_prepare_status"
                if_pending: { bind: { pivot_result: "{pivot_finalize_json}" } }
                if_completed_or_failed: { bind: { pivot_result: "{pivot_prepare_json}" } }

              step_apply_divergent_pivot_result:
                action: "Adopt a successful read-only review direction or fail closed to the existing synthesis path"
                branch_on: "pivot_result.status"
                if_completed:
                  gate_divergent_pivot_choice:
                    applies_to: confirm
                    type: approval_gate
                    purpose: "Approve the Council-selected read-only review direction before it becomes the next focus"
                    order: "Under confirm this gate runs before the set, command, log and proceed_to of this branch."
                    present: |
                      ## Divergent Review Pivot Candidate

                      **Pivot**: {pivot_result.pivotId}
                      **Council-selected candidate**: {pivot_result.selectedCandidate.id}
                      **Review direction**: {pivot_result.restoredFocus}
                      **Agreement**: {pivot_result.agreement.endorsementCount}/3 material endorsements
                      **Swept direction**: {pivot_result.completedEvent.previousFocus}

                      The adapter exposes an ordered candidate frontier and agreement tallies, but no ranked-candidate score contract. Choosing a different ranked candidate is therefore unavailable rather than inferred from array order. Every candidate remains read-only and cannot authorize a fix, target expansion, or file mutation.

                      Options:
                      A) Accept the Council-selected candidate and continue
                      B) Choose a different ranked candidate (unavailable: no ranking contract)
                      C) manualStop and proceed to the existing pre-synthesis gate
                    wait_for: "User response"
                    after_gate_refresh_lock: gate_defaults.after_gate_refresh_lock
                    on_A:
                      bookkeeping_log: '{"type":"event","event":"pivot_confirm_accepted","mode":"review","run":{current_iteration},"pivotId":"{pivot_result.pivotId}","selectedCandidate":{pivot_result.selectedCandidate},"timestamp":"{ISO_8601_NOW}","sessionId":"{session_id}","generation":{generation}}'
                      continue: "Run the set, command, log and proceed_to of this branch."
                    on_B:
                      message: "No ranked alternative can be selected because the adapter exposes no ranking score or rank contract."
                      return_to: gate_divergent_pivot_choice
                    on_C:
                      bookkeeping_log: '{"type":"event","event":"manualStop","mode":"review","run":{current_iteration},"stopReason":"manualStop","pivotId":"{pivot_result.pivotId}","timestamp":"{ISO_8601_NOW}","sessionId":"{session_id}","generation":{generation}}'
                      set: { reason: "manualStop" }
                      run_first: record_terminal_gates
                      skip_to: phase_synthesis
                  set:
                    next_dimension: "{pivot_result.restoredFocus}"
                    pivot_lineage: "Pivot {pivot_result.pivotId} selected {pivot_result.selectedCandidate.id} from source iteration {current_iteration}."
                    saturated_directions: "{pivot_result.completedEvent.saturatedDirections}"
                  command: "node .skilled/skills/system-deep-loop/runtime/scripts/reduce-state.cjs {spec_folder} {reducer_artifact_arg} --create-missing-anchors"
                  log: "Divergent review pivot {pivot_result.pivotId} restored focus to {pivot_result.restoredFocus}; continuing iteration {current_iteration}."
                  proceed_to: step_normalize_pause_events
                if_failed:
                  gate_divergent_pivot_override:
                    applies_to: confirm
                    type: approval_gate
                    purpose: "Offer the audited operator override when a failed pivot is recoverable"
                    condition: "Runs only when pivot_result.failedEvent.recoverableByOverride == true AND pivot_result.agreement.reason == 'insufficient_endorsement'. Otherwise this gate is skipped and the branch fails closed as written."
                    order: "Under confirm this gate runs before the run_first, log and skip_to of this branch."
                    present: |
                      ## Divergent Review Pivot Did Not Converge

                      **Pivot**: {pivot_result.pivotId}
                      **Failure**: {pivot_result.failureReason}
                      **Agreement tallies**: {pivot_result.agreement.tallies}

                      The adapter marked this insufficient-endorsement failure as recoverable by explicit operator override. The candidate frontier is unranked; any override must name a persisted accepted candidate id, provide a rationale, and remains a read-only review direction.

                      Options:
                      A) Fail closed to synthesis
                      B) Explicitly override with accepted candidate id + rationale
                      C) manualStop and proceed to the existing pre-synthesis gate
                    wait_for: "User response"
                    after_gate_refresh_lock: gate_defaults.after_gate_refresh_lock
                    on_A: { continue: "Fail closed: run the run_first, log and skip_to of this branch." }
                    on_B:
                      action: "Read pivot_result.paths.configPath, validate the supplied id against acceptedCandidates, bind the exact candidate and persisted previousFocus/saturatedDirections/frontier, and reject ids outside that frontier or any candidate that authorizes a fix, target expansion, or file mutation."
                      bookkeeping_log: '{"type":"event","event":"pivot_override_accepted","mode":"review","run":{current_iteration},"pivotId":"{pivot_result.pivotId}","selectedCandidate":{operator_selected_candidate},"selectedFrontier":{operator_selected_frontier},"previousFocus":"{operator_previous_focus}","saturatedDirections":{operator_saturated_directions},"reason":"{operator_override_rationale}","agreementReason":"insufficient_endorsement","timestamp":"{ISO_8601_NOW}","sessionId":"{session_id}","generation":{generation}}'
                      set:
                        next_dimension: "{operator_selected_candidate.focus}"
                        pivot_lineage: "Pivot {pivot_result.pivotId} used an audited insufficient-endorsement override for {operator_selected_candidate.id}."
                        saturated_directions: "{operator_saturated_directions}"
                      command: "node .skilled/skills/system-deep-loop/runtime/scripts/reduce-state.cjs {spec_folder} {reducer_artifact_arg} --create-missing-anchors"
                      proceed_to: step_normalize_pause_events
                    on_C:
                      bookkeeping_log: '{"type":"event","event":"manualStop","mode":"review","run":{current_iteration},"stopReason":"manualStop","pivotId":"{pivot_result.pivotId}","timestamp":"{ISO_8601_NOW}","sessionId":"{session_id}","generation":{generation}}'
                      set: { reason: "manualStop" }
                      run_first: record_terminal_gates
                      skip_to: phase_synthesis
                  run_first: record_terminal_gates
                  log: "Divergent review pivot {pivot_result.pivotId} failed closed ({pivot_result.failureReason}); proceeding to synthesis."
                  skip_to: phase_synthesis
            on_error:
              run_first: record_terminal_gates
              log: "Divergent review pivot integration error; failing closed to the existing synthesis path."
              skip_to: phase_synthesis
          if_existing_terminal_path:
            run_first: record_terminal_gates
            log: "Loop stopping. Reason: {reason}"
            skip_to: phase_synthesis
        if_blocked:
          log: "Legal-stop gates blocked STOP. Failed gates: {blocked_by_csv}. Continuing review."
        if_stuck_recovery:
          log: "Stuck detected ({stuck_count} consecutive no-progress). Entering recovery."
          recovery_strategies:
            - "Change granularity: file-level → function-level → line-level review"
            - "Traceability protocol replay: re-run unresolved core or overlay checks"
            - "Escalate severity review: re-examine P2 findings for potential P1 upgrades"
          pivot_target: "Pivot to the least-covered dimension (the review dimension with the fewest iteration passes and lowest coverage ratio)."
          set:
            next_dimension: "RECOVERY: {recovery_strategy}. Least-covered dimension: {least_explored}"
            pending_stop_event: "stuck_recovery"
            pending_stop_reason: "stuckRecovery"
            pending_stop_detail: "Recovery path activated after repeated no-progress iterations"
          if_expansive_open_node:
            when: "depth_mode == 'expansive' AND active_frontier_node is non-empty"
            note: "The recovery path still sets pending_stop_event stuck_recovery, which step_normalize_pause_events appends as deep_review.recovery_started; that event projects to stuckRecovery and resets stuckCount, so the next low-yield iteration does not close the next node after one iteration."
            command: 'node .skilled/skills/system-deep-loop/runtime/scripts/frontier-admit.cjs close --target review --artifact-dir "{artifact_dir}" --node-id "{active_frontier_node}" --status exhausted --reason stuck --iteration "{current_iteration}"'
            then_command: "node .skilled/skills/system-deep-loop/runtime/scripts/reduce-state.cjs {spec_folder} {reducer_artifact_arg} --create-missing-anchors"
            working_directory: "{repo_root}"
            log: "Stuck on frontier node {active_frontier_node}; closed it as exhausted and moved to the next open node."
          if_no_open_node:
            action: "Fall through to the global recovery below."
        if_continue:
          log: "Iteration {current_iteration}: Continuing. Dimension: {next_dimension}"

      step_normalize_pause_events:
        action: "Rewrite raw pause and recovery events to the frozen STOP_REASONS enum at emission time: converged, maxIterationsReached, blockedStop, stuckRecovery, error, manualStop, userPaused, maxDurationReached"
        if_pending_pause_event:
          append_jsonl: '{"stem":"deep_review.pause_recorded","scope":{"runId":"{session_id}","sessionId":"{session_id}","generation":{generation},"iterationId":"iteration-{current_iteration}"},"data":{"normalizedStopReason":"userPaused","sentinelCause":"sentinel-file-detected","fromIterationId":"iteration-{current_iteration}","strategy":"await-operator-resume","targetDimensionId":"{next_dimension}","outcome":"paused","lineageRef":"{session_id}","priorTailDigest":"{prior_tail_digest}"}}'
          dry_run_event_policy: preview-only
          message: "Review paused. Delete review/.deep-review-pause to resume."
          reset:
            pending_stop_event: null
            pending_stop_reason: null
            pending_stop_detail: null
          halt: true
          release_lock: step_release_lock
        if_pending_stuck_recovery:
          append_jsonl: '{"stem":"deep_review.recovery_started","scope":{"runId":"{session_id}","sessionId":"{session_id}","generation":{generation},"iterationId":"iteration-{current_iteration}","dimensionId":"{least_explored}"},"data":{"normalizedStopReason":"stuckRecovery","recoveryCause":"repeated-no-progress","fromIterationId":"iteration-{current_iteration}","strategy":"{recovery_strategy_code}","targetDimensionId":"{least_explored}","outcome":"recovery-started","lineageRef":"{session_id}","priorTailDigest":"{prior_tail_digest}","originatingPauseEventId":"none"}}'
          dry_run_event_policy: preview-only
          reset:
            pending_stop_event: null
            pending_stop_reason: null
            pending_stop_detail: null
        if_no_pending_event:
          proceed: true
        outputs:
          - prior_tail_digest: "sha256 (64 lowercase hex) of the state log bytes at the moment the pause or recovery row is emitted"

      step_generate_state_summary:
        action: "Generate compact state summary for dispatch context (~200 tokens)"
        generate: |
          STATE SUMMARY (auto-generated):
          Iteration: {current_iteration} of {max_iterations}
          Dimension: {next_dimension}
          Prior Findings: P0={p0_count} P1={p1_count} P2={p2_count}
          Dimension Coverage: {dimensions_covered_list} ({dimension_coverage})
          Traceability: core={core_protocol_status} overlay={overlay_protocol_status}
          {resource_map_prompt_line}
          Coverage Age: {coverage_age}
          Last 2 ratios: {ratio_prev} -> {ratio_latest}
          Stuck count: {stuck_count}
          Provisional Verdict: {PASS|CONDITIONAL|FAIL|PENDING} hasAdvisories={has_advisories}

      step_marker_scan:
        action: "H-2 loop-prevention guard: scan previous iteration's rendered prompt for nested review marker"
        canonical_header: "DEEP-REVIEW"
        nested_marker_pattern: "^(DEEP-RESEARCH|CODE-REVIEW)$"
        algorithm: |
          if current_iteration > 1:
            PREV_PROMPT_PATH = "{state_paths.prompt_dir}/iteration-{previous_iteration}.md"
            if file_exists(PREV_PROMPT_PATH):
              PREV_PROMPT_FIRST_LINE = head -1 of PREV_PROMPT_PATH
              if PREV_PROMPT_FIRST_LINE matches nested_marker_pattern:
                log "ERROR: nested review loop detected (foreign deep-loop marker found in previous iteration prompt). Aborting."
                halt with exit code 2
        note: |
          False-positive prevention: a review prompt that starts with its own canonical
          header is this loop's own iteration output, never a nested dispatch; only a
          foreign marker (DEEP-RESEARCH or CODE-REVIEW) is, so the guard matches
          nested_marker_pattern rather than the canonical header. Markers appearing in
          comments or body text are ignored. True-positive triggers only when a previous
          iteration's rendered prompt literally starts with a foreign deep-loop marker,
          indicating a nested review dispatch.

      # ─── APPROVAL GATE: Pre-Iteration ───
      gate_pre_iteration:
        applies_to: confirm
        skip_when: "The operator already approved the next dispatch in this pass through gate_consecutive_failures, gate_divergent_pivot_choice or gate_divergent_pivot_override."
        type: approval_gate
        purpose: "Show planned dimension focus and get approval before dispatching agent"
        present: |
          ## Review Iteration {current_iteration} of {max_iterations}

          **Dimension**: {next_dimension}
          **Dimensions Covered**: {dimensions_covered} ({dimension_coverage})
          **Findings So Far**: P0={p0_count} P1={p1_count} P2={p2_count}
          **Last newFindingsRatio**: {last_newFindingsRatio}
          **Traceability**: core={core_protocol_status} overlay={overlay_protocol_status}
          **Stuck Count**: {stuck_count}

          Options:
          A) Proceed with this dimension focus
          B) Change focus to: [user provides new dimension or focus]
          C) Stop loop and synthesize now
          D) Cancel entirely
        wait_for: "User response"
        after_gate_refresh_lock: gate_defaults.after_gate_refresh_lock
        on_A: { proceed_to: step_dispatch_iteration }
        on_B: { action: "Update next_dimension to user's choice", proceed_to: step_dispatch_iteration }
        on_C: { set: { reason: "manualStop" }, run_first: record_terminal_gates, proceed_to: phase_synthesis }
        on_D: { action: "Cancel workflow", status: "CANCELLED", release_lock: step_release_lock }

      step_frontier_activate:
        description: "Mark the active frontier node before the iteration dispatches"
        enabled_when: "depth_mode == 'expansive' AND active_frontier_node is non-empty"
        dry_run_boundary: "state-mutation"
        note: "Marking the node active at this iteration lets the reducer attribute the iteration to the node even when the leaf rewords its focus, so the node's own coverage keeps moving instead of the iteration sliding back onto the global dimension queue."
        command: 'node .skilled/skills/system-deep-loop/runtime/scripts/frontier-admit.cjs close --target review --artifact-dir "{artifact_dir}" --node-id "{active_frontier_node}" --status active --iteration "{current_iteration}"'
        working_directory: "{repo_root}"
        on_failure: "Log the stderr line as a config_warning bookkeeping event and continue; the leaf's frontierNodeId and focus marker still attribute the iteration."

      step_dispatch_iteration:
        action: "Dispatch @deep-review agent for one review iteration"
        dry_run_boundary: "dispatch"
        dry_run_preview:
          before_halt:
            - "Generate the state summary."
            - "Render the prompt pack to terminal preview without writing the prompt file."
            - "Show the selected executor branch and command or native dispatch target that would run."
        pre_dispatch_refresh_lock:
          action: "Refresh the packet lock heartbeat immediately before the dispatch starts"
          command: "node .skilled/skills/system-deep-loop/runtime/scripts/loop-lock.cjs refresh --lock-path {state_paths.lock_file} --owner-pid {captured_owner_pid} --nonce {captured_acquire_nonce}"
          on_refresh: "If the refresh output has refreshed:false, fail closed: lost the packet lock. Run step_release_lock and stop rather than dispatch without it."
        post_dispatch_refresh_lock:
          action: "Refresh the packet lock heartbeat immediately after the dispatch returns"
          command: "node .skilled/skills/system-deep-loop/runtime/scripts/loop-lock.cjs refresh --lock-path {state_paths.lock_file} --owner-pid {captured_owner_pid} --nonce {captured_acquire_nonce}"
          on_refresh: "If the refresh output has refreshed:false, fail closed: lost the packet lock. Run step_release_lock and stop rather than continue without it."
        resolve_executor:
          source: "config.executor"
          loader: ".skilled/skills/system-deep-loop/runtime/lib/deep-loop/executor-config.ts#parseExecutorConfig"
        pre_dispatch:
          generate_summary: |
            STATE SUMMARY (auto-generated):
            Iteration: {current_iteration} of {max_iterations}
            Dimension: {next_dimension}
            Prior Findings: P0={p0_count} P1={p1_count} P2={p2_count}
            Dimension Coverage: {dimensions_covered_list} ({dimension_coverage})
            Traceability: core={core_protocol_status} overlay={overlay_protocol_status}
            {resource_map_prompt_line}
            Coverage Age: {coverage_age}
            Last 2 ratios: {ratio_prev} -> {ratio_latest}
            Stuck count: {stuck_count}
            Provisional Verdict: {PASS|CONDITIONAL|FAIL|PENDING} hasAdvisories={has_advisories}
          render_prompt_pack:
            template_path: ".skilled/skills/system-deep-loop/deep-review/assets/prompt-pack-iteration.md.tmpl"
            renderer: ".skilled/skills/system-deep-loop/runtime/lib/deep-loop/prompt-pack.ts#renderPromptPack"
            output_path: "{state_paths.prompt_dir}/iteration-{current_iteration}.md"
            dry_run_output: "Render in memory and print to terminal preview; do not write output_path."
            bind_before_render:
              frontier_block: "Empty string unless depth_mode == 'expansive' and active_frontier_node is non-empty. Under expansive, the exact stdout of: node .skilled/skills/system-deep-loop/runtime/scripts/frontier-admit.cjs block --target review --artifact-dir \"{artifact_dir}\" --node-id \"{active_frontier_node}\" --dimension \"{next_dimension}\". Pass it verbatim; an empty stdout means the leaf gets no frontier block and proposes nothing."
            variables:
              state_summary: "{state_summary}"
              current_iteration: "{current_iteration}"
              max_iterations: "{max_iterations}"
              max_tool_calls_per_iteration: "{config.maxToolCallsPerIteration}"
              next_dimension: "{next_dimension}"
              review_target: "{review_target}"
              review_scope_files: "{review_scope_files}"
              p0_count: "{p0_count}"
              p1_count: "{p1_count}"
              p2_count: "{p2_count}"
              pivot_lineage: "{pivot_lineage}"
              saturated_directions: "{saturated_directions}"
              review_focus_block: "{review_focus_block}"
              frontier_block: "{frontier_block}"
              review_dimensions_list: "{review_dimensions_list}"
              unfinished_core_protocols_block: "{unfinished_core_protocols_block}"
              state_paths_config: "{state_paths.config}"
              state_paths_state_log: "{state_paths.state_log}"
              state_paths_findings_registry: "{state_paths.findings_registry}"
              state_paths_strategy: "{state_paths.strategy}"
              state_paths_iteration_pattern: "{state_paths.iteration_pattern}"
              state_paths_delta_pattern: "{state_paths.delta_pattern}"
        pre_dispatch_audit:
          skip_when: "config.executor.kind == 'native' or dry_run == true"
          call: ".skilled/skills/system-deep-loop/runtime/lib/deep-loop/executor-audit.ts#writeFirstRecordExecutor"
          args:
            stateLogPath: "{state_paths.state_log}"
            executor: "{config.executor}"
            iteration: "{current_iteration}"
            sessionId: "{session_id}"
        branch_on: "config.executor.kind"
        cli_dispatch_args: '--loop-type review --repo-root "{repo_root}" --prompt-file "{state_paths.prompt_dir}/iteration-{current_iteration}.md" --state-log "{state_paths.state_log}" --packet-dir "{state_paths.packet_dir}" --artifact-dir "{artifact_dir}" --iteration "{current_iteration}" --generation "{generation}" --session-id "{session_id}" --model "{config.executor.model}" --reasoning-effort "{config.executor.reasoningEffort}" --service-tier "{config.executor.serviceTier}" --sandbox-mode "{config.executor.sandboxMode}" --timeout-seconds "{config.executor.timeoutSeconds}"'
        if_native:
          dispatch:
            agent: deep-review
            model: opus
            context_source: "rendered_prompt_pack"
          timeout_seconds: "{config.executor.timeoutSeconds}"
          wait_for_completion: true
        if_cli_deepseek_harness:
          command: |
            node .skilled/skills/system-deep-loop/runtime/scripts/dispatch-iteration.cjs --executor cli-deepseek-harness {cli_dispatch_args} --spec-folder "{spec_folder}"
          working_directory: "{repo_root}"
          timeout_seconds: "{config.executor.timeoutSeconds}"
          wait_for_completion: true
          notes:
            - "cli-deepseek-harness single-executor: builds through the shared fan-out command builder (buildLineageCommand), so the pinned harness release, the model allowlist and the route, lineage and guards patches stay one source of truth. runAuditedExecutorCommand emits INTENT + COMPLETION receipts"
            - "The harness starts in the artifact directory, never the repository root, with a fresh DSH_HOME outside the checkout. DSH_HOME, DSH_SPEC_FOLDER, SYSTEM_SPEC_GATE_DISABLED and AI_SESSION_CHILD reach the child through dispatchEnv, and the home is removed in a finally block. The event stream is judged and counted, not echoed"
            - "The prompt opens with a REPOSITORY ROOT line, because the prompt pack's paths and gateway call are repo-relative while the harness starts in the artifact directory"
            - "The child timeout is 30 s under the step timeout (at least half of it), so the finally block removes the home before any outer kill"
            - "validateDshCompletion judges a clean exit, so a plugin that did not activate or a missing final event records a crash dispatch_failure"
            - "Fails closed when the harness binary is absent, off its pinned release or the model is off the allowlist (buildLineageCommand throws, exit non-zero). A requested cli-deepseek-harness executor never degrades to native"
            - "The command text never names the harness binary as a bare word, because the ancestry recursion guard reads the parent shell's command line"
        if_cli_mistral_vibe:
          command: |
            node --input-type=module <<'EOF'
            console.error('cli-mistral-vibe runs only as a fan-out lineage; rerun with --count=2 or a second --executor group, or choose another executor kind');
            process.exit(2);
            EOF
          working_directory: "{repo_root}"
          wait_for_completion: true
          notes:
            - "Fails closed before any dispatch receipt is written; the pre_dispatch_audit provenance row for the attempted executor remains"
        if_cli_claude_code:
          command: |
            node .skilled/skills/system-deep-loop/runtime/scripts/dispatch-iteration.cjs --executor cli-claude-code {cli_dispatch_args} --claude-config-dir "{optional_claude_config_dir}"
          working_directory: "{repo_root}"
          timeout_seconds: "{config.executor.timeoutSeconds}"
          wait_for_completion: true
          render_hint:
            optional_claude_config_dir: |
              If config.executor.configDir is set and non-null, expand a leading ~ to HOME and bind that path.
              Otherwise expand to empty string.
          notes:
            - "Routed through runAuditedExecutorCommand so claude-code produces INTENT + COMPLETION dispatch receipts; recursion guard + env allowlist enforced via buildExecutorDispatchEnv"
            - "CLAUDE_CONFIG_DIR is forwarded through guardContext.env (CLAUDE_ prefix is allowlisted) so account-specific Claude Code routing is preserved"
            - "permission-mode stays acceptEdits (review's existing iteration-write behavior); claude-code has no serviceTier flag"
            - "claude-code supports --effort for reasoning depth"
        if_cli_opencode:
          command: |
            node .skilled/skills/system-deep-loop/runtime/scripts/dispatch-iteration.cjs --executor cli-opencode {cli_dispatch_args}
          working_directory: "{repo_root}"
          timeout_seconds: "{config.executor.timeoutSeconds}"
          wait_for_completion: true
          notes:
            - "Routed through runAuditedExecutorCommand so opencode produces INTENT + COMPLETION dispatch receipts; recursion guard + env allowlist enforced via buildExecutorDispatchEnv"
            - "Fail closed before dispatch unless the rendered containment sections exist, --dir is an isolated linked worktree, the primary worktree is clean, and current-worktree changes are confined to artifact_dir both by name and after every path component is resolved through symlinks; append the recovery-baseline commit to state_log"
            - "buildLineageCommand returns empty input, so stdin is closed (EOF), equivalent to </dev/null"
            - "buildLineageCommand receives the route-proof preamble + iteration body as its message"
            - "buildLineageCommand maps reasoningEffort to the installed OpenCode version's supported option"
            - "buildLineageCommand resolves the OpenCode binary and version-correct argv for the configured sandboxMode"
            - "cli-opencode self-invocation guard: this single-executor branch must only run from a non-OpenCode dispatch surface (Claude Code/raw shell). Explicit parallel-detached cli-opencode fan-out is handled by step_fanout_spawn_cli/fanout-run.cjs, not this branch. the `cli-external-orchestration/cli-opencode` mode's SKILL.md (`.skilled/skills/cli-external-orchestration/cli-opencode/SKILL.md`) §SELF-INVOCATION PROHIBITED contract is the authoritative gate"
        if_cli_codex:
          command: |
            node .skilled/skills/system-deep-loop/runtime/scripts/dispatch-iteration.cjs --executor cli-codex {cli_dispatch_args}
          working_directory: "{repo_root}"
          timeout_seconds: "{config.executor.timeoutSeconds}"
          wait_for_completion: true
          notes:
            - "PRE-DISPATCH RULE (read before running the script): when this run is ITSELF a fan-out CLI lineage — config.fanout_lineage_artifact_dir is bound, or SPECKIT_FANOUT_LINEAGE_ID / SPECKIT_CLI_DISPATCH_STACK / CODEX_SESSION_ID is present in the environment — the lineage IS the executor. Do NOT run this dispatch script. Perform the iteration in-process instead: read the rendered prompt at {state_paths.prompt_dir}/iteration-{current_iteration}.md, do the review pass yourself, write the iteration file and the delta, and hand the iteration record to the append gateway (append-mode-event.cjs) exactly as the leaf contract requires, never writing the state log yourself, then continue to post_dispatch_validate."
            - "Nested CLI dispatch from a lineage is a route violation, not a slow path: a codex lineage that runs this script spawns codex inside its own sandbox, where the child cannot initialize and every iteration fails. The script refuses that case before any spawn and before any dispatch receipt is written, exiting RECURSION_GUARD_EXIT_CODE; that refusal is a route error to fix, never a redispatchable executor failure."
            - "Routed through runAuditedExecutorCommand so codex produces INTENT + COMPLETION dispatch receipts; recursion guard (CODEX_SESSION_ID) + env allowlist (CODEX_/OPENAI_/AZURE_OPENAI_) enforced via buildExecutorDispatchEnv"
            - "Fails closed when the codex binary is absent (exit 1) — parity with the fan-out cli-codex lineage guard in fanout-run.cjs; codex routing never degrades to native"
            - "codex exec reads the iteration prompt from stdin via the trailing '-' (input: promptBody); '-c model_reasoning_effort=' maps reasoning depth, default medium; '-c service_tier=' forwarded when configured"
            - "--sandbox workspace-write is required so the iteration can write its own iteration file/delta/state record (read-only would fail the post-dispatch artifact gate); -c approval_policy=never keeps it non-interactive; --model omitted when unset so ~/.codex/config.toml default applies"
        if_cli_cursor:
          command: |
            node .skilled/skills/system-deep-loop/runtime/scripts/dispatch-iteration.cjs --executor cli-cursor {cli_dispatch_args}
          working_directory: "{repo_root}"
          timeout_seconds: "{config.executor.timeoutSeconds}"
          wait_for_completion: true
          notes:
            - "cli-cursor single-executor: dispatches per-iteration through the shared fan-out command builder (buildLineageCommand) so the enforced cli-cursor model allowlist + headless write flags stay one source of truth; runAuditedExecutorCommand emits INTENT + COMPLETION receipts"
            - "Fails closed when cursor-agent is absent or the model is off the allowlist (buildLineageCommand throws, exit non-zero) — a requested cli-cursor executor never degrades to native"
        if_cli_devin:
          command: |
            node .skilled/skills/system-deep-loop/runtime/scripts/dispatch-iteration.cjs --executor cli-devin {cli_dispatch_args}
          working_directory: "{repo_root}"
          timeout_seconds: "{config.executor.timeoutSeconds}"
          wait_for_completion: true
          notes:
            - "cli-devin single-executor: dispatches per-iteration through the shared fan-out command builder (buildLineageCommand) so the enforced cli-devin model allowlist + headless write flags stay one source of truth; runAuditedExecutorCommand emits INTENT + COMPLETION receipts"
            - "Fails closed when devin is absent or the model is off the allowlist (buildLineageCommand throws, exit non-zero) — a requested cli-devin executor never degrades to native"
        if_cli_pi:
          command: |
            node .skilled/skills/system-deep-loop/runtime/scripts/dispatch-iteration.cjs --executor cli-pi {cli_dispatch_args}
          working_directory: "{repo_root}"
          timeout_seconds: "{config.executor.timeoutSeconds}"
          wait_for_completion: true
          notes:
            - "cli-pi single-executor: dispatches per-iteration through the shared fan-out command builder (buildLineageCommand) so the enforced cli-pi model allowlist + headless write flags stay one source of truth; runAuditedExecutorCommand emits INTENT + COMPLETION receipts"
            - "Fails closed when pi is absent or the model is off the allowlist (buildLineageCommand throws, exit non-zero) — a requested cli-pi executor never degrades to native"
            - "cli-deepseek-harness has its own single-executor branch, if_cli_deepseek_harness above, built through the same buildLineageCommand. Fan-out also runs the kind"
        post_dispatch_validate:
          validator: ".skilled/skills/system-deep-loop/runtime/lib/deep-loop/post-dispatch-validate.ts#validateIterationOutputs"
          command: "node .skilled/skills/system-deep-loop/runtime/scripts/verify-iteration.cjs --loop-type review --artifact-dir {artifact_dir} --iteration {current_iteration}"
          command_note: "Mechanical leaf-reliability gate: exit 0 = complete; non-zero prints one machine reason (dispatch_failed|iteration_file_missing|iteration_verdict_missing|state_record_missing|route_proof_missing|route_proof_mismatch|delta_file_missing|executor_missing). dispatch_failed means the narrative is missing and the completion receipt shows a non-zero exit or a signal. executor_missing means the config names a non-native executor and neither the iteration record nor its iteration_start row names one. In a fan-out lineage it means the lineage's invocation-metadata.json does not name that executor. The script enforces the artifact + route-proof + executor contract instead of trusting the leaf to self-report, and a non-zero exit triggers on_failure.redispatch_once, except executor_missing, findings_not_enumerated and ledger_backing_missing, which mean the iteration already landed and skip the redispatch."
          assert_exists: "{state_paths.iteration_pattern}"
          assert_appended: "{state_paths.state_log}"
          assert_jsonl_fields: [type, iteration, mode, run, status, focus, dimensions, filesReviewed, findingsCount, findingsSummary, findingsNew, findingDetails, newFindingsRatio, sessionId, generation, lineageMode, timestamp, durationMs]
          route_proof:
            mode: review
            target_agent: deep-review
            agent_definition_loaded: true
            resolved_route: "Resolved route: mode=review target_agent=deep-review"
          dispatchReceipt:
            receiptDir: "{state_paths.packet_dir}/dispatch-receipts"
            dispatchId: "review-i{current_iteration}-g{generation}"
          sessionId: "{session_id}"
          assert_canonical_type: "iteration"
          assert_delta_file_exists: "{state_paths.delta_pattern}"
          assert_delta_file_has_iteration_record: true
          failure_reasons:
            - iteration_file_missing
            - iteration_file_empty
            - jsonl_not_appended
            - jsonl_missing_fields
            - jsonl_parse_error
            - jsonl_wrong_type
            - delta_file_missing
            - delta_file_empty
            - delta_file_missing_iteration_record
            - executor_missing
            - dispatch_failure_logged
            - v2_missing_ledger
            - v2_uncited_ledger_row
            - v2_broken_linked_finding
            - v2_shallow_finding_details
            - delta_iteration_id_mismatch
            - state_delta_iteration_mismatch
            - route_proof_missing
            - route_proof_mismatch
          warning_surface:
            source: "result.warnings"
            action: "emit schema_advisory canonical conflict event"
            severity: "advisory"
            event_shape: '{"type":"event","event":"schema_advisory","mode":"review","iteration":{current_iteration},"warnings":{result.warnings},"severity":"advisory","timestamp":"{ISO_8601_NOW}"}'
            note: "Warnings do not fail dispatch. Hard failures still emit schema_mismatch through on_failure."
          on_failure:
            action: "emit schema_mismatch canonical conflict event"
            redispatch_once: "On the FIRST failure of the mechanical command check for this iteration, re-run step_dispatch_iteration exactly once for the same iteration number, then re-run the check. Skip this redispatch when the failure reason is executor_missing, findings_not_enumerated or ledger_backing_missing. Those reasons are returned only after the narrative, state record and delta all exist, so the iteration already landed and a second leaf would refuse to overwrite it: treat it as still failing without a second dispatch. If it still fails, record the iteration as error (per step_evaluate_results.on_missing_outputs) and continue. Never re-dispatch a given iteration more than once."
        record_executor_audit:
          skip_when: "config.executor.kind == 'native'"
          call: ".skilled/skills/system-deep-loop/runtime/lib/deep-loop/executor-audit.ts#appendExecutorAuditToLastRecord"
          args:
            stateLogPath: "{state_paths.state_log}"
            executor: "{config.executor}"
            sessionId: "{session_id}"

      step_evaluate_results:
        action: "Verify iteration outputs and extract metrics"
        verify:
          - file_exists: "{state_paths.iteration_pattern}"
          - jsonl_appended: "New iteration record in state.jsonl"
          - strategy_updated: "Strategy.md has been modified"
        extract:
          - newFindingsRatio: "From latest JSONL iteration record"
          - findings_count: "From latest JSONL iteration record"
          - severity_counts: "From latest JSONL iteration record (P0, P1, P2)"
          - dimensions: "From latest JSONL iteration record"
          - files_reviewed: "From latest JSONL iteration record"
          - status: "From latest JSONL iteration record"
          - reviewed_artifacts: "From latest JSONL iteration record"
          - traceability_checks: "From latest JSONL iteration record when present"
        on_missing_outputs:
          action: "Inspect the latest dispatch record before handling missing outputs"
          read:
            - "{state_paths.state_log}"
          extract:
            - last_record: "Parse the latest state.jsonl record after dispatch"
          branch_on: "last_record.type == 'event' AND last_record.event == 'dispatch_failure' AND last_record.executorUnavailable == true"
          if_executor_unavailable:
            set: { reason: "error", stopReason: "error" }
            message: "The {last_record.executor.kind} executor is unavailable ({last_record.matchedMarker}). Switch executor or wait, then resume this run."
            halt: true
            release_lock: step_release_lock
          if_other_failure:
            action: "Mark iteration as 'error', continue to next"
          # Canonical iteration record: include sessionId, generation, durationMs so the reducer can
          # persist the failure without dropping the iteration. Schema source: state-format.md §Iteration Records.
          # The row is staged for the append gateway: the state log is a projection of the
          # ledger, so a directly appended error row is dropped by the next refresh.
            command: |
              GATEWAY=".skilled/skills/system-deep-loop/runtime/scripts/append-mode-event.cjs"
              [ -f "$GATEWAY" ] || GATEWAY="scripts/append-mode-event.cjs"
              EVENT_FILE="$(mktemp "${TMPDIR:-/tmp}/deep-review-iteration-error.XXXXXX")"
              cat <<'DEEP_LOOP_STATE_RECORD' > "$EVENT_FILE"
              {"stem":"deep_review.iteration_error","scope":{"runId":"{session_id}","sessionId":"{session_id}"},"data":{"type":"iteration","iteration":{current_iteration},"run":{current_iteration},"mode":"review","status":"error","focus":"{next_dimension}","dimensions":["{next_dimension}"],"filesReviewed":[],"findingsCount":0,"findingsSummary":{"P0":0,"P1":0,"P2":0},"findingsNew":{"P0":0,"P1":0,"P2":0},"findingDetails":[],"traceabilityChecks":{"summary":{"required":0,"executed":0,"pass":0,"partial":0,"fail":0,"blocked":0,"notApplicable":0,"gatingFailures":0},"results":[]},"newFindingsRatio":0.0,"durationMs":0,"sessionId":"{config.sessionId}","generation":{config.generation},"lineageMode":"{config.lineageMode}"}}
              DEEP_LOOP_STATE_RECORD
              node "$GATEWAY" --mode review --run-directory "$(dirname "{state_paths.state_log}")" --event-json "$EVENT_FILE"
              RECORD_STATUS=$?
              rm -f "$EVENT_FILE"
              exit "$RECORD_STATUS"

      step_post_iteration_claim_adjudication:
        action: "Validate typed claim-adjudication packets for any new P0/P1 findings and persist the result to state.jsonl so the next iteration's claimAdjudicationGate can read it"
        dry_run_boundary: "state-mutation"
        verify:
          - typed_packets_present: "Every new P0/P1 finding in review/iterations/iteration-{NNN}.md contains a claim-adjudication JSON block"
          - packet_fields: "Each packet includes claim, evidenceRefs, counterevidenceSought, alternativeExplanation, finalSeverity, confidence, downgradeTrigger"
          - missing_packet_ids: "List of new P0/P1 finding IDs that are missing a typed packet or field; empty array when all packets validate"
        on_pass:
          set:
            claim_adjudication_passed: true
          # The row is staged as a canonical ledger event and appended by the gateway:
          # the state log is a projection of the ledger, so a write beside it is dropped
          # by the next refresh.
          command: |
            GATEWAY=".skilled/skills/system-deep-loop/runtime/scripts/append-mode-event.cjs"
            [ -f "$GATEWAY" ] || GATEWAY="scripts/append-mode-event.cjs"
            EVENT_FILE="$(mktemp "${TMPDIR:-/tmp}/deep-review-claim-adjudication.XXXXXX")"
            cat <<'DEEP_LOOP_STATE_RECORD' > "$EVENT_FILE"
            {"stem":"deep_review.claim_adjudication","scope":{"runId":"{session_id}","sessionId":"{session_id}"},"data":{"mode":"review","run":{current_iteration},"passed":true,"activeP0P1":{active_p0_p1_count},"missingPackets":[],"reason":null,"sessionId":"{session_id}","generation":{generation}}}
            DEEP_LOOP_STATE_RECORD
            node "$GATEWAY" --mode review --run-directory "$(dirname "{state_paths.state_log}")" --event-json "$EVENT_FILE"
            RECORD_STATUS=$?
            rm -f "$EVENT_FILE"
            exit "$RECORD_STATUS"
          log: "Claim adjudication passed for iteration {current_iteration}. All new P0/P1 findings have typed packets."
        on_fail:
          action: "Mark the iteration as invalid for convergence. The next iteration's claimAdjudicationGate (step_check_convergence step 0) reads the persisted `passed: false` event and vetoes STOP until a follow-up iteration rewrites the packets."
          set:
            claim_adjudication_passed: false
          command: |
            GATEWAY=".skilled/skills/system-deep-loop/runtime/scripts/append-mode-event.cjs"
            [ -f "$GATEWAY" ] || GATEWAY="scripts/append-mode-event.cjs"
            EVENT_FILE="$(mktemp "${TMPDIR:-/tmp}/deep-review-claim-adjudication.XXXXXX")"
            cat <<'DEEP_LOOP_STATE_RECORD' > "$EVENT_FILE"
            {"stem":"deep_review.claim_adjudication","scope":{"runId":"{session_id}","sessionId":"{session_id}"},"data":{"mode":"review","run":{current_iteration},"passed":false,"activeP0P1":{active_p0_p1_count},"missingPackets":{missing_packet_ids},"reason":"Missing typed packet fields for new P0/P1 findings","sessionId":"{session_id}","generation":{generation}}}
            DEEP_LOOP_STATE_RECORD
            node "$GATEWAY" --mode review --run-directory "$(dirname "{state_paths.state_log}")" --event-json "$EVENT_FILE"
            RECORD_STATUS=$?
            rm -f "$EVENT_FILE"
            exit "$RECORD_STATUS"
          log: "Claim adjudication incomplete for new P0/P1 findings. Event persisted. The next iteration's step_check_convergence claim-adjudication pre-check will veto STOP while `passed: false` remains the latest event and active P0/P1 > 0."

      step_frontier_admit:
        action: "Admit this iteration's review frontier_proposal rows as sub-target nodes before the reducer runs"
        enabled_when: "depth_mode == 'expansive'"
        dry_run_boundary: "state-mutation"
        instructions: |
          The review leaf only proposes; this step decides. Before the command, write a
          JSON array of strings to {artifact_dir}/frontier-known-texts.json holding every
          frontier node question already in registry.frontier.nodes and every ruled-out
          candidate rationale, so a proposal that repeats settled work is pruned as a
          duplicate. An absent registry gives an empty array. The helper runs the six
          admission checks in order and writes only node-store rows: a review run queues
          its nodes from that store alone, with no separate question queue to append.
        command: 'node .skilled/skills/system-deep-loop/runtime/scripts/frontier-admit.cjs admit --target review --artifact-dir "{artifact_dir}" --iteration "{current_iteration}" --input "{state_paths.delta_pattern with NNN = current_iteration}" --known-texts "{artifact_dir}/frontier-known-texts.json"'
        working_directory: "{repo_root}"
        outputs:
          - frontier_admit_json: "The JSON line the command prints: admitted node ids and pruned {nodeId, reason} rows"
        on_failure: "Log the stderr line as a config_warning bookkeeping event and continue to step_reduce_review_state; a failed admission leaves the frontier as it was and never blocks the iteration."

      step_reduce_review_state:
        action: "Run reducer to refresh the canonical findings registry before dashboard generation"
        dry_run_boundary: "reducer-refresh"
        command: "node .skilled/skills/system-deep-loop/runtime/scripts/reduce-state.cjs {spec_folder} {reducer_artifact_arg} --create-missing-anchors"
        read:
          - "{state_paths.state_log}"
          - "{state_paths.iteration_pattern}"
          - "{state_paths.findings_registry}"
          - "{state_paths.strategy}"
        write:
          - "{state_paths.findings_registry}"
          - "{state_paths.dashboard}"
          - "{state_paths.strategy}"
        failure_modes:
          malformed_delta: "skip + warn"
          missing_iteration_file: "no-op + error"
          schema_mismatch: "reject + conflict event"
        guarantee: "Idempotent for identical inputs"
        note: "Reducer outputs findingsRegistry, dashboardMetrics, and strategyUpdates. Re-running the same inputs must be idempotent."

      step_graph_upsert:
        action: "Project canonical review coverage plus optional graphEvents into graph nodes and edges, then upsert it"
        dry_run_boundary: "state-mutation"
        read:
          - "{state_paths.config}"
          - "{state_paths.state_log}"
          - "{state_paths.findings_registry}"
        transform: |
          1. Read the latest iteration JSONL record after reducer completion.
          2. Seed one stable DIMENSION node for every configured review dimension, falling back to correctness, security, traceability, and maintainability.
          3. Seed one stable FILE node for every latest-record filesReviewed entry and emit a COVERS edge from each latest-record dimension to each reviewed file.
          4. Merge optional graphEvents nodes after normalizing type = uppercase(event.kind || event.nodeKind || event.type); keep only DIMENSION, FILE, FINDING, EVIDENCE, REMEDIATION, BUG_CLASS, INVARIANT, PRODUCER, CONSUMER, TEST.
          5. Merge optional graphEvents edges after normalizing relation = uppercase(event.relation); keep only COVERS, EVIDENCE_FOR, CONTRADICTS, RESOLVES, CONFIRMS, ESCALATES, IN_DIMENSION, IN_FILE.
          6. Emit nodes as { id, type, name, iteration, metadata } and edges as { id, relation, sourceId, targetId, metadata }, deduplicated by id.
          7. Discard malformed or unknown optional events without discarding canonical dimension and file coverage.
        bash: "node .skilled/skills/system-deep-loop/runtime/scripts/upsert.cjs --spec-folder \"{spec_folder}\" --loop-type \"review\" --session-id \"{session_id}\" --nodes '{graph_nodes_json}' --edges '{graph_edges_json}'"
        note: "Invoke the runtime script directly. Canonical iteration fields provide baseline coverage; graphEvents add richer evidence."
        outputs:
          - graph_nodes_json: "JSON array of canonical and optional review graph nodes"
          - graph_edges_json: "JSON array of canonical and optional review graph edges"

      # ─── APPROVAL GATE: Post-Iteration ───
      gate_post_iteration:
        applies_to: confirm
        type: approval_gate
        purpose: "Show iteration findings and get approval for next step"
        present: |
          ## Review Iteration {current_iteration} Results

          **Dimensions**: {dimensions}
          **New Findings**: {findings_count} (P0={severity_counts.P0} P1={severity_counts.P1} P2={severity_counts.P2})
          **newFindingsRatio**: {newFindingsRatio}
          **Status**: {status}
          **Cumulative Findings**: P0={p0_count} P1={p1_count} P2={p2_count}
          **Dimension Coverage**: {dimensions_covered} ({dimension_coverage})
          **Traceability**: {traceability_checks.summary}
          **Stuck Count**: {stuck_count}

          **Recent Iteration Summary**:
          {last_3_summaries}

          Options:
          A) Continue to next iteration
          B) Continue with adjusted focus: [user provides]
          C) Stop loop and synthesize
          D) Cancel entirely
        wait_for: "User response"
        after_gate_refresh_lock: gate_defaults.after_gate_refresh_lock
        on_A: { proceed_to: step_update_tracking }
        on_B: { action: "Set next_dimension to user's choice in strategy.md", proceed_to: step_update_tracking }
        on_C: { set: { reason: "manualStop" }, run_first: record_terminal_gates, proceed_to: phase_synthesis }
        on_D: { action: "Cancel workflow", status: "CANCELLED", release_lock: step_release_lock }

      step_update_tracking:
        action: "Update loop tracking variables"
        set:
          current_iteration: "{current_iteration + 1}"
        log: "Iteration {N} complete. Dimensions: {dimensions}. newFindingsRatio: {newFindingsRatio}. Findings: P0={severity_counts.P0} P1={severity_counts.P1} P2={severity_counts.P2}."

      step_loop_decision:
        action: "Return to step_read_state for next iteration"
        goto: step_read_state

  # ════════
  # PHASE 3: SYNTHESIS
  # ════════
  phase_synthesis:
    purpose: Compile all iteration findings into review/review-report.md
    steps:

      step_fanout_merge:
        description: "Merge N lineage registries with strongest-restriction; bind p0/p1/p2 counts for step_derive_verdict; skip when single-executor"
        dry_run_boundary: "reducer-refresh"
        skip_when: "config.fanout is absent"
        command: |
          node .skilled/skills/system-deep-loop/runtime/scripts/fanout-merge.cjs \
            --loop-type review \
            --artifact-dir {artifact_dir}
        working_directory: "{repo_root}"
        wait_for_completion: true
        bind_from_output:
          p0_count: "active_p0"
          p1_count: "active_p1"
          p2_count: "active_p2"
          failed_required_gate_ids: "failed_required_gate_ids"
          search_debt_count: "search_debt"

      step_hydrate_summary_metrics:
        action: "Hydrate summary metrics before synthesis"
        read:
          - "{state_paths.config}"
          - "{state_paths.state_log}"
          - "{state_paths.findings_registry}"
          - "{state_paths.strategy}"
        read_patterns:
          - "{state_paths.packet_dir}/lineages/*/deep-review-state.jsonl"
        extract:
          - iteration_count: "When direct lineage state logs exist, count distinct run values (the integer iteration, else a numeric run) across those logs in stable lineage order; otherwise count distinct run values (the integer iteration, else a numeric run) across the root state log. Never add root compatibility records to lineage records."
          - highest_run: "When direct lineage state logs exist, take the highest run value (the integer iteration, else a numeric run) across lines where type === 'iteration' in those logs in stable lineage order, else 0; otherwise take the highest run value (the integer iteration, else a numeric run) across lines where type === 'iteration' in the root state log, else 0. Never add root compatibility records to lineage records."
          - current_iteration: "max(highest_run, iteration_count) + 1"
          - p0_count: "When step_fanout_merge bound it, keep the merged value; the fan-out verdict reads it. Otherwise the count of open findings in {state_paths.findings_registry} with status active and severity P0, for the pre-synthesis display only."
          - p1_count: "Same rule as p0_count, for severity P1."
          - p2_count: "Same rule as p0_count, for severity P2."
          - failed_required_gate_ids: "When step_fanout_merge bound it, keep the merged value. Otherwise take failedRequiredGateIds from the last line of {state_paths.state_log} with type === 'event' and event === 'terminal_gates', else []. Read the state log, not the registry: the reducer last ran before the stop wrote that row."
          - dimensions_covered: "List of reviewed dimensions"
          - dimension_coverage: "covered / total"
          - ac_coverage_signal: "For spec-folder targets only: if level is 2+ and acceptance-criteria.md exists and implementation-summary.md is in-progress or later, surface the AC_COVERAGE advisory status; otherwise mark exempt."
          - last_3_summaries: "Summarize the latest 3 iteration records"
          - reason: "Use the latest stop reason if present: read stopReason from the last line of {state_paths.state_log} with type === 'event' and event === 'terminal_gates' when it is newer than the latest stop event, since a manual stop is stored only there; else the frozen default 'converged'. (Must be a member of the STOP_REASONS enum: converged, maxIterationsReached, blockedStop, stuckRecovery, error, manualStop, userPaused, maxDurationReached.)"

      # ─── APPROVAL GATE: Pre-Synthesis ───
      gate_pre_synthesis:
        applies_to: confirm
        type: approval_gate
        purpose: "Show all accumulated findings and get approval to synthesize"
        present: |
          ## Review Loop Complete

          **Total Iterations**: {iteration_count}
          **Stop Reason**: {reason}
          **Cumulative Findings**: P0={p0_count} P1={p1_count} P2={p2_count}
          **Dimension Coverage**: {dimensions_covered} ({dimension_coverage})
          **Recent Iteration Summary**: {last_3_summaries}

          Review the iteration files in `{state_paths.iteration_dir}/` if you want more detail before synthesis.

          Options:
          A) Proceed to synthesis (compile review/review-report.md)
          B) Run more iterations (increase max or focus on specific dimension)
          C) Cancel (keep iteration files)
        wait_for: "User response"
        after_gate_refresh_lock: gate_defaults.after_gate_refresh_lock
        on_A: { proceed_to: step_read_all_iterations }
        on_B: { action: "Increase max_iterations or adjust focus, return to loop. When reason is maxDurationReached, raise maxDurationMinutes in the config too, or the duration check stops the loop again and writes another terminal record", proceed_to: phase_loop }
        on_C: { action: "Cancel synthesis, keep artifacts", status: "PARTIAL" }

      step_read_all_iterations:
        action: "Read all iteration files and strategy"
        read_pattern: "{state_paths.iteration_dir}/iteration-*.md"
        read_also: "{state_paths.strategy}"

      step_build_finding_registry:
        action: "Build deduplicated finding registry from all iterations"
        algorithm: |
          1. Extract all findings from iteration JSONL delta files
          2. Compute content_hash for each finding (emission requirement):
             content_hash = sha256(file_path + "\u001f" + line_range + "\u001f" + finding_type + "\u001f" + normalized_description_80chars)
             Normalized description = whitespace-collapsed, lowercased, first 80 chars of the finding description.
          3. Two-tier dedup:
             PRIMARY: group by content_hash field
               - Same content_hash, multiple dimensions → single finding, merged `dimensions: [<all>]` array
               - Keep highest severity on duplicates
             FALLBACK (legacy records lacking content_hash): file:line + normalized_title
               - Same file:line, multiple dimensions → single finding, multiple dimension tags
               - Keep highest severity on duplicates
          4. Track finding lifecycle:
             - status: active | duplicate | upgraded | downgraded | contested | resolved_false_positive
             - Record first_seen, upgraded_in, previous_severity for severity changes
             - Record dimensions array reflecting all dimensions that emitted this finding
          5. Resolve contradictions:
             - Findings marked contested across iterations → referee pass
             - Determine final severity and status
          6. Count only 'active' findings for totals. These totals are narrative only: step_derive_verdict reads the registry file after the self-check refreshes it, and the report and the closeout state its counts as the counts the verdict used.
        outputs:
          - finding_registry: "Deduplicated list of all findings with metadata"

      # Adjudication persistence: the Referee's call becomes a claim_adjudication row per
      # finding, so the registry the verdict reads carries the final severity. A false
      # positive is recorded as `none`, the scale value for a claim that is not a finding.
      step_adversarial_selfcheck:
        action: "Final adversarial self-check on all P0 and P1 findings"
        dry_run_boundary: "state-mutation"
        algorithm: |
          For each active P0/P1 finding:
            1. Hunter: Re-verify finding against source code (re-read file:line)
            2. Skeptic: Challenge severity — is this really P0/P1? Could it be P2?
            3. Referee: Final call — confirm, downgrade, or mark false_positive
          Record one `<findingId> <finalSeverity>` pair for every call the Referee made
          here: the severity it settled on, or `none` when it called the finding a false
          positive. An empty list means the Referee changed nothing.
          On a single-executor run, append one deep_review.claim_adjudication row per pair
          through the gateway, then refresh the registry once. The verdict step that
          follows reads the refreshed registry, so a downgrade or a false positive changes
          the counts the verdict, the report and the closeout all use.
          On a fan-out root, record the pairs for the report only: the root has no state
          log before closeout, and the merged lineage counts are what that verdict reads.
        extract:
          - selfcheck_adjudications: "One `<findingId> <finalSeverity>` pair per line, using the findingId exactly as it appears in openFindings of {state_paths.findings_registry}, empty when the Referee changed nothing"
          - adjudication_mode: "`mode` of the latest claim_adjudication gate row (the newest one without a findingId), else \"review\""
          - adjudication_run: "`run` of that gate row, else {highest_run}"
          - adjudication_passed: "`passed` of that gate row, else true"
          - adjudication_active_p0_p1: "`activeP0P1` of that gate row, else {p0_count} plus {p1_count}"
          - adjudication_missing_packets: "`missingPackets` of that gate row as a JSON array, else []"
          - adjudication_reason: "`reason` of that gate row as a JSON value, else \"adversarial self-check\""
        branch_on: "config.fanout"
        if_present:
          action: "Record the pairs in the Executive Summary for reference. Do not append: a fan-out root has no root state log before closeout, and each lineage already adjudicated its own findings, so the merged counts are the authority here."
        if_absent:
          # The row is staged for the append gateway: the state log is a projection of the
          # ledger, so a row written beside it is dropped by the next refresh.
          command: |
            GATEWAY=".skilled/skills/system-deep-loop/runtime/scripts/append-mode-event.cjs"
            [ -f "$GATEWAY" ] || GATEWAY="scripts/append-mode-event.cjs"
            RUN_DIR="$(dirname "{state_paths.state_log}")"
            while read -r FINDING_ID FINAL_SEVERITY; do
            [ -n "$FINDING_ID" ] || continue
            EVENT_FILE="$(mktemp "${TMPDIR:-/tmp}/deep-review-claim-adjudication.XXXXXX")"
            cat <<DEEP_LOOP_STATE_RECORD > "$EVENT_FILE"
            {"stem":"deep_review.claim_adjudication","scope":{"runId":"{session_id}","sessionId":"{session_id}"},"data":{"mode":"{adjudication_mode}","run":{adjudication_run},"passed":{adjudication_passed},"activeP0P1":{adjudication_active_p0_p1},"missingPackets":{adjudication_missing_packets},"reason":{adjudication_reason},"sessionId":"{session_id}","generation":{generation},"findingId":"$FINDING_ID","finalSeverity":"$FINAL_SEVERITY"}}
            DEEP_LOOP_STATE_RECORD
            node "$GATEWAY" --mode review --run-directory "$RUN_DIR" --event-json "$EVENT_FILE"
            RECORD_STATUS=$?
            rm -f "$EVENT_FILE"
            [ "$RECORD_STATUS" -eq 0 ] || exit "$RECORD_STATUS"
            done <<'DEEP_LOOP_SELFCHECK_ADJUDICATIONS'
            {selfcheck_adjudications}
            DEEP_LOOP_SELFCHECK_ADJUDICATIONS
            node .skilled/skills/system-deep-loop/runtime/scripts/reduce-state.cjs {spec_folder} {reducer_artifact_arg} --create-missing-anchors
          on_fail:
            action: "Halt with STATUS=FAIL through step_release_lock. An append the gateway rejected leaves the ledger and the registry disagreeing, so the verdict that follows would read a stale count."
            halt: true
            release_lock: step_release_lock
          log: "Adversarial self-check adjudicated {selfcheck_adjudications}; the verdict reads the refreshed registry."

      # H-1 verdict derivation: parse findings JSONL, map highest severity to verdict
      # - PASS: no P0 or P1 findings (P2-only or clean)
      # - CONDITIONAL: any P1 finding or open search debt (no P0, no failed gate)
      # - FAIL: any P0 finding, or a required quality gate (evidence, scope, coverage) still failing at the terminal stop
      # Final line of iteration-NNN.md MUST be exactly: "Review verdict: PASS" / "Review verdict: CONDITIONAL" / "Review verdict: FAIL"
      step_derive_verdict:
        action: "Derive review verdict from accumulated findings"
        note: "ac_coverage_signal is advisory while the validation rule is INFO/default-off; include it in synthesis traceability, but do not change the exact verdict enum from this signal alone."
        branch_on: "config.fanout"
        if_present:
          command: |
            node .skilled/skills/system-deep-loop/runtime/scripts/review-verdict.cjs \
              --active-p0 {p0_count} \
              --active-p1 {p1_count} \
              --active-p2 {p2_count} \
              --search-debt {search_debt_count} \
              --failed-gate-ids '{failed_required_gate_ids}'
          working_directory: "{repo_root}"
          wait_for_completion: true
          bind_from_output:
            verdict: "verdict"
            has_advisories: "has_advisories"
            active_p0: "active_p0"
            active_p1: "active_p1"
            active_p2: "active_p2"
            search_debt_count: "search_debt"
          on_fail: "Halt with STATUS=FAIL through step_release_lock. The values the merge bound are the authority on a fan-out root, so an unreadable bound value must stop the run rather than let a verdict be guessed."
        if_absent:
          command: |
            node .skilled/skills/system-deep-loop/runtime/scripts/review-verdict.cjs \
              --registry-path "{state_paths.findings_registry}" \
              --state-log "{state_paths.state_log}"
          working_directory: "{repo_root}"
          wait_for_completion: true
          bind_from_output:
            verdict: "verdict"
            has_advisories: "has_advisories"
            active_p0: "active_p0"
            active_p1: "active_p1"
            active_p2: "active_p2"
            search_debt_count: "search_debt"
          on_fail: "Halt with STATUS=FAIL through step_release_lock. A non-zero exit means the registry or the state log could not be read, so this stop has no verdict yet and none may be assumed."
        outputs:
          - verdict: "PASS | CONDITIONAL | FAIL"
          - has_advisories: "Boolean true when verdict is PASS and any active P2 findings exist"
          - active_p0: "Active P0 count the verdict used"
          - active_p1: "Active P1 count the verdict used"
          - active_p2: "Active P2 count the verdict used"
          - ac_coverage_signal: "exempt | disabled | pass | advisory-shortfall"
        contract: |
          Every iteration-NNN.md must end with exactly: "Review verdict: PASS" (or CONDITIONAL or FAIL).
          Downstream automation parses this final line via exact string match — do not vary the format.

      step_emit_resource_map:
        skip_when: "config.fanout is present"
        action: "Emit {state_paths.resource_map_output} from converged review deltas unless config.resource_map.emit is false"
        dry_run_boundary: "reducer-refresh"
        command: "node .skilled/skills/system-deep-loop/runtime/scripts/reduce-state.cjs {spec_folder} {reducer_artifact_arg} --create-missing-anchors --emit-resource-map"
        read:
          - "{state_paths.config}"
          - "{state_paths.delta_dir}/iter-*.jsonl"
        write:
          - "{state_paths.resource_map_output}"
        guarantee: "Reducer skips cleanly when config.resource_map.emit == false and writes a deterministic resource-map when enabled."
        note: "A fan-out root has no root state log before closeout, so the root reducer would fail on the missing file. Each lineage emits its own map, so the report names the ones that exist at {artifact_dir}/lineages/*/resource-map.md."

      step_resource_map_coverage_gate:
        action: "If resource_map_present, compute the Resource Map Coverage Gate synthesis inputs; otherwise preserve the skip note"
        note: "Cross-check target_files from {spec_folder}/applied/T-*.md against {spec_folder}/resource-map.md. Report touched entries, untouched entries split into expected-by-scope vs gap, and implementation paths absent from the map. Findings raised here use category resource-map-coverage with severity calibrated to the gate outcome."

      step_compile_review_report:
        action: "Compile review/review-report.md with 9 core sections, a conditional Resource Map Coverage Gate section, and an embedded Planning Packet"
        dry_run_boundary: "state-mutation"
        instructions: |
          **Zero-iteration stop:** When {state_paths.state_log} holds no line with type "iteration" (on a fan-out root, when none of the lineage state logs under {state_paths.packet_dir}/lineages/ holds one), the review did not run, and the report says so instead of reporting on work that never happened:
             - Executive Summary: open with `Review did not run`, state the stop reason and `0 iterations dispatched`, keep the verdict and hasAdvisories bound by step_derive_verdict unchanged, and state that the P0/P1/P2 counts mean not examined rather than clean.
             - Planning Trigger: state that `/speckit:plan` is not required, and set the Planning Packet to `triggered: false` and `reviewDidNotRun: true` with `remediationWorkstreams: []`, keeping every other required key from section 2 at an empty value.
             - Next step: name `/deep:review` again with a duration budget or iteration cap that allows at least one pass.
             - Sections 3 to 8: give each a single line saying the review did not run.

          Create review/review-report.md with the following sections:

          1. **Executive Summary**
             - Overall verdict: PASS | CONDITIONAL | FAIL
             - hasAdvisories: true when PASS carries active P2 items
             - P0/P1/P2 counts: {active_p0}, {active_p1}, {active_p2}, the counts the verdict used, stated as such
             - Self-check outcomes: each finding the adversarial self-check confirmed, downgraded or called a false positive. On a single-executor run the counts above already reflect them, so list them for reference
             - Review scope summary
             - Operator review focus: config.reviewFocus verbatim, or omit this line when it is null

          2. **Planning Trigger**
             - State whether `/speckit:plan` is required
             - Include a fenced `json` block labeled `Planning Packet`
             - The packet MUST include: `triggered`, `verdict`, `hasAdvisories`, `activeFindings`, `remediationWorkstreams`, `specSeed`, `planSeed`, `findingClasses`, `affectedSurfacesSeed`, `fixCompletenessRequired`
             - Build `activeFindings`, `findingClasses`, and `affectedSurfacesSeed` from reducer-owned state plus iteration JSONL `findingDetails`; if a field is missing, mark it `UNKNOWN` instead of inferring it from prose

          3. **Active Finding Registry**
             - Unified registry for active P0/P1/P2 findings
             - For each: ID, severity, title, dimension, file:line, evidence, impact, fix recommendation, disposition, findingClass, scopeProof, affectedSurfaceHints

          4. **Remediation Workstreams**
             - Ordered action groups: P0 first, then P1, with P2 advisories separated

          5. **Spec Seed**
             - Concrete seed bullets for follow-on spec updates

          6. **Plan Seed**
             - Concrete starter tasks for `/speckit:plan`

           7. **Traceability Status**
              - Summarize required core protocols first, then applicable overlay protocols
              - Include status, evidence, and any unresolved drift per protocol
              - Include `AC_COVERAGE` status for lifecycle-active spec-folder targets: exempt, disabled, pass, or advisory-shortfall, with covered/total and floor when available

          If `resource_map_present` is true, insert **## Resource Map Coverage Gate** after `Traceability Status` with exactly three bullets:
             - `Entries touched`: count of resource-map paths that appear in applied reports
             - `Entries not touched`: paths in resource-map not in implementation, labeled `expected-by-scope` or `gap`
             - `Implementation paths absent from resource-map`: `target_files` in applied reports not on the map

          8. **Deferred Items**
             - Advisory-only or backlog-worthy follow-ups that do not block the current verdict

          **Dimension Expansion Map**
             - Insert `## Dimension Expansion Map` after Deferred Items and before Search Ledger.
             - Render reducer-owned `divergence.saturatedDirections`, completed pivots, failed pivots, audited overrides, Council artifact references, selected review directions, and remaining frontier.
             - This section records breadth only. It cannot alter the Executive Summary verdict, hasAdvisories, finding registry, or adversarial self-check results.

          9. **Search Ledger**
             - Always include this section before the appendix.
             - Render reducer-owned `searchCoverage`, `candidateCoverage`, `searchDebt`, `ruledOutCandidates`, and `cleanSearchProof`.
             - If all arrays are empty or absent, include: `*No search-depth state captured (legacy v1 record)*`.
             - When `searchDebt` is non-empty, state hasSearchDebt: true. The verdict already counts it: CONDITIONAL unless an active P0 or a failed gate makes it FAIL. When debt is the only reason for CONDITIONAL, the next step is another /deep:review over the deferred or blocked bug classes, not /speckit:plan.

          10. **Audit Appendix**
             - Convergence summary, coverage summary, ruled-out claims, sources reviewed
             - Cross-reference appendix MUST be split into `Core Protocols` and `Overlay Protocols`

          Preserve machine-owned markers so the reducer-owned registry, dashboard, and strategy anchors can be refreshed on re-run without mutating prior synthesis. (Note: a `completed-continue` extension keeps the prior review report as `review-report-v{generation}-r{continuedFromRun}.md` before re-synthesis. See `deep-review/references/protocol/loop-protocol.md §Lifecycle Branches`.)
        output: "{state_paths.review_output}"

      step_derive_release_readiness_state:
        action: "Bind release-readiness state from final review results"
        algorithm: |
          if active_p0 > 0:
            release_readiness_state = "release-blocking"
          elif reason == "converged" and verdict in ["PASS", "CONDITIONAL"]:
            release_readiness_state = "converged"
          else:
            release_readiness_state = "in-progress"
        outputs:
          - release_readiness_state: "in-progress | converged | release-blocking"
        note: "State meanings follow releaseReadinessStates in deep-review/assets/review-mode-contract.yaml."

      step_convergence_report:
        action: "Append convergence report to JSONL"
        dry_run_boundary: "state-mutation"
        command: |
          GATEWAY=".skilled/skills/system-deep-loop/runtime/scripts/append-mode-event.cjs"
          [ -f "$GATEWAY" ] || GATEWAY="scripts/append-mode-event.cjs"
          EVENT_DIR="$(mktemp -d "${TMPDIR:-/tmp}/deep-review-synthesis.XXXXXX")"
          CLOSEOUT=".skilled/skills/system-deep-loop/runtime/scripts/synthesis-closeout.cjs"
          [ -f "$CLOSEOUT" ] || CLOSEOUT="scripts/synthesis-closeout.cjs"
          node "$CLOSEOUT" --mode review --event-dir "$EVENT_DIR" \
            --artifact-dir "{state_paths.packet_dir}" \
            --state-log "{state_paths.state_log}" \
            --registry "{state_paths.findings_registry}" \
            --output "{state_paths.review_output}" \
            --dashboard "{state_paths.dashboard}" \
            --stop-reason "{reason}" \
            --active-p0 "{active_p0}" --active-p1 "{active_p1}" --active-p2 "{active_p2}" \
            --dimension-coverage "{dimension_coverage}" \
            --verdict "{verdict}" \
            --release-readiness-state "{release_readiness_state}"
          NODE_STATUS=$?
          for eventFile in "$EVENT_DIR"/*.json; do
            [ -e "$eventFile" ] || continue
            node "$GATEWAY" --mode review --run-directory "$(dirname "{state_paths.state_log}")" --event-json "$eventFile"
            GATEWAY_STATUS=$?
            if [ "$GATEWAY_STATUS" -ne 0 ]; then
              rm -rf "$EVENT_DIR"
              exit "$GATEWAY_STATUS"
            fi
          done
          rm -rf "$EVENT_DIR"
          exit "$NODE_STATUS"
        note: "Emit as numeric ratio (e.g., 0.75), not quoted string. Compute: dimensions_covered / total_dimensions."

      step_update_config_status:
        action: "Mark config as complete"
        dry_run_boundary: "state-mutation"
        edit: "{state_paths.config}"
        set_field: { status: "complete" }

      step_stage_artifact_dir:
        skip_when: "config.fanout_lineage_artifact_dir is present"
        action: "Stage all skill-owned artifacts under artifact_dir for the operator's next git commit"
        dry_run_boundary: "state-mutation"
        command: "git add {state_paths.artifact_dir}"
        note: "Staging the whole artifact_dir keeps the iteration trail (iterations/, deltas/, state.jsonl, strategy, findings-registry, and the report) together; the operator keeps commit authority and can `git restore --staged {path}` before committing. Failure is non-fatal -- log warning and continue."
        on_fail: "Log warning. Do not block synthesis. The artifact_dir may be outside a git repo (e.g., temp test fixture) which is a valid case."

      # ─── APPROVAL GATE: Post-Synthesis ───
      gate_post_synthesis:
        applies_to: confirm
        type: approval_gate
        purpose: "Show review/review-report.md summary and get approval"
        present: |
          ## Review Synthesis Complete

          **review/review-report.md** has been compiled with findings from {iteration_count} iterations.
          **Verdict**: {verdict} | **hasAdvisories**: {has_advisories}
          **Active Findings**: P0={active_p0} P1={active_p1} P2={active_p2}
          **Dimension Coverage**: {dimension_coverage}

          Review `{state_paths.review_output}` before deciding next steps.

          Options:
          A) Approve and save to memory
          B) Generate remediation plan (creates action items for /speckit:plan)
          C) Request revisions to review/review-report.md
          D) Skip memory save
        wait_for: "User response"
        after_gate_refresh_lock: gate_defaults.after_gate_refresh_lock
        on_A: { proceed_to: phase_save }
        on_B: { action: "Generate remediation plan section, then save to memory", proceed_to: phase_save }
        on_C: { action: "Apply user revisions", return_to: gate_post_synthesis }
        on_D: { proceed_to: completion }

  # ════════
  # PHASE 4: SAVE
  # ════════
  phase_save:
    purpose: Preserve review context in packet continuity
    steps:

      step_compose_save_payload:
        action: "Compose the structured JSON payload consumed by generate-context.js"
        dry_run_boundary: "state-mutation"
        output: "/tmp/save-context-data-<session-id>.json"
        requirements:
          - "Write this file before invoking generate-context.js; the loader fails closed if the explicit JSON file is absent."
          - "Include `specFolder`, a concise `sessionSummary`, curated `observations`, `recent_context`, `toolCalls`, and `exchanges` from the completed review loop. Without `--full-auto` the writer only plans, and a full-auto save writes continuity only from `recent_action`, `next_safe_action`, `blockers` and `key_files`, so the payload carries all four."
          - "Use a session-scoped temp filename; do not use the retired shared `/tmp/save-context-data.json` path."
        example_payload: |
          {
            "specFolder": "{spec_folder}",
            "sessionSummary": "Deep review completed; see review/review-report.md for verdict, findings, and workstreams.",
            "observations": ["Summarize the active findings, verdict, and remediation guidance."],
            "recent_context": ["Point to the generated review artifacts and next action."],
            "exchanges": [],
            "toolCalls": [],
            "recent_action": "Deep review finished with verdict {verdict} after {iteration_count} iterations",
            "next_safe_action": "Act on the verdict in review/review-report.md",
            "blockers": [],
            "key_files": ["review/review-report.md"]
          }

      step_generate_context:
        action: "Route continuity content into the correct canonical spec document via generate-context.js"
        dry_run_boundary: "state-mutation"
        command: "node .skilled/skills/system-spec-kit/runtime/cli/dist/continuity/generate-context.js /tmp/save-context-data-<session-id>.json {spec_folder} --full-auto"
        critical_rule: "NEVER manually author files under retired memory/ paths (the runtime rejects them); use generate-context.js so the save routes into decision-record.md, implementation-summary.md, or handover.md"

      step_verify_save:
        action: "Verify canonical save routed content into the correct spec document"
        check: "Does {spec_folder}/implementation-summary.md, {spec_folder}/decision-record.md, or {spec_folder}/handover.md carry the new continuity update?"
        on_fail: "Log warning but do not block completion"

      step_release_lock:
        action: "Release the single-writer lock after save, skip-save, or cancellation cleanup has resolved"
        dry_run_boundary: "state-mutation"
        command: "node .skilled/skills/system-deep-loop/runtime/scripts/loop-lock.cjs release --lock-path {state_paths.lock_file} --owner-pid {captured_owner_pid} --nonce {captured_acquire_nonce}"
        bookkeeping_log: '{"type":"event","event":"lock_released","path":"{state_paths.lock_file}","releasePhase":"save","timestamp":"{ISO_8601_NOW}"}'

  # ════════
  # COMPLETION
  # ════════
  completion:
    message: |
      Deep review complete.
      Iterations: {iteration_count} | Stop reason: {reason}
      Findings: P0={active_p0} P1={active_p1} P2={active_p2}
      Verdict: {verdict} | hasAdvisories={has_advisories}

      Artifacts:
        - review/review-report.md (compiled from {iteration_count} iterations)
        - {iteration_count} iteration files in review/iterations/
        - State files in review/: deep-review-config.json, deep-review-state.jsonl, deep-review-findings-registry.json, deep-review-strategy.md, deep-review-dashboard.md
        - Memory context saved

      STATUS=OK PATH={spec_folder}
    next_steps:
      - "/speckit:plan [remediation] (if FAIL or CONDITIONAL verdict)"
      - "/create:changelog (if PASS, including PASS with hasAdvisories=true)"
      - "/deep:review [target] (for another review)"
      - "/speckit:save {spec_folder} (refresh canonical continuity before the next session)"

# ────────
# ERROR RECOVERY
# ────────
error_recovery:
  agent_dispatch_timeout: "Retry once with reduced scope (fewer files per iteration). If second timeout, mark as 'timeout' and continue."
  state_file_missing: "If JSONL missing during loop, reconstruct from iteration files. If strategy missing, create minimal version."
  consecutive_failures: "See step_check_convergence rule 1a. The script counts trailing failed iterations from the state log and returns stop reason error."
  continuity_save_failure: "Preserve the review packet in review/ as backup. Log warning."

# ────────
# RULES
# ────────
rules:
  DRY_RUN_OVERRIDES:
    - "When dry_run is true, dry_run_control overrides default dispatch, write, reducer, continuity-save, and child-spawn requirements."
    - "Dry-run preview events are emitted to terminal output only and are not persisted."
  ALWAYS:
    - follow_workflow_phases_in_order
    - dispatch_deep_review_agent_per_iteration
    - check_convergence_before_each_iteration
    - write_all_state_to_files
    - write_continuity_after_synthesis
    - respect_max_iterations_cap
    - treat_review_target_as_read_only
    - deduplicate_findings_before_synthesis
    - run_adversarial_selfcheck_on_p0_p1
  NEVER:
    - skip_convergence_check
    - dispatch_non_leaf_agents
    - hold_iteration_findings_in_memory_only
    - modify_config_after_initialization
    - overwrite_jsonl_state_log
    - proceed_without_state_file_verification
    - modify_files_under_review
    - report_p0_without_file_line_evidence

# ────────
# REFERENCE-ONLY APPENDIX
# ────────
reference_only_appendix:
  checkpoint_commit:
    note: "Checkpoint commits are intentionally excluded from workflow.steps."
    commands:
      - "git add {state_paths.iteration_pattern} {state_paths.state_log} {state_paths.findings_registry} {state_paths.strategy} {state_paths.review_output}"
      - 'git commit -m "chore(deep-review): iteration {NNN} complete" -m "{one-line summary of what the iteration found}"'
  severity_weights:
    note: "Severity weights for newFindingsRatio calculation"
    weights:
      P0: 10.0
      P1: 5.0
      P2: 1.0
    p0_override: "If ANY new P0 discovered → newFindingsRatio = max(calculated, 0.50). A single new P0 blocks convergence."
    clean_pass: "If total_findings == 0 (clean pass) → newFindingsRatio = 0.0"
  review_dimensions:
    note: "The four canonical review dimensions in priority order; each configured custom dimension follows them under the custom rubric row"
    dimensions:
      - { priority: 1, name: "correctness", checks: "Logic, state flow, edge cases, error handling" }
      - { priority: 2, name: "security", checks: "Auth, input/output safety, data exposure, permissions" }
      - { priority: 3, name: "traceability", checks: "Spec/checklist alignment, cross-reference integrity, evidence coverage" }
      - { priority: 4, name: "maintainability", checks: "Patterns, documentation quality, safe follow-on change clarity" }
      - { priority: 5, name: "<custom>", checks: "A configured custom dimension: review the target for the property its name states, under the shared P0-P2 doctrine. It follows the canonical four in configured order and is not required for severity coverage." }
  cross_reference_protocols:
    note: "Cross-reference verification protocols split into core and overlay classes"
    core_protocols:
      - { check: "Spec vs Code", source: "spec.md claims", target: "implementation" }
      - { check: "Checklist vs Evidence", source: "[x] items", target: "cited evidence" }
    overlay_protocols:
      - { check: "SKILL.md vs Agent", source: "Skill contracts", target: "agent files" }
      - { check: "Agent Cross-Runtime", source: ".claude", target: ".opencode/.agents" }
      - { check: "Feature Catalog vs Code", source: "Catalog claims", target: "implementation" }
      - { check: "Playbook vs Support", source: "Scenario preconditions", target: "actual support" }
