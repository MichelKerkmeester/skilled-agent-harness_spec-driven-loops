# ─────────────────────────────────────────────────────────────────
# DOCTOR ROUTER — CANONICAL ROUTE MANIFEST
# ─────────────────────────────────────────────────────────────────
# Source of truth for the routed doctor commands. Each route names the command
# that owns it, so one manifest serves every router. The list below is every one of
# the 14 router files in this folder, in no particular order:
#   /doctor:speckit         .skilled/commands/doctor/speckit.md
#   /doctor:skill-advisor   .skilled/commands/doctor/skill-advisor.md
#   /doctor:deep-loop       .skilled/commands/doctor/deep-loop.md
#   /doctor:runtime-mirrors .skilled/commands/doctor/runtime-mirrors.md
#   /doctor:sk-code         .skilled/commands/doctor/sk-code.md
#   /doctor:git             .skilled/commands/doctor/git.md
#   /doctor:ci              .skilled/commands/doctor/ci.md
#   /doctor:sk-skill        .skilled/commands/doctor/sk-skill.md
#   /doctor:agents-md       .skilled/commands/doctor/agents-md.md
#   /doctor:setup           .skilled/commands/doctor/setup.md
#   /doctor:helper          .skilled/commands/doctor/helper.md
#   /doctor:env             .skilled/commands/doctor/env.md
#   /doctor:update          .skilled/commands/doctor/update.md
#   /doctor:mcp             .skilled/commands/doctor/mcp.md
# A command that owns one route needs no positional target.
# Validated by: .skilled/commands/doctor/scripts/route-validate.sh
# Consumed by: .skilled/skills/system-skill-advisor/runtime/scripts/command-bridges/derive-command-bridges.cjs
#   turns every route, every standalone command and every mcp_subroutes
#   entry into one advisor command bridge, copies its trigger_phrases into
#   the TypeScript scorer and its runnable command into the Python slash
#   markers and the brief's lookup. A bridge routes only once
#   scoring-compatibility.json beside the deriver activates it. Doctor
#   dispatch itself stays argv-driven (see each router).
#
# Schema (per route):
#   command:          string — the doctor command that owns the route
#   target:           string — positional name the user types
#   yaml:             string — YAML asset filename in assets/
#   setup_vars:       list   — variables the router resolves and passes to YAML
#   allowed_flags:    list   — per-target flag schema (target-first parsing)
#   mutating:         enum   — read-only | add-only | mutates
#   gate3_location:   string — concrete mutation target (or "n/a" for read-only)
#   mcp_tools:        list   — subset of router's frontmatter allowed-tools union
#   trigger_phrases:  list   — diagnostic routing phrases for this target, three or
#                              more words each; the bridge deriver copies them
#                              into the advisor (see "Consumed by" above)
#   default_target:   bool   — optional; true marks the read-only target a bare typed command
#                              should suggest (the router's no-token target, or its read-only
#                              entry point), so /doctor:ci alone also reaches this route's
#                              advisor bridge. At most one per command, only on a command with
#                              several targets, and never on a mutating route.
#   lead_phrases:     list   — optional subset of trigger_phrases that puts this bridge ahead of a passing skill when the prompt contains the phrase. Use it only where the doctor command must lead the skill.
#
# Skill-advisor recommendation tools are registered through system-skill-advisor.
# To add a new target:
#   1. Append the route here with its owning command and trigger_phrases of three or more words. Add lead_phrases only for a phrase where the doctor command must rank above a passing skill.
#   2. List the target in that command's router and presentation, and add its row to the /doctor:setup target list in .skilled/commands/doctor/assets/doctor-setup-presentation.txt.
#   3. To let the advisor suggest it, add its activation entry to both the "typescript" and "python" lists in .skilled/skills/system-skill-advisor/runtime/scripts/command-bridges/scoring-compatibility.json. A bridge without one stays inactive.
#   4. Rerun node .skilled/skills/system-skill-advisor/runtime/scripts/command-bridges/derive-command-bridges.cjs, then bash .skilled/commands/doctor/scripts/route-validate.sh and node .skilled/commands/doctor/scripts/doctor-phrase-reach.cjs.
#   5. /doctor:helper needs no edit: it ranks this manifest at run time, and its contract test fails until the new route is reachable and listed in the /doctor:setup target list.
# To remove a target: delete the route AND its corresponding assets/doctor-<target>.yaml.
# ─────────────────────────────────────────────────────────────────
schema_version: 1
routes:
  - command: /doctor:speckit
    target: speckit-retrieval
    yaml: doctor-speckit-retrieval.yaml
    setup_vars: [execution_mode, intent]
    allowed_flags: []
    mutating: add-only
    gate3_location: "<packet_scratch>/doctor-speckit-retrieval-report.<timestamp>.md + <packet_scratch>/doctor-speckit-retrieval-state.<timestamp>.json + <packet_scratch>/doctor-speckit-retrieval-moved.<timestamp>.txt"
    mcp_tools: []   # file-and-script diagnostic; no MCP calls and no background service
    script_invocations:
      - 'node .skilled/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs --check --json  # the staleness verdict: exit 0 = fresh, 1 = stale documents named, 2+ = unreadable index; writes nothing'
      - 'node .skilled/skills/system-spec-kit/runtime/cli/retrieval/lookup-trigger-index.mjs --json -- "resume work session context"  # index present AND lookup runs: exit 0 = hits, 1 = clean no-hit, 2+ = missing or unreadable index, reported with stderr and never as a no-hit'
      - "rg --no-config --hidden --files-with-matches --max-count 1 --fixed-strings --ignore-case --glob '*.md' --glob '!**/z_archive/**' --glob '!**/node_modules/**' --glob '!**/.git/**' --glob '!**/scratch/**' -- 'trigger index generator' specs .skilled  # the section 2.2 recipe, flags verbatim"
      - 'node .skilled/skills/sk-doc/shared/scripts/cite-drift-scan.mjs --corpus <all|skills> --moved  # the citation-drift census, run only when the operator picks a scope at the citation_drift_scope gate; zero model calls, writes nothing, exit 2 = bad invocation or unreadable redirect table'
    trigger_phrases:
      - "trigger index drift"
      - "trigger index lookup fails"
      - "retrieval conventions doctor"
      - "ripgrep recipe check"
      - "citation drift summary"

  - command: /doctor:deep-loop
    target: deep-loop
    yaml: doctor-deep-loop.yaml
    setup_vars: [execution_mode, intent, scope]
    allowed_flags: ["--scope=research|review|council|both|all"]
    mutating: add-only
    gate3_location: "<active-spec-folder>/scratch/doctor-deep-loop-state.<timestamp>.json"
    mcp_tools: []
    script_invocations:
      - 'node .skilled/skills/system-deep-loop/runtime/scripts/status.cjs --spec-folder "{spec_folder}" --loop-type "{loop_type}" --session-id "{session_id}" --read-only'
      - 'node .skilled/skills/system-deep-loop/runtime/scripts/query.cjs --spec-folder "{spec_folder}" --loop-type "{loop_type}" --session-id "{session_id}" --query-type "{query_type}" --limit 50 --read-only'
      - 'node .skilled/skills/system-deep-loop/runtime/scripts/convergence.cjs --spec-folder "{spec_folder}" --loop-type "{loop_type}" --session-id "{session_id}" --iteration "{latest_iteration}" --read-only'
      - 'node .skilled/skills/system-spec-kit/runtime/cli/rules/check-source-tags-helper.mjs "{spec_folder}"  # [SOURCE:] tag resolution per lineage; writes nothing, zero model calls'
    trigger_phrases:
      - "deep-loop coverage graph check"
      - "deep-loop graph empty or stale"
      - "deep-research convergence drift"
      - "deep-review iteration graph"
      - "deep loop convergence check"

  - command: /doctor:skill-advisor
    target: tune
    yaml: doctor-skill-advisor-tune.yaml
    setup_vars: [execution_mode, scope, skip_tests, dry_run]
    allowed_flags: ["--skip-tests", "--dry-run", "--scope=all|explicit|derived|lexical"]
    mutating: mutates
    gate3_location: ".skilled/skills/system-skill-advisor/runtime/lib/scorer/lanes/explicit.ts + .skilled/skills/system-skill-advisor/runtime/lib/scorer/lanes/lexical.ts + .skilled/skills/*/graph-metadata.json"
    cli_commands:
      - 'node .skilled/bin/skill-advisor.cjs advisor_recommend --prompt "<prompt>" --format json --warm-only'
      - 'node .skilled/bin/skill-advisor.cjs advisor_status --workspace-root "$PWD" --format json --warm-only'
      - 'node .skilled/bin/skill-advisor.cjs advisor_validate --confirm-heavy-run true --format json'
      - 'node .skilled/bin/skill-advisor.cjs advisor_rebuild --trusted --force true --format json'
      - 'node .skilled/bin/skill-advisor.cjs skill_graph_scan --trusted --format json'
      - 'node .skilled/bin/skill-advisor.cjs skill_graph_validate --format json --warm-only'
      - 'node .skilled/bin/skill-advisor.cjs skill_graph_query --queryType <depends_on|dependents|enhances|enhanced_by|family_members|conflicts|transitive_path|hub_skills|orphans|subgraph> --format json'
      - 'node .skilled/bin/skill-advisor.cjs skill_graph_status --format json --warm-only'
    mcp_tools: []   # CLI front door only, no MCP calls
    script_invocations:
      - 'Warm-only: probe the existing system-skill-advisor IPC socket first. Only when it answers, run node .skilled/bin/skill-advisor.cjs skill_graph_status --format json --warm-only. The flag guarantees no daemon start. Exit 75 means backend unavailable and retryable.'
    trigger_phrases:
      - "skill advisor scoring"
      - "advisor recommendation tuning"
      - "skill advisor recommends the wrong skill"

  - command: /doctor:skill-advisor
    target: rebuild
    yaml: doctor-skill-advisor-rebuild.yaml
    setup_vars: [execution_mode, dry_run]
    allowed_flags: ["--dry-run"]
    mutating: mutates
    gate3_location: ".skilled/skills/system-skill-advisor/runtime/database/skill-graph.sqlite (backed up beside itself before the rebuild)"
    cli_commands:
      - 'node .skilled/bin/skill-advisor.cjs advisor_status --workspace-root "$PWD" --format json --warm-only'
      - 'node .skilled/bin/skill-advisor.cjs advisor_rebuild --trusted --force true --format json'
      - 'node .skilled/bin/skill-advisor.cjs skill_graph_scan --trusted --format json'
      - 'node .skilled/bin/skill-advisor.cjs skill_graph_validate --format json --warm-only'
    mcp_tools: []   # CLI front door only, no MCP calls
    trigger_phrases:
      - "skill advisor rebuild"
      - "rebuild the skill graph database"
      - "rerun the skill_graph scan"
      - "new skill not appearing in advisor results"

  - command: /doctor:skill-advisor
    target: skill-budget
    yaml: doctor-skill-budget.yaml
    setup_vars: [execution_mode, json_output, top_n, fail_over, project_ceiling]
    allowed_flags: ["--json", "--top-n=N", "--fail-over=N", "--project-ceiling=N"]
    mutating: read-only
    gate3_location: "n/a (read-only audit; no spec folder required)"
    mcp_tools: []   # script-only audit; no MCP calls
    script_invocations:
      - 'python3 .skilled/commands/doctor/scripts/audit_descriptions.py --repo-root "$PWD"  # description-budget audit. The workflow adds --json, --top-n, --fail-over, and --project-ceiling from the resolved flags'
      - 'Warm-only: probe the existing system-skill-advisor IPC socket first; only when it answers, run node .skilled/bin/skill-advisor.cjs advisor_status --workspace-root "$PWD" --format json --timeout-ms 500 --warm-only (the flag guarantees no daemon start; exit 75 = backend unavailable, retryable)'
    trigger_phrases:
      - "skill budget audit"
      - "description budget check"
      - "skill char count drift"
      - "frontmatter description trim"
      - "skill description too long"
      - "description longer than the limit"

  - command: /doctor:skill-advisor
    target: parent-skill
    yaml: doctor-parent-skill.yaml
    setup_vars: [execution_mode, parent_skill_dir]
    allowed_flags: ["--dir=<path>"]
    mutating: read-only
    gate3_location: "n/a (read-only structural audit; inspects a parent skill's graph-metadata/registry and reports, no writes)"
    mcp_tools: []   # script-only structural audit; no MCP calls
    script_invocations:
      # The fleet class gate runs first: it starts from SKILL.md, so it is the only
      # check that can report a metadata file a root never wrote. The per-hub audit
      # then goes deep on the one directory the operator named.
      - 'node .skilled/skills/sk-doc/sk-create-skill/scripts/ci-skill-root-metadata.cjs'
      - 'node .skilled/commands/doctor/scripts/parent-skill-check.cjs "{parent_skill_dir}"'
    trigger_phrases:
      - "parent skill structure audit"
      - "nested mode packet check"
      - "mode-registry drift guard"
      - "single graph-metadata identity"
      - "skill root metadata contract"
      - "missing skill json files"

  - command: /doctor:skill-advisor
    target: skill-graph-freshness
    yaml: doctor-skill-graph-freshness.yaml
    setup_vars: [execution_mode]
    allowed_flags: []
    mutating: read-only
    gate3_location: "n/a (read-only diagnostic; 3-way diffs the skill-graph representations and reports drift, writes nothing)"
    mcp_tools: []   # script-only read; no MCP calls
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/skill-graph-freshness.cjs'
    trigger_phrases:
      - "skill graph freshness"
      - "skill-graph zombie ghost nodes"
      - "compiled vs sqlite vs disk graph drift"
      - "reindex staleness check"

  - command: /doctor:skill-advisor
    target: router-reach
    yaml: doctor-router-reach.yaml
    setup_vars: [execution_mode, hub, concurrency]
    allowed_flags: ["--hub=<skill-id>", "--concurrency=<n>"]
    mutating: read-only
    gate3_location: "n/a (read-only routing diagnostic; probes the live advisor for every declared phrase and reports, writes nothing)"
    mcp_tools: []   # spawns the advisor CLI per phrase; no MCP calls
    script_invocations:
      - 'node .skilled/skills/sk-doc/sk-create-skill/scripts/ci-router-vocabulary-reach.cjs'
      - 'node .skilled/commands/doctor/scripts/doctor-phrase-reach.cjs  # doctor bridges: every admitted manifest phrase reaches its /doctor:x bridge as the top pick or the second line; scores in process, writes nothing tracked (the freshness check may refresh a cached build record in the ignored dist folder)'
    trigger_phrases:
      - "router reach check"
      - "does a declared phrase reach its hub"
      - "router vocabulary reach"
      - "phrase reaches nobody"
      - "routing residue allowlist"

  - command: /doctor:runtime-mirrors
    target: runtime-mirrors
    yaml: doctor-runtime-mirrors.yaml
    setup_vars: [execution_mode]
    allowed_flags: []
    mutating: read-only
    gate3_location: "n/a (read-only mirror-parity diagnostic; every checker runs in its check-only form and writes nothing)"
    mcp_tools: []   # script-only mirror parity read; no MCP calls
    script_invocations:
      - 'node .skilled/skills/system-spec-kit/runtime/cli/runtime-mirrors/sync-runtime-mirrors.cjs --check'
      - 'node .skilled/skills/system-spec-kit/runtime/cli/codex/sync-agents.cjs --check'
      - 'node .skilled/skills/system-spec-kit/runtime/cli/codex/sync-prompts.cjs --check'
      - 'node .skilled/skills/system-spec-kit/runtime/cli/pi/sync-agents-pi.cjs --check'
      - 'node .skilled/skills/system-spec-kit/runtime/cli/pi/sync-prompts-pi.cjs --check'
      - 'node .skilled/skills/system-spec-kit/runtime/cli/hermes/sync-skills-hermes.cjs --check  # n/a, not run, while .hermes/ is absent'
      - 'node .skilled/skills/system-spec-kit/runtime/cli/hermes/sync-prompts-hermes.cjs --check  # n/a, not run, while .hermes/ is absent'
      - 'node .skilled/commands/doctor/scripts/agent-roster-mirror-check.cjs'
      - 'node .skilled/commands/doctor/scripts/command-catalog-mirror-check.cjs'
      - 'node .skilled/bin/install-codex-hooks.mjs --check --allow-worktree'
    trigger_phrases:
      - "runtime mirror drift"
      - "agent command mirror parity"
      - "command catalog drift"
      - "cursor devin codex sync check"
      - "discovery mirror out of sync"
      - "hermes prompt copy drift"
      - "runtime copies drift from source"
      - "runtime prompts out of date after a pull"

  - command: /doctor:sk-code
    target: setup
    default_target: true
    yaml: doctor-sk-code-setup.yaml
    setup_vars: [execution_mode, prompt]
    allowed_flags: ["--prompt=<text>"]
    mutating: read-only
    gate3_location: "n/a (read-only setup battery; runs each check in its check-only form and prints repair commands, writes nothing)"
    mcp_tools: []   # script-only battery; no MCP calls
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/sk-code-setup-check.cjs  # the workflow adds --prompt=<text> when the operator passed one'
    trigger_phrases:
      - "sk-code setup check"
      - "verify my sk-code surface"
      - "sk-code battery fails"
      - "does my sk-code surface route"

  - command: /doctor:sk-code
    target: quality
    yaml: doctor-sk-code-quality.yaml
    setup_vars: [execution_mode, dry_run]
    allowed_flags: ["--dry-run"]
    mutating: mutates
    gate3_location: ".skilled/skills/sk-code/sk-code-quality/repository/quality.json, where init --apply creates it once and never overwrites it"
    mcp_tools: []   # script-only, no MCP calls
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/sk-code-quality-config.cjs status --json'
      - 'node .skilled/commands/doctor/scripts/sk-code-quality-config.cjs init --json  # a dry run, with --apply only after approval'
      - 'node .skilled/commands/doctor/scripts/sk-code-quality-config.cjs check --json'
    trigger_phrases:
      - "sk-code quality config"
      - "create the quality config file"
      - "quality json is missing"
      - "which checks does the quality gate run"
      - "add my lint command to the quality gate"

  - command: /doctor:git
    target: hooks
    yaml: doctor-git-hooks.yaml
    setup_vars: [execution_mode, dry_run]
    allowed_flags: ["--dry-run"]
    mutating: mutates
    gate3_location: "git config speckit.hooks.<key> in the repository's local config or the operator's global config"
    mcp_tools: []   # script-only; no MCP calls
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/git-hook-gates.cjs list --json'
      - 'node .skilled/commands/doctor/scripts/git-hook-gates.cjs set <key> on|off --scope local|global --json  # a dry run; the workflow adds --apply only after the plan is approved'
      - 'bash .skilled/scripts/install-git-hooks.sh --status'
    trigger_phrases:
      - "turn off a git hook check"
      - "disable comment hygiene gate"
      - "pre-commit gate keeps blocking"
      - "git hook settings"
    lead_phrases:
      - "disable comment hygiene gate"

  - command: /doctor:git
    target: standards
    yaml: doctor-git-standards.yaml
    setup_vars: [execution_mode, dry_run]
    allowed_flags: ["--dry-run"]
    mutating: mutates
    gate3_location: ".sk-git/ at the repository root (or the directory git config skgit.contractDir names); the shipped sk-git templates are never written"
    mcp_tools: []   # script-only; no MCP calls
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/git-standards.cjs status --json'
      - 'node .skilled/commands/doctor/scripts/git-standards.cjs init --json  # a dry run; --apply after approval'
      - 'node .skilled/commands/doctor/scripts/git-standards.cjs set <kind> <dotted.path> <json-value> --json  # a dry run; --apply after approval'
      - 'node .skilled/commands/doctor/scripts/git-standards.cjs disable <kind> --json  # a dry run; --apply after approval'
      - 'node .skilled/commands/doctor/scripts/git-standards.cjs check --json'
      - 'node .skilled/skills/sk-git/scripts/validate-message.mjs --explain'
    trigger_phrases:
      - "change commit message rules"
      - "allow longer commit subjects"
      - "stop checking pr descriptions"
      - "branch name pattern rules"
      - "customize sk-git standards"

  - command: /doctor:git
    target: setup
    default_target: true
    yaml: doctor-git-setup.yaml
    setup_vars: [execution_mode, tool]
    allowed_flags: ["--tool=<claude|codex|devin|cursor|opencode|pi|hermes>"]
    mutating: read-only
    gate3_location: "n/a (read-only setup battery; inspects each sk-git surface in its check-only form and prints repair commands, writes nothing)"
    mcp_tools: []   # script-only battery; no MCP calls
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/git-setup-check.cjs  # the workflow adds --tool=<name> for the AI tool running it'
    trigger_phrases:
      - "sk-git setup check"
      - "is my sk-git setup working"
      - "which git rules are live"
      - "check my git hooks setup"

  - command: /doctor:setup
    target: setup
    yaml: doctor-setup.yaml
    setup_vars: [execution_mode]
    allowed_flags: []
    mutating: read-only
    gate3_location: "n/a (read-only umbrella; lists every doctor target and runs each existing check in its check-only form, writes nothing)"
    cli_commands:
      - 'node .skilled/bin/skill-advisor.cjs advisor_status --workspace-root "$PWD" --format json --timeout-ms 500 --warm-only'
    mcp_tools: []   # script-only umbrella; the advisor leg goes through the CLI front door with --warm-only
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/sk-code-setup-check.cjs'
      - 'node .skilled/commands/doctor/scripts/git-setup-check.cjs  # the workflow adds --tool=<name> for the AI tool running it, when the battery knows that tool'
      - 'node .skilled/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs --check --json  # staleness verdict only; writes nothing'
      - 'node .skilled/skills/system-spec-kit/runtime/cli/runtime-mirrors/sync-runtime-mirrors.cjs --check'
    trigger_phrases:
