    target: helper
    yaml: doctor-helper.yaml
    setup_vars: [execution_mode, problem_text, json_output, area, intent]
    allowed_flags: ["--json"]
    mutating: read-only
    gate3_location: "n/a (read-only matcher; it ranks the manifest, runs a read-only pick under that command's own router and prints a writing pick as one line for the operator)"
    mcp_tools: []   # no MCP calls and no background service; one script reads one YAML file
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/doctor-helper-match.cjs --json -- "<problem text>"  # also --table and --areas; the matcher reads the manifest and writes nothing'
    trigger_phrases:
      - "which doctor command should I run"
      - "find the right doctor command"
      - "what doctor command fixes this"

  - command: /doctor:sk-skill
    target: convert
    yaml: doctor-sk-skill-convert.yaml
    setup_vars: [execution_mode, skill_target, dry_run, scratch_dir]
    allowed_flags: ["--dry-run"]
    mutating: mutates
    gate3_location: "the staged or converted skill folder .skilled/skills/<name>/ (its SKILL.md, ROUTER.md, graph-metadata.json, leaf-manifest.config.json, scaffold files and renamed resources, or an in-place SKILL.md rewrite beside a new sibling ROUTER.md and the approved edge in its own graph-metadata.json), its backups under .skilled/skills/.state/doctor-sk-skill/<name>/<timestamp>/, the one scratch root the plain-skill path uses beside them at .skilled/skills/.state/doctor-sk-skill/<name>/scratch/ and deletes, the skill's changelog folder with its .skilled/changelog/<name> link, and the integration targets the plan records: the advisor graph .skilled/skills/system-skill-advisor/runtime/database/skill-graph.sqlite, the compiled skill-graph.json, the advisor cases file and the .hermes/skills mirror"
    mcp_tools: []   # script-only; no MCP calls
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/sk-skill-convert.cjs plan "{skill_target}"  # read-only: resolves the target, classifies the input and prints the plan, the follow-ups and the backup folder; a plain skill refuses here until its intent phrases are approved'
      - 'node .skilled/commands/doctor/scripts/sk-skill-convert.cjs apply "{skill_target}" <the approved flags>  # the plan rerun: the same call without the write switch prints the plan and writes nothing, so the workflow reruns with repeated --approved-phrase, --description-trim, --allowed-tools, --edge and --agent-output and shows that plan'
      - 'node .skilled/commands/doctor/scripts/sk-skill-convert.cjs preserve --snapshot "{scratch_dir}/snapshot" "{scratch_dir}/staging"  # read-only: proves the agent-produced prose kept every original body line before the format gate, from the one scratch root'
      - 'node .skilled/commands/doctor/scripts/sk-skill-convert.cjs apply "{skill_target}" --apply  # the same plan, then the backup and the writes; the workflow adds the approved --approved-phrase, --description-trim, --allowed-tools, --edge and --agent-output flags and runs it only after an explicit yes'
      - 'node .skilled/commands/doctor/scripts/sk-skill-check.cjs .skilled/skills/<name> --json  # the post-write re-read through the read-only check engine, at the converted root: the staged root for a plain skill, the skill folder for an in-place conversion'
    trigger_phrases:
      - "convert a skill to the skilled format"
      - "convert a plain agent skill"
      - "turn my old skill into a skilled skill"
      - "skill format conversion plan"
      - "move the machine router out of a skill"
      - "skill folder conversion with a backup"

  - command: /doctor:agents-md
    target: check
    default_target: true
    yaml: doctor-agents-md-check.yaml
    setup_vars: [execution_mode, root, json_output]
    allowed_flags: ["--json", "--root <dir>"]
    mutating: read-only
    gate3_location: "n/a (read-only diagnostic; the engine reads the root instruction file, its runtime copies and its REPO RULES.md and writes nothing)"
    mcp_tools: []   # script-only; no MCP calls
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/agents-md-check.cjs  # the workflow adds --root <dir> and --json only when the operator passed them'
    trigger_phrases:
      - "check the shipped agents instruction file"
      - "agents md section check"
      - "which agents md sections are stale"
      - "agents md delivery budget report"
      - "agents md template drift report"

  - command: /doctor:agents-md
    target: embed
    yaml: doctor-agents-md-embed.yaml
    setup_vars: [execution_mode, root, dry_run, plan_digest, digest_confirmation, keep_claude_md, create_router]
    allowed_flags: ["--dry-run", "--root <dir>", "--plan-digest <digest>", "--keep-claude-md", "--remove-claude-md", "--create-router"]
    mutating: mutates
    gate3_location: "AGENTS.md (created when absent, replaced with the shipped sections plus the composed block), CLAUDE.md and .codex/AGENTS.md (folded into the block and removed, unless --keep-claude-md), .cursor/rules/repo-local.md (the generated mirror of a non-empty block) and REPO RULES.md (missing shipped rows appended, or the file created behind --create-router), with a copy of every touched path taken to the plan's backup folder under .skilled/output/doctor-agents-md/<timestamp>/ before the first byte, and .cursor/rules/skill-routing.md rewritten by the pointer generator the engine calls; the write runs only against the plan digest the operator approved"
    mcp_tools: []   # script-only; no MCP calls
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/agents-md-embed.cjs plan  # read-only: composes every target in memory and prints the targets, the diffs, the block, the budget, the preservation ledger, the backup folder and the plan digest; the workflow adds --root <dir>, --keep-claude-md, --create-router and --dry-run only when the operator passed them'
      - 'node .skilled/commands/doctor/scripts/agents-md-embed.cjs apply --plan-digest <digest>  # recomposes, refuses a digest that no longer matches, backs up, writes only inside its own allowlist and proves the composition against the bytes on disk; the workflow runs it only after the operator approves the plan that printed that digest'
      - 'node .skilled/commands/doctor/scripts/agents-md-check.cjs  # the post-write re-read of the written repository; the workflow adds --root <dir> only when this run was pointed at another repository'
    trigger_phrases:
      - "embed the shipped instructions into agents md"
      - "add the agents md repository block"
      - "fold claude md into agents md"
      - "write the repository specific instructions block"
      - "replace agents md with the shipped template"
      - "update agents md from the shipped template"

  - command: /doctor:agents-md
    target: restore
    yaml: doctor-agents-md-restore.yaml
    setup_vars: [execution_mode, run_dir, yes, dry_run]
    allowed_flags: ["--run <dir>", "--yes", "--dry-run"]
    mutating: mutates
    gate3_location: "the paths one run's own manifest.json under its backup directory records, each one re-checked against the engine's write allowlist before it is touched: a recorded file is copied back from its copy and a path the recorded run created (an AGENTS.md, CLAUDE.md, .codex/AGENTS.md, .cursor/rules/repo-local.md or REPO RULES.md it created) is removed along with each folder the run created for it that is empty again, and the backup directory itself is read and kept"
    mcp_tools: []   # script-only; no MCP calls
    script_invocations:
      - 'node .skilled/commands/doctor/scripts/agents-md-embed.cjs restore --run=<dir> --dry-run  # prints the restore plan the record and its copies describe and writes nothing'
      - 'node .skilled/commands/doctor/scripts/agents-md-embed.cjs restore --run=<dir> --yes  # puts the recorded paths back and checks every restored file against its recorded hash; the workflow passes --yes only after its own yes'
      - 'node .skilled/commands/doctor/scripts/agents-md-check.cjs  # the post-restore re-read of the restored repository, adding --root <the recorded root> when that root is not this repository'
    trigger_phrases:
      - "undo an agents md embed run"
      - "restore agents md from the backup"
      - "roll back the instruction file write"
      - "revert agents md to the file before the embed"

# ─────────────────────────────────────────────────────────────────
# COMPANION COMMAND ROUTES (/doctor:mcp sub-actions)
# ─────────────────────────────────────────────────────────────────
# /doctor:mcp dispatches via its own command (.skilled/commands/doctor/mcp.md).
# These rows are tracked here for advisor + CI visibility only — the mcp.md
# command parses its own sub-action argv and dispatches to the right YAML.
# ─────────────────────────────────────────────────────────────────
mcp_subroutes:
  - sub_action: install
    yaml: doctor-mcp-install.yaml
    allowed_flags: ["--runtime <name>"]
    mutating: mutates
    gate3_location: "Code Mode build output, .utcp_config.json and the runtime MCP configs"
    trigger_phrases:
      - "install the MCP servers"
      - "Code Mode fresh install"
      - "reinstall Code Mode MCP"

  - sub_action: debug
    yaml: doctor-mcp-debug.yaml
    allowed_flags: ["--fix"]
    mutating: mutates
    gate3_location: "Code Mode configuration and runtime registration repair"
    trigger_phrases:
      - "Code Mode broken"
      - "debug an MCP connection"
      - "MCP connection failure"
      - "utcp config is broken"
      - "mcp-doctor.sh diagnostic script"

# ─────────────────────────────────────────────────────────────────
# STANDALONE COMMANDS (own routers, tracked here for visibility)
# ─────────────────────────────────────────────────────────────────
standalone:
  - command: /doctor:update
    file: .skilled/commands/doctor/update.md
    yaml: doctor-update-check.yaml
    mutating: mutates
    actions:
      check:
        yaml: doctor-update-check.yaml
        mutating: read-only
      align:
        yaml: doctor-update-align.yaml
        mutating: add-only
      apply:
        yaml: doctor-update-apply.yaml
        mutating: mutates
      rollback:
        yaml: doctor-update-rollback.yaml
        mutating: mutates
      record-base:
        yaml: doctor-update-record-base.yaml
        mutating: mutates
      compat:
        yaml: doctor-update-compat-action.yaml
        mutating: mutates
        trigger_phrases:
          - "spec-kit version migration"
          - "pre-v4 spec folder upgrade"
          - "move .opencode/specs to specs"
    trigger_phrases:
      - "doctor update command"
      - "update skills to latest release"
      - "skilled release update"
      - "update skilled to the latest release"
      - "check for skilled updates"
      - "is there a newer skilled release"

  - command: /doctor:env
    file: .skilled/commands/doctor/env.md
    yaml: doctor-env.yaml
    mutating: mutates
    # With no selector the router stops at a menu, so the runnable form names `list`.
    runnable: /doctor:env list
    trigger_phrases:
      - "check my environment variables"
      - "which environment variable switches are set"
      - "skilled environment switch values"
      - "environment switch inventory"
    lead_phrases:
      - "check my environment variables"
