# ─────────────────────────────────────────────────────────────────
# DOCTOR: SKILL FORMAT CONVERT (INTERACTIVE, ONE SKILL FOLDER)
# ─────────────────────────────────────────────────────────────────
role: Careful operator converting one skill to the Skilled format without losing a line of what it routes
purpose: Plan the conversion in the engine, ask each field follow-up the plan names with its own yes, rerun the plan with the approved flags, show that plan, and write only after the conversion yes, then re-read the result and print the undo block the engine printed
action: Read the engine and the target -> run the plan -> on a description or allowed-tools refusal ask that one question -> produce the plain-skill prose and prove it preserved the body -> rerun the plan with the approved flags and no other hand edit -> print that plan -> explicit yes -> apply with the same flags -> re-read through the check engine -> print the engine's undo block
skill_owner: ".skilled/skills/sk-doc/sk-create-skill/"

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: sequential_read_plan_confirmed_conversion
  compliance: MANDATORY
  execution: interactive
  approvals: one_explicit_yes_per_question_before_the_first_write
  dry_run: print_the_plan_then_status_ok_without_asking
  tracking: one_skill_folder
  validation: re_read_the_converted_skill_through_the_check_engine
  never_commit: true

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  read_only: false
  allowed_targets:
    - "the staged or converted skill folder: a plain skill is copied to .skilled/skills/<name>/ and written there (SKILL.md, ROUTER.md, graph-metadata.json, leaf-manifest.config.json, the scaffold files, the benchmark folder and every resource the plan renames), and an older Skilled skill has its own SKILL.md rewritten in place beside a new sibling ROUTER.md"
    - "the backups the engine takes before every write, under .skilled/skills/.state/doctor-sk-skill/<name>/<timestamp>/: the pre-write SKILL.md, the pre-write router inputs and the preservation snapshot of the source body and its references"
    - "the skill's changelog folder <the skill folder>/changelog/ with its v<version>.md entry, and the relative link .skilled/changelog/<name> that points at it"
    - "the integration targets the engine records in its plan: the advisor graph .skilled/skills/system-skill-advisor/runtime/database/skill-graph.sqlite through skill_graph_scan, the compiled .skilled/skills/system-skill-advisor/runtime/scripts/skill-graph.json, the advisor cases file (.skilled/skills/system-skill-advisor/runtime/scripts/fixtures/skill-advisor-regression-cases.jsonl when the root sits directly under this repository's skills root, otherwise <the skill folder>/benchmark/advisor-cases.jsonl), and the .hermes/skills/ mirror"
    - "a frontmatter field the operator approved in its own question: the trimmed description, and the allowed-tools list the operator named. Both reach SKILL.md only as engine flags, written by the engine beside the same backup"
  forbidden_targets:
    - "any skill folder other than the one named by <name-or-path>"
    - "a hub: a folder holding mode-registry.json or hub-router.json, or a folder holding a nested SKILL.md packet"
    - "an existing ROUTER.md the resolver does not read as this skill's machine router, which the conversion never replaces"
    - ".skilled/commands/doctor/scripts/sk-skill-convert.cjs and its lib/, which own the conversion and never change here"
    - "SKILL.md frontmatter fields edited by this workflow: the agent rewrites prose only, and a field change is a flag the engine applies"
    - "the git index, history and remotes"
  invariant: "Nothing under the skill folder changes until the plan has been printed and the operator has answered yes. The plan call writes nothing, the apply call writes only with --apply, and every write is preceded by a backup. A no at any question ends the run with STATUS=CANCELLED and nothing written. A rerun on a converted skill reports that no conversion is needed and writes nothing."

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  convert_engine: ".skilled/commands/doctor/scripts/sk-skill-convert.cjs"
  surface_library: ".skilled/commands/doctor/scripts/lib/sk-skill-surface.cjs"
  transforms_library: ".skilled/commands/doctor/scripts/lib/sk-skill-convert-transforms.cjs"
  integration_library: ".skilled/commands/doctor/scripts/lib/sk-skill-integrate.cjs"
  check_engine: ".skilled/commands/doctor/scripts/sk-skill-check.cjs"
  router_template: ".skilled/skills/sk-doc/sk-create-skill/assets/skill/skill-router-template.md"
  router_replay: ".skilled/skills/sk-code/sk-code-skilled/assets/scripts/router-replay-lib.cjs"
  router_resolver: ".skilled/skills/sk-code/sk-code-skilled/assets/scripts/router-file-resolver.cjs"
  presentation: ".skilled/commands/doctor/assets/doctor-sk-skill-presentation.txt"

# ─────────────────────────────────────────────────────────────────
# INPUTS
# ─────────────────────────────────────────────────────────────────
inputs:
  execution_mode: "INTERACTIVE"
  skill_target: "<name-or-path> is the one skill to convert: a name under .skilled/skills, or a path to a skill root. A path outside the skills root is a plain skill, which the engine converts by staging a copy under .skilled/skills/<name> and leaving the source folder untouched. Convert never infers the target: with no name, ask for one once and stop until it is given."
  dry_run: "--dry-run prints the plan with the follow-ups it names, then STATUS=OK without asking a question (default false). The plan call writes nothing either way; the flag only removes the questions and the write."

# ─────────────────────────────────────────────────────────────────
# REFUSALS
# ─────────────────────────────────────────────────────────────────
# The converter prints one machine code per refusal, and a refusal always means
# nothing was written. The workflow prints the reason beside the code, so an
# operator reads what stopped the run and which command takes the case instead.
# A description over the budget and a missing allowed-tools are not refusals:
# the engine names them as a follow-up, and each one is its own question in
# phase 3 rather than a stopping reason.
refusals:
  - code: PREFLIGHT_REFUSED
    reason: "SKILL.md could not be read."
    next: "Check the path resolves to a readable SKILL.md, then rerun the plan."
  - code: PREFLIGHT_REFUSED
    reason: "SKILL.md must declare a description before conversion."
    next: "Add a description line to SKILL.md, then rerun the plan."
  - code: NOT_DIRECT_CHILD
    reason: "Only a direct child of .skilled/skills can be converted."
    next: "Pass a skill root that sits directly under .skilled/skills, or a path outside it that the engine can stage."
  - code: RESERVED_PREFIX
    reason: "A local- prefixed skill is filtered by the format and advisor gates."
    next: "Rename the skill without the prefix, or leave it private and unconverted."
  - code: PERSONA_PREFIX
    reason: "An agent- prefixed skill collides with runtime persona mirrors."
    next: "Rename the skill, then rerun the plan."
  - code: NAME_NOT_KEBAB
    reason: "The declared skill name is not a lowercase kebab-case name."
    next: "Fix the name field, then rerun the plan."
  - code: NESTED_PACKETS
    reason: "Nested SKILL.md packets make this a hub candidate."
    next: "/create:skill-parent <the parent skill folder>"
  - code: HUB_DECLARATION
    reason: "Hub declaration <mode-registry.json or hub-router.json> is present; conversion does not modify hubs."
    next: "/create:skill-parent <the parent skill folder>"
  - code: HUB_DECLARATION
    reason: "The existing check classified this input as <the input kind>; hub conversion is out of scope."
    next: "/create:skill-parent <the parent skill folder>"
  - code: DUAL_DECLARATION
    reason: "Resolver verdict dual-declaration: both SKILL.md and ROUTER.md declare a machine router."
    next: "Remove one of the two declarations by hand, then rerun the plan."
  - code: NO_MACHINE_ROUTER
    reason: "Expected a Skilled skill with a machine router; resolver verdict was <the resolver verdict>."
    next: "A skill with no machine router anywhere is a plain skill: it converts only from a path outside .skilled/skills, where the engine stages a new root."
  - code: NOT_PLAIN_SKILL
    reason: "The existing check classified this outside-root input as <the input kind>; only plain skills are in scope."
    next: "Point the plan at a single plain skill folder, then rerun it."
  - code: INPUT_KIND_UNSUPPORTED
    reason: "The existing check classified this input as <the input kind>; only older Skilled skills are in scope."
    next: "Read the check input kind; a plain skill converts from an outside path, and a hub belongs to /create:skill-parent."
  - code: NAME_COLLISION
    reason: "Skill name collision: <the other root claiming the name>."
    next: "Decide which root keeps the name, then rerun the plan."
  - code: TARGET_EXISTS
    reason: "The target skill folder already exists: <the target folder>"
    next: "Convert the existing root in place, or rename the incoming skill, then rerun the plan."
  - code: SOURCE_SYMLINK
    reason: "The source tree contains a symlink (<the link>); a copy would write through it, so it is not converted."
    next: "Replace the link with the file it points at, then rerun the plan."
  - code: DESCRIPTION_MISSING
    reason: "SKILL.md must declare a description before conversion."
    next: "Add a description line to SKILL.md, then rerun the plan."
  - code: ROUTER_EXISTS
    reason: "ROUTER.md already exists but declares no machine router while SKILL.md does; it will not be replaced."
    next: "Read that ROUTER.md. The conversion never overwrites a router file it did not write."
  - code: STALE_PLAN
    reason: "SKILL.md changed after planning; no files were written."
    next: "Rerun the plan, which re-reads SKILL.md, then answer the questions again."
  - code: ROUTER_CONTENT_CHANGED
    reason: "parseRouter content output changed; no target files were written."
    next: "Report the engine's message. Nothing changed."
  - code: ROUTER_SEMANTICS_CHANGED
    reason: "parseRouter semantics changed after the move; restoring the original skill files."
    next: "Report the engine's message. Nothing changed."
  - code: APPLY_FAILED
    reason: "Conversion rolled back: <the message>."
    next: "Read the engine's message, fix the cause, then rerun the plan."
  - code: PLAIN_APPLY_FAILED
    reason: "Plain conversion stopped: <the message>"
    next: "Read the engine's message, fix the cause, then rerun the plan."
  - code: ROLLBACK_FAILED
    reason: "Conversion rollback failed: <the message>. Backup retained at <the backup folder>."
    next: "Restore from that backup folder by hand, then report it."
  - code: PRESERVATION_FAILED
    reason: "Original body line is missing from SKILL.md, ROUTER.md and references/: <the first missing line>"
    next: "Put that line back into the reshaped prose, or keep it in a reference document, then rerun the preserve check."
  - code: FRONTMATTER_INVALID
    reason: "SKILL.md needs a closed YAML frontmatter block."
    next: "Close the frontmatter block, then rerun the plan."
  - code: ALLOWED_TOOLS_AMBIGUOUS
    reason: "allowed-tools has unbalanced parentheses."
    next: "Fix that one list item, then rerun the plan."
  - code: ALLOWED_TOOLS_INVALID
    reason: "allowed-tools must be a top-level frontmatter field."
    next: "Fix the allowed-tools line, then rerun the plan."
  - code: INTENT_SIGNALS_BELOW_FLOOR
    reason: "Only <n> approved intent phrase(s) were supplied; at least 8 are required."
    next: "Approve the phrases the engine suggested with repeated --approved-phrase values, then rerun the plan."
  - code: RESOURCE_LINK_MISSING
    reason: "SKILL.md links to a missing reference document: <the relative path>"
    next: "Add that reference document, or drop the link, then rerun the plan."
  - code: ALLOWED_TOOLS_APPROVAL_REQUIRED
    reason: "pass repeated --allowed-tool values, or one --allowed-tools list, to approve the permission grant."
    next: "Rerun the plan with the list the operator approved, then run the apply with the same flag."
  - code: DESCRIPTION_TRIM_REQUIRED
    reason: "The description exceeds 130 characters; approve the planned trim"
    next: "Rerun the plan with --description-trim and the text the operator approved, then run the apply with the same flag."
  - code: AGENT_RESHAPE_REQUIRED
    reason: "Provide the workflow agent output with --agent-output before applying the plain-skill plan."
    next: "Run the agent step and the preserve check, then run the plan and the apply with --agent-output."
  - code: STRICT_PACKAGE_FAILED
    reason: "package_skill.py did not report Result: PASS."
    next: "Read the package check's own output above the message, fix that requirement, then rerun the plan."
  - code: SNAPSHOT_INVALID
    reason: "The snapshot has no SKILL.md: <the snapshot folder>"
    next: "Point --snapshot at a folder holding the source SKILL.md, then rerun the preserve check."
  - code: "<any other code the engine prints>"
    reason: "the engine's own message, quoted as printed"
    next: "Treat it as the same class: nothing was written, fix that one condition, then rerun the plan."

# ─────────────────────────────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────────────────────────────
workflow:
  phase_1_read:
    purpose: "Load what the conversion is built from before anything is asked or run"
    activities:
      - "Check that .skilled/commands/doctor/scripts/sk-skill-convert.cjs, its lib/sk-skill-surface.cjs, its lib/sk-skill-convert-transforms.cjs and its lib/sk-skill-integrate.cjs, .skilled/commands/doctor/scripts/sk-skill-check.cjs and .skilled/skills/sk-doc/sk-create-skill/assets/skill/skill-router-template.md exist. If any is missing, report the missing path and stop with STATUS=FAIL. A conversion without its engine or its router template would invent a shape."
      - "Read the engine's interface before driving it: node .skilled/commands/doctor/scripts/sk-skill-convert.cjs with no subcommand prints its usage block and exits 2, and that block is the whole list of calls this workflow may make. plan <skill-name-or-path> is read-only. apply <skill-name-or-path> accepts --description-trim <text>, --allowed-tools <comma list>, --allowed-tool <tool>, --agent-output <path> and --apply, and writes only with --apply. preserve --snapshot <dir> takes an optional <skill-dir> and writes nothing."
      - "Read .skilled/commands/doctor/assets/doctor-sk-skill-presentation.txt for the plan, question, refusal and result wording. Every visible line comes from there."
      - "Read the target's SKILL.md only to recognise which follow-up the plan is about to name: the description's length, and whether allowed-tools is declared. This workflow writes neither field itself; the engine writes each one from a flag it was given."

  phase_2_plan:
    purpose: "Run the read-only plan and keep its refusals, its follow-ups and its own lines apart"
    activities:
      - "Run node .skilled/commands/doctor/scripts/sk-skill-convert.cjs plan \"{skill_target}\". The plan call writes nothing: it resolves the target, classifies the input (an older Skilled skill converted in place, or a plain skill staged under .skilled/skills/<name>), parses the router, and prints the numbered steps, the backup folder, the integration plan and the follow-up items."
      - "Exit 0 means the plan printed. Keep its exact lines for phase 3 and continue. When the plan reports no writes, which the engine prints as Writes: none, render the presentation contract's already-converted result with the engine's message, ask nothing, write nothing, and go to phase 8 with STATUS=OK."
      - "Exit 1 with DESCRIPTION_TOO_LONG means the description is over the 130-character budget and no trim has been approved yet; the engine's message names the length and the limit. Carry that follow-up to phase 3 and ask there. Do not stop the run, and do not trim anything here."
      - "Exit 1 with ALLOWED_TOOLS_MISSING means the skill declares no allowed-tools field. Carry that follow-up to phase 3 and ask there; it is not a stopping refusal."
      - "Exit 1 with any other code is a refusal: print REFUSE: with the reason the refusals list carries for that code, then STATUS=FAIL ERROR=\"<code>\", and stop. Do not offer to force, retry at another path, or edit the target by hand. A refusal whose next entry names /create:skill-parent also prints that line, because a hub belongs there. A code the list does not carry still prints the engine's own message and STATUS=FAIL ERROR=\"<code>\"."
      - "Exit 2 means the invocation or a precondition failed, such as a router parser or resolver that could not load, or a skill check that did not return its JSON report. Quote the engine's code and message, name the accepted invocation /doctor:sk-skill convert <name-or-path> [--dry-run], and end with STATUS=FAIL ERROR=\"<code>\"."

  phase_3_follow_ups:
    purpose: "Ask the two field questions with their own yes, produce the plain-skill prose, and print the plan the operator will approve"
    activities:
      - "If dry_run is true, render the presentation contract's conversion plan from the plan call's own lines: the numbered steps, the backup folder, the RESOURCE_MAP order, the integration plan and the follow-up items, with the field values the engine proposed. Follow them with the dry-run line and go to phase 8 with STATUS=OK. A dry run asks nothing and writes nothing, so it runs no question, no agent step and no rerun."
      - "When the description is over the 130-character budget, ask the trim question from the presentation contract. When the plan printed a Proposed description trim line, offer that text; when the engine refused with DESCRIPTION_TOO_LONG and printed no proposal of its own, offer a trim of 130 characters or fewer that keeps the skill's own wording, and show it in full before asking. Yes records the exact text that will be passed as --description-trim. Anything else is a no, and a no here ends the run: print the cancelled result naming the declined description trim, Changed: none, and STATUS=CANCELLED ACTION=cancelled. Nothing is written and the remaining questions are not asked."
      - "When allowed-tools is missing, propose the list the engine printed in its allowed-tools line: [Read, Grep, Glob], plus Bash when the skill folder holds a scripts/ folder. Read the list back, let the operator edit it before answering, and take their answer as the value for --allowed-tools. Yes records the list as named. Anything else is a no, and a no here ends the run with the cancelled result naming the declined allowed-tools list and STATUS=CANCELLED. This workflow never grants a tool the operator did not name and never defaults the list."
      - "For a plain skill, whose plan says the source is copied under its frontmatter name, the workflow agent reshapes the SKILL.md prose: it writes the reshaped body to a scratch output file and the path is passed as --agent-output. The agent keeps the source frontmatter block unchanged and rewrites prose only. It never edits a SKILL.md field, because a field is written by the engine from a flag the operator approved."
      - "Before the format gate, prove the reshaped prose kept the whole body: run node .skilled/commands/doctor/scripts/sk-skill-convert.cjs preserve --snapshot <a scratch folder holding the source SKILL.md and its references/> <a staging folder holding the agent's SKILL.md and those same references/>. It prints Preservation PASS: <n> original body line(s) found and exits 0. Exit 1 prints PRESERVATION_FAILED with the first missing line; that stops the run with STATUS=FAIL and nothing written. Never shorten the prose further to make the check pass."
      - "Rerun the plan with the approved flags and nothing else: node .skilled/commands/doctor/scripts/sk-skill-convert.cjs plan \"{skill_target}\" with --description-trim \"<the approved trim>\" when it was approved, --allowed-tools \"<the operator's list>\" when it was approved, and --agent-output \"<the agent's file>\" for a plain skill. The engine now prints each approved field as its own plan line, Set description: and Set allowed-tools:, beside the copy, rename, scaffold and gate steps it will run."
      - "Render that plan: the presentation contract's conversion plan section, quoting the engine's numbered steps, its backup line, its integration plan and its follow-up items, with the field values the operator approved and the question that approved each. This rerun's plan is the one the next phase asks about; the first plan is never the one the operator approves."
      - "If the rerun refuses or exits 2, handle it exactly as phase 2 does, with the code the engine prints."

  phase_4_approval:
    purpose: "Ask the one conversion question against the plan the operator has just read"
    activities:
      - "Ask the conversion question once, in the presentation contract's wording, naming the files the plan will overwrite or create, the backup folder, the integration rows the plan lists, and the fields already approved. The operator answers about the plan on screen, which is the rerun's."
      - "Any answer other than yes is a no: print the cancelled result naming the declined conversion, state Changed: none, and end with STATUS=CANCELLED ACTION=cancelled. Nothing is written."
      - "Never default an answer, never write a permission grant on the operator's behalf, and never carry an approval from one question to the next."

  phase_5_write:
    purpose: "Write the approved conversion and nothing else"
    activities:
      - "Run node .skilled/commands/doctor/scripts/sk-skill-convert.cjs apply \"{skill_target}\" --apply with exactly the flags the rerun carried: --description-trim, --allowed-tools and --agent-output. The engine prints the same plan, backs the pre-write files up under .skilled/skills/.state/doctor-sk-skill/<name>/<timestamp>/, stages or rewrites the skill folder, verifies the preservation snapshot, runs the format gates, and only then runs the integration rows."
      - "For a plain skill the apply writes the staged folder .skilled/skills/<name>/ and leaves the source folder as it was; for an older Skilled skill it rewrites SKILL.md in place beside the new ROUTER.md. Either way the approved fields are written by the engine with the same backup."
      - "Exit 0 means the conversion and its integration rows ran. Keep the backup folder, the Snapshot line, the router source line, the preservation line and every integration row line for the next phases. When an integration row reports FAILED or UNKNOWN the engine exits 1 with the rows printed: the conversion itself is complete, so report that row and its repair as the next step instead of as a failed conversion."
      - "Exit 1 is a rolled-back conversion: print the reason the refusals list carries for the code, then the backup folder the message names when it names one, then STATUS=FAIL. A rollback leaves the skill folder as it was; never repair it by hand inside this route."
      - "Exit 2 during the apply is a precondition that failed before or during the writes, so the conversion rolled back: the skill folder is as the plan found it. Quote the engine's code and its message, then end with STATUS=FAIL ERROR=\"<code>\"."

  phase_6_reread:
    purpose: "Prove the converted skill reads back and still routes"
    activities:
      - "Run node .skilled/commands/doctor/scripts/sk-skill-check.cjs <the converted root> --json and read the report, where the converted root is the Converted skill line the apply printed: for an in-place conversion that is {skill_target}. A skill that converted cleanly reports its rows with no FINDING; an exit of 1 means a row still finds something, which the result names instead of hiding."
      - "Print the router source line and the preservation line the apply printed. A line that does not read back as the plan promised is a failure, not a warning."
      - "When a row still reports FINDING, keep the result at STATUS=OK for the conversion and list that row and its repair as the next step; the conversion is complete, the remaining finding is a different requirement."

  phase_7_undo:
    purpose: "Hand the operator the exact way back that the engine printed"
    activities:
      - "Print the engine's undo block exactly as the apply printed it: its Undo: line, one cp per backed-up file, one rm per file this run created, a git -c core.fsmonitor=false restore for each tracked file an integration row overwrote, and its closing Check: line. Quote it whole, in that order."
      - "Print nothing the block does not carry. Do not add a delete for a ROUTER.md this run did not create, do not reorder the lines and do not shorten a path: the block is the engine's own record of what the run wrote."
      - "Never run the undo inside this route. The undo is printed, and the operator runs it."

  phase_8_report:
    purpose: "Summarize the run"
    activities:
      - "When the conversion ran and read back, render the presentation contract's converted result with the files changed, the fields approved, the router source line, the check verdict, the integration rows the engine printed and the engine's undo block (STATUS=OK)."
      - "When the operator declined a question, render the cancelled result naming what was declined, state Changed: none, and end with STATUS=CANCELLED ACTION=cancelled."
      - "When dry_run is true, render the dry-run result: the plan, the follow-ups it named, the dry-run line and STATUS=OK, with Changed: none."
      - "When the plan reported no writes, render the already-converted result with the engine's message and STATUS=OK."
      - "When a refusal, a missing asset, a preservation failure or a failed read-back stopped the run, render the failure result naming the phase and the engine's code (STATUS=FAIL)."
      - "End by saying the operator commits the converted skill themselves; this route stages and commits nothing."

# ─────────────────────────────────────────────────────────────────
# OUTPUT
# ─────────────────────────────────────────────────────────────────
output:
  presentation: ".skilled/commands/doctor/assets/doctor-sk-skill-presentation.txt"
  statuses: [OK, CANCELLED, FAIL]
