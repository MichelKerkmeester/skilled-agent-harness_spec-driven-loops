# ─────────────────────────────────────────────────────────────────
# DOCTOR: SKILL FORMAT CONVERT (INTERACTIVE, ONE SKILL FOLDER)
# ─────────────────────────────────────────────────────────────────
role: Careful operator converting one skill to the Skilled format without losing a line of what it routes
purpose: Plan the conversion in the engine, ask each question the plan's own messages and pending-field lines raise with its own yes, rerun the plan with the approved flags, show that plan, and write only after the conversion yes, then re-read the result and print the undo block the engine printed
action: Read the engine and the target -> run the plan -> on an intent-phrase or description-trim message, or an allowed-tools or edges line the plan prints as pending, ask that one question -> produce the plain-skill prose and prove it preserved the body -> rerun the plan with the approved flags and no other hand edit -> print that plan -> explicit yes -> apply with the same flags -> re-read through the check engine -> print the engine's undo block
skill_owner: ".skilled/skills/sk-doc/sk-create-skill/"

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: sequential_read_plan_confirmed_conversion
  compliance: MANDATORY
  execution: interactive
  approvals: one_explicit_yes_per_question_before_the_first_write
  dry_run: print_the_plan_then_status_ok_without_asking
  tracking: one_skill_folder
  validation: re_read_the_converted_skill_through_the_check_engine
  never_commit: true

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  read_only: false
  allowed_targets:
    - "the staged or converted skill folder: a plain skill is copied to .skilled/skills/<name>/ and written there (SKILL.md, ROUTER.md, graph-metadata.json, leaf-manifest.config.json, the scaffold files, the benchmark folder and every resource the plan renames), and an older Skilled skill has its own SKILL.md rewritten in place beside a new sibling ROUTER.md"
    - "the backups the engine takes before every write, under .skilled/skills/.state/doctor-sk-skill/<name>/<timestamp>/: the pre-write SKILL.md, the pre-write router inputs and the preservation snapshot of the source body and its references"
    - "the skill's changelog folder <the skill folder>/changelog/ with its v<version>.md entry, and the relative link .skilled/changelog/<name> that points at it"
    - "the one scratch root the plain-skill path uses, .skilled/skills/.state/doctor-sk-skill/<name>/scratch/: the workflow agent's reshaped SKILL.md at agent-output.md, the preserve snapshot at snapshot/ and the staging copy at staging/. It is deleted when the operator declines a question and again once a finished run has reported, so nothing there outlives the run"
    - "the integration targets the engine records in its plan: the advisor graph .skilled/skills/system-skill-advisor/runtime/database/skill-graph.sqlite through skill_graph_scan, the compiled .skilled/skills/system-skill-advisor/runtime/scripts/skill-graph.json, the advisor cases file (.skilled/skills/system-skill-advisor/runtime/scripts/fixtures/skill-advisor-regression-cases.jsonl when the root sits directly under this repository's skills root, otherwise <the skill folder>/benchmark/advisor-cases.jsonl), and the .hermes/skills/ mirror"
    - "a frontmatter field the operator approved in its own question: the trimmed description, and the allowed-tools list the operator named. Both reach SKILL.md only as engine flags, written by the engine beside the same backup"
  forbidden_targets:
    - "any skill folder other than the one named by <name-or-path>"
    - "a hub: a folder holding mode-registry.json or hub-router.json, or a folder holding a nested SKILL.md packet"
    - "an existing ROUTER.md the resolver does not read as this skill's machine router, which the conversion never replaces"
    - ".skilled/commands/doctor/scripts/sk-skill-convert.cjs and its lib/, which own the conversion and never change here"
    - "SKILL.md frontmatter fields edited by this workflow: the agent rewrites prose only, and a field change is a flag the engine applies"
    - "the git index, history and remotes"
  invariant: "Nothing under the skill folder changes until the plan has been printed and the operator has answered yes. The plan call writes nothing, and the apply call writes only with the write switch. Every skill file the run overwrites is copied to the backup first; the advisor graph is the exception, because the run's own scan rebuilds it rather than backing it up, so an operator who runs the undo rescans it afterwards. The only other write is the one scratch root, which is deleted on a declined question and once a finished run has reported. A no at any question ends the run with STATUS=CANCELLED and nothing written. A rerun on a converted skill reports that no conversion is needed and writes nothing."

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  convert_engine: ".skilled/commands/doctor/scripts/sk-skill-convert.cjs"
  surface_library: ".skilled/commands/doctor/scripts/lib/sk-skill-surface.cjs"
  transforms_library: ".skilled/commands/doctor/scripts/lib/sk-skill-convert-transforms.cjs"
  integration_library: ".skilled/commands/doctor/scripts/lib/sk-skill-integrate.cjs"
  check_engine: ".skilled/commands/doctor/scripts/sk-skill-check.cjs"
  router_template: ".skilled/skills/sk-doc/sk-create-skill/assets/skill/skill-router-template.md"
  router_replay: ".skilled/skills/sk-code/sk-code-skilled/assets/scripts/router-replay-lib.cjs"
  router_resolver: ".skilled/skills/sk-code/sk-code-skilled/assets/scripts/router-file-resolver.cjs"
  presentation: ".skilled/commands/doctor/assets/doctor-sk-skill-presentation.txt"

# ─────────────────────────────────────────────────────────────────
# INPUTS
# ─────────────────────────────────────────────────────────────────
inputs:
  execution_mode: "INTERACTIVE"
  skill_target: "<name-or-path> is the one skill to convert: a name under .skilled/skills, or a path to a skill root. A path outside the skills root is a plain skill, which the engine converts by copying it under .skilled/skills/<name> and leaving the source folder untouched. Convert never infers the target: with no name, ask for one once and stop until it is given."
  dry_run: "--dry-run prints the plan with the follow-ups it names, then STATUS=OK without asking a question (default false). The plan call writes nothing either way; the flag only removes the questions and the write."
  scratch_dir: ".skilled/skills/.state/doctor-sk-skill/<name>/scratch/ is the one scratch root the plain-skill path uses, and it holds all three of its temporary folders: the workflow agent's reshaped SKILL.md at agent-output.md, the preserve snapshot at snapshot/ (the source SKILL.md and its references/) and the staging copy the proof reads at staging/ (the agent's SKILL.md and the same references/). Nothing outside it holds a temporary copy, and it is deleted when a question is declined and once a finished run has reported."

# ─────────────────────────────────────────────────────────────────
# REFUSALS
# ─────────────────────────────────────────────────────────────────
# The converter prints one machine code per refusal, and a refusal always means
# nothing was written. The workflow prints the reason beside the code, so an
# operator reads what stopped the run and which command takes the case instead.
# A description over the budget is a follow-up message, and a missing
# allowed-tools or a missing edge is a line the plan prints as pending rather than a
# code: either way the operator answers it as its own question in phase 3, not as a
# refusal.
refusals:
  - code: PREFLIGHT_REFUSED
    reason: "SKILL.md could not be read."
    next: "Check the path resolves to a readable SKILL.md, then rerun the plan."
  - code: PREFLIGHT_REFUSED
    reason: "SKILL.md must declare a description before conversion."
    next: "Add a description line to SKILL.md, then rerun the plan."
  - code: NOT_DIRECT_CHILD
    reason: "Only a direct child of .skilled/skills can be converted."
    next: "Pass a skill root that sits directly under .skilled/skills, or a path outside it that the engine can stage."
  - code: RESERVED_PREFIX
    reason: "A local- prefixed skill is filtered by the format and advisor gates."
    next: "Rename the skill without the prefix, or leave it private and unconverted."
  - code: PERSONA_PREFIX
    reason: "An agent- prefixed skill collides with runtime persona mirrors."
    next: "Rename the skill, then rerun the plan."
  - code: NAME_NOT_KEBAB
    reason: "The declared skill name is not a lowercase kebab-case name."
    next: "Fix the name field, then rerun the plan."
  - code: NESTED_PACKETS
    reason: "Nested SKILL.md packets make this a hub candidate."
    next: "/create:skill-parent <the parent skill folder>"
  - code: HUB_DECLARATION
    reason: "Hub declaration <mode-registry.json or hub-router.json> is present; conversion does not modify hubs."
    next: "/create:skill-parent <the parent skill folder>"
  - code: HUB_DECLARATION
    reason: "The existing check classified this input as <the input kind>; hub conversion is out of scope."
    next: "/create:skill-parent <the parent skill folder>"
  - code: DUAL_DECLARATION
    reason: "Resolver verdict dual-declaration: both SKILL.md and ROUTER.md declare a machine router."
    next: "Remove one of the two declarations by hand, then rerun the plan."
  - code: NO_MACHINE_ROUTER
    reason: "Expected a Skilled skill with a machine router; resolver verdict was <the resolver verdict>."
    next: "A skill with no machine router anywhere is a plain skill: it converts only from a path outside .skilled/skills, where the engine stages a new root."
  - code: NOT_PLAIN_SKILL
    reason: "The existing check classified this outside-root input as <the input kind>; only plain skills are in scope."
    next: "Point the plan at a single plain skill folder, then rerun it."
  - code: INPUT_KIND_UNSUPPORTED
    reason: "The existing check classified this input as <the input kind>; only older Skilled skills are in scope."
    next: "Read the check input kind; a plain skill converts from an outside path, and a hub belongs to /create:skill-parent."
  - code: NAME_COLLISION
    reason: "Skill name collision: <the other root claiming the name>."
    next: "Decide which root keeps the name, then rerun the plan."
  - code: TARGET_EXISTS
    reason: "The target skill folder already exists: <the target folder>"
    next: "Convert the existing root where it sits, or rename the incoming skill, then rerun the plan."
  - code: SOURCE_SYMLINK
    reason: "The source tree contains a symlink (<the link>); a copy would write through it, so it is not converted."
    next: "Replace the link with the file it points at, then rerun the plan."
  - code: DESCRIPTION_MISSING
    reason: "SKILL.md must declare a description before conversion."
    next: "Add a description line to SKILL.md, then rerun the plan."
  - code: ROUTER_EXISTS
    reason: "ROUTER.md already exists but declares no machine router while SKILL.md does; it will not be replaced."
    next: "Read that ROUTER.md. The conversion never overwrites a router file it did not write."
  - code: STALE_PLAN
    reason: "SKILL.md changed after planning; no files were written."
    next: "The engine compares the source when the apply builds its own plan and again at the first write, so it catches a change made while that call ran, not an edit between the plan the operator approved and the apply. Rerun the plan, which re-reads SKILL.md, then answer the questions again."
  - code: ROUTER_CONTENT_CHANGED
    reason: "parseRouter content output changed; no target files were written."
    next: "Report the engine's message. Nothing changed."
  - code: ROUTER_SEMANTICS_CHANGED
    reason: "parseRouter semantics changed after the move; restoring the original skill files."
    next: "Report the engine's message. Nothing changed."
  - code: APPLY_FAILED
    reason: "Conversion rolled back: <the message>."
    next: "Read the engine's message, fix the cause, then rerun the plan."
  - code: PLAIN_APPLY_FAILED
    reason: "Plain conversion stopped: <the message>"
    next: "Read the engine's message, fix the cause, then rerun the plan."
  - code: ROLLBACK_FAILED
    reason: "Conversion rollback failed: <the message>. Backup retained at <the backup folder>."
    next: "Restore from that backup folder by hand, then report it."
  - code: PRESERVATION_FAILED
    reason: "Original body line is missing from SKILL.md, ROUTER.md and references/: <the first missing line>"
    next: "Put that line back into the reshaped prose, or keep it in a reference document, then rerun the preserve check."
  - code: FRONTMATTER_INVALID
    reason: "SKILL.md needs a closed YAML frontmatter block."
    next: "Close the frontmatter block, then rerun the plan."
  - code: ALLOWED_TOOLS_AMBIGUOUS
    reason: "allowed-tools has unbalanced parentheses."
    next: "Fix that one list item, then rerun the plan."
  - code: ALLOWED_TOOLS_INVALID
    reason: "allowed-tools must be a top-level frontmatter field."
    next: "Fix the allowed-tools line, then rerun the plan."
  - code: ALLOWED_TOOLS_DUPLICATE
    reason: "SKILL.md declares allowed-tools <twice or more times>; exactly one field is written."
    next: "Collapse the declarations to one list, then rerun the plan."
  - code: RESOURCE_LINK_MISSING
    reason: "SKILL.md links to a missing reference document: <the relative path>"
    next: "Add that reference document, or drop the link, then rerun the plan."
  - code: ALLOWED_TOOLS_APPROVAL_REQUIRED
    reason: "pass repeated --allowed-tool values, or one --allowed-tools list, to approve the permission grant."
    next: "Rerun the plan with the list the operator approved, then run the apply with the same flag."
  - code: DESCRIPTION_TRIM_REQUIRED
    reason: "The description exceeds 130 characters; approve the planned trim"
    next: "Rerun the plan with --description-trim and the text the operator approved, then run the apply with the same flag."
  - code: AGENT_RESHAPE_REQUIRED
    reason: "Provide the workflow agent output with --agent-output before applying the plain-skill plan."
    next: "Run the agent step and the preserve check, then run the plan and the apply with --agent-output."
  - code: STRICT_PACKAGE_FAILED
    reason: "package_skill.py did not report Result: PASS."
    next: "Read the package check's own output above the message, fix that requirement, then rerun the plan."
  - code: SNAPSHOT_INVALID
    reason: "The snapshot has no SKILL.md: <the snapshot folder>"
    next: "Point --snapshot at a folder holding the source SKILL.md, then rerun the preserve check."
  - code: EDGE_TYPE_REFUSED
    reason: "Only --edge enhances:<skill> is accepted, and <the value passed> is not an enhances edge naming a kebab-case skill of this skills root."
    next: "Read the plan's edges line and approve one of the names it proposes with --edge enhances:<skill>. The other edge types are mirrored by the skill at the other end, which a conversion never writes."
  - code: "<any other code the engine prints>"
    reason: "the engine's own message, quoted as printed"
    next: "Treat it as the same class: nothing was written, fix that one condition, then rerun the plan."

# ─────────────────────────────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────────────────────────────
workflow:
  phase_1_read:
    purpose: "Load what the conversion is built from before anything is asked or run"
    activities:
      - "Check that .skilled/commands/doctor/scripts/sk-skill-convert.cjs, its lib/sk-skill-surface.cjs, its lib/sk-skill-convert-transforms.cjs and its lib/sk-skill-integrate.cjs, .skilled/commands/doctor/scripts/sk-skill-check.cjs and .skilled/skills/sk-doc/sk-create-skill/assets/skill/skill-router-template.md exist. If any is missing, report the missing path and stop with STATUS=FAIL. A conversion without its engine or its router template would invent a shape."
      - "Read the engine's interface before driving it: node .skilled/commands/doctor/scripts/sk-skill-convert.cjs with no subcommand prints its usage block and exits 2, and that block is the whole list of calls this workflow may make. plan <skill-name-or-path> is read-only. apply <skill-name-or-path> accepts repeated --approved-phrase <text>, --description-trim <text>, --allowed-tools <comma list>, --allowed-tool <tool>, --edge <type>:<skill>, --agent-output <path> and --apply, and writes only with --apply: the same apply form without the write switch prints the plan and writes nothing, which is how this workflow reruns a plan. preserve --snapshot <dir> takes an optional <skill-dir> and writes nothing."
      - "Read .skilled/commands/doctor/assets/doctor-sk-skill-presentation.txt for the plan, question, refusal and result wording. Every visible line comes from there."
      - "Read the target's SKILL.md only to recognise which follow-up the plan is about to name: the description's length, and whether allowed-tools is declared. This workflow writes neither field itself; the engine writes each one from a flag it was given."

  phase_2_plan:
    purpose: "Run the read-only plan and keep its refusals, its follow-ups and its own lines apart"
    activities:
      - "Run node .skilled/commands/doctor/scripts/sk-skill-convert.cjs plan \"{skill_target}\". The plan call writes nothing: it resolves the target, classifies the input (an older Skilled skill converted in place, or a plain skill staged under .skilled/skills/<name>), parses the router, and prints the numbered steps, the backup folder, the integration plan and the follow-up items."
      - "Exit 0 means the plan printed. Keep its exact lines for phase 3 and continue. When the plan reports no writes, which the engine prints as Writes: none, render the presentation contract's already-converted result with the engine's message, ask nothing, write nothing, and go to phase 8 with STATUS=OK."
      - "Exit 1 with DESCRIPTION_TOO_LONG means the description is over the 130-character budget and no trim has been approved yet; the engine's message names the length and the limit. Carry that follow-up to phase 3 and ask there. Do not stop the run, and do not trim anything here."
      - "A printed plan whose allowed-tools line reports that approval is required is the pending grant rather than a refusal: a plain skill has no approved list yet, and an older Skilled skill declares no allowed-tools field, so the plan printed the list it proposes and wrote nothing. Carry that line to phase 3 and ask there; no flag has been passed yet. Exit 1 with ALLOWED_TOOLS_DUPLICATE is a refusal instead: the field is declared more than once, and a conversion writes exactly one field."
      - "A printed plan whose edges line reports that approval is required is the one edge a converted root needs rather than a refusal: its edges map starts empty, and the advisor graph refuses a skill with no edges at all. The line names the skill the advisor ranks highest for the approved phrases, lists the next two candidates, or says the advisor is unavailable and asks for a name. Carry that line to phase 3 and ask there; approve nothing here."
      - "Exit 1 with INTENT_SIGNALS_BELOW_FLOOR means a plain skill and no approved intent phrase: the engine refuses before it prints a plan, and its message carries both the count it needs and the phrases it suggests. Carry that follow-up to phase 3 and ask there; it is not a stopping refusal, because the phrase question is what supplies the flag."
      - "Exit 1 with any other code is a refusal: print REFUSE: with the reason the refusals list carries for that code, then STATUS=FAIL ERROR=\"<code>\", and stop. Do not offer to force, retry at another path, or edit the target by hand. A refusal whose next entry names /create:skill-parent also prints that line, because a hub belongs there. A code the list does not carry still prints the engine's own message and STATUS=FAIL ERROR=\"<code>\"."
      - "Exit 2 means the invocation or a precondition failed, such as a router parser or resolver that could not load, or a skill check that did not return its JSON report. Quote the engine's code and message, name the accepted invocation /doctor:sk-skill convert <name-or-path> [--dry-run], and end with STATUS=FAIL ERROR=\"<code>\"."

  phase_3_follow_ups:
    purpose: "Ask each question the plan's own messages raise with its own yes, produce the plain-skill prose, and print the plan the operator will approve"
    activities:
      - "If dry_run is true, render the presentation contract's conversion plan from the plan call's own lines: the numbered steps, the backup folder, the RESOURCE_MAP order, the integration plan and the follow-up items, with the field values the engine proposed. When the plan call exited 1 with a follow-up message instead of printing, print that message as the pending follow-up and no plan lines: nothing has printed, so there is no plan to show. Follow either form with the dry-run line and go to phase 8 with STATUS=OK. A dry run asks nothing and writes nothing, so it runs no question, no agent step and no rerun."
      - "Ask the questions in the order the plan's own messages raise them, and give each one its own yes. A plain skill's first plan refuses INTENT_SIGNALS_BELOW_FLOOR before it prints anything, so its phrase question comes first: no plan can print until the engine has the phrases."
      - "When the plan exited 1 with INTENT_SIGNALS_BELOW_FLOOR, a plain skill needs its intent phrases approved, and an older Skilled skill never asks this. The engine's message names the count it needs and prints the phrases it suggests; a Suggested intent phrases line on a printed plan is the same list. Show every suggested phrase on its own line, let the operator approve or edit the list before answering, and require at least eight distinct phrases of three or more words each, because these become the skill's PRIMARY keywords. Yes records each phrase as one repeated --approved-phrase value. A list shorter than eight phrases, or any phrase of fewer than three words, is not an approval: name what is missing and ask once more. Anything else is a no, and a no here ends the run: delete the scratch root, print the cancelled result naming the declined intent phrases, Changed: none, and STATUS=CANCELLED ACTION=cancelled. Nothing is written and the remaining questions are not asked."
      - "Rerun the plan after each batch of answers, carrying every flag approved so far and no write switch: node .skilled/commands/doctor/scripts/sk-skill-convert.cjs apply \"{skill_target}\" with --approved-phrase \"<an approved phrase>\" repeated for each one, plus --description-trim \"<the approved trim>\", --allowed-tools \"<the operator's list>\" and --edge \"enhances:<the approved skill>\" once those have been approved. Without the write switch the engine prints the plan and closes on its own line, Apply gate: no writes without --apply., and writes nothing. A plain skill needs this rerun right after its phrase answer, because the plan that prints then is the one whose allowed-tools, edges and Proposed description trim lines the next questions offer."
      - "When the description is over the 130-character budget, ask the trim question from the presentation contract. When the plan printed a Proposed description trim line, offer that text; when the engine refused with DESCRIPTION_TOO_LONG and printed no proposal of its own, offer a trim of 130 characters or fewer that keeps the skill's own wording, and show it in full before asking. Yes records the exact text that will be passed as --description-trim. Anything else is a no, and a no here ends the run: delete the scratch root, print the cancelled result naming the declined description trim, Changed: none, and STATUS=CANCELLED ACTION=cancelled. Nothing is written and the remaining questions are not asked."
      - "When the plan's allowed-tools line reports that approval is required — a plain skill with no approved list yet, or an older Skilled skill whose SKILL.md declares no allowed-tools field — ask the allowed-tools question with the list that line prints, and with no other list. Read it back in full — it is the engine's proposal rather than a list this workflow keeps, and it carries Bash only when the skill folder holds a scripts/ folder — and let the operator edit it before answering, then take their answer as the value for --allowed-tools. Yes records the list as named. Anything else is a no, and a no here ends the run with the cancelled result naming the declined allowed-tools list and STATUS=CANCELLED, after the scratch root is deleted. This workflow never grants a tool the operator did not name and never defaults the list."
      - "When the plan's edges line reports that approval is required, ask the edge question with the name that line proposes, and with the two other candidates when the operator would rather pick one of those. A line that says the advisor is unavailable, or that it ranked no skill, asks the operator to name a public skill of this skills root instead. The engine accepts only --edge enhances:<skill>, because an enhances edge is the one type the compiler does not require the skill at the other end to mirror, so never compose another type. Yes records that one name as the flag. Anything else is a no, and a no here ends the run with the cancelled result naming the declined edge and STATUS=CANCELLED, after the scratch root is deleted. Never write a default edge and never choose a target on the operator's behalf."
      - "For a plain skill, whose plan says the source is copied under its frontmatter name, the workflow agent reshapes the SKILL.md prose: it writes the reshaped body to {scratch_dir}/agent-output.md under the one scratch root, and that path is passed as --agent-output. The agent keeps the source frontmatter block unchanged and rewrites prose only. It never edits a SKILL.md field, because a field is written by the engine from a flag the operator approved."
      - "Before the format gate, prove the reshaped prose kept the whole body, with all three folders under {scratch_dir}: copy the source SKILL.md and its references/ into {scratch_dir}/snapshot/, copy the agent's SKILL.md and the same references/ into {scratch_dir}/staging/, then run node .skilled/commands/doctor/scripts/sk-skill-convert.cjs preserve --snapshot \"{scratch_dir}/snapshot\" \"{scratch_dir}/staging\". It prints Preservation PASS: <n> original body line(s) found and exits 0. Exit 1 prints PRESERVATION_FAILED with the first missing line; that stops the run with STATUS=FAIL and nothing written. Never shorten the prose further to make the check pass."
      - "Rerun the plan once more with every approved flag and nothing else: node .skilled/commands/doctor/scripts/sk-skill-convert.cjs apply \"{skill_target}\" with each --approved-phrase, --description-trim \"<the approved trim>\" when it was approved, --allowed-tools \"<the operator's list>\" when it was approved, --edge \"enhances:<the approved skill>\" when it was approved, and --agent-output \"{scratch_dir}/agent-output.md\" for a plain skill, still without the write switch. The engine prints the plan and the same Apply gate line, and writes nothing. An older Skilled rerun carries each approved field as its own step, Set description: and Set allowed-tools:; a plain-skill rerun carries them as its own lines, Approved intent phrases (N):, allowed-tools: [...], edges: enhances -> <skill> and Approved description trim:."
      - "Render that plan: the presentation contract's conversion plan section, quoting the engine's numbered steps, its backup line, its integration plan and its follow-up items, with the field values the operator approved and the question that approved each and the edge the engine will write. This rerun's plan is the one the next phase asks about; the first plan is never the one the operator approves."
      - "If a rerun refuses or exits 2, handle it exactly as phase 2 does, with the code the engine prints."

  phase_4_approval:
    purpose: "Ask the one conversion question against the plan the operator has just read, and write only after its yes"
    activities:
      - "Ask the conversion question once, in the presentation contract's wording, Convert this skill now? [yes/no], naming the files the plan will overwrite or create, the backup folder, the integration rows the plan lists, and the fields already approved. The operator answers about the plan on screen, which is the rerun's."
      - "Any answer other than yes is a no: delete the scratch root, print the cancelled result naming the declined conversion, state Changed: none, and end with STATUS=CANCELLED ACTION=cancelled. Nothing is written."
      - "Never default an answer, never write a permission grant on the operator's behalf, and never carry an approval from one question to the next. Phase 5 runs only after this phase's yes, and a dry run never reaches either."

  phase_5_write:
    purpose: "Write the approved conversion and nothing else, only after the conversion yes"
    activities:
      - "Run node .skilled/commands/doctor/scripts/sk-skill-convert.cjs apply \"{skill_target}\" --apply with exactly the flags the rerun carried: --approved-phrase \"<an approved phrase>\" repeated for each one, --description-trim \"<the approved trim>\", --allowed-tools \"<the operator's list>\", --edge \"enhances:<the approved skill>\" and --agent-output \"{scratch_dir}/agent-output.md\". The engine prints the same plan, backs the pre-write files up under .skilled/skills/.state/doctor-sk-skill/<name>/<timestamp>/, stages or rewrites the skill folder, verifies the preservation snapshot, runs the format gates, and only then runs the integration rows."
      - "For a plain skill the apply writes the staged folder .skilled/skills/<name>/ and leaves the source folder as it was; for an older Skilled skill it rewrites SKILL.md where it sits beside the new ROUTER.md. Either way the approved fields are written by the engine with the same backup."
      - "Exit 0 means the conversion ran; a run that ends here is not an integration row failure. Keep exactly the lines the apply printed for this path: a plain skill prints its message, Backup:, Snapshot:, Converted skill:, Preservation PASS:, each command line with its own output and one line per integration row; an older Skilled skill converted in place prints its message, Backup:, Router source:, one line per integration row and the undo block, and prints no Snapshot:, Converted skill: or Preservation PASS: because it stages nothing. Both paths run the same six rows. Then delete the scratch root now that the run has finished."
      - "Exit 1 with an Undo: block printed means the conversion and its format gates finished and an integration row failed: the staged or converted skill is kept, and the block the engine printed is the way back from it. Print the failing row, then the undo block whole, then STATUS=FAIL ERROR=\"<the integration row that failed>\". That is an integration row failure with the conversion kept, not a failed conversion, and the row it names is the operator's next step."
      - "Exit 1 with no Undo: block printed is a refusal or a rollback that wrote nothing: print the reason the refusals list carries for the code, then STATUS=FAIL and Changed: none. A rollback leaves the skill folder as it was; never repair it by hand inside this route."
      - "Exit 2 during the apply is a precondition that failed before or during the writes, so the conversion rolled back: the skill folder is as the plan found it. Quote the engine's code and its message, then end with STATUS=FAIL ERROR=\"<code>\"."

  phase_6_reread:
    purpose: "Prove the converted skill reads back and still routes"
    activities:
      - "Run node .skilled/commands/doctor/scripts/sk-skill-check.cjs <the converted root> --json and read the report, where the converted root is .skilled/skills/<name> for a plain skill — the Converted skill line its apply printed — and the skill folder itself for an older Skilled one, which prints no such line because the plan already named that folder. Never re-read the outside source a plain skill came from, which is not the root this run wrote. A skill that converted cleanly reports its rows with no FINDING; an exit of 1 means a row still finds something, which the result names instead of hiding."
      - "Print the lines this path printed and only those: an older Skilled skill's Router source line, and a plain skill's Converted skill: and Preservation PASS: lines. Read each one back against the plan; a line the path prints that does not read back as planned is a failure, not a warning, and a line the path never prints is not a missing line."
      - "When a row still reports FINDING, keep the result at STATUS=OK for the conversion and list that row and its repair as the next step; the conversion is complete, the remaining finding is a different requirement."
      - "An older Skilled skill prints the same row lines as a plain one, because both paths end with the same six rows: a row that reported DONE is a surface the conversion wired, and a row that reported n/a named the reason it did not apply."

  phase_7_undo:
    purpose: "Hand the operator the exact way back that the engine printed"
    activities:
      - "Print the engine's undo block exactly as the apply printed it: its Undo: line; the cp that restores the converted SKILL.md from the backup; then, for each integration row that wrote outside the converted folder, a cp, or cp -R for a folder, from the backup — preceded by rm -r for a folder it replaces — or the engine's # No backup was recorded for \"<file>\"; restore it by hand. comment when the row recorded none; then one rm, or rm -r for a folder, for every path this run created, the rows' own creations included; and its closing Check: line. Quote it whole, in that order."
      - "Print nothing the block does not carry. Do not add a delete for a ROUTER.md this run did not create, do not reorder the lines and do not shorten a path: the block is the engine's own record of what the run wrote."
      - "The advisor graph is the one write the run does not back up: the run's own scan rebuilds it. Tell the operator that running the undo leaves the graph describing a skill that is gone, and that the scan — /doctor:skill-advisor rebuild, or the I1 row's skill_graph_scan — is what brings it back in step."
      - "Never run the undo inside this route. The undo is printed, and the operator runs it."

  phase_8_report:
    purpose: "Summarize the run"
    activities:
      - "When the conversion ran and read back, render the presentation contract's converted result with the files changed, the fields approved, the lines this path printed — the Router source line for an older Skilled skill, and the Converted skill: and Preservation PASS: lines for a plain one — the check verdict, the integration rows the engine printed and the engine's undo block (STATUS=OK)."
      - "When the operator declined a question, render the cancelled result naming what was declined, state Changed: none with the scratch root deleted, and end with STATUS=CANCELLED ACTION=cancelled."
      - "When dry_run is true, render the dry-run result: the plan, or the first plan's refusal as the pending follow-up when it refused, then the dry-run line and STATUS=OK, with Changed: none."
      - "When the plan reported no writes, render the already-converted result with the engine's message and STATUS=OK."
      - "When a refusal, a missing asset, a preservation failure or a failed read-back stopped the run, render the failure result naming the phase and the engine's code (STATUS=FAIL)."
      - "End by saying the operator commits the converted skill themselves; this route stages and commits nothing."

# ─────────────────────────────────────────────────────────────────
# OUTPUT
# ─────────────────────────────────────────────────────────────────
output:
  presentation: ".skilled/commands/doctor/assets/doctor-sk-skill-presentation.txt"
  statuses: [OK, CANCELLED, FAIL]
