role: Code Mode installation specialist
purpose: Install Code Mode, configure its UTCP manual file, and register supported runtimes
action: Run the install workflow with explicit approval before writes

operating_mode:
  workflow: sequential_6_step
  execution: interactive
  approvals: per_mutation
  validation: post_install_health_check
  intent: INSTALL

scope:
  component: Code Mode
  source: .skilled/skills/mcp-code-mode
  manual_config: .utcp_config.json
  allowed_runtimes: [opencode, claude, codex, cursor, pi, devin]
  runtime_config_files:
    opencode: [opencode.json]
    claude: [.mcp.json, .claude/mcp.json]
    codex: [.codex/config.toml]
    cursor: [.cursor/mcp.json]
    pi: [.pi/mcp.json]
    devin: [.devin/mcp_config.json]

# Server inventory for this workflow. The mutation-class gate
# (scripts/check-mcp-mutation-class.sh) reads its own manifest,
# assets/mcp-mutation-class-manifest.yaml, not this block. The workflow below
# builds with npm directly and never runs the Code Mode installer.
servers:
  code_mode:
    label: "Code Mode"
    skill_dir: ".skilled/skills/mcp-code-mode"
    entry_point: "mcp-server/dist/index.js"
    install_script: "scripts/install.sh"
    install_script_mutation_class: mutating  # installer: writes runtime config and runs npm install

inputs:
  runtime:
    flag: "--runtime"
    values: [opencode, claude, codex, cursor, pi, devin]
    default: all

invariants:
  - "Only Code Mode build files, .utcp_config.json, and the selected runtime config files may be changed."
  - "Never request, display, or write credential values. Ask only for variable names and report their presence in root .env or the process environment."
  - "Preserve existing manuals and runtime entries when editing configuration."
  - "Stop before mutation when the Code Mode package.json is missing."
  - "Do not pass --fix or any runtime filter to the diagnostic script."

workflow:
  step_1_preflight:
    purpose: Confirm the repository and Code Mode build prerequisites
    activities:
      - "Confirm the repository root and read the Code Mode install guide."
      - "Require npm for an approved build. Confirm that a Node.js 24 interpreter can be resolved from the Code Mode manifest and launcher when the manifest is present."
      - "Check .skilled/skills/mcp-code-mode/mcp-server/package.json. If it is missing, report that this worktree lacks the package manifest and stop before writes."
      - "If --runtime is set, validate it against the allowed_runtimes list."
      - "If --runtime is unset, include all supported runtime config files in the assessment and registration plan."
    outputs: [runtime_selection, prerequisite_status]

  step_2_assess:
    purpose: Inspect the current Code Mode build, UTCP configuration, and runtime wiring
    activities:
      - "Run bash .skilled/commands/doctor/scripts/mcp-doctor.sh --json and parse status, exitCode, summary, and checks. Exit 0 is healthy, 1 warnings, 2 failures; exit 3 means the script was invoked wrongly and printed no report, so stop and report it."
      - "Review the Code Mode package manifest, source timestamps, dist/index.js, node_modules, .utcp_config.json, and selected runtime config."
      - "Treat dist/index.js as stale when any available source input is newer; syntax-check a present dist/index.js with node --check."
      - "For Codex TOML, validate with Python tomllib when available; otherwise report the config as unvalidated."
    outputs: [assessment_json, build_status, manual_status, runtime_status]

  step_3_build:
    purpose: Install Code Mode dependencies and build when needed
    condition: "The package manifest exists and the user approves the build or dependency install."
    approval: per_mutation
    actions:
      - "Run cd .skilled/skills/mcp-code-mode/mcp-server && npm install when dependencies are missing or the user requests a fresh install."
      - "Run cd .skilled/skills/mcp-code-mode/mcp-server && npm run build when dist/index.js is missing or stale."
    prohibited_actions:
      - "Do not run scripts/install.sh."
      - "Do not edit files under .skilled/skills/mcp-code-mode beyond the build outputs and package-manager outputs produced by the approved commands."

  step_4_configure_manual:
    purpose: Create or update the Code Mode UTCP manual configuration
    condition: "The user approves a .utcp_config.json change."
    approval: per_mutation
    activities:
      - "Preserve existing valid manuals and add only the manual the user identifies, using a valid underscore-separated JavaScript identifier."
      - "Require every manual to have a non-empty name and call_template_type."
      - "For each ${VAR} reference, identify the expected key: the manual name with each underscore doubled, then _<VAR>. Report only the key name and whether it is present."
      - "If a credential key is missing, tell the user to manage its value in the repository root .env file outside this workflow. Never write, ask for, or print the value."
      - "Validate the final .utcp_config.json as JSON."

  step_5_register_runtime:
    purpose: Register Code Mode in the selected runtime config files
    condition: "The user approves a runtime config change."
    approval: per_mutation
    activities:
      - "Set the Code Mode command to node and include .skilled/bin/mcp-code-mode-launcher.cjs in its command arguments."
      - "Set UTCP_CONFIG_FILE to .utcp_config.json in the Code Mode environment."
      - "When --runtime is unset, register all seven project config files. When set, limit registration to that runtime; claude covers both .mcp.json and .claude/mcp.json. Preserve unrelated entries."
      - "Parse JSON runtime files with node. Parse Codex TOML with Python tomllib when available; if unavailable, report unvalidated and do not claim validation passed."
      - "Request explicit approval for each runtime file before editing it."
    user_level_note: "Hermes registration is user-level in ~/.hermes/config.yaml and is not checked."

  step_6_verify:
    purpose: Recheck the resulting Code Mode installation and report its state
    activities:
      - "Run bash .skilled/commands/doctor/scripts/mcp-doctor.sh --json. Do not pass --fix."
      - "Parse the preserved JSON shape: status, exitCode, summary, and checks[]."
      - "Report build freshness, UTCP JSON and manual fields, credential key names with present or missing status, and runtime wiring. Never include credential values."
      - "List any remaining FAIL or WARN checks and distinguish unvalidated from valid."
    outputs: [verification_json, final_status, remaining_issues]
