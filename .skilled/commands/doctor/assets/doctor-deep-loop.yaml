# ─────────────────────────────────────────────────────────────────
# DOCTOR: DEEP LOOP COVERAGE GRAPH WORKFLOW (INTERACTIVE DIAGNOSTIC MODE)
# ─────────────────────────────────────────────────────────────────
role: Expert Operator running deep-loop coverage graph diagnostics in interactive mode
purpose: Diagnose deep-loop and council graph status with user review gates. The workflow itself writes only its packet-local state log, and every status, query and convergence call runs with --read-only, so the calls create no database, apply no schema, append no observability event and persist no snapshot.
action: Discovery -> gate -> analysis -> gate -> recommendation -> report

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: sequential
  compliance: MANDATORY
  execution: interactive
  approvals: per_phase
  tracking: phase_by_phase
  validation: continuous_self_validation
  intent: DIAGNOSE


# ─────────────────────────────────────────────────────────────────
# DEEP LOOP DOCTOR INVARIANT
# ─────────────────────────────────────────────────────────────────
deep_loop_doctor_invariant: |
  Deep-loop doctor reads graph nodes and edges from both the deep-loop coverage
  graph (research/review/context) and the council graph, plus the iteration
  folders and ai-council artifacts that back them. The workflow itself writes
  only its packet-local state log, and every status, query and convergence call
  runs with --read-only, so the calls create no database, apply no schema,
  append no observability event and persist no snapshot. It never calls
  deep_loop_graph_upsert; the council graph is created by
  replay-graph-from-artifacts.cjs.
  Lazy-init is surfaced only as a recommendation when a graph is empty and its
  source inventory (iteration folders or ai-council artifacts) is readable.

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  contract: "current runtime script interface"
  files:
    script_interface: ".skilled/skills/system-deep-loop/runtime/references/script-interface-contract.md"
  pass_policy:
    convergence_signal_required: true
    minimum_iterations: 3
    lazy_init_source_required: true

# ─────────────────────────────────────────────────────────────────
# DEEP LOOP DOCTOR PHILOSOPHY
# ─────────────────────────────────────────────────────────────────
deep_loop_doctor_philosophy:
  principle: "Coverage graph checks should show whether iteration evidence and ai-council artifacts are represented in the deep-loop and council graphs."
  approach: "Discover iteration folders -> let user review -> sample status/query/convergence -> let user review -> emit recommendation."
  mandate: "The workflow itself writes only its packet-local state log, and every status, query and convergence call runs with --read-only, so the calls create no database, apply no schema, append no observability event and persist no snapshot."

# ─────────────────────────────────────────────────────────────────
# USER INPUTS
# ─────────────────────────────────────────────────────────────────
user_inputs:
  execution_mode: "[EXECUTION_MODE] - INTERACTIVE (this YAML)"
  intent: "[INTENT] - DIAGNOSE (this YAML)"
  scope: "[SCOPE] - research|review|council|both|all; default all"


# ─────────────────────────────────────────────────────────────────
# FIELD HANDLING
# ─────────────────────────────────────────────────────────────────
field_handling:
  defaults:
    scope_empty: "all"
  scope_policy:
    research: "inspect research/iterations only"
    review: "inspect review/iterations only"
    council: "inspect ai-council/** artifacts and the council graph only"
    both: "inspect research and review iteration folders (deep-loop coverage graph only)"
    all: "inspect research and review iteration folders plus ai-council/** artifacts (deep-loop and council graphs)"

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  allowed_targets:
    - "<active-spec-folder>/scratch/doctor-deep-loop-state.*.json"
  forbidden_targets:
    - "<active-spec-folder>/research/iterations/*.md"  # read-only source inputs, never rewritten
    - "<active-spec-folder>/review/iterations/*.md"  # read-only source inputs, never rewritten
    - "<active-spec-folder>/ai-council/**"  # read-only council artifacts, never rewritten
    - "<active-spec-folder>/**/*.md"  # no spec packet doc writes from deep-loop doctor
    - "<active-spec-folder>/description.json"  # metadata not deep-loop storage
    - "<active-spec-folder>/graph-metadata.json"
    - ".skilled/skills/**/SKILL.md"
    - ".skilled/skills/**/graph-metadata.json"
    - ".skilled/agents/**/*.md"
    - ".skilled/commands/doctor/*.md"
    - ".skilled/commands/doctor/assets/doctor-*.yaml"
    - ".skilled/skills/system-deep-loop/runtime/database/deep-loop-graph.sqlite"  # read through --read-only only
    - ".skilled/skills/system-deep-loop/runtime/database/council-graph.sqlite"  # read through --read-only only
    - "direct SQL graph mutation"
  policy: "The workflow itself writes only the packet-local state log. Every status, query and convergence call runs with --read-only, so the calls create no database, apply no schema, append no observability event and persist no snapshot. Iteration files and council artifacts remain read-only inputs."
  enforcement: "Any direct workflow write outside the packet-local state log halts with STATUS=FAIL and ERROR='confirm-mode-mutation-violation'. Calls to the status, query and convergence scripts run with --read-only, so they create no database, apply no schema, append no observability event and persist no snapshot."
  validator:
    runs: "Apply these target checks before any direct workflow write; only the packet-local state log is written directly."
    steps:
      - "Resolve the state-log path under the active spec folder scratch directory."
      - "Reject direct workflow writes to iteration files, council artifacts, graph databases, or other packet files."
      - "Use only status, query, and convergence scripts for graph inspection; never call deep_loop_graph_upsert."
      - "Pass --read-only on every status, query and convergence call."

# ─────────────────────────────────────────────────────────────────
# INTERACTIVE GATES
# ─────────────────────────────────────────────────────────────────
interactive_gates:
  before_phase_1_analysis:
    prompt: "Phase 0 deep-loop discovery complete. Continue to Phase 1 graph analysis? (y/n/details)"
    blocking: true
    approvals:
      y: "continue to phase_1_analysis"
      n: "STATUS=CANCELLED; emit state log with phase=phase_0_discovery"
      details: "print graph presence, empty_graph, stale_graph, iteration counts, and lazy-init availability, then ask again"
  before_phase_2_recommendation:
    prompt: "Phase 1 graph analysis complete. Continue to Phase 2 recommendation? (y/n/details)"
    blocking: true
    approvals:
      y: "continue to phase_2_recommendation"
      n: "STATUS=CANCELLED; emit state log with phase=phase_1_analysis"
      details: "print drift classes and convergence samples, then ask again"
  before_phase_3_report:
    prompt: "Phase 2 recommendation ready. Emit report and state log? (y/n/details)"
    blocking: true
    approvals:
      y: "emit report and state log"
      n: "STATUS=CANCELLED; emit minimal state log"
      details: "print recommendation, then ask again"

# ─────────────────────────────────────────────────────────────────
# STALENESS SIGNALS
# ─────────────────────────────────────────────────────────────────
staleness_signals:
  empty_graph:
    detection: "status.cjs reports totalNodes == 0 while iteration folders or ai-council artifacts exist (per scope)"
    severity: high
  stale_graph:
    detection: "deep-loop-graph.sqlite or council-graph.sqlite last write age > 7 days OR older than its newest source file (iteration markdown or ai-council artifact)"
    severity: medium
  orphan_nodes:
    detection: "query.cjs coverage_gaps returns nodes missing incoming coverage edges"
    severity: medium
  missing_convergence_signal:
    detection: "packets with at least three iterations return empty signals from convergence.cjs"
    severity: high
  unresolved_source_tags:
    detection: "check-source-tags-helper.mjs prints WARN lines for [SOURCE: path:line] tags in the packet's research or review artifacts: a gone file, a moved file or a line past the end"
    severity: low
    note: "Informational and never a reason to rebuild a graph. The helper writes nothing and makes no model call. A resolved tag only proves the path and line exist."

# ─────────────────────────────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────────────────────────────
workflow:
  phase_0_discovery:
    purpose: "Detect graph presence, empty_graph state, staleness, and iteration folders."
    activities:
      - "Glob: <active-spec-folder>/research/iterations/*.md when scope includes research."
      - "Glob: <active-spec-folder>/review/iterations/*.md when scope includes review."
      - "Glob: <active-spec-folder>/ai-council/** when scope includes council."
      - "Bash: stat -f '%m %z' .skilled/skills/system-deep-loop/runtime/database/deep-loop-graph.sqlite when present."
      - "Bash: stat -f '%m %z' .skilled/skills/system-deep-loop/runtime/database/council-graph.sqlite when present and scope includes council."
      - "Group iteration files and ai-council artifacts by specFolder, loopType (research|review|context|council), and inferred sessionId from metadata or folder path."
      - "Run status.cjs with --read-only for up to 10 sampled spec/session namespaces; use loopType='council' for ai-council namespaces when scope includes council."
      - "Set lazy_init.available=true when empty_graph=true and (iteration_folder_count > 0 or ai_council_artifact_count > 0)."
      - "Interactive gate: before_phase_1_analysis."
    note: "An absent database reports databasePresent=false and counts as graph_present=false."
    outputs:
      - graph_present: true|false
      - empty_graph: true|false
      - stale_graph: true|false
      - iteration_folder_count: N
      - ai_council_artifact_count: N
      - sampled_status: list
      - lazy_init_available: true|false
    validation: discovery_complete
    fail_fast:
      - "deep_loop_graph_status returns tool error for all samples -> STATUS=FAIL with diagnostic"

  phase_1_analysis:
    purpose: "Classify graph drift using query and convergence checks."
    activities:
      - "For sampled namespaces, run query.cjs with --read-only --query-type coverage_gaps --limit 50."
      - "For sampled research namespaces, run query.cjs with --read-only --query-type uncovered_questions --limit 50."
      - "For sampled research namespaces, run query.cjs with --read-only --query-type unverified_claims --limit 50."
      - "For packets with at least three iterations, run convergence.cjs with --read-only --iteration <latest_iteration>."
      - "For ai-council packets with council artifacts (scope includes council), run status.cjs, query.cjs, and convergence.cjs with --read-only and loopType='council' against the council graph."
      - "When scope includes research or review, run node .skilled/skills/system-spec-kit/runtime/cli/rules/check-source-tags-helper.mjs <active-spec-folder>. Group its WARN lines by lineage (the folder after research/lineages/ or review/lineages/, or 'main' for the packet's own research or review files) and count each class: gone, moved, past end, guessed. Keep every moved tag's new path. A SKIP line means the packet was created on or before the cutoff: report the reason, never as clean; only when the operator asks to audit an older packet, rerun with SPECKIT_SOURCE_TAG_CUTOFF=2000-01-01. Exit 2 is reported with stderr."
      - "Classify drift as empty_graph, stale_graph, orphan_nodes, missing_convergence_signal, or coverage_gaps."
      - "Never call deep_loop_graph_upsert in diagnostic mode."
      - "Interactive gate: before_phase_2_recommendation."
    outputs:
      - drift_classes:
          empty_graph: boolean
          stale_graph: boolean
          orphan_nodes: N
          missing_convergence_signal: N
          coverage_gaps: N
      - unresolved_source_tags: "per lineage, {gone, moved, past_end, guessed} counts plus the moved tags' new paths, or the SKIP reason"
      - convergence_samples: list
      - severity_max: low|medium|high
    validation: analysis_complete

  phase_2_recommendation:
    purpose: "Translate drift signals into a safe operator action."
    rules:
      - "If empty_graph=true and lazy_init_available=true -> recommend a coverage-graph rebuild via /doctor:rebuild."
      - "If missing_convergence_signal > 0 -> recommend a coverage-graph rebuild via /doctor:rebuild."
      - "If stale_graph=true or orphan_nodes > 0 -> recommend a coverage-graph rebuild via /doctor:rebuild."
      - "If council graph drift is detected (empty/stale council graph while ai-council artifacts exist) -> recommend a council graph replay via ai-council replay-graph-from-artifacts.cjs (the council graph is not rebuilt by /doctor:rebuild)."
      - "unresolved_source_tags never raises severity_max and never triggers a rebuild. List the counts per lineage beside the recommendation; the fix is editing the tags in the iteration files."
      - "If no drift -> status=OK, no action needed."
    outputs:
      - status: OK|EMPTY|STALE|ATTENTION|MISSING|CANCELLED|FAIL
      - recommended_command: string
      - recommended_when: now|after-next-iteration|monitor
    validation: recommendation_complete
    activities:
      - "Interactive gate: before_phase_3_report."

  phase_3_report:
    purpose: "Emit packet-local report + state log."
    activities:
      - "Compose report following the output_contract in this workflow."
      - "Write state log to <active-spec-folder>/scratch/doctor-deep-loop-state.<timestamp>.json."
      - "Print summary table to stdout."
    outputs:
      - state_log_path: "<active-spec-folder>/scratch/doctor-deep-loop-state.<timestamp>.json"
      - status: STATUS_OK|STATUS_EMPTY|STATUS_STALE|STATUS_ATTENTION|STATUS_MISSING|STATUS_CANCELLED|STATUS_FAIL
    validation: report_emitted

# ─────────────────────────────────────────────────────────────────
# OUTPUT FORMAT
# ─────────────────────────────────────────────────────────────────
output_contract:
  format: markdown
  required_sections:
    - status_header
    - graph_state_table
    - drift_signals_block
    - lazy_init_block
    - recommendation_block
    - next_steps_block
  state_log:
    path: "<active-spec-folder>/scratch/doctor-deep-loop-state.<timestamp>.json"
    schema:
      command: "/doctor:speckit deep-loop"
      mode: INTERACTIVE
      intent: DIAGNOSE
      timestamp: ISO_8601
      duration_seconds: number
      status: OK|EMPTY|STALE|ATTENTION|MISSING|CANCELLED|FAIL
      scope: research|review|council|both|all
      drift_classes: object
      lazy_init: object
      recommendation: string

# ─────────────────────────────────────────────────────────────────
# HALT CONDITIONS
# ─────────────────────────────────────────────────────────────────
halt_conditions:
  - "Any direct workflow write outside the packet-local state log -> STATUS=FAIL with ERROR='confirm-mode-mutation-violation'"
  - "Any phase calls deep_loop_graph_upsert -> STATUS=FAIL with ERROR='confirm-mode-upsert-forbidden'"
  - "Any direct sqlite3 mutation is attempted -> STATUS=FAIL with ERROR='direct-sql-forbidden'"
  - "User answers n at any interactive gate -> STATUS=CANCELLED and emit state log"
