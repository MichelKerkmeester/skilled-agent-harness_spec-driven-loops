# ─────────────────────────────────────────────────────────────────
# DOCTOR: SETUP UMBRELLA (READ-ONLY DIAGNOSTIC)
# ─────────────────────────────────────────────────────────────────
role: Diagnostic Operator giving a first-run overview of every doctor command and running the existing read-only setup checks once
purpose: List every doctor target with what it checks, run five read-only legs, and name the runnable doctor command that repairs each failing leg
action: Print the doctor target list -> run the five read-only legs once -> render the per-leg verdict and repair lines through the presentation contract
skill_owner: ".skilled/commands/doctor/"

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: single-step
  compliance: MANDATORY
  execution: read_only
  approvals: none
  tracking: single_run
  validation: read_only_assertion

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES (READ-ONLY)
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  read_only: true
  allowed_targets: []
  forbidden_targets:
    - "**/*"
  invariant: "Every leg runs in its check-only form. This route MUST NOT regenerate the trigger index, sync a runtime mirror, start the advisor daemon, install hooks or provision the tree. A failing leg prints the doctor command that repairs it; repair is an explicit operator action, never a side effect of this diagnostic."

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  route_manifest: ".skilled/commands/doctor/_routes.yaml"
  sk_code_battery: ".skilled/commands/doctor/scripts/sk-code-setup-check.cjs"
  sk_git_battery: ".skilled/commands/doctor/scripts/git-setup-check.cjs"
  trigger_index_check: ".skilled/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs"
  runtime_mirror_check: ".skilled/skills/system-spec-kit/runtime/cli/runtime-mirrors/sync-runtime-mirrors.cjs"
  hop_history: ".skilled/hooks/session-relaunch/bin/session-relaunch.cjs"

# ─────────────────────────────────────────────────────────────────
# INPUTS
# ─────────────────────────────────────────────────────────────────
inputs:
  target: "The command takes no positional target and no flag. /doctor:setup alone runs it; anything else fails before this YAML loads."

# ─────────────────────────────────────────────────────────────────
# EXECUTION
# ─────────────────────────────────────────────────────────────────
execution:
  steps:
    - "Read .skilled/commands/doctor/_routes.yaml and print the doctor target list through the presentation contract: one row per route (command plus target), plus /doctor:update, /doctor:env and /doctor:mcp, each with the one-line description of what it checks."
    - "Leg sk-code: run node .skilled/commands/doctor/scripts/sk-code-setup-check.cjs. Exit 0 passes. Any other exit fails, with repair /doctor:sk-code setup."
    - "Leg sk-git: run node .skilled/commands/doctor/scripts/git-setup-check.cjs --tool=<name>, where <name> is the AI tool executing this command: claude, codex, devin, cursor, opencode, pi or hermes. On any other runtime, run it without --tool, because the battery accepts no other name. Exit 0 passes. Exit 3 is DEGRADED, not a failure: no check failed, but one is UNKNOWN or DEGRADED, so the row names /doctor:git setup to show which. Exit 2 is a usage error or a crash and is ERROR. Any other exit fails, with repair /doctor:git setup."
    - "Leg trigger-index: run node .skilled/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs --check --json. Exit 0 passes. Exit 1 (stale documents) or 2 and higher (unreadable index) fails, with repair /doctor:speckit."
    - "Leg runtime-mirrors: run node .skilled/skills/system-spec-kit/runtime/cli/runtime-mirrors/sync-runtime-mirrors.cjs --check. Exit 0 passes. Any other exit fails, with repair /doctor:runtime-mirrors."
    - "Leg advisor: run node .skilled/bin/skill-advisor.cjs advisor_status --workspace-root \"$PWD\" --format json --timeout-ms 500 --warm-only. Exit 0 with data.freshness set to live is PASS. Exit 0 with any other freshness is DEGRADED, with repair /doctor:skill-advisor rebuild. Exit 75 with a staleDistWarning field in stderr JSON is FAIL, with repair npm --prefix .skilled/skills/system-skill-advisor/runtime run build. Exit 75 without that field is SKIP because the daemon is not running. Any other exit is FAIL, with repair /doctor:skill-advisor rebuild."
    - "Last session hop (informational, not a leg): run node .skilled/hooks/session-relaunch/bin/session-relaunch.cjs history --last 1 and show its one output line under the result as the last session hop. Its exit and output never change the status."
    - "Run every leg even when an earlier one fails, then render the per-leg table, the DOCTOR DIAGNOSTIC RESULT summary and the troubleshooting table through .skilled/commands/doctor/assets/doctor-setup-presentation.txt."

# ─────────────────────────────────────────────────────────────────
# OUTPUT
# ─────────────────────────────────────────────────────────────────
output: |
  STATUS=OK when no leg fails: each leg passes, is skipped or is degraded. List each degraded leg with the command that shows why.
  STATUS=FAIL when any leg fails; list each failing leg with its repair command.
  STATUS=ERROR when a leg crashes or its output cannot be read; report the message and the accepted invocation (/doctor:setup).
