# ─────────────────────────────────────────────────────────────────
# DOCTOR: SETUP UMBRELLA (READ-ONLY DIAGNOSTIC)
# ─────────────────────────────────────────────────────────────────
role: Diagnostic Operator giving a first-run overview of every doctor command and running the existing read-only setup checks once
purpose: List every doctor target with what it checks, run seven read-only legs, and name the runnable doctor command that repairs each failing leg
action: Print the doctor target list -> run the seven read-only legs once -> render the per-leg verdict and repair lines through the presentation contract
skill_owner: ".skilled/skills/system-skilled-doctor/"

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: single-step
  compliance: MANDATORY
  execution: read_only
  approvals: none
  tracking: single_run
  validation: read_only_assertion

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES (READ-ONLY)
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  read_only: true
  allowed_targets: []
  forbidden_targets:
    - "**/*"
  invariant: "Every leg runs in its check-only form. This route MUST NOT regenerate the trigger index, sync a runtime mirror, start the advisor daemon, install hooks or provision the tree. A failing leg prints the doctor command that repairs it; repair is an explicit operator action, never a side effect of this diagnostic. The one write outside the repository is the advisor CLI creating its socket directory, /tmp/system-skill-advisor unless SPECKIT_IPC_SOCKET_DIR names another, when that directory is absent. No leg makes it on purpose."

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  route_manifest: ".skilled/commands/doctor/_routes.yaml"
  sk_code_battery: ".skilled/commands/doctor/scripts/sk-code-setup-check.cjs"
  sk_git_battery: ".skilled/commands/doctor/scripts/git-setup-check.cjs"
  trigger_index_check: ".skilled/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs"
  runtime_mirror_check: ".skilled/skills/system-spec-kit/runtime/cli/runtime-mirrors/sync-runtime-mirrors.cjs"
  hop_history: ".skilled/hooks/session-handover/bin/session-handover.cjs"
  hook_wiring_check: ".skilled/commands/doctor/scripts/hook-wiring-check.cjs"
  codex_approval_check: ".skilled/commands/doctor/scripts/codex-hook-approval-check.cjs"

# ─────────────────────────────────────────────────────────────────
# INPUTS
# ─────────────────────────────────────────────────────────────────
inputs:
  target: "The command takes no positional target and no flag. /doctor:setup alone runs it; anything else fails before this YAML loads."

# ─────────────────────────────────────────────────────────────────
# EXECUTION
# ─────────────────────────────────────────────────────────────────
execution:
  steps:
    - "Read .skilled/commands/doctor/_routes.yaml and print the doctor target list through the presentation contract. The presentation table owns the rows and their wording. It shows /doctor:ci as one row for its report target. That row names the scaffold and toggle routes. Each row carries the one-line description of what it checks."
    - "Leg sk-code: run node .skilled/commands/doctor/scripts/sk-code-setup-check.cjs. Exit 0 passes. Any other exit fails, with repair /doctor:sk-code setup."
    - "Leg sk-git: run node .skilled/commands/doctor/scripts/git-setup-check.cjs --tool=<name>, where <name> is the AI tool executing this command: claude, codex, devin, cursor, opencode, pi or dsh. On any other runtime, run it without --tool, because the battery accepts no other name. Exit 0 passes. Exit 3 is DEGRADED, not a failure: no check failed, but one is UNKNOWN or DEGRADED, so the row names /doctor:git setup to show which. Exit 2 is a usage error or a crash and is ERROR. Any other exit fails, with repair /doctor:git setup."
    - "Leg trigger-index: run node .skilled/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs --check --json. Exit 0 passes. Exit 1 (stale documents) or 2 and higher (unreadable index) fails, with repair /doctor:speckit."
    - "Leg runtime-mirrors: run node .skilled/skills/system-spec-kit/runtime/cli/runtime-mirrors/sync-runtime-mirrors.cjs --check. Exit 0 passes. Any other exit fails, with repair /doctor:runtime-mirrors."
    - "Leg advisor: run node .skilled/bin/skill-advisor.cjs advisor_status --workspace-root \"$PWD\" --format json --timeout-ms 500 --warm-only. Exit 0 with data.freshness set to live is PASS. Exit 0 with any other freshness is DEGRADED, with repair /doctor:skill-advisor rebuild. Exit 75 with a staleDistWarning field in stderr JSON is FAIL, with repair npm --prefix .skilled/skills/system-skill-advisor/runtime run build. Exit 75 without that field is SKIP because the daemon is not running. Any other exit is FAIL, with repair /doctor:skill-advisor rebuild. When data.hookHealth is present, show hook p95 <rollingP95Ms> ms over <invocations> prompts, fail-open <rollingFailOpenRate as a percent>, degraded <rollingDegradedRate as a percent> and last record <lastRecordAt> under the leg. It never changes the leg's status. When data.hookHealth is absent, show hook health not recorded under the leg, because no prompt hook has written a record for this checkout yet: OpenCode has no prompt hook that writes one and an unapproved Codex hook never runs. It never changes the leg's status."
    - "Leg embedder: run node .skilled/bin/skill-advisor.cjs advisor_status --workspace-root \"$PWD\" --include-semantic-health true --format json --timeout-ms 1500 --warm-only. Exit 75 is SKIP, as for the advisor leg, because the daemon is not running. When coverageComplete is true, the vector coverage check is PASS. Report the leg PASS when data.semanticLaneHealth.backend.state is reachable; if that state is not reachable, report DEGRADED, say routing continues on the other lanes and point to /doctor:skill-advisor embedder. When coverage is incomplete and the backend is reachable, report DEGRADED with stale and missing counts for skills and commands, and say the daemon refreshes them on its next start with Ollama up. Never use laneEnabled as a success condition or fail because it is false. Print data.laneWeights.semantic_shadow on its own info line; at 0 with complete coverage print: semantic lane weight 0: vectors ready, lane off by default."
    - "Leg delivery: run node .skilled/commands/doctor/scripts/hook-wiring-check.cjs --root \"$PWD\" and node .skilled/commands/doctor/scripts/codex-hook-approval-check.cjs --root \"$PWD\", and show each line they print under the leg. Both exit 0 is PASS. A hook-missing line is DEGRADED, with repair /doctor:runtime-mirrors in a Skilled checkout or /doctor:symlink check in a linked project. A pi-extension-broken line is DEGRADED, with the repair line the check printed: the Skilled checkout this project uses is likely out of date, so run git pull in that checkout, then /doctor:symlink check. WARN codex-hooks-unapproved is DEGRADED, with the repair line the check printed. WARN codex-advisor-hook-absent is DEGRADED, with the repair line the check printed. Exit 2 from either check is ERROR. This leg is never FAIL, because a hook that is not wired or not approved stops the brief, not the install."
    - "Last session hop (informational, not a leg): run node .skilled/hooks/session-handover/bin/session-handover.cjs history --last 1 and show its first output line under the result as the last session hop, plus its open notes line when it prints one. Its exit and output never change the status."
    - "Claude context window (informational, not a leg): run node .skilled/hooks/session-handover/bin/session-handover.cjs window and show its line. Its exit and output never change the status."
    - "Orphan processes (informational, not a leg): run node .skilled/commands/doctor/scripts/orphan-process-check.cjs --summary and show its line. Its exit and output never change the status."
    - "Run every leg even when an earlier one fails, then render the per-leg table, the DOCTOR DIAGNOSTIC RESULT summary and the troubleshooting table through .skilled/commands/doctor/assets/doctor-setup-presentation.txt."

# ─────────────────────────────────────────────────────────────────
# OUTPUT
# ─────────────────────────────────────────────────────────────────
output: |
  STATUS=OK when no leg fails: each leg passes, is skipped or is degraded. List each degraded leg with the command that shows why.
  STATUS=FAIL when any leg fails; list each failing leg with its repair command.
  STATUS=ERROR when a leg crashes or its output cannot be read; report the message and the accepted invocation (/doctor:setup).
