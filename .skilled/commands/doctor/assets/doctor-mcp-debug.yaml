role: Code Mode diagnostic specialist
purpose: Diagnose Code Mode build, UTCP configuration, credentials, and runtime registration
action: Run read-only diagnostics and offer individually approved repairs

operating_mode:
  workflow: sequential_5_step
  execution: interactive
  approvals: per_repair
  validation: post_repair_reverify
  intent: DEBUG

scope:
  component: Code Mode
  install_guide: .skilled/skills/mcp-code-mode/INSTALL-GUIDE.md
  diagnostic_script: .skilled/commands/doctor/scripts/mcp-doctor.sh
  runtime_config_files:
    - opencode.json
    - .mcp.json
    - .claude/mcp.json
    - .codex/config.toml
    - .cursor/mcp.json
    - .pi/mcp.json
    - .devin/mcp_config.json

inputs:
  fix:
    flag: "--fix"
    default: false
    effect: "Offer approved repairs for reported build or runtime wiring failures."

invariants:
  - "Run the doctor script with --json only; never pass --fix or another argument to the script."
  - "Do not repair credentials or write credential values. Report expected key names and presence only."
  - "Obtain explicit approval for each proposed write, even when --fix is set."
  - "Stop build repairs when .skilled/skills/mcp-code-mode/mcp-server/package.json is missing."
  - "Preserve the doctor output shape: status, exitCode, summary, checks[]."

repair_actions:
  install_dependencies:
    command: "cd .skilled/skills/mcp-code-mode/mcp-server && npm install"
    condition: "package.json exists and node_modules is missing"
  rebuild:
    command: "cd .skilled/skills/mcp-code-mode/mcp-server && npm run build"
    condition: "package.json exists and dist/index.js is missing or stale"
  runtime_wiring:
    condition: "A supported runtime config is invalid or lacks the Code Mode launcher and UTCP_CONFIG_FILE entry"
    files: [opencode.json, .mcp.json, .claude/mcp.json, .codex/config.toml, .cursor/mcp.json, .pi/mcp.json, .devin/mcp_config.json]
    entry:
      command: node
      launcher: .skilled/bin/mcp-code-mode-launcher.cjs
      env:
        UTCP_CONFIG_FILE: .utcp_config.json

workflow:
  step_1_diagnose:
    purpose: Collect structured Code Mode health results
    activities:
      - "Run bash .skilled/commands/doctor/scripts/mcp-doctor.sh --json."
      - "Parse status, exitCode, summary, and checks[]."
      - "Treat exit code 0 as healthy, 1 as warnings, and 2 as failures. Exit code 3 means the script was invoked wrongly and printed no report; stop and report it."
      - "Do not pass the command's --fix flag to the script."
    command: "bash .skilled/commands/doctor/scripts/mcp-doctor.sh --json"
    outputs: [diagnostic_json, fail_list, warn_list]
    on_healthy: "Skip to step_5_summary."

  step_2_present:
    purpose: Show the health state and identify actionable findings
    activities:
      - "Display one Code Mode row with PASS, WARN, or FAIL and a concise summary."
      - "List each failed or warning check with its detail."
      - "Explain that stale build status is determined by source timestamps and that a present dist/index.js is syntax-checked."
      - "Show the INFO result that Hermes registration is user-level in ~/.hermes/config.yaml and is not checked."
      - "When --fix is absent, offer to explain repair steps without making changes."
      - "When --fix is present, offer repair actions one at a time and wait for approval for each."
    checkpoint:
      condition: "At least one actionable FAIL exists and --fix is present."
      prompt: "Review the findings. Choose a proposed repair individually, skip it, or stop."

  step_3_investigate_and_repair:
    purpose: Diagnose the cause and apply only an approved repair
    condition: "The user selects a repair and explicitly approves it."
    activities:
      - "Read the relevant troubleshooting guidance from the Code Mode install guide."
      - "For missing package.json, report that build repair cannot continue and stop."
      - "For missing dependencies, propose repair_actions.install_dependencies."
      - "For missing or stale build output, propose repair_actions.rebuild."
      - "For invalid runtime wiring, propose a minimal edit to only the affected supported runtime file."
      - "Do not change .utcp_config.json or .env during debug repairs; explain missing credential keys by name and presence only."
      - "Use node to validate JSON edits. Use Python tomllib to validate Codex TOML when available; otherwise report unvalidated and never claim PASS."
      - "Record the approved action and its command result."
    approval_prompt: |
      Finding: {check.check}
      Detail: {check.detail}
      Proposed repair: {repair.description}
      Command or file change: {repair.command_or_change}

      Apply this repair? [Y/n]
    outputs: [repairs_attempted, repairs_succeeded, repairs_failed]

  step_4_verify:
    purpose: Confirm the result after each approved repair
    condition: "repairs_attempted > 0"
    activities:
      - "Run bash .skilled/commands/doctor/scripts/mcp-doctor.sh --json again."
      - "Compare the new checks with the original diagnostic results."
      - "Report resolved, remaining, and new findings for Code Mode."
    command: "bash .skilled/commands/doctor/scripts/mcp-doctor.sh --json"
    outputs: [verification_json, resolved_count, remaining_count]

  step_5_summary:
    purpose: Report final Code Mode status and next steps
    activities:
      - "Display before and after status for the checks that were repaired."
      - "List remaining failures, warnings, and any unvalidated runtime config."
      - "Report credential key names with present or missing status only; never show values."
      - "For remaining findings, point to the Code Mode install guide or the affected config path."
    report_fields: [status, checks, repairs_attempted, repairs_succeeded, repairs_failed, next_steps]

error_handling:
  script_not_found: "Stop and report .skilled/commands/doctor/scripts/mcp-doctor.sh is missing."
  node_not_found: "Report that Node.js 24 is required for Code Mode checks and repairs."
  json_parse_error: "Stop and report that the diagnostic JSON could not be parsed."
  script_usage_error: "Exit code 3 means a bad argument or a --root that is not a directory; stop and report the script's stderr."
  repair_fails: "Record the command result and offer the documented manual resolution; do not retry without a new approval."
