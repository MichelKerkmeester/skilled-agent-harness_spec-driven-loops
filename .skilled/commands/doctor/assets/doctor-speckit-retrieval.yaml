# ─────────────────────────────────────────────────────────────────
# DOCTOR: TRIGGER-INDEX AND RETRIEVAL-CONVENTIONS WORKFLOW (INTERACTIVE DIAGNOSTIC MODE)
# ─────────────────────────────────────────────────────────────────
role: Expert Operator running trigger-index and retrieval-convention diagnostics in interactive mode
purpose: Read-only health check + staleness detection with user review gates. No mutations. Report goes to packet-local scratch.
action: Discovery → gate → analysis → gate → staleness classification → recommendation → state log

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: sequential
  compliance: MANDATORY
  execution: interactive
  approvals: per_phase
  tracking: phase_by_phase
  validation: continuous_self_validation
  intent: DIAGNOSE  # never APPLY in this YAML


speckit_retrieval_doctor_invariant: |
  This doctor is read-only by contract and needs no background service. It treats the
  generated trigger index at .skilled/skills/system-spec-kit/runtime/data/trigger-index.json as
  the artifact it diagnoses but never regenerates. Regeneration is owned by the
  /doctor:rebuild orchestrator, which runs the generator over the whole corpus in one pass.

upstream_assets:
  contract: "local command design contract"
  conventions: ".skilled/skills/system-spec-kit/references/retrieval/retrieval-conventions.md"
  index_path: ".skilled/skills/system-spec-kit/runtime/data/trigger-index.json"
  lookup_command: 'node .skilled/skills/system-spec-kit/runtime/cli/retrieval/lookup-trigger-index.mjs --json -- "<prompt>"'
  lookup_policy: "The lookup reads a file and exits. There is no socket to probe and no daemon to start. Exit 0 = at least one candidate, exit 1 = clean no-hit reported as an empty result, exit 2 or higher = an execution error reported with stderr attached and never as a no-hit."
  generator_command: "node .skilled/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs"
  files:
    acceptance: "specs/system-speckit/033-system-speckit-v4/017-memory-database-decommission/001-trigger-index-replacement/acceptance-criteria.md"  # the bar the index and lookup were accepted against
    latency_report: ".skilled/skills/system-spec-kit/runtime/cli/retrieval/fixtures/latency-report.json"  # cold-lookup budget evidence
  pass_policy:
    lookup_exit_class: "0 or 1 on the probe prompt and on every prompt in fixtures/prompt-set.json; 2 or higher fails"  # the lookup contract, never a result count
    cold_lookup_p95_budget_ms: 200  # the budget the latency report was accepted under
    index_regenerates_byte_identical: true  # two generator runs must hash the same; proof owned by /doctor:rebuild
    index_regenerates_byte_identical_owner: "/doctor:rebuild"  # its generator leg rebuilds the index and its --check verification proves the result; this read-only doctor writes only its report and state log, so it can never run the two builds the proof needs
speckit_retrieval_doctor_philosophy:
  principle: "Detect index staleness before it breaks Gate 1 lookups; this command never mutates — regeneration runs through /doctor:rebuild"
  approach: "Read the index and its manifest → run the lookup and a ripgrep recipe → classify staleness → emit recommendations"
  mandate: "This command is read-only by contract."
  honest_loss: "The retired continuity database offered semantic paraphrase, vector and BM25 fusion, decay, access tracking, session dedup and causal traversal. None of them has a replacement here. This doctor diagnoses a lexical index and a lexical scan, and it reports a miss as a miss."

# ─────────────────────────────────────────────────────────────────
# USER INPUTS (passed from Markdown setup phase)
# ─────────────────────────────────────────────────────────────────
user_inputs:
  execution_mode: "[EXECUTION_MODE] - INTERACTIVE (this YAML)"
  intent: "[INTENT] - DIAGNOSE (this YAML)"

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES (READ-ONLY)
# ─────────────────────────────────────────────────────────────────

mutation_boundaries:
  allowed_targets:
    - "<packet_scratch>/doctor-speckit-retrieval-report.*.md"  # the diagnostic report only
    - "<packet_scratch>/doctor-speckit-retrieval-state.*.json"  # the diagnostic state log only
  forbidden_targets:
    - ".skilled/skills/system-spec-kit/runtime/data/trigger-index.json"  # never regenerate from the doctor
    - "<active-spec-folder>/**/*.md"  # never write into spec packet docs from /doctor:speckit speckit-retrieval
    - "<active-spec-folder>/description.json"  # spec metadata belongs to the continuity writer
    - "<active-spec-folder>/graph-metadata.json"  # graph metadata is not a doctor target
    - ".skilled/skills/**/SKILL.md"  # never edit skill bodies
    - ".skilled/skills/**/graph-metadata.json"
    - ".skilled/agents/**/*.md"
    - ".skilled/commands/doctor/*.md"
    - ".skilled/commands/doctor/assets/doctor-*.yaml"
  enforcement: "This command is READ-ONLY by contract. No mutation phases exist in this YAML. Any attempted write halts with STATUS=FAIL and ERROR='confirm-mode-mutation-violation'."
  validator:
    name: validate_targets
    runs: "before any file write; diagnostic mode should never reach a write path"
    steps:
      - "For each target: resolve via realpath; reject absolute paths; reject paths containing `..` or symlinks escaping repo root"
      - "Assert resolved target is repo-relative under repo_root"
      - "Match resolved target against allowed_targets patterns only"
      - "Reject any match against forbidden_targets patterns"
      - "On first violation: abort, append violation to state log, exit STATUS=FAIL with diagnostic"
    on_pass: "diagnostic reads may continue"
    on_fail: "abort before any write; STATUS=FAIL ERROR=\"target validation failed: <path>\""

# ─────────────────────────────────────────────────────────────────
# INTERACTIVE GATES
# ─────────────────────────────────────────────────────────────────
interactive_gates:
  before_phase_1_analysis:
    prompt: "Phase 0 complete. Continue to Phase 1? (y/n/details)"
    blocking: true
    approvals:
      y: "continue to phase_1_analysis"
      n: "STATUS=CANCELLED; emit state log with phase=phase_0_discovery"
      details: "print Phase 0 discovery outputs, then ask again"
  before_phase_2_recommendation:
    prompt: "Phase 1 complete. Continue to Phase 2? (y/n/details)"
    blocking: true
    approvals:
      y: "continue to phase_2_recommendation"
      n: "STATUS=CANCELLED; emit state log with phase=phase_1_analysis"
      details: "print Phase 1 staleness classification outputs, then ask again"

# ─────────────────────────────────────────────────────────────────
# STALENESS SIGNALS
# ─────────────────────────────────────────────────────────────────
staleness_signals:
  index_content_stale:
    detection: "generate-trigger-index.mjs --check --json exits 1 with fresh false, naming staleDocuments, a non-zero missingDocuments count, or obsoletePaths: the committed index no longer matches what the corpus declares"
    severity: medium
    note: "This is the staleness verdict. --check reads the corpus and the committed index and writes nothing. Exit 2 or higher is an unreadable index or a bad invocation, reported with stderr and never as fresh."
  index_older_than_corpus:
    detection: "Any indexed source file has an mtime newer than the trigger index mtime"
    severity: low
    note: "Supporting evidence only. A checkout, copy or touch moves mtimes without changing a phrase, so this sample never decides the verdict; index_content_stale does."

  committed_pair_mismatch:
    detection: "The manifestHash inside runtime/data/trigger-index.json differs from the one in runtime/cli/retrieval/fixtures/corpus-manifest.json, so one generator run did not produce the committed pair"
    severity: medium
    note: "Costs one JSON read per file and no corpus walk. Every generator run writes both files, so a mismatch means one of them was committed alone."
  lookup_exit_error:
    detection: "The lookup command exits 2 or higher, or emits stderr"
    severity: high
    note: "An exit of 1 is a clean no-hit and is never a staleness signal. Conflating the two is the failure this row exists to prevent."
  ripgrep_ambient_config:
    detection: "The section 2.2 recipe run once without --no-config returns a different path set than the same recipe with it, meaning RIPGREP_CONFIG_PATH is injecting arguments; the workflow runs both"
    severity: high
  trigger_phrase_drift:
    detection: "Frontmatter trigger_phrases changed in a source file since the index was generated"
    severity: low
  anchor_marker_drift:
    detection: "Unmatched or orphan <!-- ANCHOR:id --> / <!-- /ANCHOR:id --> pairs in the up-to-five sampled packets; phase 1 counts them per sample"
    severity: low
  corpus_pollution:
    detection: "The phraseQuality bucket in committed generation-diagnostics.json reports editor-fallback, folder-token-fallback, generic-workflow-word, numeric-only, prose-sentence, single-token, and stop-word-only counts; any non-zero count is the signal. The generator judges each owning document with its own packet-folder tokens, so folder-token-fallback is counted the way the per-document validator reports it."
    severity: medium
  schema_version_mismatch:
    detection: "The index schema version does not match the version the lookup script expects"
    severity: high
  gate1_instruction_parity:
    detection: "One of the five runtimes has no path to the Gate 1 lookup instruction: the root AGENTS.md line is missing, a generated pointer block in .codex/AGENTS.md or .cursor/rules/skill-routing.md is absent or differs from that line (sync-gate1-pointers.cjs --check exits 1), or Pi's context-file loading no longer lists AGENTS.md"
    severity: medium
    note: "Claude reads the root AGENTS.md directly and Pi loads it from the working directory; Codex and the Cursor rule shared by Cursor and Devin carry generated pointer blocks. Reach is per runtime: a pointer, direct load, verified inheritance, or session-start injection each count as a path."

# ─────────────────────────────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────────────────────────────
workflow:
  phase_0_discovery:
    purpose: Confirm the index exists, the lookup runs and a ripgrep recipe resolves; capture baseline
    activities:
      - "Bash: test -f .skilled/skills/system-spec-kit/runtime/data/trigger-index.json (index present)"
      - "Bash: stat -f '%m %z' .skilled/skills/system-spec-kit/runtime/data/trigger-index.json (mtime + size)"
      - "Bash: node .skilled/skills/system-spec-kit/runtime/cli/retrieval/generate-trigger-index.mjs --check --json (the staleness evidence; it writes nothing). Exit 0 with fresh true means the committed index matches the corpus; exit 1 is the index_content_stale signal, recorded with its staleDocuments count, missingDocuments and obsoletePaths; exit 2 or higher is reported with stderr and never as fresh. It walks the corpus once, so run it once per doctor run"
      - "Run upstream_assets.lookup_command with a known probe prompt; record exit status, indexHash, manifestHash and candidatePhraseCount"
      - "Run the lookup once per prompt in .skilled/skills/system-spec-kit/runtime/cli/retrieval/fixtures/prompt-set.json; any exit of 2 or higher is the lookup_exit_error signal"
      - "Bash: compare the manifestHash field of .skilled/skills/system-spec-kit/runtime/data/trigger-index.json with the manifestHash fields of .skilled/skills/system-spec-kit/runtime/cli/retrieval/fixtures/corpus-manifest.json, generation-diagnostics.json and phrase-variants.json; any unequal value is the committed_pair_mismatch signal, since one generator run writes all four"
      - "Optional, when the operator asks about latency: node .skilled/skills/system-spec-kit/runtime/cli/retrieval/measure-cold-lookup.mjs --json --out <packet scratch path>; exit 1 means the cold-start budget was exceeded. Never write the committed fixtures/latency-report.json from a diagnostic run"
      - "Run the path-only recipe from retrieval-conventions.md section 2.2 for a known phrase with --no-config --hidden --files-with-matches --max-count 1 --fixed-strings --ignore-case --glob '*.md' --glob '!**/z_archive/**' --glob '!**/node_modules/**' --glob '!**/.git/**' --glob '!**/scratch/**'; record exit status and path count"
      - "Run the same recipe once more without --no-config; a different path set is the ripgrep_ambient_config signal"
      - "Re-run that recipe with the roots set to a path that does not exist; confirm exit 2 with stderr, proving the wrapper can tell a broken invocation from a clean miss"
      - "Gate 1 reach, per runtime: verify the root AGENTS.md instruction Claude reads directly and Pi loads from the working directory; run node .skilled/skills/system-spec-kit/runtime/cli/runtime-mirrors/sync-gate1-pointers.cjs --check for Codex through .codex/AGENTS.md and Cursor and Devin through .cursor/rules/skill-routing.md. Any missing instruction path or a non-zero exit is the gate1_instruction_parity signal"
      - "Interactive gate: before_phase_1_analysis"
    outputs:
      - index_present: true|false
      - index_mtime: {path: string, mtime: epoch_seconds}
      - index_size: {path: string, size: bytes}
      - index_check: {exit: 0|1|2+, fresh: true|false, stale_documents: N, missing_documents: N, obsolete_paths: N}
      - lookup_exit: 0|1|2+
      - index_hash: string
      - manifest_hash: string
      - committed_pair_match: true|false
      - candidate_phrase_count: N
      - ripgrep_exit: 0|1|2+
      - ripgrep_path_count: N
      - gate1_reach: {claude: direct|none, codex: pointer|none, cursor: pointer|none, devin: pointer|none, pi: inherited|none}
    validation: discovery_complete
    fail_fast:
      - "Lookup exits 2 or higher → STATUS=FAIL with stderr attached"
      - "Index file missing → STATUS=MISSING, message='trigger index not generated'; the ripgrep lane still works and is reported separately"
      - "A committed fixture named above is missing or unreadable → STATUS=MISSING naming the fixture; the four-way compare cannot run on three files"

  phase_1_analysis:
    purpose: Classify staleness signals + identify suspect packets
    activities:
      - "Supporting evidence only, after the phase 0 --check verdict: cross-reference the index mtime with source mtimes. node -e reads the index's paths array from runtime/data/trigger-index.json and stats each path; any indexed file newer than the index is the index_older_than_corpus signal, reported beside the --check result and never in place of it. The recipe roots hold lineages, dist and fixtures the index excludes, so a find over the roots would over-count"
      - "Sample up to 5 packets flagged as staleness candidates, taking them from the --check staleDocuments list first"
      - "For each sample, read its frontmatter trigger_phrases and compare against the phrases the index holds for that path (read-only)"
      - "For each sample, count <!-- ANCHOR:id --> openers against <!-- /ANCHOR:id --> closers; an unmatched pair is the anchor_marker_drift signal"
      - "Read the phraseQuality bucket of .skilled/skills/system-spec-kit/runtime/cli/retrieval/fixtures/generation-diagnostics.json; report every non-zero aggregate class as corpus_pollution, whether or not any source document is stale."
      - "Aggregate signals into a staleness_classes count map"
      - "Interactive gate: before_phase_2_recommendation"
    outputs:
      - staleness_classes:
          index_content_stale: 0|1
          index_older_than_corpus: N
          lookup_exit_error: K
          ripgrep_ambient_config: L
          trigger_phrase_drift: P
          anchor_marker_drift: Q
          corpus_pollution: R
          schema_version_mismatch: S
      - sample_staleness_explanations: [up to 5 entries]
      - severity_max: low|medium|high
    validation: analysis_complete

  phase_2_recommendation:
    purpose: Translate staleness signals into recommended action
    rules:
      - "If severity_max == high (schema mismatch, lookup error, or ambient config) → recommend a full regeneration via /doctor:rebuild"
      - "If severity_max == medium (index content stale per --check, manifest hash mismatch, or corpus pollution) → recommend full-corpus regeneration via /doctor:rebuild, or a corpus fix first when the signal is pollution: the phrases never rank, so the cost is precision and parse time, not a wrong answer"
      - "If severity_max == low (trigger phrase drift, anchor drift, or an mtime sample that --check did not confirm) → recommend monitoring; rerun in 1-2 weeks"
      - "If no staleness → status=OK, no action needed"
      - "A lookup exit of 1 with a healthy index is a correct empty answer, not a finding. Never recommend a regeneration to make a no-hit disappear."
    outputs:
      - status: OK|DEGRADED|STALE|MISSING
      - recommended_command: string
      - recommended_when: now|low-activity-window|monitor

  phase_3_report:
    purpose: Emit packet-local report + state log
    activities:
      - "Compose report following the OUTPUT CONTRACT below"
      - "Write to <packet_scratch>/doctor-speckit-retrieval-report.<timestamp>.md (mutation class: add-only per _routes.yaml; the trigger index itself stays read-only)"
      - "Print summary table to stdout"
    outputs:
      - report_path: string
      - status: STATUS_OK | STATUS_DEGRADED | STATUS_STALE | STATUS_MISSING
    validation: report_emitted

# ─────────────────────────────────────────────────────────────────
# OUTPUT CONTRACT
# ─────────────────────────────────────────────────────────────────
output_contract:
  format: markdown
  required_sections:
    - status_header
    - index_state_table
    - staleness_signals_block
    - recommendation_block
  optional_sections:
    - sample_staleness_explanations
  state_log:
    path: "<packet_scratch>/doctor-speckit-retrieval-state.<timestamp>.json"
    schema:
      command: "/doctor:speckit speckit-retrieval"
      mode: INTERACTIVE
      intent: DIAGNOSE
      timestamp: ISO_8601
      duration_seconds: number
      status: OK|DEGRADED|STALE|MISSING|FAIL|CANCELLED
      staleness_classes: object
      recommendation: string

# ─────────────────────────────────────────────────────────────────
# HALT CONDITIONS
# ─────────────────────────────────────────────────────────────────
halt_conditions:
  - "Phase 0 lookup exits 2 or higher → STATUS=FAIL with stderr attached"
  - "Trigger index missing entirely → STATUS=MISSING (not FAIL); recommend /doctor:rebuild to generate it"
  - "Any phase emits a write attempt outside the packet scratch → STATUS=FAIL with ERROR='confirm-mode-mutation-violation'"
  - "User answers `n` at any interactive gate → STATUS=CANCELLED and emit state log"
