# ─────────────────────────────────────────────────────────────────
# DOCTOR: OVERLAY STATUS (READ-ONLY DIAGNOSTIC)
# ─────────────────────────────────────────────────────────────────
role: Diagnostic Operator reporting whether a vendored Skilled tree still carries its overlays, without changing a byte of it
purpose: Name every overlay destination that is not in sync, with the engine's own fix for it, by running the overlay engine's status mode once
action: Run .skilled/commands/doctor/scripts/overlay-engine.cjs status once -> render its lines through the presentation contract
skill_owner: ".skilled/skills/system-skilled-doctor/"

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: single-step
  compliance: MANDATORY
  execution: read_only
  approvals: none
  tracking: single_run
  validation: read_only_assertion

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES (READ-ONLY)
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  read_only: true
  allowed_targets: []
  forbidden_targets:
    - "**/*"
  invariant: "This route prints and never writes. It runs the engine's status mode only, never apply, apply --capture or apply --relayout, and status takes no lock. The verify steps status starts are the read-only check modes the overlay manifest names. A repair is an explicit action the operator runs through /doctor:overlay apply, apply --capture or apply --relayout."

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  overlay_engine: ".skilled/commands/doctor/scripts/overlay-engine.cjs"
  overlay_setting: ".skilled-overlays.json at the tree root, naming the overlay folder; skilled-overlays/ when the file is absent"
  overlay_manifest: "<overlay folder>/overlay-manifest.json, read by the engine and never by this workflow"
  presentation: ".skilled/commands/doctor/assets/doctor-overlay-presentation.txt"

# ─────────────────────────────────────────────────────────────────
# INPUTS
# ─────────────────────────────────────────────────────────────────
inputs:
  target: "status is the route's default target: /doctor:overlay and /doctor:overlay status both run it. Any other positional fails before this YAML loads."
  root: "The vendored tree to read when --root <dir> is passed (default none, so the engine reads the tree it is vendored in)."
  json_output: "true when --json is passed: the route prints the engine's JSON and nothing else (default false)."
  audit_output: "true when --audit is passed: the route also prints one AUDIT line per unowned vendored path that differs from upstream at the pin, is missing from the tree, or is tracked there and never upstream, plus the audit count, then the advisory DOCS lines for the overlay folder's READMEs and the docs count (default false)."
  execution_mode: "INTERACTIVE"

# ─────────────────────────────────────────────────────────────────
# EXECUTION
# ─────────────────────────────────────────────────────────────────
execution:
  steps:
    - "Run node .skilled/commands/doctor/scripts/overlay-engine.cjs status once, adding --root \"{root}\" only when the operator passed one, and --json when the operator asked for JSON. With --audit, add --audit to that same call, which adds the pin comparison. Pass no other flag: the engine's status mode accepts these three and nothing else."
    - "The engine prints one line per destination that is not in sync, in the form <state> <key>  (<origin>)  fix: <fix>. The state is overlay-edited, live-edited, both-changed, upstream-moved or cannot-apply, and an in-sync destination prints no line."
    - "After those lines the engine prints its state counts, one MISS line per failed check, one STALE line per root file upstream changed under a repin.rootFiles overlay, one LAYOUT line per manifest field that keeps a source off its layout path, at most 20 of them and then one LAYOUT overflow line for the rest with an indented Next: line under it, one NOTE line per note, its checked line and RESULT: PASSED or RESULT: FAILED. Keep every line as printed, because the counts and the fix text are the engine's answer and not this workflow's."
    - "With --audit the engine also prints one AUDIT line per unowned vendored path that drifted from the pin, in the form AUDIT <kind> <path>, where the kind is differs, missing or extra, then the audit count. A finding fails the status, and AUDIT skipped means the manifest names no upstream checkout that holds the pin."
    - "With --audit the engine then checks the overlay folder's READMEs and prints, after the AUDIT lines and before the checked line, one DOCS missing-readme <overlay label>/<folder> line per walked folder with neither a README.md nor a README.markdown as a regular file, one DOCS invalid-readme <overlay label>/<folder>/<README.md or README.markdown>: <first blocking error> line per README sk-doc's validator rejects, naming the file it read, with (+N more) when it found more, and docs=<n>. DOCS skipped: <reason> means python3 or the validator is missing, so no README was validated: it is not a finding, docs= does not count it, and the missing-readme lines still print. This leg reads only the overlay folder, so it runs even when AUDIT skipped printed. The DOCS lines are advisory: they never change RESULT:, the result field of --json or the exit, so show each one as printed with the README to add or fix, and never report it as a failure."
    - "A STALE line fails the status and a LAYOUT line does not: a stale root file is outstanding work, while an off-layout source still applies. Show both with the engine's own fix, and name /doctor:overlay apply --relayout beside each LAYOUT line, except a line that ends change the destination or remove the entry: that destination sits under root/skilled and relayout refuses the move, so show that remedy instead of relayout. Relayout refuses every move while any such line is present, or while the overflow line counts entries under root/skilled, so when either holds, say to fix those entries first and relayout after, even beside the lines and the overflow that name relayout. A NOTE line never fails the status: it names a check the run skipped, a value no record covers, an operation whose path names an array item by position or an insert anchor that matched nothing, with its own fix. Show each one as printed."
    - "Render the output through .skilled/commands/doctor/assets/doctor-overlay-presentation.txt: the lines as printed, the meaning and fix of each state from the state table, then the DOCTOR DIAGNOSTIC RESULT summary. Name the /doctor:overlay form beside each fix the engine printed."
    - "With --json, print the engine's JSON exactly and nothing around it."
    - "Map the engine's exit to the route status: exit 0 is in sync, exit 1 is a finding, and exit 2 is a precondition that failed, such as a missing overlay manifest, an invalid .skilled-overlays.json, or a manifest layout link whose path escapes the tree root or is listed twice."

# ─────────────────────────────────────────────────────────────────
# OUTPUT
# ─────────────────────────────────────────────────────────────────
output: |
  STATUS=OK when the engine exits 0 and prints RESULT: PASSED; show the counts and the checked line, and with --audit every DOCS line and the docs count, because a DOCS finding never fails the status.
  STATUS=FINDINGS when the engine exits 1. Show each line not in sync first with its fix, then each MISS line, then each STALE, LAYOUT, NOTE and AUDIT line, then each DOCS line, then the DOCTOR DIAGNOSTIC RESULT summary. Exit 1 never comes from a DOCS line.
  STATUS=ERROR when the engine exits 2 or crashes. Quote its message and name the accepted invocation (/doctor:overlay status [--json] [--audit] [--root <dir>]).
