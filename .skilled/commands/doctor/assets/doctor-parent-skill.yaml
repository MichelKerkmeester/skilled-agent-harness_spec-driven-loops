# ─────────────────────────────────────────────────────────────────
# DOCTOR: PARENT SKILL WORKFLOW (INTERACTIVE READ-ONLY MODE)
# ─────────────────────────────────────────────────────────────────
role: Expert Operator running the parent-skill structural audit in interactive mode
purpose: Read-only audit of parent-skill structure, routing manifests, root metadata, router contracts, and version consistency
action: Run parent-skill-check.cjs against the target parent-skill dir -> present per-invariant PASS/FAIL report -> final status

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: sequential_read_only_audit
  compliance: MANDATORY
  execution: interactive
  approvals: none
  tracking: audit_report_and_exit_code
  validation: audit_script_exit_code
  read_only: true

# ─────────────────────────────────────────────────────────────────
# PARENT-SKILL AUDIT INVARIANT
# ─────────────────────────────────────────────────────────────────
parent_skill_doctor_invariant: |
  The audit runs the fleet-wide root-metadata gate before the selected parent
  hub checker. The fleet gate checks each skill root's metadata class, nested
  identity files, generated leaf-manifest freshness and reachability, and root
  router contract. The parent checker verifies the selected hub's registry and
  directory consistency, mode routing contract, changelog shape, root
  description, playbook, benchmark baseline, and routing-version consistency.
  A mode packet may use packetKind "workflow", "surface", or "transport".
  Nested graph-metadata.json and description.json files are prohibited.
  PARENT_HUB_CHECK_STRICT=0 downgrades only advisory findings;
  hard failures remain failures. Both checks are read-only and report their
  individual exit codes.

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  contract: "skill-root metadata and parent-skill audit contracts"
  audit_script: ".skilled/commands/doctor/scripts/parent-skill-check.cjs"
  root_metadata_gate: ".skilled/skills/sk-doc/sk-create-skill/scripts/ci-skill-root-metadata.cjs"
  reference_implementation: ".skilled/skills/system-deep-loop"
  reference_doc: ".skilled/skills/sk-doc/sk-create-skill/references/README.md"

# ─────────────────────────────────────────────────────────────────
# USER INPUTS
# ─────────────────────────────────────────────────────────────────
user_inputs:
  execution_mode: "INTERACTIVE"
  parent_skill_dir: "[PARENT_SKILL_DIR] path"

# ─────────────────────────────────────────────────────────────────
# FIELD HANDLING
# ─────────────────────────────────────────────────────────────────
field_handling:
  defaults:
    parent_skill_dir_empty: ".skilled/skills/system-deep-loop"
  validation:
    execution_mode_must_be: INTERACTIVE
    parent_skill_dir_must_be_existing_directory: true
  command_mapping:
    parent_skill_dir: "pass as the first positional argument to the audit script"

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  read_only: true
  allowed_targets: []
  forbidden_targets:
    - "**/*"
  invariant: "This workflow is read-only. It may execute the audit script and print output, but it must not write files, reindex databases, mutate graph metadata, or edit the audited skill."

# ─────────────────────────────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────────────────────────────
workflow:
  phase_0_audit:
    purpose: "Run the fleet metadata gate and selected parent-skill structural audit (read-only)."
    activities:
      - "Resolve parent_skill_dir (default to upstream_assets.reference_implementation when empty)."
      - "Execute upstream_assets.root_metadata_gate via Bash with no --fix flag."
      - "Execute upstream_assets.audit_script via Bash with parent_skill_dir as the first positional argument, even when the fleet gate reports findings."
      - "Capture stdout and exit code separately for both checks."
    outputs:
      - fleet_metadata_report
      - fleet_metadata_exit_code
      - parent_skill_report
      - parent_skill_exit_code

  phase_1_report:
    purpose: "Present the per-invariant PASS/FAIL report and the final status."
    activities:
      - "Print both reports and their exit codes."
      - "Map both exit codes 0 to STATUS=OK; any exit code 1 to STATUS=FAIL; any exit code 2 to STATUS=ERROR."

# ─────────────────────────────────────────────────────────────────
# OUTPUT FORMAT
# ─────────────────────────────────────────────────────────────────
output_format: |
  STATUS=OK when both checks exit 0.
  STATUS=FAIL ERROR="parent-skill invariant failed" when either check exits 1 and neither exits 2.
  STATUS=ERROR ERROR="parent-skill audit could not run" when either check exits 2.
