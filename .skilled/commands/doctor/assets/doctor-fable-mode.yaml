# ─────────────────────────────────────────────────────────────────
# DOCTOR: FABLE-MODE BEHAVIORAL METRICS (READ-ONLY DIAGNOSTIC)
# ─────────────────────────────────────────────────────────────────
role: Diagnostic Operator reporting fable-5 behavioral metrics for a deep-loop artifact dir
purpose: Render the current tool:text / words-per-message / opener / caveat / evidence metrics and compare them to the captured baseline
action: Run fable-mode-check.cjs against the target dir -> render current-vs-baseline metrics -> final status
skill_owner: ".skilled/skills/system-spec-kit/runtime/cli/metrics/"

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: single-step
  compliance: MANDATORY
  execution: read_only
  approvals: none
  tracking: single_run
  validation: read_only_assertion

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES (READ-ONLY)
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  read_only: true
  allowed_targets: []
  forbidden_targets:
    - "**/*"
  invariant: "This diagnostic is read-only. It reads deep-loop state JSONL plus iteration markdown and the baseline snapshot, renders metrics, and exits. It MUST NOT write files, mutate any database or graph metadata, or edit the inspected artifacts. The metric computation is deterministic for a fixed corpus."

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  audit_script: ".skilled/commands/doctor/scripts/fable-mode-check.cjs"
  metric_library: ".skilled/skills/system-spec-kit/runtime/cli/metrics/fable-metrics.cjs"
  baseline_snapshot: ".skilled/skills/system-spec-kit/runtime/cli/metrics/fable-baseline.json"

# ─────────────────────────────────────────────────────────────────
# INPUTS
# ─────────────────────────────────────────────────────────────────
inputs:
  target_dir: "Required deep-loop artifact directory (one lineage directory or a directory containing lineages/); pass with --dir."
  baseline: "Optional baseline snapshot path (--baseline); defaults to the committed fable-baseline.json."

# ─────────────────────────────────────────────────────────────────
# EXECUTION
# ─────────────────────────────────────────────────────────────────
execution:
  steps:
    - "Execute upstream_assets.audit_script via Bash with target_dir as --dir and baseline as --baseline; when baseline is empty, use upstream_assets.baseline_snapshot."
    - "Render the five behavioral metrics and the per-metric delta against the baseline."
    - "Report STATUS from the script exit code; never write."

# ─────────────────────────────────────────────────────────────────
# OUTPUT
# ─────────────────────────────────────────────────────────────────
output: |
  STATUS=OK when the diagnostic renders and at least one metric was measured (script exits 0).
  STATUS=ERROR when the script exits 2, with ERROR set from its STATUS=ERROR line:
    ERROR="fable-mode invalid arguments" for an unknown flag, a flag missing its value, or a doubled target;
    ERROR="fable-mode target directory not found" when target_dir does not exist;
    ERROR="fable-mode target is not a directory" when target_dir is a file;
    ERROR="fable-mode baseline could not be loaded" when an explicit baseline is missing or malformed;
    ERROR="fable-mode nothing measured" when the target yields no lineage or every metric is INSUFFICIENT.
  The metrics are drift detectors, not quality scores: higher tool:text and evidence ratios and
  lower words/opener/caveat values indicate closer alignment to the fable-5 signature.
