# ─────────────────────────────────────────────────────────────────
# DOCTOR: SK-GIT SETUP BATTERY (READ-ONLY DIAGNOSTIC)
# ─────────────────────────────────────────────────────────────────
role: Diagnostic Operator reporting whether the sk-git setup passes its read-only battery end to end
purpose: Run the read-only battery over the sk-git install, hooks, trust, gates, standards, allowlist, worktrees, Commit-Id policy, advisory rules, suppressors and AI-tool hook registration, and name the repair command for each failing check
action: Run .skilled/commands/doctor/scripts/git-setup-check.cjs once -> render its per-check PASS/FAIL/SKIP/UNKNOWN verdict and repair lines through the presentation contract
skill_owner: ".skilled/skills/sk-git/"

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: single-step
  compliance: MANDATORY
  execution: read_only
  approvals: none
  tracking: single_run
  validation: read_only_assertion

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES (READ-ONLY)
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  read_only: true
  allowed_targets: []
  forbidden_targets:
    - "**/*"
  invariant: "Every check runs in its check-only form and the battery prints a repair command instead of applying one. This route MUST NOT install hooks, set trust, write git config or .sk-git/, request a Commit-Id or provision a worktree. Repair is an explicit operator action, never a side effect of a diagnostic."

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  setup_battery: ".skilled/commands/doctor/scripts/git-setup-check.cjs"

# ─────────────────────────────────────────────────────────────────
# INPUTS
# ─────────────────────────────────────────────────────────────────
inputs:
  target: "setup is one of the route's three targets, along with hooks and standards: /doctor:git setup runs it. Any other positional fails before this YAML loads."
  tool: "--tool=<name> names the AI tool running the check: claude, codex, devin, cursor, opencode or pi. The battery probes only that tool's hook registration file and reports the others as not checked."

# ─────────────────────────────────────────────────────────────────
# EXECUTION
# ─────────────────────────────────────────────────────────────────
execution:
  steps:
    - "Run .skilled/commands/doctor/scripts/git-setup-check.cjs once, adding --tool=<name> for the AI tool executing this command."
    - "The battery runs eleven checks in order: install (the toolchain is present), hooks (every installed git hook resolves to this checkout), trust (this checkout is trusted through the shared git common dir or its local config), gates (the saved hook gate settings), standards (the contract folder and the rule copies in force), allowlist (the remote-branch allowlist patterns), worktrees (the worktree base and the provisioning entries), commit-id (the Commit-Id policy markers), advisory-rules (every rule in hard-rules.json names a known check), suppression (the advisory suppressors and the two whole-hook master switches), and ai-tool-hooks (the named tool's git-preflight advisory registration)."
    - "Each check prints one PASS|FAIL|SKIP|UNKNOWN line with its source, its detail lines, and a repair: <command> line under each failure. The battery's last line is STATUS=OK checks=11, or STATUS=FAIL failed=<n> skipped=<n> unknown=<n>."
    - "Render the battery's verdict through .skilled/commands/doctor/assets/doctor-git-presentation.txt: the per-check table and the DOCTOR DIAGNOSTIC RESULT summary, with the repair command under each failure."
    - "Map the battery's exit code to the route status: 0 all checks pass, 1 any failure, 2 bad argument."

# ─────────────────────────────────────────────────────────────────
# OUTPUT
# ─────────────────────────────────────────────────────────────────
output: |
  STATUS=OK when the battery exits 0 and its last line is STATUS=OK checks=11.
  STATUS=FAIL when the battery exits 1. List each failing check with the repair command its repair: line printed, and each skipped or unknown check.
  STATUS=FAIL ERROR="<message>" when the battery exits 2 (bad argument) or crashes, or when its output cannot be read. Report the message and the accepted invocation (/doctor:git setup [--tool=<name>]).
