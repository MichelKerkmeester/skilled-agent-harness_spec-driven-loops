# ─────────────────────────────────────────────────────────────────
# DOCTOR: ROUTER REACH WORKFLOW (INTERACTIVE READ-ONLY MODE)
# ─────────────────────────────────────────────────────────────────
role: Expert Operator running the router-reach diagnostic in interactive mode
purpose: Read-only proof that every multi-word phrase a hub's ROUTER.md advertises actually reaches that hub, asked of the live advisor rather than inferred from a diff
action: Run ci-router-vocabulary-reach.cjs -> present the per-hub reach report -> final status

# ─────────────────────────────────────────────────────────────────
# OPERATING MODE
# ─────────────────────────────────────────────────────────────────
operating_mode:
  workflow: sequential_read_only_diagnostic
  compliance: MANDATORY
  execution: interactive
  approvals: none
  tracking: diagnostic_report_and_exit_code
  validation: script_exit_code
  read_only: true

# ─────────────────────────────────────────────────────────────────
# REACH DIAGNOSTIC INVARIANT
# ─────────────────────────────────────────────────────────────────
router_reach_invariant: |
  Routing runs in two stages. The advisor scores a hub's graph-metadata.json intent_signals
  to choose a hub; that hub's ROUTER.md then chooses a mode inside it. A phrase the router
  advertises that the advisor has never heard of is a capability the fleet has and cannot be
  asked for, and no diff of the two vocabularies can tell that apart from the many
  differences that are deliberate. Only the live advisor settles it.

  The check probes every multi-word declared phrase and sorts each outcome:
    - WRONG-HUB:    another hub ranked first and the declaring hub never surfaced.
    - OUTRANKED:    the declaring hub surfaced but lost the top slot. Presence above the
                    confidence bar is not routing, so this fails like a wrong hub.
    - NO-REACH:     nothing cleared the bar. Usually length, which vocabulary cannot fix.
                    Reported, never failed.
    - ALLOWED:      a known ownership dispute listed in router-reach-allowlist.json, which
                    pins the winning hub as well as the phrase. If the winner changes, the
                    entry stops matching and the phrase fails again.
    - PROBE-ERROR:  the advisor could not be asked. This FAILS. A probe that never ran once
                    printed a clean pass over an advisor that was not there, and single
                    words are skipped precisely so real cases are not buried.

  Single-word declarations are skipped by design. Sampling is refused under CI, because a
  truncated inventory proves only what it sampled and that is how phrases stayed broken
  across green runs.

# ─────────────────────────────────────────────────────────────────
# UPSTREAM ASSETS
# ─────────────────────────────────────────────────────────────────
upstream_assets:
  contract: "local command design contract"
  diagnostic_script: ".skilled/skills/sk-doc/sk-create-skill/scripts/ci-router-vocabulary-reach.cjs"
  doctor_reach_script: ".skilled/commands/doctor/scripts/doctor-phrase-reach.cjs"
  allowlist: ".skilled/skills/sk-doc/sk-create-skill/scripts/router-reach-allowlist.json"
  stage_one_vocabulary: ".skilled/skills/*/graph-metadata.json"
  stage_two_vocabulary: ".skilled/skills/*/ROUTER.md"

# ─────────────────────────────────────────────────────────────────
# USER INPUTS
# ─────────────────────────────────────────────────────────────────
user_inputs:
  execution_mode: "INTERACTIVE"
  hub: "optional single hub id; omitted means the whole fleet"
  concurrency: "optional positive probe concurrency; omitted means the script default"

# ─────────────────────────────────────────────────────────────────
# FIELD HANDLING
# ─────────────────────────────────────────────────────────────────
field_handling:
  validation:
    execution_mode_must_be: INTERACTIVE
    hub_must_be: "a directory under .skilled/skills/ carrying both ROUTER.md and mode-registry.json, or unset"
    concurrency_must_be: "a positive integer, or unset"
  command_mapping:
    hub: "pass as --hub <id> when supplied"
    concurrency: "pass as --concurrency <n> when supplied"

# ─────────────────────────────────────────────────────────────────
# MUTATION BOUNDARIES
# ─────────────────────────────────────────────────────────────────
mutation_boundaries:
  read_only: true
  allowed_targets: []
  forbidden_targets:
    - "**/*"
  invariant: "This workflow is read-only. It probes the advisor and prints the result. It must not edit a router, add or remove a signal, rebuild the advisor, or amend the allowlist to make a failing phrase pass."

# ─────────────────────────────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────────────────────────────
workflow:
  phase_0_diagnose:
    purpose: "Probe every declared phrase against the live advisor."
    activities:
      - "Execute upstream_assets.diagnostic_script via Bash, adding --hub <id> when supplied and --concurrency <n> when supplied; otherwise use the script default."
      - "Capture stdout and exit code. The run probes concurrently and takes minutes, not seconds."
      - "Execute upstream_assets.doctor_reach_script via Bash (node .skilled/commands/doctor/scripts/doctor-phrase-reach.cjs). It scores every phrase of each doctor command bridge that is active in the TypeScript scorer in process, under the pinned force-local regime, and needs the advisor runtime built. Capture its stdout, its STATUS= line and its exit code: 0 every admitted phrase reaches its bridge as the top pick or the second line, 1 at least one miss, 2 missing build or bad argument."
    outputs:
      - reach_report
      - advisor_generation
      - exit_code

  phase_1_report:
    purpose: "Present the reach report and the final status."
    activities:
      - "Print the per-hub counts and every failing phrase with the hub that took it instead."
      - "State the advisor generation the numbers were taken at, since a rebuild changes them."
      - "Require the literal RESULT line. A run that printed no rule output has failed, not passed."
      - "Report the doctor reach probe separately: its STATUS= line and every FAIL row with the top pick and the second line it got instead. A doctor miss fails the run like a wrong-hub row."

# ─────────────────────────────────────────────────────────────────
# OUTPUT FORMAT
# ─────────────────────────────────────────────────────────────────
output_format: |
  RESULT: PASSED with exit 0 when every declared phrase reaches its hub or is an allowed
  dispute. RESULT: FAILED with exit 1 on any wrong-hub, outranked or probe-error row.
  Exit 2 means the run was refused rather than failed, which today means a sampled
  inventory under CI.

  A no-reach row does not fail. It is reported for a human to judge, because it is usually
  a phrase too short to clear the bar at all and no amount of vocabulary changes that.

  The doctor reach probe adds its own STATUS=OK or STATUS=FAIL line. RESULT: FAILED also
  covers a doctor probe exit 1, and its exit 2 is reported as a refused run.
