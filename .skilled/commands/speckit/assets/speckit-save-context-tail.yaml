# ═══════════════════════════════════════════════════════════════════════
# SMART SPECKIT: SHARED SAVE-CONTEXT TAIL
# ═══════════════════════════════════════════════════════════════════════
# The plan, implement and complete workflows each end with a save_context
# step. Its command-specific purpose, activities and outputs stay in the
# command's own asset; the writer contract below is the same for all three
# and lives here once, under one placeholder convention: {spec_path} is the
# packet the step saves into.

save_context_core:
  tool_invocation:
    command: Read(".skilled/skills/system-spec-kit/SKILL.md")
    note: "Read SKILL.md to activate context saving"
  post_save_write:
    invocation:
      command: "node .skilled/skills/system-spec-kit/runtime/cli/dist/continuity/generate-context.js --stdin --full-auto --session-id <id> --runtime <slug> {spec_path}"
      note: "Compose the save JSON and pipe it to this call on stdin. <id> is the calling session id, and a runtime with no session-id variable runs uuidgen once and reuses that value. <slug> is one of claude, codex, opencode, pi, devin, dsh or cursor. Only a --full-auto run writes the continuity fields."
    critical_note: "The writer is the whole write, and it refreshes description.json and graph-metadata.json itself. There is no indexing handoff, no daemon to wait for and no launcher file to check. One read-only check follows it: .skilled/skills/system-spec-kit/runtime/cli/spec/validate.sh {spec_path} --strict."
    after: "Immediately after the canonical spec document is refreshed on disk"
