# SMART SPECKIT: IMPLEMENT WORKFLOW (ONE ASSET, THREE EXECUTION MODES)
predicate_grammar:
  shared_tail: "assets/speckit-lifecycle-shared.yaml#predicate_grammar"
  shared_tail_note: "The rules for when, when_legacy_literal and after live once in the shared lifecycle include."

execution_mode:
  source: "$ARGUMENTS"
  values: [auto, confirm, autopilot]
  default: confirm
  rule: "Under confirm, execute every checkpoint block in order at the step that carries it, and apply the mode_overrides.confirm wording. Under auto or autopilot, skip every block whose applies_to is confirm and every checkpoint_confirm flag and keep the autonomous wording of this file. Under autopilot, the unattended_autopilot block of this file is the contract for the workspace, the terminal result, the reason codes and the task metadata."
checkpoints: [step_1_review_plan_and_spec, step_2_task_breakdown, step_3_analysis, step_4_acceptance_criteria, step_5_implementation_check, step_6_development, step_7_completion, step_8_save_context, step_6_7_acceptance_verify]
mode_overrides:
  confirm:
    role: "Expert Developer using Smart SpecKit for interactive implementation"
    purpose: "Spec-driven implementation with step-by-step user approval"
    action: "Execute from task breakdown to completion with user checkpoints"
    approvals: "step_by_step"
    validation: "checkpoint_based"
    mandate: "Build incrementally, review with user, deliver confidently"
    goal_prompt_choice: "[offer|skip|set] - Optional session-goal behavior. Defaults to offer unless the user chooses skip or set; set requires goal_objective."
    interactive_integration: "Confidence checks surfaced at user checkpoints"
    step_completion_rule: "Execute ALL activities \u2192 Verify ALL outputs \u2192 Present checkpoint for approval \u2192 Mark step complete after approval \u2192 THEN proceed. NEVER skip steps, NEVER proceed without user approval outside child dispatch, NEVER jump to coding before Step 6."
    approach: "incremental_implementation_with_reviews, systematic execution with user validation at checkpoints"
    principle: "Execute with user approval at each checkpoint outside child dispatch"
    checkpoint_behavior: "Complete the step, present the results and the options, then wait for the response. Approve marks the step complete and continues. An option that shows information (a label that starts with Review, View, Show or Check) shows it, then presents the same checkpoint again. An option that asks for a change (a label that starts with Modify, plus Address Blockers and Adjust Baseline) applies the change, reruns that step's post_write_validation when the step has one, then presents the same checkpoint again. Any other option does what its description says."
    child_dispatch_checkpoints: "When child_dispatch applies, record each checkpoint question with its first option as the default in the lineage directory and continue."

# CHECKPOINT OPTIONS
checkpoint_options:
  shared_tail: "assets/speckit-lifecycle-shared.yaml#checkpoint_options"
  shared_tail_note: "The standard option set lives once in the shared lifecycle include. A reference such as checkpoint_options.standard resolves through this pointer."
  code_review:
  - label: "Approve Code"
    description: "Implementation reviewed, continue to Step 6.7 acceptance verification"
  - label: "Review Code"
    description: "Show code changes for review"
  - label: "Modify Code"
    description: "Request code changes before completion"

role: Expert Developer using Smart SpecKit for fully autonomous implementation
purpose: Spec-driven implementation with complete autonomous execution
action: Execute from task breakdown to completion with self-validation

runtime_agent_path_resolution:
  default: .skilled/agents
  claude: .claude/agents

# OPERATING MODE
operating_mode:
  workflow: sequential
  compliance: MANDATORY
  execution: autonomous
  approvals: none
  tracking: progressive_task_checklists
  validation: continuous_self_validation

unattended_autopilot:
  enabled: true
  default_enabled: false
  activation_flags: [":autopilot", ":unattended", "--unattended"]
  execution_mode_value: autopilot
  compatibility:
    auto_unchanged: true
    autopilot_is_not_auto_alias: true
  workspace_choice:
    values: [worktree, current_branch]
    bound_by: "A pre-bound setup answer or the one startup question. After startup autopilot waits for no answer."
    worktree: "Create the branch only with `git worktree add -b <branch> <path>`, as sk-git SKILL.md section 3 states, and run every later step inside that worktree."
    current_branch: "Stay on the branch that is checked out. Create no branch."
    inherited: "A run with AI_SESSION_CHILD=1, or one already inside a linked worktree, takes current_branch."
    unbound: "With no bound workspace_choice, emit the terminal result with reason uncertainty_blocked before any write."
    forbidden: "Never run git branch, git checkout -b, git switch -c, git merge or git push."
  terminal_result:
    output_prefix: SPECKIT_AUTOPILOT_RESULT
    schema:
      required_fields: [mode, ok, reason, branch, merged, verification]
      success_reason: null
      failure_reason_field: reason
      success: '{"mode":"autopilot","ok":true,"reason":null,"branch":"<branch>","merged":false,"verification":"passed"}'
      failure: '{"mode":"autopilot","ok":false,"reason":"<terminal_reason_code>","branch":"<branch>","merged":false,"verification":"<summary>"}'
    terminal_reason_codes:
      - no_eligible_tasks
      - retry_exhausted
      - verification_failed
      - uncertainty_blocked
  lifecycle_sequence:
    - bind_workspace
    - propose_unattended
    - apply_unattended
    - archive_in_place
    - verify_clean
  sequence_note: "A workflow runs the entries its own steps implement, in this order."
  stop_rule: "After startup no branch waits for an answer. A branch whose modes map names a default takes it. A branch that cannot continue without an answer emits the terminal result with reason uncertainty_blocked."
  p1_rule: "An unfinished P1 item stays Unmet, the terminal result names it with reason verification_failed and the run does not report success."
  merge_rule: "Autopilot never merges and never pushes. A run that passed verification reports its branch with merged false, and the merge is left to the operator."
  branch_preserved_failure:
    preserve_branch: true
    merge: false
    branch_preserved: true
    emit_terminal_result: true
  task_metadata_contract:
    required_fields: [agent, deps, touched-files]
    written_by: "The workflow step whose key ends in _task_breakdown."
    missing_or_uncertain_field_reason: uncertainty_blocked

# GATE 3 COMPLIANCE
gate_3_compliance:
  status: ENFORCED_VIA_PHASES
  modes: { confirm: "ask standard_question and wait for A, B, C or D", auto: "ask standard_question and wait when no spec folder is bound, because Gate 3 is a required stop. A bound folder is used with no question", autopilot: "use the spec folder bound at startup. With none bound, emit SPECKIT_AUTOPILOT_RESULT with reason uncertainty_blocked before any write" }
  mechanism: "Phase 1-3 blocking gates in implement.md"
  machine_contract: ".skilled/skills/system-spec-kit/shared/gate-3-classifier.ts (classifyPrompt)"
  standard_question: "Spec Folder (required): A) Existing | B) New (new or unrelated work only) | C) Related (Use a related folder, phase child, new or existing sub-track, or a series parent for a different change to the same artifact as an existing packet in the same track) | D) Skip"
  ask_surface: "Ask standard_question through the question tool .skilled/repo-rules/communication-handoff.md section 5 names for your runtime, with A to D as its choices. Print it as text only where section 5 names no tool for this session."
  first_message_protocol: "If FIRST message requests implementation, ask spec folder FIRST, unless child_dispatch applies"
  child_dispatch: "When AI_SESSION_CHILD=1 marks a non-interactive worker bound to a lineage directory, Gate 3 is pre-resolved to that directory and the worker does not ask. Interactive sessions always ask."
  failure_pattern_19:
    triggers: ["comprehensive", "fix all", "15 agents", "implement everything"]
    action: "STOP → Ask spec folder question → Wait for A/B/C/D, unless child_dispatch applies"
  self_verification: |
    □ File modification detected? Did I ask spec folder question?
    □ Did I wait for user's A/B/C/D response before using project tools? Not required when child_dispatch applies.

# USER INPUTS
user_inputs:
  spec_folder: "[SPEC_FOLDER] - Spec folder path. REQUIRED for implement workflow."
  context: "[CONTEXT] - Background info, constraints, existing docs."
  issues: "[ISSUES] - Known issues or concerns."
  request: "[REQUEST] - Implementation scope. Default: comprehensive review."
  environment: "[STAGING LINK] - Staging/production URL for browser testing."
  scope: "[FILES] - Files/folders to work with."
  goal_prompt_choice: "[offer|skip|set] - Optional session-goal behavior. Defaults to offer under :auto; set requires goal_objective."
  goal_objective: "[TEXT] - Objective passed to opencode_goal only when goal_prompt_choice is set."

# FIELD HANDLING
field_handling:
  spec_id:
    derive_from: "specs/{NNN}, specs/{NNN-name}, or specs/{NNN-parent}/{NNN-phase} (phase child — use parent NNN as spec_id)"
    fallback: "numeric portion or timestamp"
  defaults: { spec_folder_empty: "REQUIRED", context_empty: "Infer from REQUEST + codebase", issues_empty: "Use planning phase issues", environment_empty: "Skip browser testing", scope_empty: "specs/**" }
  phase_folder_awareness:
    note: "[SPEC_FOLDER] may be a phase child path (e.g., specs/003-name/001-phase/). When --phase-folder is provided, spec_id derives from the parent folder NNN, not the child NNN. Also load parent spec.md for cross-reference context. A phase whose parent goal.md has no binding row for it gets one through /create:goal <parent> phase-add."
    path_pattern: "specs/{NNN-parent}/{NNN-phase}/"
    # phase_path_grammar is documentation only and additive. The runtime
    # parser already supports arbitrary nesting depth via is-phase-parent.ts
    # walking each direct child. This grammar exists to make the supported shapes
    # explicit for workflow authors and documentation consumers. Runtime behavior
    # is unchanged.
    phase_path_grammar:
      note: "Phase folder paths are NOT limited to two levels. Any folder matching `^[0-9]{3}-[a-z0-9][a-z0-9-]*$` whose direct child also matches that regex AND has spec.md OR description.json becomes a phase parent. Recursion is unbounded; depth is data, not policy."
      shapes:
        flat: "specs/{NNN-name}/" # leaf packet, no children
        two_level: "specs/{NNN-parent}/{NNN-phase}/" # one layer of phases
        three_level: "specs/{NNN-grandparent}/{NNN-parent}/{NNN-phase}/" # nested phases (e.g., packet/phase/sub-phase)
        deep: "specs/{NNN-A}/{NNN-B}/{NNN-C}/{NNN-D}/{NNN-E}/" # deeply nested phase-child topology
      detection_rule: "isPhaseParent(folder) — at .skilled/skills/system-spec-kit/runtime/lib/spec/is-phase-parent.ts and the shell mirror is_phase_parent in runtime/cli/lib/shell-common.sh. Both must agree; the save path keeps its own copy in runtime/cli/spec/is-phase-parent.ts because it also recognises derived children and hardened membership."
      spec_id_derivation: "spec_id is the FIRST {NNN} segment under specs/. For deep nests, parent_chain accumulates from outermost to innermost, and graph-metadata.json.parent_id encodes the immediate parent."
  scope_policy: { default: "**", rule: "Implementation may edit any workspace file. Narrow to [FILES] scope when explicitly provided by the user." }

goal_prompting:
  shared_tail: "assets/speckit-lifecycle-shared.yaml#goal_prompting"
  shared_tail_note: "The goal offer, the set path and the packet goal posture live once in the shared lifecycle include."

# REQUEST HANDLING
request_handling:
  default: "Conduct a comprehensive review of the spec folder and carry out its implementation fully autonomously."
  override: "Use [REQUEST] if provided, else use default above"

# COMPONENT CREATION ROUTING
component_creation_routing:
  purpose: "Prevent /speckit:implement from routing skill, agent, or command component scaffolding to @code."
  trigger_paths:
    - ".skilled/skills/**"
    - ".skilled/agents/**"
    - ".skilled/commands/**"
  classify_before_dispatch:
    component_authoring:
      examples: ["skill scaffold", "agent role file", "command workflow", "template", "metadata", "package docs", "SKILL.md", "agent markdown", "command YAML"]
      route: "@markdown for actual /create:* command execution; otherwise main-agent/direct sk-doc + system-spec-kit"
      forbidden_route: "@code"
    executable_code_subtask:
      examples: ["script implementation", "test file", "MCP server source", "parser/compiler code"]
      route: "@code only after scaffolding is complete and exact files, success criteria, and verification commands are named"
  pre_dispatch_self_check:
    - "If task prompt says Agent: @code for component_authoring, STOP and rewrite the task."
    - "If subagent_type is general but embedded prompt names a different Agent than the selected route, STOP and rewrite the task."
    - "If the task is an actual /create:* command, load @markdown and preserve the command semantics instead of approximating with @code."

# DOCUMENTATION LEVELS
documentation_levels:
  shared_tail: "assets/speckit-lifecycle-shared.yaml#documentation_levels"
  shared_tail_note: "The level table and the level selection rule live once in the shared lifecycle include."

# PREREQUISITES
prerequisites:
  level_1_required: ["[SPEC_FOLDER]/spec.md", "[SPEC_FOLDER]/plan.md", "[SPEC_FOLDER]/tasks.md"]
  level_2_required: ["[SPEC_FOLDER]/acceptance-criteria.md"]
  level_3_required: []
  optional_artifacts: ["[SPEC_FOLDER]/research/research.md", "[SPEC_FOLDER]/decision-record.md"]
  verification: MUST EXIST BEFORE PROCEEDING
  note: This workflow assumes planning completed via /speckit:plan

# AVAILABLE TEMPLATES
available_templates:
  default_level: level_2
  level_1:
    tasks: .skilled/skills/system-spec-kit/templates/core/tasks.md.tmpl
    implementation_summary: .skilled/skills/system-spec-kit/templates/core/implementation-summary.md.tmpl
  level_2:
    tasks: .skilled/skills/system-spec-kit/templates/core/tasks.md.tmpl
    implementation_summary: .skilled/skills/system-spec-kit/templates/core/implementation-summary.md.tmpl
  level_3:
    tasks: .skilled/skills/system-spec-kit/templates/core/tasks.md.tmpl
    implementation_summary: .skilled/skills/system-spec-kit/templates/core/implementation-summary.md.tmpl
  level_3_plus:
    tasks: .skilled/skills/system-spec-kit/templates/core/tasks.md.tmpl
    implementation_summary: .skilled/skills/system-spec-kit/templates/core/implementation-summary.md.tmpl
  shared:
    handover: .skilled/skills/system-spec-kit/templates/addons/handover.md.tmpl
    debug_delegation: .skilled/skills/system-spec-kit/templates/addons/debug-delegation.md.tmpl

template_compliance:
  # cadence: declared once; each step's own gate below states why it re-runs this command
  strict_validation_command: ".skilled/skills/system-spec-kit/runtime/cli/spec/validate.sh [SPEC_FOLDER] --strict"
  guard_scripts_command: "bash .skilled/skills/system-spec-kit/runtime/cli/spec/check-example-drift.sh && bash .skilled/skills/system-spec-kit/runtime/cli/spec/check-card-sync.sh"
  prompt_contract:
    rule: "When this workflow writes tasks.md or implementation-summary.md, embed the matching inline scaffold below in the authoring prompt and preserve required ANCHOR/H2 order. Follow .skilled/skills/system-spec-kit/references/workflows/spec-authoring-card.md and fill every [YOUR_VALUE_HERE: ...] token before the status leaves Draft."
  inline_scaffolds:
    tasks_md: |
      # Tasks: [NAME]
      <!-- ANCHOR:notation --> ## Task Notation
      <!-- ANCHOR:phase-1 --> ## Phase 1: Setup
      <!-- ANCHOR:phase-2 --> ## Phase 2: Implementation
      <!-- ANCHOR:phase-3 --> ## Phase 3: Verification
      <!-- ANCHOR:completion --> ## Completion Criteria
      <!-- ANCHOR:cross-refs --> ## Cross-References
    implementation_summary_md: |
      # Implementation Summary
      <!-- ANCHOR:metadata --> ## Metadata
      <!-- ANCHOR:what-built --> ## What Was Built
      <!-- ANCHOR:how-delivered --> ## How It Was Delivered
      <!-- ANCHOR:decisions --> ## Key Decisions
      <!-- ANCHOR:verification --> ## Verification
      <!-- ANCHOR:limitations --> ## Known Limitations

# PARALLEL DISPATCH CONFIGURATION
parallel_dispatch_config:
  enabled: true
  scoring: { domain_count: 0.35, file_count: 0.25, loc_estimate: 0.15, parallel_opportunity: 0.20, task_type: 0.05 }
  thresholds: { direct_max: 20, ask_min: 20, min_domains: 2 }
  override_phrases:
    direct: [ "proceed directly", "handle directly", "skip parallel", "skip agents" ]
    parallel: [ "use parallel", "dispatch agents", "parallelize", "use agents" ]
    auto: [ "auto-decide", "auto mode", "decide for me" ]
  eligible_phases: [step_6_development]

# AGENT AVAILABILITY (conditional, not instructions)
# These entries define WHICH agent to use IF a workflow step calls for it.
# Do NOT dispatch agents based on reading this section.
# Agents are activated ONLY when their designated step is executing.
agent_availability:
  review:
    available_at_step: 7
    condition: "ONLY dispatch when Step 7 is actively executing and all prior steps are completed"
    agent_file: "[runtime_agent_path]/review.md"
    dispatch_prompt:
      # This entry dispatches nothing. It states the marker for any step that dispatches @review.
      marker: "CODE-REVIEW"
      rule: "Any step that dispatches @review starts the rendered prompt with the line CODE-REVIEW, then one blank line, before any other text. This is the marker the review mode's floor names, and the step that dispatches is its dispatcher. Write it exactly, with nothing else on its line."
    standards_contract:
      baseline: "sk-code"
      overlay: "Load sk-code router-selected evidence"
      precedence: "Router-selected style/process/build/test conventions override generic baseline guidance; baseline security/correctness minimums remain mandatory."
    fallback: "general"
    blocking: true
    on_block: "A P0 or an open P1 finding blocks. Address before completion."
    verdict: "The review's pass or fail follows severity alone: any P0, or an open P1, fails the gate. The advisory score never blocks."
    review_mode: "Gate Validation with gate_type post_execution. One dispatch per run, and one more after a REQUESTED_CHANGES verdict."
    fallback_rule: "The general fallback keeps the CODE-REVIEW marker and the blocking verdict."
    not_for: "reviewing this workflow prompt, reviewing the command, or any pre-step validation"
  debug:
    available_at_step: 6
    condition: "ONLY surface a prompted offer when 3+ task failures observed during Step 6 development. Never auto-dispatch — the user opts in via Task tool."
    agent_file: "[runtime_agent_path]/debug.md"
    fallback: "general-purpose"
    modes: { confirm: "ask the prompt in on_threshold", auto: "take continue manually, log it and list it under Defaults taken", autopilot: "take continue manually. When the retry path is exhausted, emit SPECKIT_AUTOPILOT_RESULT with reason retry_exhausted" }
    prompt_threshold: { counter: "task_failure_count", reset_on: "new_task", threshold: 3, mode: "operator-judgment", note: "Counter is documentation-only; the workflow operator surfaces the prompt based on observed repeated failures, never auto-routes." }
    on_threshold: "Surface a single direct prompt: 'Dispatch @debug for fresh-perspective root-cause? (y / continue manually / skip)'. On y, generate debug-delegation.md scaffold and instruct user to dispatch @debug via Task tool. The workflow itself NEVER calls Task tool → @debug. When child_dispatch applies, take the continue manually branch of debug_delegation instead of surfacing the prompt."
    not_for: "proactive debugging, pre-step investigation, reviewing this workflow, or any autonomous routing"

# QUALITY GATES
quality_gates:
  enabled: true
  exists_rule: "A check that a packet document exists passes only when the file exists and `rg -c 'YOUR_VALUE_HERE:' <file>` finds no match. Every check whose id ends in _exists is decided by this rule, and a failed check names the file."
  pre_implementation:
    location: "Before Step 6"
    pass_when: every check passes
    blocking: hard
    checks:
      - { id: prerequisites_complete, from: step_1_review_plan_and_spec, criteria: ".skilled/skills/system-spec-kit/runtime/cli/setup/check-prerequisites.sh exited 0 and spec.md and plan.md exist." }
      - { id: plan_clarity, from: step_1_review_plan_and_spec, criteria: "plan.md states a concrete technical approach and affected files, and leaves no material design choice open." }
      - { id: tasks_exists, from: step_2_task_breakdown, criteria: "tasks.md passes exists_rule." }
      - { id: task_breakdown_quality, from: step_3_analysis, criteria: "The consistency analysis reports no CRITICAL or HIGH finding and no P0 requirement without a task." }
    on_fail: "PRE-IMPLEMENTATION GATE FAILED. Failed checks: {failed_checks}. Fix each one before coding."
  post_implementation:
    location: "After Step 7"
    pass_when: every check passes
    blocking: hard
    checks:
      - { id: all_tasks_complete, from: step_6_development, criteria: "tasks.md holds no unchecked task line." }
      - { id: checklist_verified, from: step_6_7_acceptance_verify, criteria: "Every acceptance-criteria row is Met, Waived or Superseded and every P0 checklist item is marked [x] (Level 2+)." }
      - { id: tests_pass, from: step_7_completion, criteria: "The test command for the changed surface exited 0 in this run." }
      - { id: summary_exists, from: step_7_completion, criteria: "implementation-summary.md passes exists_rule." }
    on_fail: "POST-IMPLEMENTATION GATE FAILED. Failed checks: {failed_checks}. Fix each one before the save."

# CIRCUIT BREAKER
circuit_breaker:
  enabled: true
  thresholds: { failures: 3, success_to_close: 1 }
  states: { CLOSED: normal_operation, OPEN: skip_affected_step, HALF_OPEN: test_single }
  step_overrides: { step_7: "critical - must complete or fail explicitly" }

# CONFIDENCE & CLARIFICATION FRAMEWORK
confidence_framework:
  thresholds:
    high: { range: "80-100%", action: "Proceed with cited evidence" }
    medium: { range: "40-79%", action: "Proceed with caution, document assumptions" }
    low: { range: "0-39%", action: "STOP - Ask A/B/C clarification, unless child_dispatch applies, in which case record the question with its default in the lineage directory and continue", modes: { confirm: "ask the question and wait", auto: "ask the question and wait, because confidence below 40 is a required stop", autopilot: "emit SPECKIT_AUTOPILOT_RESULT with reason uncertainty_blocked" } }
  scoring_weights: { pattern_alignment: 0.30, side_effect_awareness: 0.25, implementation_clarity: 0.25, test_coverage: 0.20 }
  reply_format: ["Confidence: NN%", "Top factors: 2-3 bullets", "Next action"]
  escalation: { failed_threshold: 2 }

# REQUEST ANALYSIS FRAMEWORK
request_analysis_framework:
  pre_implementation_validation: [plan_understood, tasks_clear, patterns_identified, confidence_80_plus, scope_bounded]
  citation_requirement: "Reference task ID in commits, cite pattern sources, use [DEVIATION: reason] for plan departures"

# WORKFLOW ENFORCEMENT
workflow_enforcement:
  mode: strict
  step_order: sequential_mandatory
  skip_allowed: false
  prerequisites_gate:
    location: "Before Step 1"
    requirements: ["spec.md exists in SPEC_FOLDER", "plan.md exists in SPEC_FOLDER"]
    action_if_failed: "STOP - run /speckit:plan first"
  step_completion_rule: "Execute ALL activities → Verify ALL outputs → Mark step complete → THEN proceed. NEVER skip steps, NEVER proceed without completion, NEVER jump to coding before Step 6."
  critical_steps:
    step_6: { enforcement: "MUST mark tasks [x] in tasks.md", verification: "Count [x] vs [ ] — all must be [x]" }
    step_7: { enforcement: "MUST create implementation-summary.md", verification: "File must exist in spec folder" }

# CONTEXT LOADING
context_loading:
  trigger: "At workflow START, before Step 1"
  purpose: "Load prior context from planning phase"
  retrieval_recipe:
    reference: ".skilled/skills/system-spec-kit/references/retrieval/retrieval-conventions.md"
    command: "rg --no-config --json --fixed-strings --ignore-case -C 2 --glob '*.md' --glob '!**/z_archive/**' --glob '!**/node_modules/**' -- 'planning context for {spec_folder_name}' {spec_folder_path}"
    anchors: [summary, decisions, state, implementation]
    anchor_command: "rg --no-config --fixed-strings --ignore-case --glob '*.md' --glob '!**/z_archive/**' --glob '!**/node_modules/**' -- '<!-- ANCHOR:<id> -->' {spec_folder_path}"
    exit_status: "0 = matches, 1 = clean no-hit reported as an empty result, 2 or higher = error with stderr attached and never reported as no-hit"
    unsupported: "Lexical only. Semantic paraphrase, vector and BM25 fusion, decay, access tracking and session dedup are not available; an unmatched phrase is a no-hit, not a weaker guess."
  command_reference: "/speckit:search"
  when_to_skip: ["User says 'skip context' or 'fresh start'"]
  behavior:
    if_context_found: "Surface planning decisions before implementation"
    if_no_context: "Proceed to Step 1 — rely on spec.md and plan.md"

# WORKFLOW
workflow:
  step_1_review_plan_and_spec:
    purpose: Review spec and planning artifacts
    code_search_guidance:
      example_queries: ["project structure entry points", "similar feature implementation", "existing utility patterns"]
    activities:
    - Run bash .skilled/skills/system-spec-kit/runtime/cli/setup/check-prerequisites.sh --json
    - Verify spec.md and plan.md exist
    - Load and review all planning artifacts
    - Understand requirements, analyze approach, identify dependencies, note constraints
    - Confirm plan.md leaves no design choice to the implementer
    on_fail: "STOP before task breakdown. plan.md leaves a design choice to the implementer: name the choice, return to /speckit:plan so it records the decision in plan.md and reruns its task breakdown, then rerun /speckit:implement from Step 1."
    required_documents: ["[SPEC_FOLDER]/spec.md", "[SPEC_FOLDER]/plan.md"]
    optional_documents: [research/research.md, "decision-record-*.md"]
    deep_analysis:
      focus: comprehensive_plan_review
      outputs: [requirements_summary, technical_approach_understanding, identified_dependencies, potential_challenges]
    validation: planning_artifacts_understood
    checkpoint:
      applies_to: confirm
      question: "Step 1 Complete: Plan and spec reviewed. How would you like to proceed?"
      child_dispatch: "When child_dispatch applies, record this question with the default Proceed in the lineage directory and continue instead of asking."
      options:
        - { label: "Proceed", description: "Plan is clear, proceed to task breakdown" }
        - { label: "Review Plan", description: "Show plan.md for detailed review" }
        - { label: "Review Spec", description: "Show spec.md for reference" }

  step_2_task_breakdown:
    purpose: Validate tasks.md, or write it when it is missing or unfilled (Level 1+ requirement)
    unattended_task_metadata:
      applies_to: autopilot
      rule: "Every task row carries agent, deps and touched-files. When a field cannot be set, end with reason uncertainty_blocked, as unattended_autopilot.task_metadata_contract states."
    activities:
    - "Apply quality_gates.exists_rule to tasks.md. When the file passes, validate it against plan.md and spec.md and do not rewrite it"
    - "When tasks.md is missing or fails exists_rule, write it from plan.md and spec.md with the steps below"
    - Generate tasks organized by user story with dependency graph
    - Mark parallel-executable tasks with [P], define phases, generate estimates
    outputs: [tasks.md]
    template: .skilled/skills/system-spec-kit/templates/core/tasks.md.tmpl
    template_prompt_contract:
      canonical_template: .skilled/skills/system-spec-kit/templates/core/tasks.md.tmpl
      inline_scaffold_key: tasks_md
      writing_rule: "Embed template_compliance.inline_scaffolds.tasks_md in the prompt before writing tasks.md and preserve the required anchors/headers in order."
    post_write_validation:
      # cadence: this gate re-validates the documents this step wrote; a later step's writes get their own gate
      command: ".skilled/skills/system-spec-kit/runtime/cli/spec/validate.sh [SPEC_FOLDER] --strict"
      on_fail: "STOP and repair tasks.md template drift before proceeding"
      guard_command: "bash .skilled/skills/system-spec-kit/runtime/cli/spec/check-example-drift.sh && bash .skilled/skills/system-spec-kit/runtime/cli/spec/check-card-sync.sh"
      guard_on_fail: "Report the guard output and continue: a failure means the skill's own examples or authoring card drifted, not this packet"
    validation: tasks_documented
    checkpoint:
      applies_to: confirm
      question: "Step 2 Complete: Tasks defined. Review tasks.md?"
      options:
        - { label: "Approve Tasks", description: "Task breakdown looks good" }
        - { label: "Review Tasks", description: "Show tasks.md for review" }
        - { label: "Modify Tasks", description: "Request changes to task breakdown" }

  step_3_analysis:
    purpose: Verify consistency across all artifacts
    activities: [Build requirements inventory, Build task coverage mapping, Run consistency checks, "Assign severity levels (CRITICAL, HIGH, MEDIUM, LOW)", Generate gap analysis]
    on_fail: "A CRITICAL or HIGH finding, or a P0 requirement that no task covers, stops the run before development. For a tasks.md finding, return to step_2_task_breakdown, fix tasks.md and rerun this step. For a spec.md or plan.md finding, STOP and name /speckit:plan. After the third failed round, STOP and report the open findings. MEDIUM and LOW findings are recorded in the report and do not block."
    outputs: [consistency_report, coverage_verification]
    validation: consistency_verified
    checkpoint:
      applies_to: confirm
      question: "Step 3 Complete: Consistency verified. How would you like to proceed?"
      child_dispatch: "When child_dispatch applies, record the question with Approve, the first option of checkpoint_options.standard, as the default in the lineage directory and continue."
      options: checkpoint_options.standard

  step_4_acceptance_criteria:
    purpose: Author the acceptance-criteria.md rows before development (Level 2+). This step verifies no row.
    activities:
    - Skip for Level 1, MANDATORY for Level 2+
    - Load acceptance-criteria.md and the requirements in spec.md
    - "When acceptance-criteria.md holds only the scaffold row: write one Unmet row per spec requirement, each naming the command or inspection that verifies it"
    - "Otherwise: confirm that every spec requirement has a row, and add an Unmet row for each requirement that has none"
    - Leave every row Unmet. The acceptance verification step after development verifies the rows
    outputs: { acceptance_rows: authored_or_confirmed, requirements_without_row: none }
    validation: acceptance_rows_authored
    checkpoint:
      applies_to: confirm
      question: "Step 4 Complete: Acceptance criteria rows authored. Ready to implement?"
      child_dispatch: "When child_dispatch applies, default to Start Implementation when every requirement has a row. When a requirement has no row, write the missing row, record it in the lineage directory and continue."
      options:
        - { label: "Start Implementation", description: "Begin development phase" }
        - { label: "Review Rows", description: "Show the acceptance-criteria.md rows" }
        - { label: "Modify Rows", description: "Change a row before development" }

  step_5_implementation_check:
    purpose: Verify all prerequisites for implementation
    activities: [Verify environment ready, Check API endpoints, Verify dependencies, Confirm no blockers]
    checks: { prerequisites: verified, blockers: none, environment: ready }
    on_fail: "STOP before coding. Name the failed check and its blocker, fix it, then rerun this step."
    validation: prerequisites_verified
    checkpoint:
      applies_to: confirm
      question: "Step 5 Complete: Environment ready. Proceed with development?"
      child_dispatch: "When child_dispatch applies, default to Start Coding. When a check above fails, record the failed check and its blocker in the lineage directory before coding, and do not take Hold, since a child records a halt and continues."
      options:
        - { label: "Start Coding", description: "Begin implementation" }
        - { label: "Check Environment", description: "Show environment status" }
        - { label: "Hold", description: "Wait before proceeding" }

  step_6_development:
    purpose: Execute implementation following task plan
    component_creation_guard:
      enforcement: MANDATORY
      rule: "Apply component_creation_routing before any development dispatch touching .skilled/skills/**, .skilled/agents/**, or .skilled/commands/**."
      on_violation: "STOP → rewrite dispatch for @markdown or main-agent/sk-doc execution; never send Agent: @code for component scaffolding."
    pre_phase_parallel_check:
      enabled: true
      phase_domains: [code, testing]
      complexity_boost: 15
      decision_logic: "Check override phrases → session preference → sequential deps → calculate complexity → <20% direct, >=20%+2 domains → ask user"
      modes: { confirm: "ask at ask_min, as decision_logic states", auto: "direct: take the fallback and list it under Defaults taken", autopilot: "direct: take the fallback" }
      child_dispatch: "When child_dispatch applies, do not ask. Take direct, the fallback below, and record the decision in the lineage directory."
      on_parallel_dispatch:
        agents:
          - { name: "implementation_agent", focus: "Core implementation tasks from tasks.md" }
          - { name: "test_agent", focus: "Test implementation and validation" }
        dispatch_note: "Spawn agents in SINGLE message for parallel execution"
        warning: "Development tasks may have dependencies - verify task order"
      fallback: "Proceed with activities below if dispatch fails or user chooses direct"
    activities:
    - Parse tasks.md, execute phase by phase
    - Setup first (structure, dependencies, config)
    - Follow TDD where applicable
    - Core development (models, services, endpoints)
    - Integration (database, middleware, logging)
    - Update task checklist progressively (mark [x])
    - Log progress after each task
    debug_delegation:
      trigger: "Same error 3+ times after fix attempts (operator-judgment threshold)"
      modes: { confirm: "ask the prompt in action", auto: "take continue manually, log it and list it under Defaults taken", autopilot: "take continue manually. When the retry path is exhausted, emit SPECKIT_AUTOPILOT_RESULT with reason retry_exhausted" }
      enforcement: MANDATORY
      action: |
        STOP → surface a single direct prompt to the user:
          ⚠️  3 task failures observed on this packet. The @debug agent runs a 5-phase fresh-perspective root-cause pass with no prior context — it costs one Task-tool dispatch and writes findings to a structured report.
          Dispatch @debug? (y / continue manually / skip)
        On y:
          1. Run scaffold-debug-delegation.sh to generate <spec_folder>/debug-delegation.md (versioned to debug-delegation-NNN.md if a prior file exists) populated from the failure trail using the Debug Context Handoff schema at .skilled/agents/debug.md schema lines.
          2. Surface a one-line confirmation with the scaffold path and a Task-tool invocation example for the user to copy.
          3. The workflow itself NEVER invokes Task tool → @debug. The user dispatches.
        On "continue manually": log "user declined debug at threshold N", proceed with existing manual flow, do NOT reset the failure counter.
        On "skip": apply existing skip semantics (failure counter resets per reset_on: new_task).
      child_dispatch: "When child_dispatch applies, do not surface the prompt. Take the continue manually branch below, log it in the lineage directory and proceed without resetting the failure counter."
      no_autonomous_routing: true
      reference: "debug delegation safety contract"
    approach: autonomous_implementation_with_checkpoints
    requirements: { follow: "Check skills folder for coding standards", update: task_checklist_progressively, test: before_commit, validate: continuously }
    confidence_checkpoint:
      evaluate_at: "Before each significant code change"
      per_task_assessment:
        scoring_factors:
          - { factor: "Implementation clarity", weight: 0.35 }
          - { factor: "Pattern alignment", weight: 0.30 }
          - { factor: "Risk awareness", weight: 0.35 }
        thresholds:
          high_80_plus: "Implement task, mark [x]"
          medium_40_79: "Implement with extra validation, add comments"
          low_below_40: { action: "STOP: A) Research B) Simplify C) Skip. When child_dispatch applies, record the question with A) Research as the default in the lineage directory and continue.", modes: { confirm: "ask the question and wait", auto: "ask the question and wait, because confidence below 40 is a required stop", autopilot: "emit SPECKIT_AUTOPILOT_RESULT with reason uncertainty_blocked" } }
      citation_requirement: "Reference task ID in commits, cite pattern sources, use [DEVIATION: reason]"
    validation: development_complete
    checkpoint:
      applies_to: confirm
      question: "Step 6 Complete: Development finished. Review implementation?"
      child_dispatch: "When child_dispatch applies, record the question with Approve Code, the first option of checkpoint_options.code_review, as the default in the lineage directory and continue. Approve Code reaches Step 6.7, which verifies the acceptance-criteria rows before Step 7 completion."
      options: checkpoint_options.code_review

  step_6_7_acceptance_verify:
    purpose: Verify every acceptance-criteria row and every P0/P1 checklist item after development and before completion
    blocking: true
    level_requirement: "Level 2+"
    activities:
    - Skip for Level 1, MANDATORY for Level 2+
    - Load acceptance-criteria.md and the Verification Checklist section of tasks.md
    - Set every row to Met with observed evidence, or to Waived/Superseded naming an ADR that exists in decision-record.md
    - Verify ALL P0 checklist items are marked [x] with evidence
    - "Verify ALL P1 items are marked [x]. Under confirm a P1 item may instead carry documented user approval to defer. Under auto and autopilot an unfinished P1 item stays Unmet and the run does not report success"
    - P2 items may be deferred with a documented reason
    verification_protocol: { p0: "BLOCKER", p1: "Required. Under confirm the user may approve a deferral. Under auto and autopilot an unfinished P1 item stays Unmet, the result names it and the run does not report success", p2: "Optional, can defer with reason" }
    p0_enforcement:
      blocking: true
      on_incomplete: "UNMET CRITERIA OR P0 ITEMS INCOMPLETE - Cannot proceed to completion. WORKFLOW HALTED."
    outputs: { acceptance_status: closeable_or_not, checklist_status: pass_or_fail, p0_status: "all_complete or blocked" }
    validation: acceptance_verified_and_marked
    checkpoint:
      applies_to: confirm
      question: "Acceptance verification complete: every row and every P0/P1 checklist item verified. Proceed to completion?"
      child_dispatch: "When child_dispatch applies, default to Approve only when every acceptance-criteria row and every P0 item is verified. When one is open, record the open rows and the p0_enforcement halt in the lineage directory, do not claim completion, and continue."
      options: checkpoint_options.standard

  step_7_completion:
    purpose: Generate implementation summary
    level_requirement: "All levels (MANDATORY - do not skip)"
    enforcement_note: "MANDATORY for all levels. implementation-summary.md is a required file created after implementation completes."
    review_dispatch:
      order: "First activity of this step, at every level. One dispatch per run, and one more after a REQUESTED_CHANGES verdict."
      agent: "@review, as the review entry of agent_availability names it. The general fallback gets the same prompt and its verdict blocks the same way."
      tool_scope: "Read-only. The prompt grants no write tool and passes file paths, never file contents."
      prompt: |
        CODE-REVIEW

        Mode: Gate Validation
        gate_type: post_execution
        task_id: [SPEC_FOLDER]
        artifact: [the path of every file this run changed, one per line]
        context: Spec folder [SPEC_FOLDER]. Review the changed files against spec.md and acceptance-criteria.md in that folder. When the run changed no file, review the spec folder.
        Return review_status as APPROVED, COMMENTED or REQUESTED_CHANGES, with every P0 and open P1 finding at file:line.
      verdict:
        APPROVED: "Continue with the next activity."
        COMMENTED: "Continue with the next activity and list the comments in implementation-summary.md."
        REQUESTED_CHANGES: "Any P0 or an open P1. Stop this step and return to step_6_development. Write no implementation-summary.md and claim no completion. Fix the listed findings there, then dispatch @review once more with the same prompt."
        advisory_score: "Never blocks."
      halt:
        trigger: "The second dispatch returns REQUESTED_CHANGES."
        action: "List the P0 and open P1 findings, write no implementation-summary.md and claim no completion."
        modes: { confirm: "stop and show the findings", auto: "stop, report the findings and report no success", autopilot: "emit SPECKIT_AUTOPILOT_RESULT with reason verification_failed" }
    activities: ["Dispatch @review first, as review_dispatch states, and act on its verdict before any other activity", Run validation on spec folder, Verify all tasks completed, Validate tests pass, Confirm plan followed, Generate implementation-summary.md, Update all task status, Reread the request and its amendments and map each outcome they ask for to a Met row or name it as not done]
    pre_completion_validation:
      enforcement: MANDATORY
      outcomes: { success: "continue", user_error: "STOP and fix invocation", validation_error: "STOP and fix", test_failure: "STOP and fix the failing tests, then rerun them before completion continues", system_error: "STOP and diagnose tooling or file I/O" }
    summary_document:
      location: "[SPEC_FOLDER]/implementation-summary.md"
      required_sections: [files_modified_created, verification_steps_taken, deviations_from_plan, skill_updates, recommended_next_steps, browser_testing_results]
      canonical_template: .skilled/skills/system-spec-kit/templates/core/implementation-summary.md.tmpl
      inline_scaffold_key: implementation_summary_md
      writing_rule: "Embed template_compliance.inline_scaffolds.implementation_summary_md in the prompt before writing implementation-summary.md."
    verification_summary:
      acceptance_verification:
        required: true
        must_include: [Criteria total, Met count, Waived or superseded rows with their ADR, tasks.md P0/P1 status, Link to acceptance-criteria.md]
    post_write_validation:
      # cadence: this gate re-validates the documents this step wrote; a later step's writes get their own gate
      command: ".skilled/skills/system-spec-kit/runtime/cli/spec/validate.sh [SPEC_FOLDER] --strict"
      on_fail: "STOP and repair implementation-summary.md template drift before marking completion"
      guard_command: "bash .skilled/skills/system-spec-kit/runtime/cli/spec/check-example-drift.sh && bash .skilled/skills/system-spec-kit/runtime/cli/spec/check-card-sync.sh"
      guard_on_fail: "Report the guard output and continue: a failure means the skill's own examples or authoring card drifted, not this packet"
    validation: implementation_complete
    completion_checkpoint:
      enforcement: HARD_BLOCK
      before_marking_complete: "Verify implementation-summary.md exists with all required sections."
      required_file: "[SPEC_FOLDER]/implementation-summary.md"
    checkpoint:
      applies_to: confirm
      question: "Step 7 Complete: Implementation summary generated. Review?"
      options:
        - { label: "Approve Summary", description: "Summary is complete" }
        - { label: "View Summary", description: "Show implementation-summary.md" }
        - { label: "Add Details", description: "Add more to summary" }

  step_8_save_context:
    purpose: Save conversation context
    activities: [Invoke system-spec-kit skill, Preserve decisions/insights/changes, Refresh the routed canonical spec document with the continuity writer]
    outputs: ["Canonical continuity refreshed in spec docs (decision-record.md / implementation-summary.md / handover.md) by the continuity writer"]
    validation: context_saved_successfully
    importance_tier:
      assign: important
      rationale: "Implementation sessions contain significant code decisions"
      tier_reference: "critical > important > normal > temporary > deprecated"
    checkpoint:
      applies_to: confirm
      question: "Step 8 Complete: Implementation workflow finished!"
      options:
        - { label: "Done", description: "Complete the workflow" }
        - { label: "View Final Summary", description: "Show complete implementation summary" }
    shared_tail: "assets/speckit-save-context-tail.yaml#save_context_core"
    shared_tail_note: "The writer call and the post-save check live once in the shared tail; {spec_path} is this workflow's packet."

# WORKFLOW TERMINATION
termination:
  after_step: 8
  message: "Implementation complete. The workflow ends after step 8, which wrote continuity once."
  next_steps: [Review implementation-summary.md, Verify changes in staging, Prepare for code review and PR]

# ERROR RECOVERY
error_recovery:
  step_validation_fails: { action: "Review requirements, ask clarifying questions, retry", modes: { confirm: "ask the clarifying questions and wait", auto: "review the requirements and retry with no question. After the third failed retry stop and report the failed validation", autopilot: "review the requirements and retry. After the third failed retry emit SPECKIT_AUTOPILOT_RESULT with reason retry_exhausted" } }
  tests_fail: "Debug, fix, re-run before marking complete"
  prerequisites_insufficient: { action: "Return to /speckit:plan or ask user", modes: { confirm: "ask the user whether to return to /speckit:plan", auto: "stop and name /speckit:plan as the next command", autopilot: "emit SPECKIT_AUTOPILOT_RESULT with reason uncertainty_blocked" } }
  environment_unavailable: "Skip browser testing, document limitation"
  unexpected_error: "Log error, document state, attempt graceful recovery"

# RULES
rules:
  ALWAYS:
  - follow_workflow_sequence
  - document_all_changes
  - validate_before_completion
  - update_task_checklist_progressively
  - self_validate_and_proceed
  - test_incrementally
  - use_checklist_for_verification_level_2_plus
  - mark_checklist_items_with_evidence
  - complete_all_p0_items_before_done
  CONFIRM_ONLY:
  - get_user_approval_for_p1_deferrals
  AUTO_AND_AUTOPILOT:
  - do_not_prompt_for_user_approval
  - leave_unfinished_p1_items_unmet_and_do_not_report_success
  NEVER:
  - skip_workflow_steps
  - ignore_blockers
  - submit_without_validation
  - expand_scope_beyond_spec
  - proceed_without_self_validation
  - claim_completion_without_checklist_verification_level_2_plus
  - skip_p0_checklist_items
  - defer_p1_items_without_user_approval
