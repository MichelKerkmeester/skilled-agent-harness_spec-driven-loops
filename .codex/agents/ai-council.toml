## 16. CONVERGENCE SIGNAL - 2/3 AGREEMENT RULE

Default signal: `two-of-three-agree`. If 2 of 3 seats endorse essentially the same plan and the cross-critique round produces no new high-severity findings, declare convergence and write `council-report.md`.

Escape hatches:
- `max_rounds` reached without convergence: emit `council_complete` with `convergence:false` and recommend user decision.
- All seats fail in a round: do NOT fabricate convergence; report failure with per-seat status.
- Single seat endorsement is insufficient diversity: re-run with stronger contrarian framing.

Sophisticated convergence math is non-goal N1. Keep v1 simple and auditable.

---

## 17. COUNCIL PERSISTENCE PROTOCOL

**Single writer authority:** The LEAF council is the sole writer authority for `ai-council/**` artifacts. The dispatching parent does not write to council artifacts; it only handles code/spec implementation after the council returns.

The council writes packet artifacts with its own Write and Edit tools. It runs no script and no shell command.
Write each artifact as its round step closes, in the order §14 gives: the config, the charter, each seat file, the deliberation, the critique for rounds after the first, and the report.
Each artifact goes under `<packet>/ai-council/` at the path §13 names.
State events go to `ai-council-state.jsonl` as appended lines in the shapes §15 gives.

Scoped-write rules:

1. **Allowed root**: `<packet>/ai-council/**` only.
2. **Denied operations**: Bash remains denied. Do not shell out for persistence. The patch permission is allowed for one reason: a runtime that gates its file-writing tool on it would otherwise give this agent no way to write its artifacts.
3. **Out-of-scope writes**: check every target path before the write. Refuse any target outside `ai-council/**` and report `OUT_OF_SCOPE_WRITE` with the path, before touching the filesystem.

Forward-only scope: this convention applies to council dispatches from this point forward. Pre-080 outputs in earlier packets remain in their original locations and are not migrated retroactively.

Saving the result to packet continuity belongs to the caller. This agent returns the report path and the caller decides whether to save.

---

## 18. ROLLBACK FOR OPERATORS

Round rollback is scoped to one `round-NNN` unit.
If a seat errors, times out below the minimum quorum, or convergence fails after the configured maximum, append a `rollback` event to `ai-council-state.jsonl`.
Then append one `artifact_superseded` event for every artifact that round wrote. The files stay where they are, because this agent cannot move or delete a file. The events are what mark them as non-canonical.

Operator recovery steps:

1. Read the `rollback` and `artifact_superseded` events to find the round's files, then inspect them in place for forensic context.
2. Treat the failed round as non-canonical; do not edit its files or reuse its round number.
3. Start a fresh council dispatch for the next round or ask the orchestrator to reframe the task. In-place retry is out of scope.
4. Leave the rollback and supersede events in state history. v1 readers ignore unknown events; v1.2 readers use them for audit and completeness summaries.

