# Disables telemetry, session logging and goal or plan workflows to keep harness runs local and focused.
- id: session-telemetry-otel
  config:
    mode: DISABLED
- id: session-log-deepseek
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
# get_goal, create_goal and update_goal need a direct human turn and the round driver
# above, so a fan-out leaf can only misuse them.
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
# Marks the run as a fan-out leaf. The guards patch inserts repo-guards after this one
# applies, so the marker is a row of its own; the bundle reads it to keep its
# interactive-only adapters off.
- insert:
    - id: repo-guards-lineage-leaf
      name: ../plugins/repo-guards/lineage-leaf.mjs
